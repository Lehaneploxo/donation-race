<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>🥋 Street Fighters</title>
<style>
  html, body { width:100vw; height:100vh; margin:0; background:#000; overflow:hidden; font-family:Arial,sans-serif; }
  #wrap { position:absolute; left:0; top:0; width:600px; height:1000px; transform-origin:0 0; }
  canvas { display:block; background:#000; }
  .ui-btn { position: fixed; z-index: 99999; width: 26px; height: 26px; font-size: 12px; background: rgba(0,0,0,0.55); color: rgba(255,255,255,0.55); border: 1px solid rgba(255,255,255,0.2); border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  #backBtn  { top: calc(50% - 62px); right: 10px; }
  #voiceBtn { top: calc(50% - 13px); right: 10px; }
  #fsBtn    { top: calc(50% + 36px); right: 10px; }
  #statusBadge { position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%); font-size: 12px; padding: 4px 12px; border-radius: 8px; border: 2px solid #555; background: rgba(0,0,0,0.78); color: #AAA; white-space: nowrap; z-index: 99999; display: none; }
  #statusBadge.live  { color: #00FF88; border-color: #00FF88; }
  #statusBadge.demo  { color: #FF9900; border-color: #FF9900; }
  #statusBadge.error { color: #FF4444; border-color: #FF4444; }
</style>
</head>
<body>
<button id="backBtn"  class="ui-btn" title="Главное меню">⌂</button>
<button id="voiceBtn" class="ui-btn" title="Озвучка">🔇</button>
<button id="fsBtn"    class="ui-btn" title="На весь экран">⛶</button>
<div id="statusBadge"></div>
<div id="ratingOverlay" style="position:fixed;top:27%;left:50%;transform:translateX(-50%);z-index:200;pointer-events:none;display:none;background:rgba(0,0,0,0.88);border:2px solid rgba(255,80,80,0.5);border-radius:10px;padding:8px 16px 10px;font-family:Arial,sans-serif;min-width:180px;text-align:center;"></div>
<div id="wrap"><canvas id="c" width="600" height="1000"></canvas></div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const wrap = document.getElementById('wrap');
const CW = canvas.width;

function applyScale(){
  const vw = document.documentElement.clientWidth || window.innerWidth;
  const vh = document.documentElement.clientHeight || window.innerHeight;
  const s = Math.min(vw/600, vh/1000);
  const x = (vw - 600*s)/2, y = (vh - 1000*s)/2;
  wrap.style.transform = `translate(${x}px,${y}px) scale(${s})`;
}
window.addEventListener('resize', applyScale);
applyScale();

// ── Бойцы: ТОЛЬКО два показателя — Энергия (жизнь/выносливость) и Сила (урон) ──
// Сердечки убраны — Энергия теперь одновременно и здоровье, и ресурс на удар.
// Донаты — ВСЕГДА без ограничений, толкают и Энергию, и Силу.
// Лайки — Энергию растят ВСЕГДА, без потолка (как донат). Силу растят только
// пока текущая Сила бойца (какой бы она ни стала — хоть от донатов) ещё не
// достигла потолка LIKE_POWER_CAP; выше потолка лайк Силу уже не трогает.
const LIKE_POWER_CAP = 500;

// боец без лайков/донатов 15 минут подряд — Сила начинает капать (-1/сек,
// не ниже 1); любой новый лайк/донат сбрасывает таймер (см. applyGrowth)
const INACTIVITY_MS = 15*60*1000;
const POWER_DECAY_INTERVAL_MS = 1000;

// stolenEnergy — очки из ОТДЕЛЬНОЙ БД (all-time): сколько энергии боец
// отнял у противников за все бои (начисляется когда противник падает).
// Это метрика для ТОП-листа, отдельная от текущей энергии/силы в бою.

// 7 перекрасок КАЖДОГО силуэта (Brawler Girl и Enemy Punk) — 14 скинов в
// одном общем пуле. baseType определяет набор анимаций/атак (CHAR_ANIMS/
// CHAR_ATTACKS ниже), dir — конкретную (перекрашенную) папку спрайтов.
// Пул общий и для реальных игроков (applyGrowth), и для ботов (spawnBot) —
// оба силуэта могут быть и тем, и другим, как попросил пользователь.
// Перекраски сделаны HSL hue-rotation по неймно найденным зонам "волосы/
// одежда/обувь" (см. историю чата) — кожа и золотые акценты не трогались.
const SKIN_VARIANTS = [
  { baseType:'brawler_girl', dir:'brawler_girl',              color:'#ff5566' },
  { baseType:'brawler_girl', dir:'brawler_girl_v2_yellowgreen',color:'#c6e05a' },
  { baseType:'brawler_girl', dir:'brawler_girl_v3_green',      color:'#5fe36a' },
  { baseType:'brawler_girl', dir:'brawler_girl_v4_teal',       color:'#4fe3d0' },
  { baseType:'brawler_girl', dir:'brawler_girl_v5_blue',       color:'#4fa8ff' },
  { baseType:'brawler_girl', dir:'brawler_girl_v6_purple',     color:'#8a6bff' },
  { baseType:'brawler_girl', dir:'brawler_girl_v7_pink',       color:'#e06bff' },
  { baseType:'enemy_punk',   dir:'enemy_punk',                 color:'#ff5566' },
  { baseType:'enemy_punk',   dir:'enemy_punk_v2_yellowgreen',  color:'#c6e05a' },
  { baseType:'enemy_punk',   dir:'enemy_punk_v3_green',        color:'#5fe36a' },
  { baseType:'enemy_punk',   dir:'enemy_punk_v4_teal',         color:'#4fe3d0' },
  { baseType:'enemy_punk',   dir:'enemy_punk_v5_blue',         color:'#4fa8ff' },
  { baseType:'enemy_punk',   dir:'enemy_punk_v6_purple',       color:'#8a6bff' },
  { baseType:'enemy_punk',   dir:'enemy_punk_v7_pink',         color:'#e06bff' },
];
function randomSkin(){ return SKIN_VARIANTS[Math.floor(Math.random()*SKIN_VARIANTS.length)]; }

// ── Уровень зрителя (медаль у ника) — по all-time ⚡ отнятой энергии,
// независимо от пояса чемпиона (можно носить и то, и другое одновременно).
// Только для реальных бойцов — у ботов нет истории в БД.
const TIER_BRONZE = 100000, TIER_SILVER = 1000000, TIER_GOLD = 10000000;
function tierOf(total){
  if (total >= TIER_GOLD) return 'gold';
  if (total >= TIER_SILVER) return 'silver';
  if (total >= TIER_BRONZE) return 'bronze';
  return null;
}
const TIER_COLORS = {
  bronze: { outer:'#7a4a25', inner:'#95582c', ring:'#3d2410' },
  silver: { outer:'#c8c8ce', inner:'#e8e8ee', ring:'#8b8b93' },
  gold:   { outer:'#ffd75e', inner:'#fff2b0', ring:'#a8790a' },
};
function drawTierMedal(cx, y, s, tier){
  const c = TIER_COLORS[tier];
  if (!c) return;
  const r = 7*s;
  ctx.save();

  // лента над диском — треугольный "галстук" + два коротких хвостика по
  // бокам, чтобы силуэт читался как настоящая медаль, а не просто кружок.
  // Цвет ленты общий для всех уровней — металл диска (бронза/серебро/
  // золото) остаётся единственным, что показывает уровень.
  const ribbonColor = '#c62839', ribbonDark = '#8f1c29';
  const topY = y - r*2.3, apexY = y - r*0.8;
  ctx.fillStyle = ribbonColor;
  ctx.beginPath();
  ctx.moveTo(cx - r*0.9, topY);
  ctx.lineTo(cx + r*0.9, topY);
  ctx.lineTo(cx, apexY);
  ctx.closePath();
  ctx.fill();
  ctx.lineWidth = 0.6*s; ctx.strokeStyle = ribbonDark; ctx.stroke();
  ctx.fillStyle = ribbonDark;
  ctx.beginPath();
  ctx.moveTo(cx - r*0.9, topY); ctx.lineTo(cx - r*1.15, topY+r*0.65); ctx.lineTo(cx - r*0.5, topY+r*0.3);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(cx + r*0.9, topY); ctx.lineTo(cx + r*1.15, topY+r*0.65); ctx.lineTo(cx + r*0.5, topY+r*0.3);
  ctx.closePath(); ctx.fill();

  // диск медали
  ctx.beginPath(); ctx.arc(cx, y, r, 0, Math.PI*2);
  ctx.fillStyle = c.outer; ctx.fill();
  ctx.lineWidth = 1.3; ctx.strokeStyle = c.ring; ctx.stroke();
  ctx.beginPath(); ctx.arc(cx, y, r*0.6, 0, Math.PI*2);
  ctx.fillStyle = c.inner; ctx.fill();
  if (tier === 'gold'){
    ctx.shadowColor = '#ffcc33'; ctx.shadowBlur = 6*s;
    ctx.beginPath(); ctx.arc(cx, y, r, 0, Math.PI*2);
    ctx.lineWidth = 1; ctx.strokeStyle = '#ffcc33'; ctx.stroke();
    ctx.shadowBlur = 0;
  }
  ctx.restore();
}

// ── Чемпион улицы: текущий #1 в all-time рейтинге отнятой энергии ──
// получает золотой ник вместо обычного, пока держит первое место.
// В отличие от бокса — нет отдельного золотого скина (только 1 вариант
// спрайта Brawler Girl), так что смены спрайта тут нет, только подсветка ника.
let _championName = null;
let _championSince = null; // Date.now() с последнего флаша времени владения поясом

// сбрасывает накопленное с последнего флаша время владения поясом на
// сервер (по 60 сек, чтобы не терять много при перезагрузке/рестарте) —
// только пока реально идёт эфир (не в demo/connecting)
function flushBeltTime(){
  if (!_championName || !_championSince) return;
  const now = Date.now();
  const elapsedSec = Math.floor((now - _championSince) / 1000);
  if (elapsedSec > 0 && typeof _gameMode !== 'undefined' && _gameMode === 'tiktok') {
    reportBelt(_championName, elapsedSec);
  }
  _championSince = now;
}

function applyChampionSkin(v){
  v.isChamp = true;
}
function revertChampionSkin(v){
  v.isChamp = false;
}
// вызывается после каждого обновления _dbTop (и сразу после спавна нового
// бойца) — синхронизирует, кто именно сейчас должен носить золото
function syncChampionStatus(){
  const newName = (_dbTop[0] && _dbTop[0].username) || null;
  if (newName === _championName){
    // лидер не поменялся, но он мог только что заспавниться — на всякий
    // случай убеждаемся, что золото на нём, если он уже на ринге
    if (newName){ const v = findRealFighter(newName); if (v) applyChampionSkin(v); }
    return;
  }
  flushBeltTime(); // закрываем отрезок владения поясом старым чемпионом перед сменой
  if (_championName){
    const old = findRealFighter(_championName);
    if (old) revertChampionSkin(old);
  }
  _championName = newName;
  _championSince = newName ? Date.now() : null;
  if (_championName){
    const now = findRealFighter(_championName);
    if (now) applyChampionSkin(now);
  }
}
setInterval(flushBeltTime, 60000);

// ростер бойцов стартует ПУСТЫМ — реальные бойцы появляются по первому
// лайку/донату конкретного зрителя (см. applyGrowth ниже); пока их <2 на
// ринге, слоты подсаживаются ботами (см. секцию ботов ниже).
const VARIANTS = [];

// ── Геометрия экрана: плашка сверху, ринг ниже ──
const PANEL_TOP = 14, PANEL_H = 250;
const WALL_TOP = PANEL_TOP + PANEL_H + 10;
const FLOOR_TOP = 480, FLOOR_BOT = 1000;

// зона движения — пол ринга, с отступом от канатов/краёв
const RING = { xMin:75, xMax:525, yMin:FLOOR_TOP+45, yMax:FLOOR_BOT-35 };
const KO_FALL_MS = 1600;  // сколько играет анимация падения перед исчезновением
const FIGHT_DIST = 68;
// бой стартует только если бойцы ещё и близки по глубине (Y) — иначе при
// диагональной близости (один дальше от камеры, другой ближе) они дерутся
// "по диагонали", хотя визуально не стоят друг перед другом
const FIGHT_Y_GAP = 30;

// раунды убраны (были чисто декоративным таймером поверх непрерывного
// боя) — бой идёт непрерывно. Нокаутированный боец пропадает с ринга
// насовсем и НЕ оживает автоматически — возврат бойца на ринг приходит
// от нового лайка/доната этого же зрителя (см. applyGrowth).

// ── Анимации: у Brawler Girl (реальные игроки) и Enemy Punk (боты) —
// РАЗНЫЕ наборы кадров (не просто перекраска одного пака, как в боксе).
// Своей анимации нокаута/падения нет ни у кого (пак Streets of Fight её не
// содержит) — вместо неё используется Hurt, застывающий на последнем кадре
// (не идеально, но рабочая заглушка — см. память проекта).
const CHAR_ANIMS = {
  brawler_girl: {
    idle:  { folder:'Idle',      prefix:'idle',      count:4,  fps:8,  loop:true  },
    walk:  { folder:'Walk',      prefix:'walk',       count:10, fps:12, loop:true  },
    jab:   { folder:'Jab',       prefix:'jab',        count:3,  fps:16, loop:false },
    punch: { folder:'Punch',     prefix:'punch',      count:3,  fps:16, loop:false },
    kick:  { folder:'Kick',      prefix:'kick',       count:5,  fps:16, loop:false },
    hurt:  { folder:'Hurt',      prefix:'hurt',       count:2,  fps:12, loop:false },
    ko:    { folder:'Hurt',      prefix:'hurt',       count:2,  fps:8,  loop:false },
  },
  enemy_punk: {
    idle:  { folder:'Idle',  prefix:'idle',  count:4, fps:8,  loop:true  },
    walk:  { folder:'Walk',  prefix:'walk',  count:4, fps:10, loop:true  },
    jab:   { folder:'Punch', prefix:'punch', count:3, fps:16, loop:false }, // нет джеба/кика отдельно — переиспользуем punch
    punch: { folder:'Punch', prefix:'punch', count:3, fps:16, loop:false },
    kick:  { folder:'Punch', prefix:'punch', count:3, fps:16, loop:false },
    hurt:  { folder:'Hurt',  prefix:'hurt',  count:4, fps:12, loop:false },
    ko:    { folder:'Hurt',  prefix:'hurt',  count:4, fps:8,  loop:false },
  },
};
// набор ударов, из которого случайно выбирается анимация атаки — у Brawler
// Girl три разных (джеб/удар/пинок), у Enemy Punk только один (punch)
const CHAR_ATTACKS = {
  brawler_girl: ['jab','punch','kick'],
  enemy_punk:   ['punch'],
};
// dir — конкретная (возможно перекрашенная) папка спрайтов, baseType —
// какой набор анимаций использовать (brawler_girl/enemy_punk структура
// одинакова у всех перекрасок одного силуэта, меняются только пиксели)
function loadFrames(dir, baseType){
  const defs = CHAR_ANIMS[baseType];
  const out = {};
  for (const key in defs){
    const a = defs[key];
    out[key] = [];
    for (let i=1;i<=a.count;i++){
      const img = new Image();
      img.src = `sprites/streets_of_fight/${dir}/${a.folder}/${a.prefix}${i}.png`;
      out[key].push(img);
    }
  }
  return out;
}

const clamp = (v,a,b) => Math.max(a, Math.min(b, v));

// общая инициализация рантайм-полей бойца — используется и для стартовых
// (демо-)игроков, и для ботов, добавляемых в ростер динамически
function initFighterRuntime(v, x, y){
  v.x = x; v.y = y;
  v.tx = x; v.ty = y;
  v.state = 'idle'; v.stateTimer = 0;
  v.animName = 'idle'; v.frameIdx = 0; v.frameTimer = 0;
  v.facing = 1;
  v.lean = 0;
  v.punchCooldown = Math.random()*600;
  v.wanderPause = Math.random()*800;
  v.inExchange = false;
  v.koTimer = 0;
  v.alive = true;
  v.eliminated = false; // true = совсем убран с ринга (энергия кончилась)
  v.lastAttacker = null;
  v.frames = loadFrames(v.dir, v.baseType);
}

// ── Реальные игроки: создаются/растут по лайкам и донатам из живого чата ──
// (см. WebSocket-секцию ниже). Если боец уже был нокаутирован и пропал с
// ринга — новый лайк/донат от того же зрителя возвращает его в бой.
function spawnRingPos(){
  return {
    x: RING.xMin + Math.random()*(RING.xMax-RING.xMin),
    y: RING.yMin + Math.random()*(RING.yMax-RING.yMin),
  };
}

function findRealFighter(username){
  return VARIANTS.find(v=>!v.isBot && v.name===username);
}

// gain: { likeEnergy?, likePower?, giftEnergy?, giftPower? } — прибавка от
// одного события. giftEnergy/giftPower (донат) и likeEnergy (лайк по Энергии)
// всегда начисляются полностью, без ограничений. likePower (лайк по Силе)
// начисляется, только если ТЕКУЩАЯ Сила бойца (какой бы она ни стала — хоть
// от донатов) ещё не достигла потолка LIKE_POWER_CAP.
// isGift — донат это или лайк (влияет на то, какой фразой диктор это
// объявит; обычные лайки на уже живого бойца молчат — иначе диктор
// захлёбывался бы каждым лайком).
function applyGrowth(username, gain, isGift){
  if (!username) return;
  let v = findRealFighter(username);
  const isNew = !v;
  if (!v){
    const skin = randomSkin();
    const pos = spawnRingPos();
    v = {
      dir: skin.dir, baseType: skin.baseType, name: username, color: skin.color, isBot: false,
      baseDir: skin.dir, baseColor: skin.color, isChamp: false,
      stolenEnergy: 0, powerDecayAcc: 0, kos: 0, allTimeStolen: 0,
    };
    v.energyMax = 0; v.energy = 0; v.powerMax = 0; v.power = 0;
    initFighterRuntime(v, pos.x, pos.y);
    VARIANTS.push(v);
    requestTier(username); // подтягиваем all-time очки для медали (клиент знает только топ-5)
  }
  syncChampionStatus(); // если это чемпион только что заспавнился — сразу золото

  // любой лайк/донат — признак активности зрителя, сбрасывает таймер
  // бездействия (см. INACTIVITY_MS / decayInactivePower в update())
  v.lastActiveAt = Date.now();

  let gainedEnergy = gain.giftEnergy || 0;
  let gainedPower  = gain.giftPower  || 0;
  gainedEnergy += gain.likeEnergy || 0; // лайки растят Энергию без потолка, как донат
  if (gain.likePower && v.power < LIKE_POWER_CAP) gainedPower += gain.likePower;

  v.energyMax += gainedEnergy;
  v.powerMax  += gainedPower;

  const wasDown = !v.alive || v.eliminated;
  if (wasDown){
    // боец был выбит с ринга — новый лайк/донат возвращает его в бой,
    // но со свежими показателями (старые уже обнулены в collapse())
    const pos = spawnRingPos();
    v.alive = true; v.eliminated = false;
    v.energy = v.energyMax;
    v.power = v.powerMax;
    v.state = 'idle'; v.frameIdx = 0;
    v.x = pos.x; v.y = pos.y; v.tx = pos.x; v.ty = pos.y;
    pushEvent(v.isChamp ? pick(CHAMPION_ENTRANCE_LINES)(cleanNickForSpeech(v.name))
                         : pick(REVIVE_LINES)(cleanNickForSpeech(v.name)), true, v.isChamp);
  } else {
    v.energy += gainedEnergy;
    v.power  += gainedPower;
  }

  if (isNew && !wasDown) {
    pushEvent(v.isChamp ? pick(CHAMPION_ENTRANCE_LINES)(cleanNickForSpeech(v.name))
                         : pick(JOIN_LINES)(cleanNickForSpeech(v.name)), true, v.isChamp);
  } else if (isGift && !wasDown) pushEvent(pick(GIFT_LINES)(cleanNickForSpeech(v.name)), true);
  // обычный лайк на уже живого бойца — молча, диктор не озвучивает каждый лайк
}

function onLike(username){ applyGrowth(username, { likeEnergy:10, likePower:1 }, false); }

// ── Команда "Team" в чате: тумблер красного флажка — пока боец жив, свои
// с флажком друг друга не бьют. Флаг слетает автоматически при нокауте
// (см. v.eliminated=true в update()). Боты в команду вступать не могут —
// findRealFighter ищет только реальных.
function toggleTeam(username){
  const v = findRealFighter(username);
  if (!v || !v.alive || v.eliminated) return;
  v.team = !v.team;
  pushEvent(pick(v.team ? TEAM_JOIN_LINES : TEAM_LEAVE_LINES)(cleanNickForSpeech(v.name)), true);
}
function onGift(username, coins){
  coins = Math.max(1, Math.floor(Number(coins)||1));
  applyGrowth(username, { giftEnergy:100*coins, giftPower:10*coins }, true);
}

// ── Админ-буст (команды "power"/"super power"/"boost ник hp dmg" в чате,
// доступны только создателю игры — проверка на сервере в server.js) ──
// Приходит тем же сообщением arena_cheat, что и в arena2/arena3: hp → Энергия,
// damage → Сила. Даём как донат (giftEnergy/giftPower — без потолка,
// applyGrowth сам оживит бойца, если тот был в нокауте).
function applyCheat(username, hp, damage){
  if (!username) return;
  hp = hp|0; damage = damage|0;
  if (hp < 0 || damage < 0){
    // Коррекция статов уже существующего бойца (может забирать, не только
    // давать) — например если буст применился дважды из-за дубликата
    // сообщения в TikTok-чате. В отличие от applyGrowth не создаёт нового
    // бойца и не запускает анимацию оживления/возврата.
    const v = findRealFighter(username);
    if (!v) return;
    v.energyMax = Math.max(0, v.energyMax + hp);
    v.powerMax  = Math.max(0, v.powerMax + damage);
    v.energy    = Math.max(0, v.energy + hp);
    v.power     = Math.max(0, v.power + damage);
    pushEvent(`⚡ КОРРЕКЦИЯ! @${cleanNickForSpeech(username)} ${hp}⚡ ${damage}💪`, true);
    return;
  }
  applyGrowth(username, { giftEnergy: hp, giftPower: damage }, false);
  pushEvent(`⚡ АДМИН-БУСТ! @${cleanNickForSpeech(username)} +${hp}⚡ +${damage}💪`, true);
}

const BOT_NAMES = ['street_thug','alley_rat','back_punk','corner_boy','night_prowler','rust_belt','fists_of_fury','junk_yard_joe','shadow_biker','no_name_kid','turf_bully','iron_fence'];
const MAX_FIGHTERS = 10;
const MAX_BOTS = 3; // на ринге одновременно не больше 3 ботов
const BOT_CHECK_MS = 15000;
const BOT_ENERGY = 100, BOT_POWER = 5;
let botSpawnTimer = BOT_CHECK_MS;

function getBotName(){
  const used = new Set(VARIANTS.map(v=>v.name));
  const available = BOT_NAMES.filter(n=>!used.has(n));
  const pool = available.length ? available : BOT_NAMES;
  return pool[Math.floor(Math.random()*pool.length)];
}

function spawnBot(){
  if (VARIANTS.filter(v=>!v.eliminated).length >= MAX_FIGHTERS) return;
  if (VARIANTS.filter(v=>v.isBot && !v.eliminated).length >= MAX_BOTS) return;
  // боты берутся из ТОГО ЖЕ общего пула скинов, что и реальные игроки —
  // и Brawler Girl, и Enemy Punk могут быть ботом (ник всё равно серый,
  // чтобы отличать бота от реального зрителя)
  const skin = randomSkin();
  const v = {
    dir: skin.dir,
    baseType: skin.baseType,
    name: getBotName(),
    color: '#9aa0a6',
    isBot: true,
    energyMax: BOT_ENERGY, energy: BOT_ENERGY, power: BOT_POWER,
    stolenEnergy: 0,
  };
  const pos = spawnRingPos();
  initFighterRuntime(v, pos.x, pos.y);
  VARIANTS.push(v);
  // боты не объявляются диктором — тишина, только реальные бойцы на слуху
}

// каждые 15 сек: если реальных игроков на ринге < 2 — подсаживаем 1 или 2 бота
function updateBotSpawns(dt){
  botSpawnTimer -= dt;
  if (botSpawnTimer > 0) return;
  botSpawnTimer = BOT_CHECK_MS;
  const realOnRing = VARIANTS.filter(v=>!v.isBot && v.alive && !v.eliminated).length;
  if (realOnRing >= 2) return;
  const count = Math.random()<0.5 ? 1 : 2;
  for (let i=0; i<count; i++) spawnBot();
}

// urgent=true — обычно обрывает текущую фразу и говорит сразу (как
// donation-хайп в arena2); НО если сейчас играет protected-фраза (чемпион
// ринга/главное правило) — её не обрываем, новая просто становится
// следующей в очереди. protect=true — сама эта фраза, начав звучать,
// тоже не может быть оборвана (используется для входа чемпиона и правил)
function pushEvent(text, urgent, protect){
  const item = { text, protected: !!protect, ts: Date.now() };
  if (urgent){
    if (!vProtected){
      if (window.speechSynthesis) window.speechSynthesis.cancel();
      vSpeaking = false;
    }
    vQueue.unshift(item);
    if (vQueue.length>12) vQueue.length = 12;
  } else {
    vQueue.push(item);
    if (vQueue.length>12) vQueue.shift();
  }
  vSpeakNext();
}

function estimateSpeechMs(text){
  return Math.min(7000, Math.max(2200, text.length*75));
}

// событие, простоявшее в очереди дольше этого — уже не актуально (то, что
// оно описывало, случилось секунд 10+ назад), озвучивать его не нужно,
// просто выкидываем и берём следующее
const SPEECH_STALE_MS = 10000;

function vSpeakNext(){
  if (vSpeaking) return;
  while (vQueue.length && Date.now() - vQueue[0].ts > SPEECH_STALE_MS){
    vQueue.shift();
  }
  if (vQueue.length===0){ vScheduleQuiet(); return; }
  clearTimeout(vQuietTimer);
  const item = vQueue.shift();
  const text = item.text;
  vSpeaking = true;
  vProtected = item.protected;
  const dur = estimateSpeechMs(text);
  const onDone = ()=>{ vSpeaking=false; vProtected=false; setTimeout(vSpeakNext, 400); };
  if (voiceEnabled && window.speechSynthesis){
    speak(text, onDone);
  } else {
    setTimeout(onDone, dur);
  }
}

// ── Озвучка (архитектура как в arena2.html) ──
let voiceEnabled = false, _cachedVoice = null;

function getRuVoice(){
  if(_cachedVoice) return _cachedVoice;
  const voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
  _cachedVoice = voices.find(v=>/pavel/i.test(v.name))
    || voices.find(v=>/ru/i.test(v.lang) && /male/i.test(v.name))
    || voices.find(v=>/ru[-_]/i.test(v.lang))
    || voices.find(v=>/ru/i.test(v.lang))
    || voices.find(v=>v.default)
    || voices[0] || null;
  return _cachedVoice;
}
// диктор должен читать только буквы никнейма — без "@" и без смайликов/
// эмодзи (у ников бывают любые декоративные символы из TikTok)
function speakClean(text){
  return text
    .replace(/[\u{1F1E6}-\u{1F1FF}\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{2190}-\u{21FF}\u{2300}-\u{23FF}\u{2B00}-\u{2BFF}\u{FE0F}\u{200D}]/gu, '')
    .replace(/@/g, '')
    .replace(/\s+/g, ' ')
    .trim();
}
// ник в TikTok может содержать ЛЮБЫЕ декоративные символы (рамки, звёздочки,
// зачёркнутые/жирные unicode-буквы, диакритику) — для озвучки оставляем
// только буквы/цифры самого ника, остальное диктор не должен произносить.
// NFKD раскладывает декоративные unicode-буквы (полноширинные, зачёркнутые,
// в кружочках и т.п.) обратно в обычные буквы перед фильтрацией.
function cleanNickForSpeech(name){
  return String(name||'')
    .normalize('NFKD')
    .replace(/[_.\-]+/g, ' ')
    .replace(/[^\p{L}\p{N} ]+/gu, '')
    .replace(/\s+/g, ' ')
    .trim();
}
// как speakText в arena2: onDone вызывается по РЕАЛЬНОМУ завершению речи
// (или через 8с как страховка) — этим тактом живёт вся очередь vQueue
function speak(text, onDone){
  const done = onDone || (()=>{});
  if(!voiceEnabled || !window.speechSynthesis){ done(); return; }
  const clean = speakClean(text);
  const u = new SpeechSynthesisUtterance(clean);
  const v = getRuVoice();
  if(v) u.voice = v;
  u.lang = 'ru-RU'; u.rate = 1.08; u.volume = 1;
  let finished = false;
  const finish = ()=>{ if(finished) return; finished = true; done(); };
  u.onend = u.onerror = finish;
  setTimeout(finish, 8000);
  try{ window.speechSynthesis.speak(u); }catch(e){ finish(); }
}
if(window.speechSynthesis) window.speechSynthesis.onvoiceschanged = ()=>{ _cachedVoice = null; };

// ── Звуки боя (удары/нокаут) — синтезируются на лету, без файлов ──
let audioCtx = null;
function getAudioCtx(){
  if (!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  return audioCtx;
}
function playPunchSound(){
  if (!voiceEnabled) return;
  const ac = getAudioCtx(); const now = ac.currentTime;

  const osc = ac.createOscillator(), gain = ac.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(150, now);
  osc.frequency.exponentialRampToValueAtTime(55, now+0.09);
  gain.gain.setValueAtTime(0.4, now);
  gain.gain.exponentialRampToValueAtTime(0.001, now+0.13);
  osc.connect(gain); gain.connect(ac.destination);
  osc.start(now); osc.stop(now+0.14);

  const bufSize = Math.floor(ac.sampleRate*0.06);
  const buf = ac.createBuffer(1, bufSize, ac.sampleRate);
  const data = buf.getChannelData(0);
  for (let i=0;i<bufSize;i++) data[i] = (Math.random()*2-1)*(1-i/bufSize);
  const noise = ac.createBufferSource(); noise.buffer = buf;
  const noiseGain = ac.createGain();
  noiseGain.gain.setValueAtTime(0.3, now);
  noiseGain.gain.exponentialRampToValueAtTime(0.001, now+0.06);
  noise.connect(noiseGain); noiseGain.connect(ac.destination);
  noise.start(now);
}
function playKOSound(){
  if (!voiceEnabled) return;
  const ac = getAudioCtx(); const now = ac.currentTime;
  const osc = ac.createOscillator(), gain = ac.createGain();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(200, now);
  osc.frequency.exponentialRampToValueAtTime(38, now+0.5);
  gain.gain.setValueAtTime(0.32, now);
  gain.gain.exponentialRampToValueAtTime(0.001, now+0.55);
  osc.connect(gain); gain.connect(ac.destination);
  osc.start(now); osc.stop(now+0.6);
}

// Сервер шлёт общие "arena_*" события на весь стрим — тут выбираем только

let _ws = null, _wsUser = '', _gameMode = 'connecting';

function setStatus(cls, text){
  const el = document.getElementById('statusBadge');
  if (!el) return;
  el.style.display = 'block';
  el.className = cls;
  el.textContent = text;

function wsConnect(username){
  _wsUser = username;
  if (_ws && _ws.readyState < 2){ _ws.onclose = null; _ws.close(); }
  const proto = location.protocol==='https:' ? 'wss:' : 'ws:';
  _ws = new WebSocket(`${proto}//${location.host}?username=${encodeURIComponent(username)}`);
  _ws.onopen = ()=> setStatus('connecting', '⏳ @'+username+'…');
  _ws.onmessage = (e)=>{
    try {
      const d = JSON.parse(e.data);
      if (d.type==='init' || d.type==='status'){
        const m = d.tiktokMode || d.mode;
        _gameMode = m || 'connecting';
        if (m==='tiktok') setStatus('live', '🔴 LIVE @'+(d.username||username));
        else if (m==='demo') setStatus('demo', '🟡 Ожидание эфира…');
        else setStatus('connecting', '⏳ @'+username+'…');
      }
      if (d.type==='arena_like' && _gameMode==='tiktok') onLike(d.username);
      if (d.type==='arena_boxing_chat' && _gameMode==='tiktok') onLike(d.username);
      if (d.type==='arena_team' && _gameMode==='tiktok') toggleTeam(d.username);
      if (d.type==='arena_gift' && _gameMode==='tiktok') onGift(d.username, d.coins);
      if (d.type==='arena_cheat' && _gameMode==='tiktok') applyCheat(d.username, d.hp, d.damage);
      if (d.type==='top_streetfighter') { _dbTop = (d.data||[]).map(p=>({ username:p.username, stolen:p.total_stolen })); syncChampionStatus(); }
      if (d.type==='streetfighter_tier_info'){
        const v = findRealFighter(d.username);
        if (v) v.allTimeStolen = Number(d.total_stolen)||0;
      }
      if (d.type==='arena_streetfighter_rating'){
        if (d.rank){
          const pts = Number(d.stolen||0).toLocaleString('ru-RU');
          let html = `<span style="color:#FF6688;font-size:16px;font-weight:bold;">📊 @${d.username}</span><br>`
            + `<span style="color:#FFD700;font-size:14.5px;">#${d.rank} место · ⚡${pts}</span><br>`
            + `<span style="color:#ffb4c4;font-size:13.5px;">🥊 Нокаутов: ${d.kos||0}</span>`;

            html += `<div style="margin-top:5px;padding-top:5px;border-top:1px dashed rgba(255,215,0,0.25);display:flex;align-items:center;justify-content:center;gap:6px;color:#fff2b0;font-size:14px;font-weight:700;">${BELT_ICON_SVG}<b>${formatBeltTime(d.beltSeconds)}</b></div>`;
          }
          _showRating(html);
        } else {
          _showRating(`<span style="color:#AAA;font-size:15px;">📊 @${d.username}<br>пока не в рейтинге</span>`);
        }
      }
    } catch(err){ console.error('[streetfighter ws]', err); }
  };
  _ws.onclose = ()=>{ setStatus('error', '❌ Disconnected…'); setTimeout(()=>wsConnect(_wsUser), 3000); };
  _ws.onerror = ()=>{};
}

// ── Единый масштаб для ВСЕХ пиксель-арт ассетов пака (персонажи и фон —
// из одного пака Streets of Fight) — иначе дверь/стена не в пропорции с
// бойцом. Кадры бойцов нативно 96×63, целимся в ту же высоту бойца, что и
// FIGHTER_SCALE (130*0.85) — см. историю разработки streetfighter_arena_mockup.html
const UNIT_SCALE = (130*0.85) / 63; // ≈1.754

// геометрия фона строго та же, что PANEL_TOP/WALL_TOP/FLOOR_TOP/FLOOR_BOT
// выше (один в один с boxing_arena.html) — небо+стена делят фиксированную
// полосу WALL_TOP..FLOOR_TOP в пропорции нативных размеров тайлов (80:96),
// сама дорога тайлится с UNIT_SCALE уже внутри фиксированной FLOOR_TOP..FLOOR_BOT
const SKY_WALL_TOTAL = FLOOR_TOP - WALL_TOP; // 206
const SKY_H = SKY_WALL_TOTAL * (80/(80+96));
const WALL_H = SKY_WALL_TOTAL - SKY_H;
// верхняя полоса неба, где НЕТ силуэта города (сама картинка скайлайна
// сжата и прижата к низу SKY_H) — сюда кладём луну, чтобы она была
// гарантированно позади/выше крыш, а не "перед домами". Самая высокая
// крыша в back.png начинается на 10% высоты картинки от верха (замерено
// сканированием пикселей) — держим полосу настолько узкой, насколько
// можно, чтобы дома были покрупнее, но луна её не касалась
const SKY_OPEN_H = SKY_H * 0.15;
// технический зазор между низом HUD-плашки и WALL_TOP (никем больше не
// используется — плашка рисуется поверх всего в конце кадра) даём под
// свечение луны, чтобы его не резало ровной линией клипа
const SKY_EXTRA_TOP = 10;
const ROAD_TILE_H = 144 * UNIT_SCALE;

const TILESET_SRC = 'sprites/streets_of_fight/stage/tileset.png';
const BACK_SRC     = 'sprites/streets_of_fight/stage/back.png';
const FORE_SRC      = 'sprites/streets_of_fight/stage/fore.png';

// Точные координаты кусков внутри tileset.png/fore.png — вычислены
// сканированием прозрачных зазоров (PowerShell System.Drawing), не на глаз:
const TILE_WALL_PIZZA  = { sx:0,   sy:0,   sw:224, sh:96 };
const TILE_WALL_WINDOW = { sx:288, sy:0,   sw:224, sh:96 };
const TILE_ROAD        = { sx:48,  sy:224, sw:112, sh:144 };
const TILE_LAMP         = { sx:16,  sy:0,   sw:42,  sh:144 }; // fore.png содержит фонарь+куст, куст не используем

const imgTileset = new Image(); imgTileset.src = TILESET_SRC;
const imgBack     = new Image(); imgBack.src = BACK_SRC;
const imgFore     = new Image(); imgFore.src = FORE_SRC;

// автомат с газировкой — своего спрайта в паке нет, рисуем процедурно;
// шрифт "COLA" общий, без чужого товарного знака (публичный TikTok-стрим)
function drawVendingMachine(dx, dyBase, h){
  const w = h * 0.5;
  const y = dyBase - h;
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath(); ctx.ellipse(dx + w/2, dyBase + 2, w*0.6, 6, 0, 0, Math.PI*2); ctx.fill();

  const body = ctx.createLinearGradient(dx, y, dx + w, y);
  body.addColorStop(0, '#8f0d13'); body.addColorStop(0.5, '#e21b26'); body.addColorStop(1, '#a80f16');
  ctx.fillStyle = body;
  roundRectPath(dx, y, w, h, 4); ctx.fill();

  ctx.fillStyle = '#333';
  ctx.fillRect(dx - 2, y - 5, w + 4, 6);

  const pw = w*0.72, ph = h*0.4, px = dx + (w-pw)/2, py = y + h*0.1;
  ctx.fillStyle = '#150c10';
  ctx.fillRect(px - 3, py - 3, pw + 6, ph + 6);
  const glow = ctx.createLinearGradient(px, py, px, py + ph);
  glow.addColorStop(0, '#124a66'); glow.addColorStop(1, '#0a2436');
  ctx.fillStyle = glow;
  ctx.fillRect(px, py, pw, ph);
  ctx.fillStyle = 'rgba(230,60,60,0.85)';
  const canW = pw/4;
  for (let i=0;i<3;i++) ctx.fillRect(px+4+i*canW, py+ph*0.3, canW*0.55, ph*0.6);

  ctx.fillStyle = '#fff';
  ctx.textAlign = 'center';
  ctx.font = `bold ${Math.max(8, h*0.1)}px Arial Black`;
  ctx.fillText('COLA', dx + w/2, y + h*0.63);

  ctx.fillStyle = '#1a1a1a';
  ctx.fillRect(dx + w*0.12, y + h*0.68, w*0.76, h*0.06);
  ctx.fillStyle = '#ffd23f';
  for (let i=0;i<4;i++){
    ctx.beginPath();
    ctx.arc(dx + w*0.2 + i*w*0.2, y + h*0.71, w*0.035, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.fillStyle = '#111';
  ctx.fillRect(dx + w*0.25, y + h*0.86, w*0.5, h*0.08);

  ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 2;
  roundRectPath(dx, y, w, h, 4); ctx.stroke();
  ctx.restore();
}

// мусорный бак в духе улиц Америки 80-х — оцинкованная сталь, помятый,
// с ржавыми потёками и торчащим мусором; тоже рисуется процедурно
function drawTrashCan(dx, dyBase, h){
  const wTop = h * 0.5, wBot = h * 0.58;
  const y = dyBase - h;
  ctx.save();

  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath(); ctx.ellipse(dx + wBot/2, dyBase + 2, wBot*0.62, 6, 0, 0, Math.PI*2); ctx.fill();

  // корпус — слегка сужается кверху (классический жестяной бак)
  const bodyTop = y + h*0.14;
  ctx.beginPath();
  ctx.moveTo(dx + (wBot-wTop)/2, bodyTop);
  ctx.lineTo(dx + (wBot-wTop)/2 + wTop, bodyTop);
  ctx.lineTo(dx + wBot, dyBase);
  ctx.lineTo(dx, dyBase);
  ctx.closePath();
  const body = ctx.createLinearGradient(dx, y, dx + wBot, y);
  body.addColorStop(0,   '#5c6068');
  body.addColorStop(0.35,'#9aa0a8');
  body.addColorStop(0.55,'#c4c9cf');
  body.addColorStop(0.75,'#83898f');
  body.addColorStop(1,   '#4a4e54');
  ctx.fillStyle = body;
  ctx.fill();

  // гофрированные горизонтальные рёбра жёсткости
  ctx.save();
  ctx.clip();
  ctx.strokeStyle = 'rgba(0,0,0,0.25)'; ctx.lineWidth = 1.5;
  for (let i=1;i<=3;i++){
    const ly = bodyTop + (dyBase-bodyTop)*(i/4);
    ctx.beginPath(); ctx.moveTo(dx-2, ly); ctx.lineTo(dx+wBot+2, ly); ctx.stroke();
  }
  // ржавые потёки
  ctx.fillStyle = 'rgba(140,70,20,0.35)';
  ctx.fillRect(dx + wBot*0.22, bodyTop + (dyBase-bodyTop)*0.35, 3, (dyBase-bodyTop)*0.6);
  ctx.fillRect(dx + wBot*0.68, bodyTop + (dyBase-bodyTop)*0.15, 2, (dyBase-bodyTop)*0.75);
  // вмятина
  ctx.fillStyle = 'rgba(0,0,0,0.18)';
  ctx.beginPath(); ctx.ellipse(dx + wBot*0.4, dyBase - (dyBase-bodyTop)*0.3, wBot*0.14, wBot*0.1, 0, 0, Math.PI*2); ctx.fill();
  ctx.restore();

  ctx.strokeStyle = 'rgba(0,0,0,0.45)'; ctx.lineWidth = 1.5;
  ctx.stroke();

  // крышка с ободом
  const lidY = bodyTop, lidRX = wTop*0.62, lidRY = h*0.055;
  ctx.fillStyle = '#6d7178';
  ctx.beginPath(); ctx.ellipse(dx + (wBot-wTop)/2 + wTop/2, lidY, lidRX, lidRY, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#b6bac0';
  ctx.beginPath(); ctx.ellipse(dx + (wBot-wTop)/2 + wTop/2, lidY - lidRY*0.35, lidRX*0.86, lidRY*0.7, 0, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.4)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.ellipse(dx + (wBot-wTop)/2 + wTop/2, lidY, lidRX, lidRY, 0, 0, Math.PI*2); ctx.stroke();

  // торчащий мусор — мятая бумага и обломок доски
  ctx.fillStyle = '#e8dcc0';
  ctx.beginPath();
  ctx.moveTo(dx + wTop*0.35, lidY - lidRY*0.3);
  ctx.lineTo(dx + wTop*0.55, lidY - h*0.16);
  ctx.lineTo(dx + wTop*0.7,  lidY - lidRY*0.2);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.25)'; ctx.lineWidth = 1; ctx.stroke();

  ctx.restore();
}

// звёзды и луна — рисуются ДО скайлайна (см. drawBackground), поэтому
// силуэт города потом полностью перекрывает всё, что попало ниже
// открытой полосы SKY_OPEN_H; сид звёзд фиксированный (не дёргаются
// между кадрами), лёгкое мерцание по времени t (мс из rAF)
let _nightStars = null;
function drawNightSky(t){
  if (!_nightStars){
    _nightStars = [];
    let seed = 1337;
    const rnd = () => { seed = (seed*9301+49297) % 233280; return seed/233280; };
    // держим звёзды в открытой полосе неба (SKY_OPEN_H) — та же зона, где
    // луна, — чтобы все были гарантированно видны, а не спрятаны за домами
    const openFrac = SKY_OPEN_H / SKY_H;
    for (let i=0;i<80;i++){
      _nightStars.push({ x: rnd(), y: rnd()*openFrac, r: 0.5+rnd()*1.3, phase: rnd()*Math.PI*2 });
    }
  }
  ctx.save();
  // клип расширен вверх на SKY_EXTRA_TOP — это ничейный технический зазор
  // под HUD-плашкой, полностью перекрывается ею в конце кадра; используем
  // его как запас, чтобы мягкое свечение луны угасало само по себе, а не
  // обрезалось ровной линией клипа
  ctx.beginPath(); ctx.rect(0, WALL_TOP - SKY_EXTRA_TOP, CW, SKY_H + SKY_EXTRA_TOP); ctx.clip();

  // луна — маленькая и компактная, чтобы вместе с мягким свечением
  // целиком помещаться в запас над крышами даже при узкой SKY_OPEN_H
  const moonX = CW*0.83, moonR = 7, glowR = moonR*1.8;
  const moonY = (WALL_TOP - SKY_EXTRA_TOP) + glowR + 1;
  const glow = ctx.createRadialGradient(moonX, moonY, moonR*0.3, moonX, moonY, glowR);
  glow.addColorStop(0, 'rgba(255,248,214,0.4)');
  glow.addColorStop(1, 'rgba(255,248,214,0)');
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(moonX, moonY, glowR, 0, Math.PI*2); ctx.fill();

  ctx.fillStyle = '#fdf6d8';
  ctx.beginPath(); ctx.arc(moonX, moonY, moonR, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = 'rgba(196,186,148,0.55)';
  ctx.beginPath(); ctx.arc(moonX-3, moonY-2, 1.7, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(moonX+3.5, moonY+3, 1.3, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(moonX+1.5, moonY-4.5, 0.9, 0, Math.PI*2); ctx.fill();

  ctx.fillStyle = '#fff';
  for (const s of _nightStars){
    const tw = 0.5 + 0.5*Math.sin(t*0.0018 + s.phase);
    ctx.globalAlpha = 0.35 + tw*0.55;
    ctx.beginPath();
    ctx.arc(s.x*CW, WALL_TOP + s.y*SKY_H, s.r, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

function drawTiledSource(img, tile, dx, dy, dw, dh, tileScreenW, tileScreenH){
  if (!img.complete || !img.naturalWidth) return;
  const nx = Math.ceil(dw / tileScreenW) + 1;
  const ny = tileScreenH ? Math.ceil(dh / tileScreenH) + 1 : 1;
  ctx.save();
  ctx.beginPath(); ctx.rect(dx, dy, dw, dh); ctx.clip();
  for (let row = 0; row < ny; row++){
    for (let i = 0; i < nx; i++){
      ctx.drawImage(img, tile.sx, tile.sy, tile.sw, tile.sh,
        dx + i*tileScreenW, dy + row*(tileScreenH||dh), tileScreenW, tileScreenH||dh);
    }
  }
  ctx.restore();
}

function drawBackground(t) {
  // фон неба на всю полосу (в т.ч. под открытую полосу вверху) — один и
  // тот же тон NIGHT_PURPLE и здесь, и в lighten-проходе ниже, чтобы стык
  // между открытой полосой и фоном за домами не был виден
  const NIGHT_PURPLE = '#000000';
  // заливаем и технический запас SKY_EXTRA_TOP над WALL_TOP — иначе там
  // будет видна голая полоса, когда в неё зайдёт свечение луны
  ctx.fillStyle = NIGHT_PURPLE; ctx.fillRect(0, WALL_TOP - SKY_EXTRA_TOP, CW, SKY_H + SKY_EXTRA_TOP);

  // звёзды и луна рисуются ДО скайлайна — луна и часть звёзд лежат в
  // открытой полосе неба над крышами (SKY_OPEN_H), силуэт города рисуется
  // поверх нижней части и полностью перекрывает то, что попало на него
  drawNightSky(t);

  // небо/неоновый скайлайн (back.png, тайлится по ширине) — прижат к низу
  // полосы SKY_H и сжат по высоте, чтобы наверху осталась чистая полоса
  // неба SKY_OPEN_H без домов
  const skyImgH = SKY_H - SKY_OPEN_H;
  if (imgBack.complete && imgBack.naturalWidth){
    const tw = imgBack.naturalWidth * UNIT_SCALE;
    drawTiledSource(imgBack, { sx:0, sy:0, sw:imgBack.naturalWidth, sh:imgBack.naturalHeight }, 0, WALL_TOP + SKY_OPEN_H, CW, skyImgH, tw);

    // у back.png фон за домами чисто чёрный (не фиолетовый, как хотелось) —
    // "lighten" поднимает только тёмные/чёрные пиксели до фиолетового тона,
    // яркие неоновые цвета зданий почти не трогает (max по каналам)
    ctx.save();
    ctx.beginPath(); ctx.rect(0, WALL_TOP + SKY_OPEN_H, CW, skyImgH); ctx.clip();
    ctx.globalCompositeOperation = 'lighten';
    ctx.fillStyle = NIGHT_PURPLE;
    ctx.fillRect(0, WALL_TOP + SKY_OPEN_H, CW, skyImgH);
    ctx.globalCompositeOperation = 'source-over';
    ctx.restore();
  }

  // стена дома — чередуем кусок с пиццерией и кусок с окном
  const wallY = WALL_TOP + SKY_H;
  const pizzaTileW = TILE_WALL_PIZZA.sw * UNIT_SCALE;
  if (imgTileset.complete && imgTileset.naturalWidth){
    const tw = pizzaTileW;
    let x = 0, i = 0;
    ctx.save();
    ctx.beginPath(); ctx.rect(0, wallY, CW, WALL_H); ctx.clip();
    while (x < CW + tw){
      const tile = (i % 2 === 0) ? TILE_WALL_PIZZA : TILE_WALL_WINDOW;
      ctx.drawImage(imgTileset, tile.sx, tile.sy, tile.sw, tile.sh, x, wallY, tw, WALL_H);
      x += tw; i++;
    }
    ctx.restore();
  } else {
    ctx.fillStyle = '#3a2a20'; ctx.fillRect(0, wallY, CW, WALL_H);
  }

  // козырёк/карниз крыши на стыке неба и стены — без него стена сливалась
  // с фоном и было непонятно, откуда она "начинается"; с карнизом сразу
  // видно, что это крыша одноэтажного магазина, а ночной город (back.png)
  // остаётся виден выше — как горизонт позади здания
  const ledgeH = 13;
  ctx.fillStyle = '#2b2129';
  ctx.fillRect(0, wallY - ledgeH, CW, ledgeH + 4);
  ctx.fillStyle = '#6b5f68';
  ctx.fillRect(0, wallY - ledgeH, CW, 4);
  ctx.fillStyle = 'rgba(255,220,160,0.35)';
  ctx.fillRect(0, wallY - ledgeH, CW, 1.5);
  const ledgeShadow = ctx.createLinearGradient(0, wallY + 4, 0, wallY + 20);
  ledgeShadow.addColorStop(0, 'rgba(0,0,0,0.6)');
  ledgeShadow.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = ledgeShadow;
  ctx.fillRect(0, wallY + 4, CW, 20);

  // дорога/тротуар — тайлится и по ширине, и по высоте масштабом UNIT_SCALE
  const roadH = FLOOR_BOT - FLOOR_TOP;
  if (imgTileset.complete && imgTileset.naturalWidth){
    const tw = TILE_ROAD.sw * UNIT_SCALE;
    drawTiledSource(imgTileset, TILE_ROAD, 0, FLOOR_TOP, CW, roadH, tw, ROAD_TILE_H);
  } else {
    ctx.fillStyle = '#26364a'; ctx.fillRect(0, FLOOR_TOP, CW, roadH);
  }

  // лёгкое затемнение снизу для глубины
  const g = ctx.createLinearGradient(0, FLOOR_TOP, 0, FLOOR_BOT);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.35)');
  ctx.fillStyle = g; ctx.fillRect(0, FLOOR_TOP, CW, roadH);

  // автомат с газировкой — справа от пиццерии, у стены на тротуаре;
  // низ автомата на уровне низа стены (там же, где низ пиццерии/двери)
  drawVendingMachine(pizzaTileW + 6, FLOOR_TOP + 4, 100);

  // мусорный бак — у самого левого края тротуара, подальше от двери пиццерии
  drawTrashCan(8, FLOOR_TOP + 4, 62);

  // фонари по бокам (только фонарь из fore.png, без куста) — для глубины
  if (imgFore.complete && imgFore.naturalWidth){
    const fw = TILE_LAMP.sw * UNIT_SCALE, fh = TILE_LAMP.sh * UNIT_SCALE;
    ctx.drawImage(imgFore, TILE_LAMP.sx, TILE_LAMP.sy, TILE_LAMP.sw, TILE_LAMP.sh, 18, wallY - fh*0.35, fw, fh);
    ctx.save(); ctx.scale(-1,1);
    ctx.drawImage(imgFore, TILE_LAMP.sx, TILE_LAMP.sy, TILE_LAMP.sw, TILE_LAMP.sh, -(CW-18), wallY - fh*0.35, fw, fh);
    ctx.restore();
  }
}

// все бойцы ОДНОГО размера (как totalSc в arena2) — глубина влияет только на позицию/порядок отрисовки, не на масштаб
// увеличено на 25% (было 0.85) — решили сначала зафиксировать размер бойцов,
// а карту/комнаты подгонять уже под них
const FIGHTER_SCALE = 0.85 * 1.25;

function roundRectPath(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y,   x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x,   y+h, r);
  ctx.arcTo(x,   y+h, x,   y,   r);
  ctx.arcTo(x,   y,   x+w, y,   r);
  ctx.closePath();
}

function drawFighter(v) {
  if (v.eliminated) return; // насовсем исчез с ринга

  const s = FIGHTER_SCALE;
  const cx = v.x, floorY = v.y;
  const img = (v.frames[v.animName] || v.frames.idle)[v.frameIdx];

  ctx.save();
  ctx.globalAlpha = v.alive ? 0.25 : 0.15;
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.ellipse(cx, floorY, 28*s, 7*s, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();

  const baseH = 130*s;
  let dh = baseH;
  if (img && img.complete && img.naturalWidth) {
    // некоторые кадры удара сильно шире (вытянутая рука) — ограничиваем
    // ширину, а не растягиваем, чтобы не было "кляксы"; масштаб равномерный
    const maxW = baseH*1.55;
    let scale = baseH / img.naturalHeight;
    if (img.naturalWidth*scale > maxW) scale = maxW/img.naturalWidth;
    const dw = img.naturalWidth*scale;
    dh = img.naturalHeight*scale;
    ctx.save();
    ctx.translate(cx, floorY);
    ctx.rotate(v.lean||0); // лёгкий наклон в сторону движения — заменяет отсутствующий цикл ходьбы
    // v.facing<0 значит "должен смотреть вправо". У двух базовых спрайтов
    // ПРОТИВОПОЛОЖНЫЙ дефолт в исходных файлах (проверено покадрово, по лицу
    // и волосам, не только по наклону ног): enemy_punk по умолчанию смотрит
    // влево, а brawler_girl — вправо. Флип считаем от реального дефолта
    // каждого типа, иначе один из двух персонажей всегда ходит/бьёт спиной.
    const wantsRight = v.facing < 0;
    const defaultsRight = v.baseType === 'brawler_girl';
    if (wantsRight !== defaultsRight) ctx.scale(-1,1);
    ctx.drawImage(img, -dw/2, -dh+8, dw, dh);
    ctx.restore();
  }

  const headTopY = floorY - dh + 8;
  const labelY = headTopY - 16*s;

  ctx.textAlign = 'center';
  ctx.font = `bold ${16*s}px Arial Black`;
  const tag = (v.team ? '🚩' : '') + (v.isBot ? '🤖' : '');
  const nameTxt = v.alive ? tag+v.name : tag+v.name+' 💤';

  // тёмная подложка под ником — читаемость не зависит от цвета фона за спиной
  const nameW = ctx.measureText(nameTxt).width;
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.fillRect(cx - nameW/2 - 6*s, labelY - 14*s, nameW + 12*s, 18*s);

  // уровень зрителя (медаль слева от ника) — только у реальных бойцов,
  // независимо от пояса чемпиона (можно носить и то, и другое сразу)
  const tier = (!v.isBot) ? tierOf(v.allTimeStolen||0) : null;

  if (v.isChamp && v.alive){
    // чемпион улицы — золотое свечение вокруг ника вместо обычного цвета
    // (своего золотого скина/пояса, в отличие от бокса, тут нет)
    ctx.lineWidth = 4.5*s;
    ctx.lineJoin = 'round';
    ctx.strokeStyle = 'rgba(40,20,0,0.95)';
    ctx.strokeText(nameTxt, cx, labelY);
    ctx.shadowColor = '#ffcc33';
    ctx.shadowBlur = 12*s;
    ctx.fillStyle = '#fff2b0';
    ctx.fillText(nameTxt, cx, labelY);
    ctx.shadowBlur = 0;
    ctx.fillText(nameTxt, cx, labelY);
  } else if (tier === 'gold' && v.alive){
    // золотой уровень (не чемпион) — тот же приём, но свечение слабее
    ctx.lineWidth = 4.5;
    ctx.strokeStyle = 'rgba(0,0,0,0.95)';
    ctx.strokeText(nameTxt, cx, labelY);
    ctx.shadowColor = '#ffcc33';
    ctx.shadowBlur = 6*s;
    ctx.fillStyle = '#fff2b0';
    ctx.fillText(nameTxt, cx, labelY);
    ctx.shadowBlur = 0;
  } else {
    ctx.fillStyle = v.alive ? v.color : '#888';
    ctx.strokeStyle = 'rgba(0,0,0,0.95)';
    ctx.lineWidth = 4.5;
    ctx.strokeText(nameTxt, cx, labelY);
    ctx.fillText(nameTxt, cx, labelY);
  }

  if (tier && v.alive){
    drawTierMedal(cx - nameW/2 - 12*s, labelY - 5*s, s, tier);
  }

  // ⚡ Энергия и 💪 Сила — в стиле _drawLabels из arena3.html (сердечки убраны — Энергия теперь и есть здоровье)
  ctx.font = `bold ${13*s}px Arial`;
  ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,0.9)';
  const enTxt = `❤️ ${Math.max(0,v.energy)}`;
  ctx.strokeText(enTxt, cx, labelY + 18*s);
  ctx.fillStyle = '#FF6688'; ctx.fillText(enTxt, cx, labelY + 18*s);

  const pwTxt = `💪 ${v.power}`;
  ctx.strokeText(pwTxt, cx, labelY + 36*s);
  ctx.fillStyle = '#ff9d5c'; ctx.fillText(pwTxt, cx, labelY + 36*s);
}

// ── Игровая логика: движение по рингу, столкновения, урон, нокаут ──
// урон наносит ТОЛЬКО тот, кто реально попал (один "победитель обмена" за
// столкновение, не оба одновременно — так реалистичнее)
// урон = Сила атакующего напрямую (Сила и Энергия растут из одного
// источника лайки/донаты, так что шкалы соразмерны)
function damageFor(power){ return Math.max(1, power); }

function advanceAnim(v, dt){
  const key = v.state==='walk' ? 'walk'
    : v.state==='punch' ? v.animName
    : v.state==='hurt' ? 'hurt'
    : v.state==='ko' ? 'ko'
    : 'idle';
  const def = CHAR_ANIMS[v.baseType][key];
  v.frameTimer += dt;
  const frameDur = 1000/def.fps;
  if (v.frameTimer >= frameDur){
    v.frameTimer -= frameDur;
    v.frameIdx++;
    if (v.frameIdx >= def.count) v.frameIdx = def.loop ? 0 : def.count-1;
  }
  v.animName = key;
}

function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

const KO_LINES = [
  (w,l,st)=>`⚔️ ${w} нокаутировал ${l}! (+${st}⚡)`,
  (w,l,st)=>`💥 ${w} впечатал ${l} в стену! (+${st}⚡)`,
  (w,l,st)=>`🥋 ${l} досчитался до десяти от ${w}! (+${st}⚡)`,
  (w,l,st)=>`😵 ${w} выключил свет для ${l}! (+${st}⚡)`,
  (w,l,st)=>`🌟 ${l} увидел звёзды после удара ${w}! (+${st}⚡)`,
  (w,l,st)=>`🏥 ${l} отправляется в нокдаун стараниями ${w}! (+${st}⚡)`,
];
const TIRED_LINES = [
  l=>`💦 ${l} выдохся и упал!`,
  l=>`🥵 ${l} сдулся без сил!`,
  l=>`😮‍💨 ${l} рухнул от истощения!`,
  l=>`🫠 ${l} закончился раньше боя!`,
];

function collapse(loser, winner){
  if (!loser.alive) return;
  loser.alive = false;
  loser.state = 'ko'; loser.animName = 'ko'; loser.frameIdx = 0; loser.frameTimer = 0;
  loser.koTimer = KO_FALL_MS;
  playKOSound();

  // нокаут обнуляет ВСЮ накопленную статистику реального бойца (не только
  // текущую энергию) — следующий лайк/донат от этого зрителя стартует его
  // заново с нуля, а не восстанавливает прежнюю силу
  if (!loser.isBot){
    loser.energyMax = 0; loser.energy = 0;
    loser.powerMax = 0; loser.power = 0;
  }
  if (winner){
    // урон от финального удара уже засчитан в throwPunch (за каждый удар) —
    // здесь начисляем ТОЛЬКО фиксированный бонус за сам факт нокаута
    const koBonus = 100;
    const finishingDmg = damageFor(winner.power); // только для текста фразы диктора
    winner.stolenEnergy += koBonus;
    // боты не пишутся в БД/рейтинг — бонус за нокаут и счётчик нокаутов
    // засчитываются только реальному зрителю-победителю
    if (!winner.isBot){
      winner.allTimeStolen = (winner.allTimeStolen||0) + koBonus;
      winner.kos = (winner.kos||0) + 1;
      reportStolen(winner.name, koBonus);
      reportKO(winner.name);
    }
    // диктор объявляет только реальных победителей — бот-победитель молчит
    if (!winner.isBot) pushEvent(pick(KO_LINES)(cleanNickForSpeech(winner.name), cleanNickForSpeech(loser.name), finishingDmg + koBonus), true);
  } else if (!loser.isBot) {
    pushEvent(pick(TIRED_LINES)(cleanNickForSpeech(loser.name)), true);
  }
}

// как в arena2.html: при столкновении бьют ОБА (не один случайный
// атакующий), удар ничего не стоит — ограничен только кулдауном между
// обменами. Урон = Сила напрямую, пропущенный удар ослабляет Силу
// защищавшегося на 30% от урона (в arena2 — 40%, тут 30% по договорённости).
// За один обмен каждый может попасть серией 1-3 ударов — но НЕ одним кадром:
// удары розыгрываются по одному, по очереди между бойцами, так что на
// экране видно ровно столько попаданий, сколько было по факту.
let activeExchanges = [];
const PUNCH_TICK_MS = 240; // пауза между отдельными ударами внутри серии

function startExchange(a, b){
  a.punchCooldown = 999999; b.punchCooldown = 999999;
  a.inExchange = true; b.inExchange = true;
  a.facing = b.x>=a.x ? -1 : 1;
  b.facing = a.x>=b.x ? -1 : 1;

  const hits = 1 + Math.floor(Math.random()*3);
  const queue = [];
  for (let i=0; i<hits; i++){
    // порядок внутри пары рандомный, а не всегда "a первый" - иначе тот,
    // кто оказался a по индексу спавна, всегда бьёт раньше и может убить
    // соперника до того, как дойдёт очередь до его ответного удара
    if (Math.random() < 0.5){
      queue.push({ attacker:a, defender:b });
      queue.push({ attacker:b, defender:a });
    } else {
      queue.push({ attacker:b, defender:a });
      queue.push({ attacker:a, defender:b });
    }
  }
  activeExchanges.push({ a, b, queue, idx:0, timer:0 });
}

function throwPunch(attacker, defender){
  const punchNames = CHAR_ATTACKS[attacker.baseType];
  attacker.state='punch'; attacker.animName=punchNames[Math.floor(Math.random()*punchNames.length)]; attacker.frameIdx=0; attacker.frameTimer=0; attacker.stateTimer=PUNCH_TICK_MS;
  defender.state='hurt'; defender.animName='hurt'; defender.frameIdx=0; defender.frameTimer=0; defender.stateTimer=PUNCH_TICK_MS;
  attacker.facing = defender.x>=attacker.x ? -1 : 1;
  defender.facing = attacker.x>=defender.x ? -1 : 1;

  const dmg = damageFor(attacker.power);
  // очки рейтинга — не больше, чем у защищающегося реально было энергии:
  // Сила бьёт на dmg, но "отжать" физически можно максимум то, что было
  // (иначе при избыточной Силе засчитывался бы придуманный излишек)
  const stolen = Math.min(dmg, Math.max(0, defender.energy));
  defender.energy -= dmg;
  defender.power = Math.max(1, defender.power - Math.max(1, Math.floor(dmg*0.3)));
  defender.lastAttacker = attacker;
  playPunchSound();

  // очки рейтинга — за каждый удар, сразу и безусловно (не только победителю
  // финального нокаута): отнял энергию — она сразу твоя, в любом случае
  attacker.stolenEnergy += stolen;
  if (!attacker.isBot){
    attacker.allTimeStolen = (attacker.allTimeStolen||0) + stolen;
    reportStolen(attacker.name, stolen);
  }

  if (defender.energy<=0) collapse(defender, attacker);
}

function finishExchange(ex){
  const { a, b } = ex;
  const cd = 1000 + Math.random()*500;
  a.punchCooldown = cd; b.punchCooldown = cd;
  a.inExchange = false; b.inExchange = false;
  if (a.alive) a.state = 'idle';
  if (b.alive) b.state = 'idle';
  if (a.alive && b.alive){
    const dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy)||1, push=75;
    a.tx = clamp(a.x - dx/d*push, RING.xMin, RING.xMax);
    a.ty = clamp(a.y - dy/d*push, RING.yMin, RING.yMax);
    b.tx = clamp(b.x + dx/d*push, RING.xMin, RING.xMax);
    b.ty = clamp(b.y + dy/d*push, RING.yMin, RING.yMax);
    a.wanderPause = 500; b.wanderPause = 500;
  }
}

function updateExchanges(dt){
  for (let i=activeExchanges.length-1; i>=0; i--){
    const ex = activeExchanges[i];
    ex.timer -= dt;
    if (ex.timer > 0) continue;

    if (!ex.a.alive || !ex.b.alive || ex.idx >= ex.queue.length){
      finishExchange(ex);
      activeExchanges.splice(i,1);
      continue;
    }

    const { attacker, defender } = ex.queue[ex.idx];
    ex.idx++;
    ex.timer = PUNCH_TICK_MS;
    if (attacker.alive && defender.alive) throwPunch(attacker, defender);
  }
}

function update(dt){
  for (const v of VARIANTS){
    advanceAnim(v, dt);

    if (!v.alive){
      if (!v.eliminated){
        v.koTimer -= dt;
        if (v.koTimer<=0){ v.eliminated = true; v.team = false; } // исчезает с ринга насовсем, флажок команды слетает
      }
      continue;
    }

    if (v.energy<=0){ collapse(v, v.lastAttacker); continue; } // выдохся сам по себе, не только от удара

    // 15 минут без лайков/донатов — Сила капает по 1/сек, не ниже 1
    // (ботов не касается — у них нет зрителя-владельца)
    if (!v.isBot && v.power>1 && Date.now()-v.lastActiveAt >= INACTIVITY_MS){
      v.powerDecayAcc = (v.powerDecayAcc||0) + dt;
      while (v.powerDecayAcc >= POWER_DECAY_INTERVAL_MS && v.power>1){
        v.powerDecayAcc -= POWER_DECAY_INTERVAL_MS;
        v.power -= 1;
      }
    } else if (!v.isBot){
      v.powerDecayAcc = 0;
    }

    if (v.punchCooldown>0) v.punchCooldown -= dt;

    if (v.state==='punch' || v.state==='hurt'){
      v.stateTimer -= dt;
      if (v.stateTimer<=0) v.state='idle';
      continue;
    }

    // во время серии ударов боец стоит на месте и ждёт своего следующего
    // удара/реакции — не убегает бродить между отдельными попаданиями
    if (v.inExchange) continue;

    v.wanderPause -= dt;
    const dx=v.tx-v.x, dy=v.ty-v.y, dist=Math.hypot(dx,dy);
    if (dist<6 && v.wanderPause<=0){
      v.tx = RING.xMin + Math.random()*(RING.xMax-RING.xMin);
      v.ty = RING.yMin + Math.random()*(RING.yMax-RING.yMin);
      v.wanderPause = 500 + Math.random()*1400;
    }
    if (dist>6){
      const speed = 0.05;
      v.x += (dx/dist)*speed*dt;
      v.y += (dy/dist)*speed*dt;
      v.facing = dx>=0 ? -1 : 1; // спрайт по умолчанию смотрит влево — флип нужен при движении вправо
      v.state = 'walk';
    } else {
      v.state = 'idle';
      v.lean = (v.lean||0)*0.85;
    }
  }

  // мягкое разведение — живые бойцы не должны залипать друг в друге
  const MIN_SEP = 58;
  for (let i=0;i<VARIANTS.length;i++){
    const a = VARIANTS[i];
    if (!a.alive) continue;
    for (let j=i+1;j<VARIANTS.length;j++){
      const b = VARIANTS[j];
      if (!b.alive) continue;
      const dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy)||0.001;
      if (d < MIN_SEP){
        const push = (MIN_SEP-d)/2, ux=dx/d, uy=dy/d;
        a.x = clamp(a.x-ux*push, RING.xMin, RING.xMax);
        a.y = clamp(a.y-uy*push, RING.yMin, RING.yMax);
        b.x = clamp(b.x+ux*push, RING.xMin, RING.xMax);
        b.y = clamp(b.y+uy*push, RING.yMin, RING.yMax);
      }
    }
  }

  for (let i=0;i<VARIANTS.length;i++){
    const a = VARIANTS[i];
    if (!a.alive || a.punchCooldown>0) continue;
    for (let j=i+1;j<VARIANTS.length;j++){
      const b = VARIANTS[j];
      if (!b.alive || b.punchCooldown>0) continue;
      if (a.team && b.team) continue; // свои с красным флажком друг друга не бьют
      if (Math.hypot(a.x-b.x, a.y-b.y) < FIGHT_DIST && Math.abs(a.y-b.y) < FIGHT_Y_GAP) startExchange(a,b);
    }
  }

  updateExchanges(dt);
  updateBotSpawns(dt);

  // сама очередь двигается по завершению речи (см. vSpeakNext)
}

let _lastT = 0;
function loop(t) {
  if (!_lastT) _lastT = t;
  const dt = Math.min(50, t-_lastT);
  _lastT = t;

  update(dt);

  ctx.clearRect(0,0,canvas.width,canvas.height);
  drawBackground(t);

  const sorted = [...VARIANTS].sort((a,b)=>a.y-b.y);
  for (const v of sorted) drawFighter(v);

  drawHUD();

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
