<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>🎄 Новогодний переполох</title>
<style>
html,body{margin:0;height:100%;background:#0b1530;color:#e8e8e8;font-family:Arial,sans-serif;overflow:hidden}
#stage{position:absolute;left:0;top:0;bottom:0;right:300px;overflow:hidden}
#wrap{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:0 0}
canvas{display:block;image-rendering:pixelated}
#panel{position:absolute;right:0;top:0;bottom:0;width:300px;background:#18203a;border-left:1px solid #2c3658;overflow-y:auto;padding:10px;box-sizing:border-box;font-size:13px}
#panel h3{margin:2px 0 8px;font-size:16px;color:#ffd75e}
.sec{background:#222c4c;border-radius:8px;padding:8px;margin-bottom:8px}
.sec b{color:#ffd75e}
button{background:#33406a;color:#fff;border:1px solid #4a5888;border-radius:6px;padding:5px 8px;margin:2px;cursor:pointer;font-size:12px}
button:hover{background:#43528a}
.hint{color:#8f9bc0;font-size:11px;line-height:1.35}
#statusBadge{position:absolute;left:8px;bottom:8px;font-size:12px;padding:3px 8px;border-radius:6px;background:rgba(0,0,0,.55);border:1px solid #888;display:none;z-index:5}
#statusBadge.live{color:#ff4d4d;border-color:#ff4d4d}
#statusBadge.demo{color:#FF9900;border-color:#FF9900}
#statusBadge.connecting{color:#aaa}
#statusBadge.error{color:#ff4d4d}
/* боевой режим (?username=): тест-пульт скрыт, игра на весь экран */
body.live #panel{display:none}
body.live #stage{right:0}
.ui-btn{position:fixed;z-index:99999;width:34px;height:34px;font-size:16px;padding:0;margin:0;background:rgba(0,0,0,0.55);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.25);border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center}
#backBtn{top:calc(50% - 90px);right:10px} #voiceBtn{top:calc(50% - 45px);right:10px} #musicBtn{top:calc(50%);right:10px} #fsBtn{top:calc(50% + 45px);right:10px}
body:not(.live) .ui-btn{right:310px}
#soundBtn{position:absolute;left:50%;top:42%;transform:translateX(-50%);z-index:6;display:none;font-size:22px;padding:14px 26px;border-radius:30px;background:#c0182c;border:3px solid #ffd75e;box-shadow:0 6px 24px rgba(0,0,0,.5)}
</style>
</head>
<body>
<div id="stage"><div id="wrap"><canvas id="c" width="1080" height="1920"></canvas></div><div id="statusBadge"></div><button id="soundBtn">🔊 Нажми — включить музыку</button></div>
<button id="backBtn" class="ui-btn" title="Все игры">⌂</button>
<button id="voiceBtn" class="ui-btn" title="Голос ведущего">🗣️</button>
<button id="musicBtn" class="ui-btn" title="Музыка">🎵</button>
<button id="fsBtn" class="ui-btn" title="На весь экран">⛶</button>
<div id="panel">
  <h3>🎄 Новогодний переполох</h3>
  <div class="hint" style="margin-bottom:8px">Черновой режим: эфир имитируется, в базу ничего не пишется. Для эфира открой /newyear?username=твой_ник — пульт исчезнет.</div>
  <div class="sec"><b>Зрители</b><br>
    <button id="bAdd">+ зритель</button><button id="bAdd5">+5 зрителей</button>
    <button id="bLike">❤️ лайки случайному</button><button id="bSim">🤖 авто-эфир: вкл</button>
  </div>
  <div class="sec"><b>Подарки случайному</b><br>
    <button data-g="1">1 монета</button><button data-g="10">10</button><button data-g="99">99</button><button data-g="1000">1000</button>
  </div>
  <div class="sec"><b>Календарь (тест даты)</b><br>
    <button data-d="2026-11-05T19:00:00">5 ноября</button>
    <button data-d="2026-12-06T19:00:00">6.12 Николай</button>
    <button data-d="2026-12-15T19:00:00">15 декабря</button>
    <button data-d="2026-12-24T20:00:00">24.12 Сочельник</button>
    <button data-d="2026-12-25T19:00:00">25.12 Рождество</button>
    <button data-d="2026-12-31T23:59:40">31.12 23:59:40</button>
    <button data-d="2027-01-06T20:00:00">6.01 Сочельник</button>
    <button data-d="2027-01-07T19:00:00">7.01 Рождество</button>
    <button data-d="2027-01-13T23:59:40">13.01 23:59:40</button>
    <button data-d="">сейчас</button>
    <div class="hint" id="dateNow"></div>
  </div>
  <div class="sec"><b>Ведущий и режимы</b><br>
    <button id="bRound">⏭ конец раунда</button><button id="bMode">🔁 сменить режим</button><button id="bSay">💬 фраза ведущего</button>
  </div>
  <div class="sec"><b>Звук</b><br>
    <button id="bMusic">🎵 Музыка: вкл</button><button id="bNext">⏭ трек</button><button id="bSfx">💥 Эффекты: вкл</button>
    <div class="hint" id="trackName"></div>
  </div>
</div>
<script>
'use strict';
// ════════════════════════════════════════════════════════════════════════════
//  НОВОГОДНИЙ ПЕРЕПОЛОХ (25.10.2026) — сезонная игра ноябрь–январь.
//  Режим «Снежная битва»: зрители — эльфы, кидаются снежками вокруг ёлки.
//  Тепло = энергия (лайк +10, монета +100), Сила снежка (лайк +1, монета +10).
//  Отнятое тепло = ⭐ (топ дня, сброс в полночь по Киеву). ⭐ за всё время = уровень:
//  с 40-го уровня эльф навсегда становится Сантой, лидер дня — Золотой Санта.
//  Календарь (оба Рождества, отсчёт, салют) — по киевскому времени, тест: ?date=2026-12-31T23:59:40
// ════════════════════════════════════════════════════════════════════════════
const Q = new URLSearchParams(location.search);
const LIVE_USER = (Q.get('username') || '').replace(/^@/, '').trim();
const DEMO = !LIVE_USER;
const AUTO = DEMO && Q.has('auto');     // тест из списка игр: имитация эфира на весь экран, без пульта
if (!DEMO || AUTO) document.body.classList.add('live');
const CW = 1080, CH = 1920;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;

function applyScale(){
  const st = document.getElementById('stage');
  const w = st.clientWidth, h = st.clientHeight;
  const s = Math.min(w/CW, h/CH);
  const wrap = document.getElementById('wrap');
  wrap.style.transform = `scale(${s})`;
  wrap.style.left = Math.round((w - CW*s)/2) + 'px';
}
window.addEventListener('resize', applyScale); applyScale();

const rnd = (a,b) => a + Math.random()*(b-a);
const pick = a => a[Math.floor(Math.random()*a.length)];
const clamp = (v,a,b) => v<a?a:v>b?b:v;
function hashStr(s){ let h = 2166136261; for (let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h>>>0; }
function short(n,k){ return n.length>k ? n.slice(0,k-1)+'…' : n; }
function fmtNum(n){ return Math.floor(n).toLocaleString('ru-RU'); }

// ───────────────────────── Время по Киеву и календарь ─────────────────────────
// «стенные часы» Киева: число мс, у которого UTC-поля = местное киевское время
let TEST_WALL = null, TEST_T0 = 0;
function kyivOffsetMs(ms){
  const p = new Intl.DateTimeFormat('en-US', { timeZone:'Europe/Kyiv', hourCycle:'h23', year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', second:'2-digit' }).formatToParts(new Date(ms));
  const g = t => +p.find(x => x.type===t).value;
  return Date.UTC(g('year'), g('month')-1, g('day'), g('hour'), g('minute'), g('second')) - Math.floor(ms/1000)*1000;
}
let KYIV_OFF = kyivOffsetMs(Date.now());
setInterval(() => { KYIV_OFF = kyivOffsetMs(Date.now()); }, 60000);
function parseWall(str){
  const m = /^(\d{4})-(\d\d)-(\d\d)(?:T(\d\d):(\d\d)(?::(\d\d))?)?$/.exec(str || '');
  return m ? Date.UTC(+m[1], +m[2]-1, +m[3], +(m[4]||12), +(m[5]||0), +(m[6]||0)) : null;
}
function setTestDate(str){ const w = parseWall(str); TEST_WALL = w; TEST_T0 = Date.now(); }
if (Q.get('date')) setTestDate(Q.get('date'));
function wallNow(){ return TEST_WALL != null ? TEST_WALL + (Date.now() - TEST_T0) : Date.now() + KYIV_OFF; }

const DAY = 86400000;
const SPECIAL = {
  '12-06': { title:'🎁 День святого Николая', host:'Сегодня День святого Николая! Подарки под подушкой у всех, кто в игре!' },
  '12-19': { title:'🎁 Николай (по старому стилю)', host:'Святой Николай снова в гостях — по старому стилю!' },
  '12-24': { title:'⭐ Сочельник', host:'Сочельник! Ждём первую звезду — и за стол!', star:true, eve:true },
  '12-25': { title:'🔔 Рождество Христово', host:'С Рождеством Христовым! Хо-хо-хо!', star:true, bells:true },
  '12-31': { title:'🥂 Канун Нового года', host:'Сегодня последний день года! Готовьтесь к отсчёту!' },
  '01-01': { title:'🎆 С Новым годом!', host:'С Новым годом! Пусть всё сбудется!', star:true },
  '01-06': { title:'⭐ Сочельник', host:'Сочельник! Кутья на столе, ждём первую звезду!', star:true, eve:true },
  '01-07': { title:'🔔 Рождество Христово', host:'Христос рождается! С Рождеством!', star:true, bells:true },
  '01-13': { title:'🎶 Щедрый вечер', host:'Щедрый вечер, добрый вечер! Колядуем!', shchedryk:true },
  '01-14': { title:'🎆 Старый Новый год', host:'Со Старым Новым годом!', star:true },
};

function calendar(){
  const w = wallNow(), d = new Date(w);
  const Y = d.getUTCFullYear(), M = d.getUTCMonth()+1, D = d.getUTCDate();
  const key = String(M).padStart(2,'0') + '-' + String(D).padStart(2,'0');
  const sy = M >= 7 ? Y : Y-1;                         // год начала сезона
  const nov1 = Date.UTC(sy,10,1), dec24 = Date.UTC(sy,11,24);
  const ny = Date.UTC(sy+1,0,1), oldNy = Date.UTC(sy+1,0,14), xmas2 = Date.UTC(sy+1,0,7), xmas1 = Date.UTC(sy,11,25);
  const frac = w < nov1 ? 0 : clamp((w - nov1)/(dec24 - nov1), 0, 1);
  const sp = SPECIAL[key] || null;
  const hour = d.getUTCHours();
  const night = hour >= 17 || hour < 7 || (sp && sp.eve);
  return {
    w, Y, M, D, key, sp, hour, night,
    ornaments: w < nov1 ? 2 : Math.ceil(TREE_ORN.length * (0.06 + 0.94*frac)),
    snow: M === 10 ? 0.35 : M === 11 ? 0.65 : 1,
    star: (w >= Date.UTC(sy,11,24,17)) || (sp && sp.star),
    toNY: ny - w, toOldNY: oldNy - w, toXmas1: xmas1 - w, toXmas2: xmas2 - w,
    fireworks: (w >= ny && w < ny + 15*60000) || (w >= oldNy && w < oldNy + 10*60000),
  };
}
function plural(n, a, b, c){ n = Math.abs(n) % 100; const n1 = n % 10; if (n > 10 && n < 20) return c; if (n1 > 1 && n1 < 5) return b; if (n1 === 1) return a; return c; }
function hms(ms){ const s = Math.max(0, Math.ceil(ms/1000)); return `${String(Math.floor(s/3600)).padStart(2,'0')}:${String(Math.floor(s/60)%60).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`; }
function infoLine(c){
  if (c.toNY > 0 && c.toNY <= DAY) return '🥂 До Нового года ' + hms(c.toNY);
  if (c.toOldNY > 0 && c.toOldNY <= DAY && c.key === '01-13') return '🎆 До Старого Нового года ' + hms(c.toOldNY);
  if (c.sp) return c.sp.title;
  const alt = Math.floor(performance.now()/8000) % 2;
  const days = ms => Math.ceil(ms/DAY);
  if (c.toXmas1 > 0 && alt) return `🔔 До Рождества (25 декабря) ${days(c.toXmas1)} ${plural(days(c.toXmas1),'день','дня','дней')}`;
  if (c.toNY > 0) return `🎄 До Нового года ${days(c.toNY)} ${plural(days(c.toNY),'день','дня','дней')}`;
  if (c.toXmas2 > 0) return `🔔 До Рождества (7 января) ${days(c.toXmas2)} ${plural(days(c.toXmas2),'день','дня','дней')}`;
  if (c.toOldNY > 0) return `🎆 До Старого Нового года ${days(c.toOldNY)} ${plural(days(c.toOldNY),'день','дня','дней')}`;
  return '❄️ Зимние каникулы — играем дальше!';
}

// ───────────────────────── Уровни ─────────────────────────
// ⭐ за всё время → уровень 1..100. Порог Санты — 40 уровень (~275 тыс. ⭐), рассчитан на постоянных
// зрителей за несколько недель сезона.
const LEVEL_THRESHOLDS = Array.from({length:100}, (_, i) => i === 0 ? 0 : Math.round(60 * Math.pow(i, 2.3) / 10) * 10);
const SANTA_LEVEL = 40;
const LEVEL_RANKS = [
  { name:'Снежинка',          from:1,  to:4,   color:'#bfe3ff' },
  { name:'Эльф-новичок',      from:5,  to:9,   color:'#7fd37a' },
  { name:'Эльф-помощник',     from:10, to:14,  color:'#3fbf5f' },
  { name:'Мастер снежков',    from:15, to:19,  color:'#3fa9f5' },
  { name:'Снежный воин',      from:20, to:24,  color:'#17c9b2' },
  { name:'Ледяной ас',        from:25, to:29,  color:'#9b59f6' },
  { name:'Хранитель ёлки',    from:30, to:34,  color:'#ef4bb0' },
  { name:'Правая рука Санты', from:35, to:39,  color:'#ff8c1a' },
  { name:'Санта',             from:40, to:49,  color:'#ff2e4d' },
  { name:'Великий Санта',     from:50, to:69,  color:'#ffd700' },
  { name:'Легенда Рождества', from:70, to:100, color:'#ffffff' },
];
function levelOf(total){ total = total||0; let l = 1; for (let i=0;i<LEVEL_THRESHOLDS.length;i++){ if (total >= LEVEL_THRESHOLDS[i]) l = i+1; else break; } return l; }
function rankOfLevel(l){ return LEVEL_RANKS.find(r => l>=r.from && l<=r.to) || LEVEL_RANKS[0]; }

// ───────────────────────── Графика ─────────────────────────
const IMG = {};
function loadImg(key, src){ const im = new Image(); im.src = src; IMG[key] = im; return im; }
const SP = 'sprites/newyear/';
for (let c=0;c<8;c++) for (let b=0;b<2;b++) loadImg(`elf_${c}_${b}`, `${SP}elf_${c}_${b}.png`);
['santa_red','santa_gold','santa_blue','tree_bare','tree_full','tree_small','hmurych','holiday16'].forEach(k => loadImg(k, SP + k + '.png'));
const HOST_META = { idle:{n:16,w:162,h:256}, run:{n:11,w:211,h:266}, jump:{n:16,w:230,h:270}, dead:{n:17,w:313,h:275}, slide:{n:11,w:263,h:205} };
for (const a in HOST_META) loadImg('host_'+a, `${SP}host_${a}.webp`);
let TREE_ORN = [];
fetch(SP + 'tree_ornaments.json').then(r => r.json()).then(j => {
  // порядок появления игрушек по дням — перемешан один раз, всегда одинаково
  const arr = j.ornaments.slice(); let s = 12345;
  for (let i=arr.length-1;i>0;i--){ s = (s*1103515245+12345) & 0x7fffffff; const k = s % (i+1); [arr[i],arr[k]] = [arr[k],arr[i]]; }
  TREE_ORN = arr;
}).catch(()=>{});

// поле боя
const FIELD = { x0:60, x1:1020, y0:600, y1:1400 };
const TREE = { x:540, y:1000, sc:4.6, rx:150, ry:62 };   // y — основание ствола; rx/ry — «следа» ёлки на снегу
const S = 2.5;            // масштаб эльфов (кадр 64 → 160)
const FEET = 60;          // ступни в кадре LPC

// фоны — у каждого режима своя локация, рисуются один раз:
// битва — снежная поляна, рейд — сумеречная ледяная пустошь Хмурыча, мастерская — тёплая изба Санты
const BG = {};
function bgCanvas(){ const c = document.createElement('canvas'); c.width = CW; c.height = CH; const g = c.getContext('2d'); g.imageSmoothingEnabled = false; return [c, g]; }
function seeded(seed){ let s = seed; return () => (s = (s*16807) % 2147483647) / 2147483647; }
function bgBattle(){
  const [c, g] = bgCanvas(), r = seeded(7);
  const grd = g.createLinearGradient(0,0,0,CH); grd.addColorStop(0,'#dfeaf7'); grd.addColorStop(1,'#eef4fb');
  g.fillStyle = grd; g.fillRect(0,0,CW,CH);
  for (let i=0;i<1400;i++){ const x = r()*CW, y = r()*CH; g.fillStyle = r()<0.5 ? 'rgba(170,195,225,0.35)' : 'rgba(255,255,255,0.8)'; g.fillRect(x, y, 6 + r()*14, 3); }
  for (let i=0;i<60;i++){ const x = r()*CW, y = r()*CH; g.fillStyle = 'rgba(150,180,215,0.25)'; g.beginPath(); g.ellipse(x, y, 40+r()*80, 10+r()*16, 0, 0, Math.PI*2); g.fill(); }
  return c;
}
function iceCrystal(g, x, y, k, r){
  // кристаллы льда торчат из снега — 3-5 граней
  const n = 3 + Math.floor(r()*3);
  for (let i=0;i<n;i++){
    const h = (60 + r()*90)*k, w = (16 + r()*14)*k, ox = (i - n/2)*18*k + r()*10, lean = (r()-0.5)*0.5;
    g.save(); g.translate(x + ox, y); g.rotate(lean);
    g.fillStyle = '#5f7fc4'; g.beginPath(); g.moveTo(-w/2,0); g.lineTo(0,-h); g.lineTo(w/2,0); g.closePath(); g.fill();
    g.fillStyle = '#9fc4f5'; g.beginPath(); g.moveTo(-w/2,0); g.lineTo(0,-h); g.lineTo(0,0); g.closePath(); g.fill();
    g.fillStyle = 'rgba(255,255,255,0.7)'; g.fillRect(-w/4, -h*0.6, 3*k, h*0.35);
    g.restore();
  }
}
function deadTree(g, x, y, k){
  g.strokeStyle = '#2b2440'; g.lineCap = 'round';
  const br = (x0, y0, a, len, w, d) => {
    if (d > 4 || len < 8) return;
    const x1 = x0 + Math.cos(a)*len, y1 = y0 + Math.sin(a)*len;
    g.lineWidth = w; g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke();
    br(x1, y1, a - 0.5, len*0.68, w*0.65, d+1); br(x1, y1, a + 0.42, len*0.62, w*0.65, d+1);
  };
  br(x, y, -Math.PI/2, 90*k, 14*k, 0);
}
function bgRaid(){
  const [c, g] = bgCanvas(), r = seeded(31);
  // небо в сумерках сверху, ниже — синий снег пустоши
  const sky = g.createLinearGradient(0,0,0,640); sky.addColorStop(0,'#1b1838'); sky.addColorStop(1,'#4a3f7a');
  g.fillStyle = sky; g.fillRect(0,0,CW,640);
  for (let i=0;i<120;i++){ g.fillStyle = `rgba(255,255,255,${0.3 + r()*0.6})`; g.fillRect(r()*CW, r()*600, 3, 3); }
  g.fillStyle = '#efe6c8'; g.beginPath(); g.arc(880, 500, 46, 0, Math.PI*2); g.fill();
  g.fillStyle = '#4a3f7a'; g.beginPath(); g.arc(902, 488, 42, 0, Math.PI*2); g.fill();
  // зубчатые ледяные горы на горизонте
  g.fillStyle = '#2f3566'; g.beginPath(); g.moveTo(0, 640);
  for (let x=0; x<=CW; x+=60) g.lineTo(x, 560 - r()*90);
  g.lineTo(CW, 640); g.closePath(); g.fill();
  const grd = g.createLinearGradient(0,600,0,CH); grd.addColorStop(0,'#8e9bd0'); grd.addColorStop(1,'#b9c4ea');
  g.fillStyle = grd; g.fillRect(0,600,CW,CH-600);
  for (let i=0;i<1100;i++){ const x = r()*CW, y = 600 + r()*(CH-600); g.fillStyle = r()<0.5 ? 'rgba(80,90,160,0.3)' : 'rgba(230,236,255,0.55)'; g.fillRect(x, y, 6 + r()*14, 3); }
  // угольные пятна — Хмурыч разбрасывает уголь вместо подарков
  for (let i=0;i<26;i++){ const x = r()*CW, y = 640 + r()*(CH-700); g.fillStyle = 'rgba(40,36,60,0.35)'; g.beginPath(); g.ellipse(x, y, 20+r()*40, 6+r()*10, 0, 0, Math.PI*2); g.fill();

const DECOR = [[40,520],[1040,500],[30,860],[1050,900],[70,1250],[1010,1290],[300,440],[790,430]];
// в мастерской вместо ёлочек по углам — горки готовых подарков

// ───────────────────────── Игроки ─────────────────────────
const players = new Map();       // ключ — ник (lowercase)

  'sonya.v','kostya_ua','masha_2012','ilya.games','liza_sun','timur_07','anya.snow','vlad_top','katyusha_k','ruslan.rs'];
// Боты: людей нет — заходят по одному раз в 15 с, до 10. Живой зритель сразу выбивает одного бота.

const BOT_MAX = 10, BOT_STEP = 15;
let botT = 0;
const BASE_WARMTH = 100, BASE_POWER = 10;

function makePlayer(name, isBot){
  const h = hashStr(name.toLowerCase());
  const side = Math.floor(Math.random()*4);
  const x = side===0 ? FIELD.x0 : side===1 ? FIELD.x1 : rnd(FIELD.x0, FIELD.x1);
  const y = side===2 ? FIELD.y0 : side===3 ? FIELD.y1 : rnd(FIELD.y0, FIELD.y1);
  return {
    name, key:name.toLowerCase(), isBot,
    color: h % 8, beard: (h >> 3) & 1,
    x, y, vx:0, vy:0, dir:2, walkT:0,
    warmth:BASE_WARMTH, warmthMax:BASE_WARMTH, power:BASE_POWER, powerMax:BASE_POWER,
    state:'walk', stateT:0, throwAt:rnd(0.5,1.5), target:null, retarget:0,
    frozenT:0, hitT:0, lastActive:performance.now(), lifetime:0, tierKnown:isBot, joinT:0, fakeLv: 1 + (h % 12),

function realPlayers(){ return [...players.values()].filter(p => !p.isBot); }

  const k = name.toLowerCase();

    p = makePlayer(name, false); players.set(k, p);
    requestTier(name);
    if (DEMO){ p.lifetime = demoLifetime[k] || 0; p.tierKnown = true; }
    floaters.push({ x:p.x, y:p.y-170, t:0, text:'❄ ' + short(name,14) + ' в игре!', color:'#1d5fa8' });

}
function botList(){ return [...players.values()].filter(p => p.isBot); }
function botTarget(){ const n = realPlayers().length; return n === 0 ? BOT_MAX : n === 1 ? 1 : 0; }
function addBot(){
  const name = pick(BOT_NAMES.filter(n => !players.has(n))) || ('elf_' + Math.floor(rnd(100, 999)));
  const b = makePlayer(name, true); players.set(b.key, b);

function replaceBot(){ const bots = botList(); if (bots.length) removeBot(pick(bots)); }
function updateBots(dt){
  botT -= dt;

  if (botT > 0) return;
  if (n < want){ addBot(); botT = BOT_STEP; }

}
function isSanta(p){ return !p.isBot && levelOf(p.lifetime) >= SANTA_LEVEL; }
function isGolden(p){ return !p.isBot && dayLeader && dayLeader.toLowerCase() === p.key; }
function skinOf(p){

// рост от лайков/подарков — как в Street Fighters: растёт и текущее, и максимум
function onLike(name, count){

function onGift(name, coins){

  p.volley = Math.min(5, 1 + Math.floor(Math.log10(coins+1)*1.5));   // залп снежков сразу
  if (modeNow().id === 'shop'){
    // в мастерской монета — готовый подарок в руки сразу; крупный донат считается за несколько

// ───────────────────────── Бой ─────────────────────────
function treeBlocks(x1,y1,x2,y2){
  // пересекает ли отрезок «след» ёлки (эллипс)
  const ax = (x1-TREE.x)/TREE.rx, ay = (y1-TREE.y)/TREE.ry, bx = (x2-TREE.x)/TREE.rx, by = (y2-TREE.y)/TREE.ry;
  const dx = bx-ax, dy = by-ay, L = dx*dx+dy*dy || 1;
  const t = clamp(-(ax*dx+ay*dy)/L, 0, 1);
  const cx = ax+dx*t, cy = ay+dy*t;
  return cx*cx+cy*cy < 1;
}
function dist(a,b){ return Math.hypot(a.x-b.x, (a.y-b.y)*1.3); }
function chooseTarget(p){
  let best = null, bd = 1e9;
  for (const q of players.values()){
    if (q === p || q.state === 'frozen') continue;
    let d = dist(p,q) + (treeBlocks(p.x,p.y-40,q.x,q.y-40) ? 260 : 0) + rnd(0,120);
    if (isGolden(q)) d -= 120;       // Золотого Санту все хотят «заснежить»
    if (d < bd){ bd = d; best = q; }
  }
  return best;
}
function throwBall(p, q, big){
  const pw = p.power * (big ? 1 : 1);
  const r = 9 + Math.min(18, Math.log2(pw/BASE_POWER + 1) * 4);
  const sx = p.x + (p.dir===3 ? 30 : p.dir===1 ? -30 : 0), sy = p.y - 80;
  const tx = q.x + rnd(-14,14), ty = q.y - (q === boss ? 28*BS : 60) + rnd(-10,10);
  const d = Math.hypot(tx-sx, ty-sy);
  snowballs.push({ from:p, to:q, x:sx, y:sy, sx, sy, tx, ty, t:0, dur:clamp(d/950, 0.22, 0.7), r, power:pw, arc:clamp(d*0.18, 20, 90) });
  sfxThrow();
}
function hit(b){
  const q = b.to, p = b.from;
  if (q === boss){ bossHit(b); return; }
  if (!players.has(q.key) || q.state === 'frozen'){ puff(b.tx, b.ty, 8, b.coal ? '#333' : '#ffffff'); return; }
  const dmg = Math.min(b.power, q.warmth);
  q.warmth -= dmg; q.hitT = 0.25;
  q.x += clamp(q.x - b.sx, -1, 1) * 10;
  puff(b.tx, b.ty, 10 + Math.min(20, b.r), b.coal ? '#3a3a44' : '#ffffff');
  sfxHit(b.r);
  if (players.has(p.key) && !p.isBot && dmg > 0){
    reportStolen(p.name, dmg);
    p.lifetime += dmg;
    roundPts[p.key] = (roundPts[p.key]||0) + dmg;
  }
  if (dmg >= 25) floaters.push({ x:q.x, y:q.y-150, t:0, text:'-' + fmtNum(dmg), color:'#2a7fd4' });
  if (q.warmth <= 0) freeze(q, p);
}
function freeze(q, by){
  q.state = 'frozen'; q.frozenT = 6; q.warmth = 0;
  puff(q.x, q.y-60, 30, '#e6f4ff'); sfxFreeze();
  if (by && !by.isBot && players.has(by.key)){
    reportKO(by.name);
    if (!q.isBot && Math.random() < 0.5) hostSay(pick([
      `${short(by.name,14)} заморозил ${short(q.name,14)}!`, `Бррр! ${short(q.name,14)} теперь снеговик!`, `${short(q.name,14)}, оттаивай скорее!`]), 'idle', 3, 'freeze');
  }
}
function thaw(q){
  // лишний бот после заморозки уходит с поля, а не оттаивает
  if (q.isBot && botList().length > botTarget()){ removeBot(q); return; }
  // нокаут обнуляет бойца — как в Street Fighters
  q.state = 'walk'; q.warmth = q.warmthMax = BASE_WARMTH; q.power = q.powerMax = BASE_POWER;
  puff(q.x, q.y-60, 16, '#ffffff');
}
function puff(x, y, n, color){
  for (let i=0;i<n;i++){ const a = rnd(0, Math.PI*2), s = rnd(60, 260); particles.push({ x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s - 80, t:0, life:rnd(0.35,0.8), r:rnd(3,8), color }); }
}

function updatePlayer(p, dt){
  if (p.hitT > 0) p.hitT -= dt;
  if (p.state === 'frozen'){ p.frozenT -= dt; if (p.frozenT <= 0) thaw(p); return; }
  const raidMode = modeNow().id === 'raid', shopMode = modeNow().id === 'shop';
  if (shopMode) p.target = null;
  else if (raidMode) p.target = bossFightable() ? boss : null;
  else {
    p.retarget -= dt;
    if (!p.target || p.target === boss || p.retarget <= 0 || !players.has(p.target.key) || p.target.state === 'frozen'){ p.target = chooseTarget(p); p.retarget = rnd(2.5, 5); }
  }
  const q = p.target;
  let mx = 0, my = 0;
  if (shopMode && p.state !== 'throw'){
    const v = shopStep(p, dt);
    if (!v){ p.moving = false; return; }
    mx = v[0]; my = v[1];
  } else if (p.state === 'throw'){
    p.stateT += dt;
    if (!p.released && p.stateT >= 0.32){ p.released = true; if (q && (q === boss ? bossFightable() : players.has(q.key))) throwBall(p, q); }
    if (p.stateT >= 0.55){
      p.state = 'walk';
      if (p.volley > 1 && q){ p.volley--; p.state = 'throw'; p.stateT = 0.18; p.released = false; }
      else p.volley = 0;
    }
  } else if (q && q === boss){
    // встаём кольцом вокруг Хмурыча, у каждого своё место на кольце
    const a = (hashStr(p.key) % 360) * Math.PI/180 + time*0.05;
    const gx = clamp(boss.x + Math.cos(a)*420, FIELD.x0, FIELD.x1), gy = clamp(boss.y + Math.sin(a)*280, FIELD.y0, FIELD.y1);
    const dx = gx - p.x, dy = gy - p.y, d = Math.hypot(dx, dy) || 1;
    if (d > 40){ mx = dx/d; my = dy/d; }
    const bx = boss.x - p.x, by = boss.y - p.y, bd = Math.hypot(bx, by);
    const blocked = treeBlocks(p.x, p.y-40, boss.x, boss.y-80);
    p.throwAt -= dt;
    if (p.throwAt <= 0 && !blocked && bd < 700){
      p.state = 'throw'; p.stateT = 0; p.released = false; p.throwAt = rnd(1.0, 1.6);
      p.dir = Math.abs(bx) > Math.abs(by) ? (bx > 0 ? 3 : 1) : (by > 0 ? 2 : 0);
      if (!p.volley) p.volley = 1;
    }
  } else if (q){
    const dx = q.x - p.x, dy = q.y - p.y, d = Math.hypot(dx, dy) || 1;
    const blocked = treeBlocks(p.x, p.y-40, q.x, q.y-40);
    const want = 300;
    if (blocked){ mx = -dy/d * p.strafe; my = dx/d * p.strafe; mx += dx/d*0.3; my += dy/d*0.3; }
    else if (d > want + 80){ mx = dx/d; my = dy/d; }
    else if (d < want - 120){ mx = -dx/d; my = -dy/d; }
    else { mx = -dy/d * p.strafe * 0.5; my = dx/d * p.strafe * 0.5; }
    p.throwAt -= dt;
    if (p.throwAt <= 0 && !blocked && d < 560){
      p.state = 'throw'; p.stateT = 0; p.released = false; p.throwAt = rnd(1.0, 1.7);
      p.dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 3 : 1) : (dy > 0 ? 2 : 0);
      if (!p.volley) p.volley = 1;
    }
    if (Math.random() < dt*0.25) p.strafe *= -1;
  } else {
    const dx = p.wanderX - p.x, dy = p.wanderY - p.y, d = Math.hypot(dx,dy);
    if (d < 20){ p.wanderX = rnd(FIELD.x0, FIELD.x1); p.wanderY = rnd(FIELD.y0, FIELD.y1); }
    else { mx = dx/d*0.6; my = dy/d*0.6; }
  }
  // мягко тянемся к середине поля, чтобы не жаться к краям
  const fcx = (FIELD.x0+FIELD.x1)/2, fcy = (FIELD.y0+FIELD.y1)/2;
  mx += (fcx - p.x)/(FIELD.x1-FIELD.x0)*0.9; my += (fcy - p.y)/(FIELD.y1-FIELD.y0)*0.9;
  // расталкиваемся, не налезаем друг на друга
  for (const o of players.values()){
    if (o === p) continue;
    const dx = p.x - o.x, dy = (p.y - o.y)*1.6, d = Math.hypot(dx,dy);
    if (d < 90 && d > 0.01){ mx += dx/d * (90-d)/90 * 1.5; my += dy/d * (90-d)/90 * 1.0; }
  }
  if (boss){ const dx = p.x - boss.x, dy = (p.y - boss.y)*1.6, d = Math.hypot(dx,dy); if (d < 230 && d > 0.01){ mx += dx/d*2; my += dy/d*1.4; } }
  const speed = shopMode ? 230 : 150;
  const len = Math.hypot(mx, my);
  if (len > 0.05 && p.state !== 'throw'){
    const k = Math.min(1, len);
    p.x += mx/len * speed * k * dt; p.y += my/len * speed * k * dt * 0.8;
    p.walkT += dt * k;
    p.dir = Math.abs(mx) > Math.abs(my) ? (mx > 0 ? 3 : 1) : (my > 0 ? 2 : 0);
    p.moving = true;
  } else p.moving = false;
  // ёлку обходим: выталкиваем из её «следа»
  const ex = (p.x - TREE.x)/(TREE.rx+30), ey = (p.y - TREE.y)/(TREE.ry+24), e = Math.hypot(ex, ey);
  if (e < 1 && e > 0.001){ p.x = TREE.x + ex/e*(TREE.rx+30); p.y = TREE.y + ey/e*(TREE.ry+24); }
  p.x = clamp(p.x, FIELD.x0, FIELD.x1); p.y = clamp(p.y, FIELD.y0, FIELD.y1);
}

// ───────────────────────── Раунды и режимы ─────────────────────────
// Режимы идут по кругу по 20 минут, привязка к киевским часам (перезагрузка страницы не сбивает).
const MODES = [ { id:'battle', title:'СНЕЖНАЯ БИТВА', short:'битва', icon:'❄️' }, { id:'raid', title:'РЕЙД НА ХМУРЫЧА', short:'рейд', icon:'😈' },
                { id:'shop', title:'МАСТЕРСКАЯ САНТЫ', short:'мастерская', icon:'🎁' } ];
let modeOffset = 0;   // тест: ?mode=raid или кнопка на пульте
const MODE_MIN = 20;
let roundPts = {}, lastSlot = null;
function modeSlot(){ const w = wallNow(); return Math.floor(w / (MODE_MIN*60000)); }
function modeNow(){ return MODES[(modeSlot() + modeOffset) % MODES.length]; }
function modeNext(){ return MODES[(modeSlot() + modeOffset + 1) % MODES.length]; }
function modeLeftMs(){ const w = wallNow(); return (modeSlot()+1)*MODE_MIN*60000 - w; }
function endRound(){
  const best = Object.entries(roundPts).sort((a,b) => b[1]-a[1])[0];
  const pl = best && players.get(best[0]);
  const next = modeNow(), prev = MODES[(modeSlot() + modeOffset + MODES.length - 1) % MODES.length];
  hostRun(`${next.icon} ${next.title}!`, best ? `${prev.id === 'shop' ? 'Лучший мастер' : 'Лучший снайпер'} раунда — ${short(pl ? pl.name : best[0], 16)}!` : 'Новый раунд!');
  roundPts = {};
  setupMode(next);
}
function setupMode(m){
  for (const p of players.values()){ p.target = null; p.ws = null; }
  if (m.id === 'shop'){ shop = { n:1, gifts:0, goal:20, fly:null, by:{} }; newSleigh(); }
  if (m.id === 'raid'){ raid = { wave:1, gifts:GIFTS_MAX, pause:4 }; boss = null; }
  else if (boss && boss.state !== 'down'){ boss.state = 'escape'; boss.goal = { x:boss.x, y:FIELD.y0 - 260 }; }
}

// ───────────────────────── Рейд на Хмурыча ─────────────────────────
// Хмурыч тащит подарки из-под ёлки в мешок, все эльфы бьют его снежками. Отбили — подарки
// возвращаются, следующая волна сильнее. Утащил все — убегает, через 15 с приходит снова.
// ⭐ за урон по Хмурычу идут в тот же топ дня.
const GIFTS_MAX = 12, BS = 6.5;    // BS — масштаб Хмурыча (кадр 64 → 416, вдвое выше эльфа)
const GIFT_SPOTS = Array.from({length:GIFTS_MAX}, (_, i) => {
  const a = Math.PI*(0.08 + 0.84*i/(GIFTS_MAX-1)), row = i % 2;
  return { x: TREE.x - Math.cos(a)*(150 - row*40), y: TREE.y + 18 + Math.sin(a)*(34 + row*10), c: ['#d4303f','#2f7fd8','#2fa34f','#e0a325','#9b4fd4','#e0633a'][i%6], w: 40 + (i*7)%18 };
});
let raid = { wave:1, gifts:GIFTS_MAX, pause:4 }, boss = null;
function bossFightable(){ return !!boss && (boss.state === 'fight' || boss.state === 'steal' || boss.state === 'enter'); }
function spawnBoss(){
  const n = Math.max(3, players.size);
  const hpMax = Math.round((3000 + 900*n) * (1 + 0.6*(raid.wave-1)));
  raid.gifts = GIFTS_MAX;
  boss = { key:'__boss', name:'Хмурыч', isBot:true, x:rnd(300, 780), y:FIELD.y0 - 200, dir:2, walkT:0, moving:false,
    state:'enter', goal:{ x:rnd(300,780), y:FIELD.y0 + 120 }, hp:hpMax, hpMax, power:30 + 20*raid.wave,
    throwT:3, stealT:8, hitT:0, angry:false, sack:0, t:0, throwAnim:0, dmgBy:{} };
  hostSay(raid.wave === 1 ? 'Хмурыч пришёл за подарками! Бейте его снежками!' : `Хмурыч вернулся! Волна ${raid.wave} — он ещё злее!`, 'jump', 4, 'raid');
  sfxFanfare();
}
function bossGoalAroundTree(){ const a = rnd(0, Math.PI*2); return { x:clamp(TREE.x + Math.cos(a)*rnd(280,380), FIELD.x0+120, FIELD.x1-120), y:clamp(TREE.y + Math.sin(a)*rnd(170,300), FIELD.y0+180, FIELD.y1-40) }; }
function bossThrow(){
  const cands = [...players.values()].filter(q => q.state !== 'frozen' && Math.hypot(q.x-boss.x, q.y-boss.y) < 800);
  if (!cands.length) return;
  const n = boss.angry ? Math.min(3, cands.length) : 1;
  for (let k=0;k<n;k++){
    const q = cands.splice(Math.floor(Math.random()*cands.length), 1)[0];
    const sx = boss.x, sy = boss.y - 34*BS, tx = q.x, ty = q.y - 60, d = Math.hypot(tx-sx, ty-sy);
    snowballs.push({ from:boss, to:q, x:sx, y:sy, sx, sy, tx, ty, t:0, dur:clamp(d/800, 0.3, 0.85), r:16, power:boss.power, arc:clamp(d*0.25, 40, 140), coal:true });
  }
  boss.throwAnim = 0.55; boss.dir = 2; sfxThrow();
}
function bossHit(b){
  if (!bossFightable()){ puff(b.tx, b.ty, 8, '#ffffff'); return; }
  const dmg = Math.min(b.power, boss.hp), p = b.from;
  boss.hp -= dmg; boss.hitT = 0.15;
  puff(b.tx, b.ty, 10 + Math.min(20, b.r), '#ffffff'); sfxHit(b.r);
  if (players.has(p.key) && !p.isBot && dmg > 0){
    reportStolen(p.name, dmg); p.lifetime += dmg;
    roundPts[p.key] = (roundPts[p.key]||0) + dmg;
    boss.dmgBy[p.key] = (boss.dmgBy[p.key]||0) + dmg;
  }
  if (dmg >= 25) floaters.push({ x:boss.x + rnd(-60,60), y:boss.y - 56*BS, t:0, text:'-' + fmtNum(dmg), color:'#c0182c' });
  if (!boss.angry && boss.hp < boss.hpMax/2){ boss.angry = true; hostSay('Хмурыч разозлился! Кидается углём во всех!', 'idle', 3.5, 'raid'); }
  if (boss.hp <= 0){
    boss.state = 'down'; boss.t = 0;
    const best = Object.entries(boss.dmgBy).sort((a,b) => b[1]-a[1])[0];
    const bp = best && players.get(best[0]);
    raid.gifts = GIFTS_MAX;
    puff(boss.x, boss.y - 100, 60, '#fff6c8');
    for (let i=0;i<4;i++) rockets.push({ x:rnd(150, CW-150), y:CH*0.75, vy:-rnd(900,1200), ty:rnd(450, 800), color:pick(['#ff4d6d','#ffd75e','#7fd3ff','#5dff8a']) });
    hostSay(best ? `Ура! Хмурыч повержен! Больше всех снежков — ${short(bp ? bp.name : best[0], 16)}!` : 'Ура! Хмурыч повержен, подарки спасены!', 'jump', 5, 'raid');
    sfxGift(100);
  }
}
function moveBoss(dt, speed){
  const dx = boss.goal.x - boss.x, dy = boss.goal.y - boss.y, d = Math.hypot(dx, dy);
  if (d < 12){ boss.moving = false; return true; }
  boss.x += dx/d*speed*dt; boss.y += dy/d*speed*dt; boss.walkT += dt; boss.moving = true;
  boss.dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 3 : 1) : (dy > 0 ? 2 : 0);
  if (boss.state === 'fight'){
    const ex = (boss.x - TREE.x)/(TREE.rx+90), ey = (boss.y - TREE.y)/(TREE.ry+40), e = Math.hypot(ex, ey);
    if (e < 1 && e > 0.001){ boss.x = TREE.x + ex/e*(TREE.rx+90); boss.y = TREE.y + ey/e*(TREE.ry+40); }
  }
  return false;
}
function updateRaid(dt){
  if (!boss){
    if (modeNow().id !== 'raid') return;
    raid.pause -= dt; if (raid.pause <= 0) spawnBoss();
    return;
  }
  const b = boss; b.t += dt; if (b.hitT > 0) b.hitT -= dt; if (b.throwAnim > 0) b.throwAnim -= dt;
  if (b.state === 'enter'){ if (moveBoss(dt, 160)){ b.state = 'fight'; b.goal = bossGoalAroundTree(); } }
  else if (b.state === 'fight' || b.state === 'steal'){
    b.throwT -= dt;
    if (b.throwT <= 0 && b.throwAnim <= 0){ bossThrow(); b.throwT = b.angry ? rnd(1.8, 2.8) : rnd(3, 4.5); }
    if (b.throwAnim > 0) b.moving = false;
    else if (b.state === 'fight'){
      if (moveBoss(dt, 110)) b.goal = bossGoalAroundTree();
      b.stealT -= dt;
      if (b.stealT <= 0 && raid.gifts > 0){ const g = GIFT_SPOTS[raid.gifts-1]; b.state = 'steal'; b.goal = { x:g.x, y:g.y + 40 }; }
    } else if (moveBoss(dt, 150)){
      raid.gifts--; b.sack++;
      const g = GIFT_SPOTS[raid.gifts]; puff(g.x, g.y, 14, g.c); sfxThrow();
      if (raid.gifts <= 0){ b.state = 'escape'; b.goal = { x:b.x, y:FIELD.y0 - 260 }; hostSay('Хмурыч утащил все подарки и убегает!', 'dead', 4, 'raid'); }
      else { b.state = 'fight'; b.goal = bossGoalAroundTree(); b.stealT = clamp(15 - raid.wave, 9, 15);
        if (raid.gifts % 3 === 0) hostSay(`Хмурыч стащил подарок! Осталось ${raid.gifts}!`, 'idle', 3, 'raid'); }
    }
  }
  else if (b.state === 'escape'){
    if (moveBoss(dt, 240)){
      const lost = modeNow().id === 'raid' && raid.gifts <= 0;
      boss = null; raid.pause = 15;
      if (lost) hostSay('Санта уже везёт новые подарки! Готовьтесь!', 'idle', 4, 'raid');
    }
  }
  else if (b.state === 'down'){
    if (b.t > 4){ boss = null; raid.wave++; raid.pause = 12; }
  }
}
function drawSack(x, y, k){
  const r = (30 + k*4) * BS/4;
  ctx.fillStyle = '#ab7a46'; ctx.strokeStyle = '#4a2f16'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.ellipse(x, y, r, r*1.05, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#8f6236'; ctx.fillRect(x-10, y-r-14, 20, 18); ctx.strokeRect(x-10, y-r-14, 20, 18);
  if (k > 0){ ctx.fillStyle = '#d4303f'; ctx.fillRect(x-22, y-r-34, 22, 22); ctx.fillStyle = '#2f7fd8'; ctx.fillRect(x+2, y-r-28, 18, 18); }
}
function drawBoss(){
  const b = boss, im = IMG.hmurych;
  if (!im || !im.complete || !im.naturalWidth) return;
  ctx.fillStyle = 'rgba(60,90,130,0.3)'; ctx.beginPath(); ctx.ellipse(b.x, b.y, 22*BS, 6*BS, 0, 0, Math.PI*2); ctx.fill();
  let row, col;
  if (b.state === 'down'){ row = 8; col = Math.min(5, Math.floor(b.t*8)); }
  else if (b.throwAnim > 0){ row = 4 + b.dir; col = clamp(Math.floor((0.55 - b.throwAnim)/0.55*13), 0, 12); }
  else if (b.moving){ row = b.dir; col = 1 + Math.floor(b.walkT*10) % 8; }
  else { row = b.dir; col = 0; }
  const sackK = Math.min(12, b.sack), sx = b.x + (b.dir === 1 ? 18*BS : -18*BS), sy = b.y - 30*BS;
  if (b.state !== 'down' && b.dir !== 0) drawSack(sx, sy, sackK);
  const dx = Math.round(b.x - 32*BS), dy = Math.round(b.y - FEET*BS);
  ctx.drawImage(im, col*64, row*64, 64, 64, dx, dy, 64*BS, 64*BS);
  if (b.hitT > 0){ ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.6; ctx.drawImage(im, col*64, row*64, 64, 64, dx, dy, 64*BS, 64*BS); ctx.restore(); }
  if (b.state !== 'down' && b.dir === 0) drawSack(sx, sy, sackK);
  ctx.textAlign = 'center';
  strokeText(b.angry ? 'ХМУРЫЧ 😡' : 'ХМУРЫЧ', b.x, b.y - 53*BS, 'bold 38px Arial', '#2f8a3c', 7);
}
function drawGiftPile(){
  const n = modeNow().id === 'raid' ? raid.gifts : GIFTS_MAX;
  for (let i=0;i<n;i++){
    const g = GIFT_SPOTS[i], w = g.w, h = w*0.8;
    ctx.fillStyle = g.c; ctx.strokeStyle = 'rgba(0,0,0,0.45)'; ctx.lineWidth = 3;
    ctx.fillRect(g.x - w/2, g.y - h, w, h); ctx.strokeRect(g.x - w/2, g.y - h, w, h);
    ctx.fillStyle = '#ffe27a'; ctx.fillRect(g.x - 4, g.y - h, 8, h); ctx.fillRect(g.x - w/2, g.y - h*0.55, w, 7);
  }
}
function drawRaidBar(){
  if (modeNow().id !== 'raid') return;
  const x = 90, y = 412, w = CW - 180, h = 46;
  ctx.fillStyle = 'rgba(14,26,52,0.9)'; roundRect(ctx, x-6, y-6, w+12, h+12, 14); ctx.fill();
  if (boss && boss.state !== 'escape'){
    const f = clamp(boss.hp / boss.hpMax, 0, 1);
    ctx.fillStyle = '#3a1520'; ctx.fillRect(x, y, w, h);
    ctx.fillStyle = boss.angry ? '#ff3b4f' : '#3fbf5f'; ctx.fillRect(x, y, w*f, h);
    ctx.textAlign = 'center'; strokeText(`ХМУРЫЧ · волна ${raid.wave} · ${fmtNum(Math.max(0,boss.hp))}`, CW/2, y+34, 'bold 28px Arial', '#ffffff', 5, '#14203f');
  } else {
    ctx.textAlign = 'center'; ctx.fillStyle = '#ffe27a'; ctx.font = 'bold 28px Arial';
    ctx.fillText(`Хмурыч придёт через ${Math.max(1, Math.ceil(raid.pause))} с…`, CW/2, y+34);
  }
  ctx.textAlign = 'right'; ctx.font = 'bold 26px Arial'; ctx.fillStyle = '#ffffff'; ctx.fillText(`🎁 ${raid.gifts}/${GIFTS_MAX}`, x + w, y + h + 40);
}


// ───────────────────────── Мастерская Санты ─────────────────────────
// Каждый эльф мастерит подарок за своим верстаком и несёт его в сани. Лайк — работа быстрее,
// монета — подарок готов сразу (и считается за несколько). Сани наполнились — улетают с салютом,
// приезжают новые, побольше. ⭐ за подарок = сила × 5, в тот же топ дня.
// Сани, олени и подарки — «16x16 Holiday Sprites» (jhanson9012, CC0).
const SLEIGH = { x:200, y:720, sc:7 };
const CRAFT_TIME = 4, GIFT_VALUE = 5;
let shop = { n:1, gifts:0, goal:20, fly:null, by:{} };
function shopGoal(){ return Math.min(400, Math.round((30 + 8*Math.max(3, players.size)) * (1 + 0.3*(shop.n-1)))); }
function newSleigh(){ shop.gifts = 0; shop.by = {}; shop.goal = shopGoal(); }
// места верстаков: по бокам и снизу от ёлки (не за кроной, не у саней и не под ведущим);
// новый эльф занимает первое свободное — порядок подобран так, чтобы поле заполнялось равномерно
const BENCH_SPOTS = [[520,1190],[890,840],[150,1040],[760,710],[330,1220],[700,1210],[285,900],[900,1000],
  [420,1340],[900,680],[160,1200],[620,1340],[770,880],[300,1065],[250,1345],[130,880]].map(([x,y]) => ({ x, y }));
function wsSpot(p){
  const w = p.ws;
  if (w.slot == null){
    const taken = new Set([...players.values()].map(o => o.ws && o.ws.slot).filter(v => v != null));
    w.slot = BENCH_SPOTS.findIndex((_, i) => !taken.has(i));
    if (w.slot < 0) w.slot = hashStr(p.key) % BENCH_SPOTS.length;
  }
  return BENCH_SPOTS[w.slot];
}
// возвращает направление движения; null — эльф стоит за верстаком
function shopStep(p, dt){
  const w = p.ws || (p.ws = { ph:'go', prog:0, c:0, cnt:1 });
  if (w.ph === 'craft'){
    p.dir = 2; w.prog += dt / CRAFT_TIME;
    if (w.prog >= 1){ w.ph = 'carry'; puff(p.x, p.y - 40, 10, '#fff6c8'); }
    return null;
  }
  const t = w.ph === 'carry' ? { x:SLEIGH.x + 60, y:SLEIGH.y + 60 } : wsSpot(p);
  const dx = t.x - p.x, dy = t.y - p.y, d = Math.hypot(dx, dy) || 1;
  if (w.ph === 'carry' && d < 95){ deliverGift(p, w); w.ph = 'go'; return [0, 0]; }
  if (w.ph === 'go' && d < 25){ w.ph = 'craft'; w.prog = 0; w.c = Math.floor(Math.random()*7); w.cnt = 1; return null; }
  return [dx/d, dy/d];
}
function deliverGift(p, w){
  const val = p.power * GIFT_VALUE * w.cnt;
  if (!p.isBot){
    reportStolen(p.name, val); p.lifetime += val;
    roundPts[p.key] = (roundPts[p.key]||0) + val;
    shop.by[p.key] = (shop.by[p.key]||0) + w.cnt;
  }
  if (!shop.fly) shop.gifts += w.cnt;
  floaters.push({ x:SLEIGH.x + 40, y:SLEIGH.y - 150, t:0, text:`+${fmtNum(val)} ⭐`, color:'#d49a00' });
  puff(SLEIGH.x, SLEIGH.y - 70, 8, '#ffe27a'); sfxGift(1);
  if (!shop.fly && shop.gifts >= shop.goal) sleighFly();
}
function sleighFly(){
  const best = Object.entries(shop.by).sort((a,b) => b[1]-a[1])[0];
  const bp = best && players.get(best[0]);
  shop.fly = { t:0 };
  for (let i=0;i<5;i++) rockets.push({ x:rnd(150, CW-150), y:CH*0.75, vy:-rnd(900,1200), ty:rnd(450, 800), color:pick(['#ff4d6d','#ffd75e','#7fd3ff','#5dff8a']) });
  hostSay(best ? `Сани №${shop.n} полетели! Лучший мастер — ${short(bp ? bp.name : best[0], 16)}!` : `Сани №${shop.n} полетели! Хо-хо-хо!`, 'jump', 5, 'shop');
  sfxFanfare();
}
function updateShop(dt){
  if (!shop.fly) return;
  shop.fly.t += dt;
  if (shop.fly.t > 6){ shop.fly = null; shop.n++; newSleigh(); puff(SLEIGH.x, SLEIGH.y - 50, 30, '#ffffff'); hostSay(`Новые сани! Нужно ${shop.goal} подарков!`, 'idle', 4, 'shop'); }
}
function drawSheet(sx, sy, sw, sh, x, y, sc, flip){
  const im = IMG.holiday16; if (!im || !im.complete || !im.naturalWidth) return;
  if (flip){ ctx.save(); ctx.translate(x + sw*sc, y); ctx.scale(-1, 1); ctx.drawImage(im, sx, sy, sw, sh, 0, 0, sw*sc, sh*sc); ctx.restore(); }
  else ctx.drawImage(im, sx, sy, sw, sh, x, y, sw*sc, sh*sc);
}
function drawGiftIcon(c, x, y, sc){ drawSheet(64 + 16*c + 2, 3, 13, 13, Math.round(x - 6.5*sc), Math.round(y - 13*sc), sc); }   // x,y — низ по центру
function drawSleigh(){
  if (shop.fly) return;
  const k = SLEIGH.sc, x = SLEIGH.x, y = SLEIGH.y;
  ctx.fillStyle = 'rgba(60,90,130,0.3)'; ctx.beginPath(); ctx.ellipse(x + 60, y, 150, 22, 0, 0, Math.PI*2); ctx.fill();
  // олень впереди саней
  drawSheet(32, 2, 16, 14, x + 60, y - 14*k + 4, k);
  // подарки горкой в санях — чем полнее, тем выше
  const n = Math.min(14, Math.ceil(shop.gifts / shop.goal * 14));
  for (let i=0;i<n;i++){ const row = i < 6 ? 0 : i < 11 ? 1 : 2, col = row === 0 ? i : row === 1 ? i-6 : i-11;
    drawGiftIcon(i % 7, x - 62 + col*22 + row*14, y - 60 - row*26, 2.4); }
  drawSheet(6, 2, 20, 14, x - 20*k/2 - 10, y - 14*k + 4, k);
  ctx.textAlign = 'center'; strokeText(`САНИ №${shop.n}`, x + 20, y - 150, 'bold 26px Arial', '#c0182c', 6);
}
function drawBench(p){
  const w = p.ws, x = p.x, y = p.y + 30;
  ctx.fillStyle = '#5a3418'; ctx.fillRect(x-50, y-28, 12, 34); ctx.fillRect(x+38, y-28, 12, 34);
  ctx.fillStyle = '#8a5428'; ctx.fillRect(x-60, y-42, 120, 18);

  }
}
function drawFlyingSleigh(){
  if (!shop.fly) return;
  const t = shop.fly.t, k = 7, x = -360 + t/6 * (CW + 720), y = 540 - Math.sin(t*1.3)*40 - t*12;
  const f = Math.floor(t*10) % 4;
  for (let i=0;i<6;i++) particles.push({ x:x + rnd(0,60), y:y + 110 + rnd(-10,10), vx:-rnd(40,120), vy:rnd(-20,40), t:0, life:rnd(0.5,1.1), r:rnd(3,6), color:pick(['#ffe27a','#ffffff','#ff9db0']) });
  drawSheet(64 + f*48, 24, 48, 24, x, y, k);

function drawShopBar(){
  if (modeNow().id !== 'shop') return;
  const x = 90, y = 412, w = CW - 180, h = 46;
  ctx.fillStyle = 'rgba(14,26,52,0.9)'; roundRect(ctx, x-6, y-6, w+12, h+12, 14); ctx.fill();
  ctx.textAlign = 'center';
  if (shop.fly){ ctx.fillStyle = '#ffe27a'; ctx.font = 'bold 28px Arial'; ctx.fillText(`Сани №${shop.n} улетели! Хо-хо-хо!`, CW/2, y+34); return; }
  ctx.fillStyle = '#3a2a10'; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = '#e0a325'; ctx.fillRect(x, y, w*clamp(shop.gifts/shop.goal, 0, 1), h);
  strokeText(`САНИ №${shop.n} · 🎁 ${fmtNum(shop.gifts)} / ${fmtNum(shop.goal)}`, CW/2, y+34, 'bold 28px Arial', '#ffffff', 5, '#14203f');
}


// ───────────────────────── Ведущий Санта ─────────────────────────
const host = { anim:'idle', t:0, x:900, y:1415, bubble:null, bubbleT:0, run:null, queue:[], lineT:20, lockT:0 };
const HOST_LINES = [
  'Пишите в чат — и вы в игре!', 'Лайк — и снежок летит сильнее!', 'Каждая монетка — +10 к силе снежка!',
  'Лидер дня становится Золотым Сантой!', 'С 40-го уровня эльф навсегда становится Сантой!',
  'Прячьтесь за ёлкой от снежков!', 'Хо-хо-хо! Кто тут самый меткий?', 'Замёрз — стал снеговиком. Оттаешь через 6 секунд!',
];
// tag — фразы одного вида не копятся: новая заменяет старую в очереди; очередь не длиннее 3
function hostSay(text, anim, dur, tag){
  const m = { text, anim:anim||'idle', dur:dur||4, tag };
  const i = tag ? host.queue.findIndex(q => q.tag === tag) : -1;
  if (i >= 0) host.queue[i] = m; else host.queue.push(m);
  while (host.queue.length > 3) host.queue.shift();
}
function hostRun(banner, text){ host.run = { t:0, banner, text }; sfxFanfare(); speak(banner); }
let voiceOn = true, ruVoice = null;
function speak(t){
  if (!voiceOn || !window.speechSynthesis) return;
  try {
    const clean = t.replace(/[^\p{L}\p{N}\s.,!?—-]/gu, '').trim(); if (!clean) return;
    if (!ruVoice) ruVoice = speechSynthesis.getVoices().find(v => /^ru/i.test(v.lang)) || null;
    const u = new SpeechSynthesisUtterance(clean); u.lang = 'ru-RU'; u.pitch = 0.6; u.rate = 1.0; if (ruVoice) u.voice = ruVoice;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  } catch(e){}
}
function updateHost(dt){
  host.t += dt;
  if (host.run){
    host.run.t += dt;

    el.textContent = 'Киев: ' + w.toISOString().slice(0,19).replace('T',' ') + (TEST_WALL != null ? ' (тест)' : '');
  }, 500);
  if (!AUTO) for (let i=0;i<8;i++) onChat(DEMO_NAMES[i]);
  setInterval(() => {
    if (!simOn) return;
    const real = realPlayers();
    if (AUTO){
      // зрители приходят примерно раз в полминуты (до 7) и иногда уходят — видно, как боты уступают место
      if (real.length < 7 && Math.random() < 0.025) onChat(pick(DEMO_NAMES.filter(n => !players.has(n.toLowerCase()))) || DEMO_NAMES[0]);
      if (real.length && Math.random() < 0.005){ const q = pick(real); puff(q.x, q.y-60, 16, '#ffffff'); players.delete(q.key); }
    } else if (real.length < 12 && Math.random() < 0.15) onChat(pick(DEMO_NAMES));
    if (real.length){ const p = pick(real); onLike(p.name, Math.ceil(rnd(1,8))); if (Math.random() < 0.06) onGift(p.name, pick([1,1,1,5,10,30,99])); }
  }, 700);
  const randomReal = () => { const r = realPlayers(); return r.length ? pick(r).name : DEMO_NAMES[0]; };
  document.getElementById('bAdd').onclick = () => onChat(pick(DEMO_NAMES.filter(n => !players.has(n.toLowerCase()))) || ('elf_' + Math.floor(rnd(100,999))));
  document.getElementById('bAdd5').onclick = () => { for (let i=0;i<5;i++) onChat('elf_' + Math.floor(rnd(100,999))); };
  document.getElementById('bLike').onclick = () => onLike(randomReal(), 20);
  document.getElementById('bSim').onclick = (e) => { simOn = !simOn; e.target.textContent = '🤖 авто-эфир: ' + (simOn ? 'вкл' : 'выкл'); };
  document.querySelectorAll('[data-g]').forEach(b => b.onclick = () => onGift(randomReal(), +b.dataset.g));
  document.querySelectorAll('[data-d]').forEach(b => b.onclick = () => setTestDate(b.dataset.d));
  document.getElementById('bRound').onclick = () => endRound();
  document.getElementById('bMode').onclick = () => { modeOffset++; endRound(); };
  document.getElementById('bSay').onclick = () => { host.lineT = 0; };
  document.getElementById('bMusic').onclick = (e) => { audioInit(); setMusic(!SND.musicOn); e.target.textContent = '🎵 Музыка: ' + (SND.musicOn ? 'вкл' : 'выкл'); };
  document.getElementById('bSfx').onclick = (e) => { audioInit(); setSfx(!SND.sfxOn); e.target.textContent = '💥 Эффекты: ' + (SND.sfxOn ? 'вкл' : 'выкл'); };
  document.getElementById('bNext').onclick = () => { audioInit(); forceNext = true; if (SND.music){ SND.music.disconnect(); SND.music = SND.ac.createGain(); SND.music.gain.value = SND.musicOn ? 0.3 : 0; SND.music.connect(SND.ac.destination); } };
}

if (Q.get('mode')){ const i = MODES.findIndex(m => m.id === Q.get('mode')); if (i >= 0) modeOffset = ((i - modeSlot()) % MODES.length + MODES.length) % MODES.length; }
setupMode(modeNow());
drawBg();
hostSay('Хо-хо-хо! Добро пожаловать в Новогодний переполох!', 'jump', 5);
requestAnimationFrame(frame);
</script>
</body>
</html>
