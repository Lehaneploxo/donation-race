// плавный переход портал↔улица — фиолетовая вспышка-вихрь на пол-секунды
// вместо резкой смены фона, накрывает только зону боя (не HUD-плашку)
const PORTAL_TRANSITION_MS = 500;
let portalTransitionUntil = 0;
function startPortalTransition(){ portalTransitionUntil = performance.now() + PORTAL_TRANSITION_MS; }
function drawPortalTransition(){
  const now = performance.now();
  if (now >= portalTransitionUntil) return;
  const remain = portalTransitionUntil - now;
  const t = 1 - remain/PORTAL_TRANSITION_MS; // 0 в начале .. 1 в конце
  const alpha = t < 0.5 ? (t/0.5) : (1-t)/0.5; // нарастает к середине, гаснет к концу
  const areaH = PORTAL_CH - WALL_TOP;
  ctx.save();
  ctx.globalAlpha = Math.min(1, alpha);
  ctx.fillStyle = '#000';
  ctx.fillRect(0, WALL_TOP, CW, areaH);
  const cx = CW/2, cy = WALL_TOP + areaH/2, r = 280;
  const grad = ctx.createRadialGradient(cx,cy,0,cx,cy,r);
  grad.addColorStop(0, 'rgba(190,100,255,0.9)');
  grad.addColorStop(1, 'rgba(190,100,255,0)');
  ctx.globalAlpha = Math.min(1, alpha)*0.85;
  ctx.fillStyle = grad;
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
  ctx.restore();
}

function drawPortalCountdown(){
  const secs = Math.max(0, Math.ceil(portalTimer/1000));
  const mm = Math.floor(secs/60), ss = String(secs%60).padStart(2,'0');
  const label = portalActive ? `🌀 ПОРТАЛ FANTASY ARENA: 0:${ss}` : `🌀 Портал через ${mm}:${ss}`;
  // "Портал через X:XX" на обычной карте — покрупнее (28px), по повторной
  // просьбе пользователя (20px оказалось слишком мелко); активный баннер
  // портала остаётся 20px
  const fontPx = portalActive ? 20 : 28;
  const boxH = portalActive ? 32 : 42;
  // поднято вплотную к плашке правил (WALL_TOP уже включает свой отступ
  // от неё — 10px, см. `const WALL_TOP = PANEL_TOP + PANEL_H + 10`), но не
  // внахлёст — было +8/+27../+35, подняли на 6px
  // почти под самым краем плашки правил (её рамка заканчивается на
  // PANEL_TOP+PANEL_H=264, WALL_TOP=274 — уходим в этот технический
  // зазор, оставляя всего пару пикселей)
  const topOffset = -14;
  const baselineOffset = (portalActive ? 27 : 35) - 22;
  ctx.save();
  ctx.textAlign = 'center';
  ctx.font = `bold ${fontPx}px Arial Black`;
  const w = ctx.measureText(label).width;
  const maxW = CW-16;
  ctx.fillStyle = portalActive ? 'rgba(120,40,180,0.75)' : 'rgba(0,0,0,0.55)';
  ctx.fillRect(CW/2-Math.min(w,maxW)/2-14, WALL_TOP+topOffset, Math.min(w,maxW)+28, boxH);
  ctx.strokeStyle = 'rgba(0,0,0,0.85)'; ctx.lineWidth = 3;

  ctx.strokeStyle = vg;
  ctx.beginPath(); ctx.moveTo(CW/2,T+72); ctx.lineTo(CW/2,T+TH-6); ctx.stroke();

  // левая колонка — правила (только суть: лайк/монета/рейтинг/команда);
  // заголовок "КАК ИГРАТЬ:" убран, чтобы освободить место под строку Team
  const rules = [
    { text: '👍 1 лайк = +10❤️ +1💪',       color: '#FF6688' },
    { text: '🎁 1 монета = +100❤️ +10💪',   color: '#FFD700' },

    { text: '🚩 Напиши "Team" — заходи в команду', color: '#ff5566' },
    { text: '🎮 Напиши "skin1"-"skin5" — выбери героя', color: '#4fc3ff' },
    { text: '⏳ 5 мин тишины = 💪Сила -1/сек', color: '#ffa64d' },
  ];
  const rY = T+78, rStep = 24; // сжато с 82/28 — освободило строку снизу под телеграм-канал
  // буквы "растянуты" по высоте: берём шрифт покрупнее и сжимаем его по
  // ширине через ctx.scale(sx,1) — так же, как сделано в arena2/arena3 —
  // ширина остаётся в рамках левой колонки (не вылезает на топ-список),
  // а сама плашка не увеличивается. Шрифт увеличен с 22 до 24px по просьбе
  // (читаемость) — авто-сжатие по ширине (ruleScaleX ниже) само подстроится
  // под новый размер и не даст тексту вылезти за периметр колонки.
  const ruleFont = 'bold 24px Arial Black';
  const ruleAvailW = CW/2 - 16;

  rules.forEach(r => { ruleScaleX = Math.min(ruleScaleX, ruleAvailW / ctx.measureText(r.text).width); });

    ctx.scale(ruleScaleX, 1);
    ctx.font = ruleFont; ctx.textAlign = 'left';
    ctx.strokeStyle = 'rgba(0,0,0,0.85)'; ctx.lineWidth = 3.5;
    ctx.strokeText(r.text, 8/ruleScaleX, rY + i*rStep);
    ctx.fillStyle = r.color;
    ctx.fillText(r.text, 8/ruleScaleX, rY + i*rStep);
    ctx.restore();
  });

  // телеграм-канал — отдельной строкой под правилами, своим размером
  // шрифта (не участвует в общем ruleScaleX, чтобы не сжимать остальные
  // правила из-за длинного адреса)

    const tgText = '📱 Наш телеграм: tiktokgames777';

    ctx.strokeStyle = 'rgba(0,0,0,0.85)'; ctx.lineWidth = 3;

    ctx.fillStyle = '#4fc3ff';
    ctx.fillText(tgText, 8, rY + rules.length*rStep, ruleAvailW);
    ctx.restore();

  // правая колонка — топ по силе
  ctx.font = 'bold 12px Arial Black'; ctx.textAlign = 'center';
  ctx.strokeStyle = 'rgba(0,0,0,0.9)'; ctx.lineWidth = 3;

  // очки топа = отнятая энергия у противников ЗА ТЕКУЩИЙ ДЕНЬ (из отдельной
  // БД — _dbTop, обнуляется каждую полночь вместе с короной, см.
  // performStreetFighterWeeklyResetIfNeeded), НЕ текущая сила/энергия боя
  const top = _dbTop.slice(0,5).map(p=>({ name:p.username, stolenEnergy:p.stolen }));
  const rankColors = ['#FFD700','#C0C0C0','#CD7F32','#AAAAAA','#666666'];
  const ranks = ['1.','2.','3.','4.','5.'];
  const tX = CW/2 + 8, tY = T+108, tStep = 29;
  for (let i=0;i<top.length;i++){
    const p = top[i], y = tY + i*tStep;
    if (i===0){ ctx.fillStyle='rgba(255,215,0,0.08)'; ctx.fillRect(tX-4,y-21,CW/2-12,tStep-1); }
    ctx.font = i===0 ? 'bold 21px Arial Black' : 'bold 19px Arial Black';
    ctx.textAlign='left'; ctx.strokeStyle='rgba(0,0,0,0.9)'; ctx.lineWidth=3.5;
    ctx.strokeText(ranks[i], tX, y);
    ctx.fillStyle=rankColors[i];
    ctx.fillText(ranks[i], tX, y);
    ctx.strokeText(p.name, tX+26, y, 148);
    ctx.fillStyle = i===0 ? '#FFE566' : '#EEEEEE';
    ctx.fillText(p.name, tX+26, y, 148);
    ctx.textAlign='right'; ctx.strokeStyle='rgba(0,0,0,0.9)'; ctx.lineWidth=3;
    ctx.font = i===0 ? 'bold 17px Arial' : 'bold 16px Arial';
    ctx.strokeText('⚡'+p.stolenEnergy, CW-8, y);
    ctx.fillStyle='#7fd3ff'; ctx.fillText('⚡'+p.stolenEnergy, CW-8, y);
  }
  ctx.font = '9px Arial'; ctx.fillStyle = 'rgba(255,255,255,0.18)';
  ctx.textAlign = 'center'; ctx.fillText('отнятая энергия за день', CW*0.75, T+TH-6);

// все бойцы ОДНОГО размера (как totalSc в arena2) — глубина влияет только на позицию/порядок отрисовки, не на масштаб
// увеличено на 25% (было 0.85) — решили сначала зафиксировать размер бойцов,
// а карту/комнаты подгонять уже под них
const FIGHTER_SCALE = 0.85 * 1.25;

function roundRectPath(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y,   x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x,   y+h, r);
  ctx.arcTo(x,   y+h, x,   y,   r);
  ctx.arcTo(x,   y,   x+w, y,   r);
  ctx.closePath();
}

// ── Процедурная анимация нокаута/падения (заменяет застывший кадр Hurt) ──
// В паке нет отдельной анимации "лежит" — раньше использовался последний
// кадр Hurt, застывающий на месте (заглушка). Теперь падение анимируется
// поворотом на 90° (спина ложится строго горизонтально на пол).
//
// ВАЖНО: за основу берём кадр IDLE, а не Hurt. Во всех PNG пака у каждого
// кадра фиксированный холст с прозрачными полями по краям, а сам силуэт
// внутри — уже. У некоторых персонажей (enemy_punk/batting_girl/brute_arms/
// bancho) кадры Hurt сами по себе нарисованы раскинутыми/широкими (у Brute
// Arms, например, силуэт Hurt — 134×72, шире чем выше — размашистый рефлекс
// на удар). При повороте на 90° такой уже широкий кадр становится узким и
// вертикальным — выглядит как будто персонаж встал, а не упал. Idle-поза
// (руки по бокам) у ВСЕХ 5 силуэтов стабильно "выше, чем шире" — только она
// даёт предсказуемый результат после поворота у любого персонажа.
const _koBBoxCache = {};
function getKOBBox(img){
  const key = img.src;
  if (_koBBoxCache[key]) return _koBBoxCache[key];
  const c = document.createElement('canvas');
  c.width = img.naturalWidth; c.height = img.naturalHeight;
  const cctx = c.getContext('2d');
  cctx.drawImage(img,0,0);
  const data = cctx.getImageData(0,0,c.width,c.height).data;
  let minX=c.width, minY=c.height, maxX=-1, maxY=-1;
  for (let y=0;y<c.height;y++){
    for (let x=0;x<c.width;x++){
      if (data[(y*c.width+x)*4+3] > 10){
        if (x<minX) minX=x; if (x>maxX) maxX=x;
        if (y<minY) minY=y; if (y>maxY) maxY=y;
      }
    }
  }
  const bbox = maxX<0 ? {x:0,y:0,w:c.width,h:c.height} : {x:minX,y:minY,w:maxX-minX+1,h:maxY-minY+1};
  _koBBoxCache[key] = bbox;
  return bbox;
}

const KO_STUMBLE_END = 300, KO_FALL_END = 650, KO_SETTLE_END = 1300;
const KO_FULL_ANGLE = Math.PI/2; // 90° — лежит строго горизонтально, одинаково у всех
function koEaseInCubic(t){ return t*t*t; }

// рисует бойца в процедурной позе падения/лежания вместо обычного кадра;
// НЕ трогает игровую логику (v.koTimer уже считается в update(), тут только
// отрисовка по текущему значению таймера). Возвращает dh для меток ниже.
function drawKOPose(v, cx, floorY, s){
  const img = (v.frames.idle && v.frames.idle[0]) || null;
  const baseH = 130*s;

  let dw = baseH*0.6, dh = baseH, bx=0, by=0, bw=dw, bh=dh;
  if (img && img.complete && img.naturalWidth){
    const maxW = baseH*1.55;
    let scale = baseH/img.naturalHeight;
    if (img.naturalWidth*scale > maxW) scale = maxW/img.naturalWidth;
    dw = img.naturalWidth*scale;
    dh = img.naturalHeight*scale;
    const bbox = getKOBBox(img);
    bx = bbox.x*scale; by = bbox.y*scale; bw = bbox.w*scale; bh = bbox.h*scale;
  }

  const t = Math.max(0, KO_FALL_MS - v.koTimer);
  const facingRight = v.facing < 0; // та же логика направления, что и в обычной отрисовке
  let angle = 0, skidX = 0, alpha = 1;

  if (t <= KO_STUMBLE_END){
    const p = t/KO_STUMBLE_END;
    angle = Math.sin(p*Math.PI*3) * 0.09 * (1-p); // мелкая тряска-шатание
  } else if (t <= KO_FALL_END){
    const p = (t-KO_STUMBLE_END)/(KO_FALL_END-KO_STUMBLE_END);
    const e = koEaseInCubic(p);
    angle = e * KO_FULL_ANGLE;
    skidX = e * (18*s) * (facingRight ? -1 : 1); // отлетает назад от направления взгляда
  } else if (t <= KO_SETTLE_END){
    const p = (t-KO_FALL_END)/(KO_SETTLE_END-KO_FALL_END);
    const wobble = Math.sin(p*Math.PI*2.2) * 0.04 * (1-p); // демпфированное доседание
    angle = Math.min(KO_FULL_ANGLE, KO_FULL_ANGLE + wobble);
    skidX = (18*s) * (facingRight ? -1 : 1);
  } else {
    const p = (t-KO_SETTLE_END)/(KO_FALL_MS-KO_SETTLE_END);
    angle = KO_FULL_ANGLE;
    skidX = (18*s) * (facingRight ? -1 : 1);
    alpha = 1 - Math.min(1,p); // fade out перед исчезновением с ринга
  }

  // доля "прижатости" к полу — пивот поднят на половину ширины РЕАЛЬНОГО
  // силуэта (bw), а не всего холста, иначе прозрачные поля вокруг
  // персонажа приподнимают его над полом на неправильную величину
  const settleP = Math.min(1, Math.abs(angle)/KO_FULL_ANGLE);
  const px = cx + skidX;
  const py = floorY - (bw/2)*settleP;
  // поворот ВСЕГДА в сторону, противоположную facingRight — падает на
  // спину, одинаково для любого силуэта
  const theta = (facingRight ? -1 : 1) * angle;

  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(px, py);
  ctx.rotate(theta);
  if (img && img.complete && img.naturalWidth){
    const defaultsRight = v.baseType === 'brawler_girl' || v.baseType === 'batting_girl'
      || v.baseType === 'brute_arms' || v.baseType === 'bancho';
    if (facingRight !== defaultsRight) ctx.scale(-1,1);
    // сдвиг так, чтобы центр НИЗА именно силуэта (bbox), а не холста, лёг
    // точно на точку опоры/поворота
    ctx.drawImage(img, -(bx+bw/2), 8-(by+bh), dw, dh);
  }
  ctx.restore();

  return dh;
}

// золотой костюм чемпиона прошлой недели — тонирует ЛЮБОЙ выбранный спрайт
// целиком (силуэт не меняется). Рисуем через офскрин-буфер: source-atop
// прямо на основном canvas красил бы весь прямоугольник (там уже
// непрозрачный фон под спрайтом), а не только пиксели персонажа — поэтому
// сначала переносим кадр на отдельный прозрачный canvas и тонируем ТАМ.
// Один переиспользуемый буфер (не новый canvas каждый кадр) — чемпион
// прошлой недели всегда только один на ринге, так что это дёшево.
const _tintCanvas = document.createElement('canvas');
const _tintCtx = _tintCanvas.getContext('2d');
function tintGold(img){
  _tintCanvas.width = img.naturalWidth;
  _tintCanvas.height = img.naturalHeight;
  _tintCtx.drawImage(img, 0, 0);
  _tintCtx.globalCompositeOperation = 'source-atop';
  _tintCtx.globalAlpha = 0.55;
  _tintCtx.fillStyle = '#ffd700';
  _tintCtx.fillRect(0, 0, _tintCanvas.width, _tintCanvas.height);
  _tintCtx.globalCompositeOperation = 'source-over';
  _tintCtx.globalAlpha = 1;
  return _tintCanvas;
}

function drawFighter(v) {
  if (v.eliminated) return; // насовсем исчез с ринга
  if (v.isBoss) { drawPortalBoss(v); return; }

  const s = FIGHTER_SCALE;
  const cx = v.x, floorY = v.y;
  const img = (v.frames[v.animName] || v.frames.idle)[v.frameIdx];

  ctx.save();
  ctx.globalAlpha = v.alive ? 0.25 : 0.15;
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.ellipse(cx, floorY, 28*s, 7*s, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();

  const baseH = 130*s;
  let dh = baseH;
  if (v.state === 'ko') {
    // падение/лежание — процедурный поворот вместо застывшего кадра Hurt
    dh = drawKOPose(v, cx, floorY, s);
  } else if (img && img.complete && img.naturalWidth) {
    // некоторые кадры удара сильно шире (вытянутая рука) — ограничиваем
    // ширину, а не растягиваем, чтобы не было "кляксы"; масштаб равномерный
    const maxW = baseH*1.55;
    let scale = baseH / img.naturalHeight;
    if (img.naturalWidth*scale > maxW) scale = maxW/img.naturalWidth;
    const dw = img.naturalWidth*scale;
    dh = img.naturalHeight*scale;
    ctx.save();
    ctx.translate(cx, floorY);
    ctx.rotate(v.lean||0); // лёгкий наклон в сторону движения — заменяет отсутствующий цикл ходьбы
    // v.facing<0 значит "должен смотреть вправо". У базовых спрайтов
    // ПРОТИВОПОЛОЖНЫЙ дефолт в исходных файлах — проверено ЖИВЫМ тестом
    // (принудительная ходьба в игре, не по одному кадру стойки — на стоячем
    // кадре направление легко спутать с наклоном позы): enemy_punk по
    // умолчанию смотрит влево; brawler_girl и все три Urban Brawlers
    // (batting_girl/brute_arms/bancho) — вправо. Флип считаем от реального
    // дефолта каждого типа, иначе кто-то из бойцов всегда ходит/бьёт спиной.
    const wantsRight = v.facing < 0;
    const defaultsRight = v.baseType === 'brawler_girl' || v.baseType === 'batting_girl'
      || v.baseType === 'brute_arms' || v.baseType === 'bancho';
    if (wantsRight !== defaultsRight) ctx.scale(-1,1);
    if (v.isChamp && v.alive){
      ctx.drawImage(tintGold(img), -dw/2, -dh+8, dw, dh);
    } else {
      ctx.drawImage(img, -dw/2, -dh+8, dw, dh);
    }
    ctx.restore();
  }

  const headTopY = floorY - dh + 8;
  const labelY = headTopY - 16*s;

  ctx.textAlign = 'center';
  ctx.font = `bold ${16*s}px Arial Black`;
  const tag = (v.team ? '🚩' : '') + (v.isBot ? '🤖' : '');
  // корона у короля улиц — справа от ника, прямо на арене (не только в
  // топ-листе/карточке рейтинга). Считается частью nameTxt ДО замера
  // ширины (nameW), чтобы тёмная подложка под ником тоже растянулась под неё.
  const crownTag = (v.isChamp && v.alive) ? ' 👑' : '';
  const nameTxt = v.alive ? tag+v.name+crownTag : tag+v.name+' 💤';

  // тёмная подложка под ником — читаемость не зависит от цвета фона за спиной
  const nameW = ctx.measureText(nameTxt).width;
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.fillRect(cx - nameW/2 - 6*s, labelY - 14*s, nameW + 12*s, 18*s);

  // уровень зрителя (бейдж слева от ника) — только у реальных бойцов,
  // независимо от короны чемпиона (можно носить и то, и другое сразу)
  const level = (!v.isBot) ? levelOf(v.allTimeStolen||0) : null;
  // порог свечения сдвинут 46→96 (19.08.2026, после расширения шкалы до 100
  // уровней) — теперь светится самый верхний ранг "Миф улиц", а не старый потолок
  const isTopRank = level!=null && level >= 96;

  if (v.isChamp && v.alive){
    // чемпион ПРОШЛОЙ недели — сплошной золотой ник, БЕЗ shadowBlur-свечения
    // (по просьбе пользователя: жрёт производительность на слабых телефонах,
    // тот же приём, что у бейджа/уровня — просто обводка+заливка)
    ctx.lineWidth = 4.5*s;
    ctx.strokeStyle = 'rgba(40,20,0,0.95)';
    ctx.strokeText(nameTxt, cx, labelY);
    ctx.fillStyle = '#FFD700';
    ctx.fillText(nameTxt, cx, labelY);
  } else if (isTopRank && v.alive){
    // топ-ранг "Легенда улиц" (не чемпион) — тот же приём, но свечение слабее
    ctx.lineWidth = 4.5;
    ctx.strokeStyle = 'rgba(0,0,0,0.95)';
    ctx.strokeText(nameTxt, cx, labelY);
    ctx.shadowColor = '#ffcc33';
    ctx.shadowBlur = 6*s;
    ctx.fillStyle = '#fff2b0';
    ctx.fillText(nameTxt, cx, labelY);
    ctx.shadowBlur = 0;
  } else {
    ctx.fillStyle = v.alive ? v.color : '#888';
    ctx.strokeStyle = 'rgba(0,0,0,0.95)';
    ctx.lineWidth = 4.5;
    ctx.strokeText(nameTxt, cx, labelY);
    ctx.fillText(nameTxt, cx, labelY);
  }

  if (level!=null && v.alive){
    drawLevelText(cx - nameW/2 - 8*s, labelY, s, level);
  }

  // ⚡ Энергия и 💪 Сила — в стиле _drawLabels из arena3.html (сердечки убраны — Энергия теперь и есть здоровье)
  ctx.font = `bold ${13*s}px Arial`;
  ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,0.9)';
  const enTxt = `❤️ ${Math.max(0,v.energy)}`;
  ctx.strokeText(enTxt, cx, labelY + 18*s);
  ctx.fillStyle = '#FF6688'; ctx.fillText(enTxt, cx, labelY + 18*s);

  const pwTxt = `💪 ${v.power}`;
  ctx.strokeText(pwTxt, cx, labelY + 36*s);
  ctx.fillStyle = '#ff9d5c'; ctx.fillText(pwTxt, cx, labelY + 36*s);
}

// ── Игровая логика: движение по рингу, столкновения, урон, нокаут ──
// урон наносит ТОЛЬКО тот, кто реально попал (один "победитель обмена" за
// столкновение, не оба одновременно — так реалистичнее)
// урон = Сила атакующего напрямую (Сила и Энергия растут из одного
// источника лайки/донаты, так что шкалы соразмерны)
function damageFor(power){ return Math.max(1, power); }

function advanceAnim(v, dt){
  const key = v.state==='walk' ? 'walk'
    : v.state==='punch' ? v.animName
    : v.state==='hurt' ? 'hurt'
    : v.state==='ko' ? 'ko'
    : 'idle';
  const def = CHAR_ANIMS[v.baseType][key];
  v.frameTimer += dt;
  const frameDur = 1000/def.fps;
  if (v.frameTimer >= frameDur){
    v.frameTimer -= frameDur;
    v.frameIdx++;
    if (v.frameIdx >= def.count) v.frameIdx = def.loop ? 0 : def.count-1;
  }
  v.animName = key;
}

function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

const KO_LINES = [
  (w,l)=>`⚔️ ${w} нокаутировал ${l}!`,
  (w,l)=>`💥 ${w} впечатал ${l} в стену!`,
  (w,l)=>`🥋 ${l} досчитался до десяти от ${w}!`,
  (w,l)=>`😵 ${w} выключил свет для ${l}!`,
  (w,l)=>`🌟 ${l} увидел звёзды после удара ${w}!`,
  (w,l)=>`🏥 ${l} отправляется в нокдаун стараниями ${w}!`,
];
const TIRED_LINES = [
  l=>`💦 ${l} выдохся и упал!`,
  l=>`🥵 ${l} сдулся без сил!`,
  l=>`😮‍💨 ${l} рухнул от истощения!`,
  l=>`🫠 ${l} закончился раньше боя!`,
];

const PORTAL_OPEN_LINES = [
  '🌀 Портал открывается! Бойцы переносятся в мир Fantasy Arena!',
  '🌀 Улицы исчезают — начинается бой в фэнтези-мире!',
  '🌀 Портал забирает бойцов в другое измерение!',
];
const PORTAL_CLOSE_LINES = [
  '🌀 Портал закрывается — возвращаемся на улицы!',
  '🌀 Фэнтези-мир исчезает, бой продолжается на привычных улицах!',
  '🌀 Портал закрыт, бойцы снова дома!',
];

function collapse(loser, winner){
  if (!loser.alive) return;
  loser.alive = false;
  loser.state = 'ko'; loser.animName = 'ko'; loser.frameIdx = 0; loser.frameTimer = 0;
  loser.koTimer = KO_FALL_MS;
  playKOSound();

  // нокаут обнуляет ВСЮ накопленную статистику реального бойца (не только
  // текущую энергию) — следующий лайк/донат от этого зрителя стартует его
  // заново с нуля, а не восстанавливает прежнюю силу
  if (!loser.isBot){
    loser.energyMax = 0; loser.energy = 0;
    loser.powerMax = 0; loser.power = 0;
  }
  if (winner){
    // очки за сам нокаут НЕ начисляются — рейтинг = чисто отнятая энергия,
    // уже засчитанная за каждый удар в throwPunch (включая добивающий).
    // Здесь только считаем счётчик нокаутов (kos), очков он не даёт.
    // боты не пишутся в БД/рейтинг — счётчик нокаутов засчитывается
    // только реальному зрителю-победителю
    if (!winner.isBot){
      winner.kos = (winner.kos||0) + 1;
      reportKO(winner.name);
    }
    // диктор объявляет только реальных победителей — бот-победитель молчит
    if (!winner.isBot) pushEvent(pick(KO_LINES)(cleanNickForSpeech(winner.name), cleanNickForSpeech(loser.name)), true);
  } else if (!loser.isBot) {
    pushEvent(pick(TIRED_LINES)(cleanNickForSpeech(loser.name)), true);
  }
}

// как в arena2.html: при столкновении бьют ОБА (не один случайный
// атакующий), удар ничего не стоит — ограничен только кулдауном между
// обменами. Урон = Сила напрямую, пропущенный удар ослабляет Силу
// защищавшегося на 30% от урона (в arena2 — 40%, тут 30% по договорённости).
// За один обмен каждый может попасть серией 1-3 ударов — но НЕ одним кадром:
// удары розыгрываются по одному, по очереди между бойцами, так что на
// экране видно ровно столько попаданий, сколько было по факту.
let activeExchanges = [];
const PUNCH_TICK_MS = 240; // пауза между отдельными ударами внутри серии

// VS-карточка (фишка из Fantasy Arena, 29.08.2026) — когда сталкиваются
// двое САМЫХ СИЛЬНЫХ реальных зрителей (не ботов) прямо сейчас на ринге,
// по центру экрана на пару секунд всплывает баннер с именами
let vsCardA = '', vsCardB = '', vsCardUntil = 0;
function maybeTriggerVsCard(a, b){
  // только в портале (карты Fantasy Arena) — на обычных картах Street
  // Fighters VS-карточка убрана по просьбе пользователя (29.08.2026)
  if (!portalActive) return;
  if (a.isBot || b.isBot) return;
  const topTwo = VARIANTS
    .filter(v=>!v.isBot && v.alive && !v.eliminated)
    .sort((x,y)=>(y.power||0)-(x.power||0))
    .slice(0,2);
  if (topTwo.length<2) return;
  const topNames = new Set([topTwo[0].name, topTwo[1].name]);
  if (topNames.has(a.name) && topNames.has(b.name)){
    vsCardA = a.name; vsCardB = b.name;
    vsCardUntil = performance.now() + 2200;
  }
}
function drawVsCard(){
  if (performance.now() >= vsCardUntil) return;
  const remain = vsCardUntil - performance.now();
  const alpha = Math.min(1, remain/350);
  // в портале — 1:1 как в fantasy_arena.html (тот же y=405 относительно
  // WALL_TOP, тот же цвет #ff5566 без свечения); вне портала — свой стиль
  // с красным свечением, поднятый в зону ночного неба Street Fighters
  // в портале WALL_TOP+121 наезжал на бейдж "короля дня" (тот занимает
  // WALL_TOP+80..+112, см. drawWeeklyChampionBadge) — опустили ниже
  const y = portalActive ? WALL_TOP + 150 : WALL_TOP + 40;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.textAlign = 'center';
  ctx.font = '900 30px Arial Black';
  ctx.strokeStyle = 'rgba(0,0,0,0.75)'; ctx.lineWidth = 5;
  const line = `${vsCardA}  ⚔️  ${vsCardB}`;
  ctx.strokeText(line, CW/2, y, CW-20);
  if (portalActive){
    ctx.fillStyle = '#ff5566';
  } else {
    ctx.shadowColor = '#ff2020'; ctx.shadowBlur = 10;
    ctx.fillStyle = '#ff2020';
  }
  ctx.fillText(line, CW/2, y, CW-20);
  ctx.shadowBlur = 0;
  ctx.font = 'bold 14px Arial Black';
  ctx.strokeText('серьёзная схватка!', CW/2, y+20);
  ctx.fillStyle = 'rgba(255,255,255,0.75)';
  ctx.fillText('серьёзная схватка!', CW/2, y+20);
  ctx.restore();
}

function startExchange(a, b){
  maybeTriggerVsCard(a, b);
  a.punchCooldown = 999999; b.punchCooldown = 999999;
  a.inExchange = true; b.inExchange = true;
  a.facing = b.x>=a.x ? -1 : 1;
  b.facing = a.x>=b.x ? -1 : 1;

  const hits = 1 + Math.floor(Math.random()*3);
  const queue = [];
  for (let i=0; i<hits; i++){
    // порядок внутри пары рандомный, а не всегда "a первый" - иначе тот,
    // кто оказался a по индексу спавна, всегда бьёт раньше и может убить
    // соперника до того, как дойдёт очередь до его ответного удара
    if (Math.random() < 0.5){
      queue.push({ attacker:a, defender:b });
      queue.push({ attacker:b, defender:a });
    } else {
      queue.push({ attacker:b, defender:a });
      queue.push({ attacker:a, defender:b });
    }
  }
  activeExchanges.push({ a, b, queue, idx:0, timer:0 });
}

function throwPunch(attacker, defender){
  const punchNames = CHAR_ATTACKS[attacker.baseType];
  attacker.state='punch'; attacker.animName=punchNames[Math.floor(Math.random()*punchNames.length)]; attacker.frameIdx=0; attacker.frameTimer=0; attacker.stateTimer=PUNCH_TICK_MS;
  defender.state='hurt'; defender.animName='hurt'; defender.frameIdx=0; defender.frameTimer=0; defender.stateTimer=PUNCH_TICK_MS;
  attacker.facing = defender.x>=attacker.x ? -1 : 1;
  defender.facing = attacker.x>=defender.x ? -1 : 1;

  const dmg = damageFor(attacker.power);
  // очки рейтинга — не больше, чем у защищающегося реально было энергии:
  // Сила бьёт на dmg, но "отжать" физически можно максимум то, что было
  // (иначе при избыточной Силе засчитывался бы придуманный излишек)
  const stolen = Math.min(dmg, Math.max(0, defender.energy));
  defender.energy -= dmg;
  defender.power = Math.max(1, defender.power - Math.max(1, Math.floor(dmg*0.3)));
  defender.lastAttacker = attacker;
  playPunchSound();
  if (portalActive) spawnPortalDamageNumber(defender.x, defender.y-150, dmg);

  // очки рейтинга — за каждый удар, сразу и безусловно (не только победителю
  // финального нокаута): отнял энергию — она сразу твоя, в любом случае
  attacker.stolenEnergy += stolen;
  if (!attacker.isBot){
    attacker.allTimeStolen = (attacker.allTimeStolen||0) + stolen;
    reportStolen(attacker.name, stolen);
    // повышение РАНГА (не каждого уровня — см. RANK_UP_LINES) — диктор
    // объявляет целиком, не перебивая (protect=true), но не обрывая уже
    // звучащую protected-фразу правил/чемпиона (см. pushEvent)
    const newRankIdx = rankIndexOfLevel(levelOf(attacker.allTimeStolen));
    if (newRankIdx > (attacker.knownRankIdx||0)){
      attacker.knownRankIdx = newRankIdx;
      const rankName = LEVEL_RANKS[newRankIdx].name;
      pushEvent(pick(RANK_UP_LINES)(cleanNickForSpeech(attacker.name), rankName), true, true);
    }
  }

  if (defender.energy<=0) collapse(defender, attacker);
}

function finishExchange(ex){
  const { a, b } = ex;
  const cd = 1000 + Math.random()*500;
  a.punchCooldown = cd; b.punchCooldown = cd;
  a.inExchange = false; b.inExchange = false;
  if (a.alive) a.state = 'idle';
  if (b.alive) b.state = 'idle';
  if (a.alive && b.alive){
    const dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy)||1, push=75;
    a.tx = clamp(a.x - dx/d*push, RING.xMin, RING.xMax);
    a.ty = clamp(a.y - dy/d*push, RING.yMin, RING.yMax);
    b.tx = clamp(b.x + dx/d*push, RING.xMin, RING.xMax);
    b.ty = clamp(b.y + dy/d*push, RING.yMin, RING.yMax);
    a.wanderPause = 500; b.wanderPause = 500;
  }
}

function updateExchanges(dt){
  for (let i=activeExchanges.length-1; i>=0; i--){
    const ex = activeExchanges[i];
    ex.timer -= dt;
    if (ex.timer > 0) continue;

    if (!ex.a.alive || !ex.b.alive || ex.idx >= ex.queue.length){
      finishExchange(ex);
      activeExchanges.splice(i,1);
      continue;
    }

    const { attacker, defender } = ex.queue[ex.idx];
    ex.idx++;
    ex.timer = PUNCH_TICK_MS;
    if (attacker.alive && defender.alive) throwPunch(attacker, defender);
  }
}

function update(dt){
  for (const v of VARIANTS){
    advanceAnim(v, dt);

    if (!v.alive){
      if (!v.eliminated){
        v.koTimer -= dt;
        if (v.koTimer<=0){ v.eliminated = true; v.team = false; } // исчезает с ринга насовсем, флажок команды слетает
      }
      continue;
    }

    if (v.energy<=0){ collapse(v, v.lastAttacker); continue; } // выдохся сам по себе, не только от удара

    // 5 минут без лайков/донатов — Сила капает по 1/сек, не ниже 1
    // (ботов не касается — у них нет зрителя-владельца)
    if (!v.isBot && v.power>1 && Date.now()-v.lastActiveAt >= INACTIVITY_MS){
      v.powerDecayAcc = (v.powerDecayAcc||0) + dt;
      while (v.powerDecayAcc >= POWER_DECAY_INTERVAL_MS && v.power>1){
        v.powerDecayAcc -= POWER_DECAY_INTERVAL_MS;
        v.power -= 1;
      }
    } else if (!v.isBot){
      v.powerDecayAcc = 0;
    }

    if (v.punchCooldown>0) v.punchCooldown -= dt;

    if (v.state==='punch' || v.state==='hurt'){
      v.stateTimer -= dt;
      if (v.stateTimer<=0) v.state='idle';
      continue;
    }

    // во время серии ударов боец стоит на месте и ждёт своего следующего
    // удара/реакции — не убегает бродить между отдельными попаданиями
    if (v.inExchange) continue;

    v.wanderPause -= dt;
    const dx=v.tx-v.x, dy=v.ty-v.y, dist=Math.hypot(dx,dy);
    if (dist<6 && v.wanderPause<=0){
      v.tx = RING.xMin + Math.random()*(RING.xMax-RING.xMin);
      // в портале (Fantasy Arena) бойцы дерутся линейно на одной линии,
      // как там — см. PORTAL_LINE_Y ниже, а не бродят по всей площадке ринга
      v.ty = portalActive ? PORTAL_LINE_Y : (RING.yMin + Math.random()*(RING.yMax-RING.yMin));
      v.wanderPause = 500 + Math.random()*1400;
    }
    if (dist>6){
      const speed = 0.05;
      v.x += (dx/dist)*speed*dt;
      v.y += (dy/dist)*speed*dt;
      v.facing = dx>=0 ? -1 : 1; // спрайт по умолчанию смотрит влево — флип нужен при движении вправо
      v.state = 'walk';
    } else {
      v.state = 'idle';
      v.lean = (v.lean||0)*0.85;
    }
  }

  // мягкое разведение — живые бойцы не должны залипать друг в друге
  const MIN_SEP = 58;
  for (let i=0;i<VARIANTS.length;i++){
    const a = VARIANTS[i];
    if (!a.alive) continue;
    for (let j=i+1;j<VARIANTS.length;j++){
      const b = VARIANTS[j];
      if (!b.alive) continue;
      const dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy)||0.001;
      if (d < MIN_SEP){
        const push = (MIN_SEP-d)/2, ux=dx/d, uy=dy/d;
        a.x = clamp(a.x-ux*push, RING.xMin, RING.xMax);
        a.y = clamp(a.y-uy*push, RING.yMin, RING.yMax);
        b.x = clamp(b.x+ux*push, RING.xMin, RING.xMax);
        b.y = clamp(b.y+uy*push, RING.yMin, RING.yMax);
      }
    }
  }

  for (let i=0;i<VARIANTS.length;i++){
    const a = VARIANTS[i];
    if (!a.alive || a.punchCooldown>0) continue;
    for (let j=i+1;j<VARIANTS.length;j++){
      const b = VARIANTS[j];
      if (!b.alive || b.punchCooldown>0) continue;
      if (a.team && b.team) continue; // свои с красным флажком друг друга не бьют
      if (Math.hypot(a.x-b.x, a.y-b.y) < FIGHT_DIST && Math.abs(a.y-b.y) < FIGHT_Y_GAP) startExchange(a,b);
    }
  }

  updateExchanges(dt);
  updateBotSpawns(dt);

  // портал в Fantasy Arena — см. блок ПОРТАЛ выше. Пока портал активен,
  // roomSwitchTimer НЕ тикает (см. ниже) — комната Street Fighters
  // застывает на месте и возобновляется с того же момента после портала.
  portalTimer -= dt;
  if (portalActive){
    portalScrollX += PORTAL_SCROLL_SPEED*(dt/1000);
    if (portalTimer <= 0){
      portalActive = false; portalTimer = PORTAL_CYCLE_MS;
      pushEvent(pick(PORTAL_CLOSE_LINES), true);
      startPortalTransition();
      setPortalMusic(false);
      removePortalBosses();
    }
  } else if (portalTimer <= 0){
    portalActive = true;
    portalTimer = PORTAL_DURATION_MS;
    portalMapIdx = (portalMapIdx + 1) % PORTAL_MAPS.length;
    portalScrollX = 0;
    snapFightersToPortalLine();
    pushEvent(pick(PORTAL_OPEN_LINES), true);
    startPortalTransition();
    setPortalMusic(true);
    spawnPortalBoss();
  }

  // смена комнаты (фон/реквизит) каждые ROOM_SWITCH_MS — бой и бойцы не
  // сбрасываются, меняется только декорация. На паузе, пока идёт портал.
  if (!portalActive){
    roomSwitchTimer -= dt;
    if (roomSwitchTimer <= 0){
      roomIdx = (roomIdx + 1) % ROOMS.length;
      roomSwitchTimer = ROOM_SWITCH_MS;
    }
  }

  // удаляем выбывших бойцов из активного списка (см. комментарий у
  // VARIANTS выше) — реальных зрителей перед удалением кэшируем
  // (уровень/закреплённый скин), боты просто выбрасываются, им кэш не нужен
  for (let i=VARIANTS.length-1; i>=0; i--){
    const v = VARIANTS[i];
    if (!v.eliminated) continue;
    if (!v.isBot){
      _fighterCache.set(v.name, {
        allTimeStolen: v.allTimeStolen, knownRankIdx: v.knownRankIdx,
        skinChosen: v.skinChosen, dir: v.dir, baseType: v.baseType,
        color: v.color, baseDir: v.baseDir, baseColor: v.baseColor,
      });
    }
    VARIANTS.splice(i, 1);
  }

  // сама очередь двигается по завершению речи (см. vSpeakNext)
}

let _lastT = 0;
let _lastFrameT = 0;
const FRAME_INTERVAL = 1000/30; // FPS-cap: 30 кадров/сек вместо неограниченных ~60 — вдвое меньше нагрузки на CPU/GPU телефона, визуально почти незаметно
function loop(t) {
  if (t - _lastFrameT < FRAME_INTERVAL) { requestAnimationFrame(loop); return; }
  _lastFrameT = t;

  if (!_lastT) _lastT = t;
  const dt = Math.min(50, t-_lastT);
  _lastT = t;

  const _workStart = performance.now();

  update(dt);

  ctx.clearRect(0,0,canvas.width,canvas.height);
  if (portalActive) drawPortalBackground(); else drawBackground(t);

  const sorted = [...VARIANTS].sort((a,b)=>a.y-b.y);
  for (const v of sorted) drawFighter(v);

  updateDrawPortalDamageNumbers(t, dt/1000);
  drawPortalTransition();

  drawHUD();
  drawVsCard();
  drawPortalCountdown();

  updateDrawCoinRain(dt); // дождь монет крупного доната — поверх всего, на весь экран
  drawGiftBanner();

  trackPerf(performance.now() - _workStart);

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
