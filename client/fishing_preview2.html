<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>🎣 Fishing v2 — черновик визуала (улучшенный)</title>
<style>
  html, body { width:100vw; height:100vh; margin:0; background:#000; overflow:hidden; font-family:Arial,sans-serif; }
  #wrap { position:absolute; left:0; top:0; width:600px; height:1000px; transform-origin:0 0; }
  canvas { display:block; background:#000; }
  #note { position:fixed; bottom:8px; left:8px; color:rgba(255,255,255,0.4); font-size:11px; z-index:99999; }
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="600" height="1000"></canvas></div>
<div id="note">Черновик визуала v2 (улучшенное море/закат/птицы) — client/fishing_preview2.html</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const wrap = document.getElementById('wrap');
const CW = canvas.width, CH = canvas.height;

function applyScale(){
  const vw = document.documentElement.clientWidth || window.innerWidth;
  const vh = document.documentElement.clientHeight || window.innerHeight;
  const s = Math.min(vw/CW, vh/CH);
  const x = (vw - CW*s)/2, y = (vh - CH*s)/2;
  wrap.style.transform = `translate(${x}px,${y}px) scale(${s})`;
}
window.addEventListener('resize', applyScale);
applyScale();

const HORIZON_Y = 330;
const DOCK_TOP = 830;
const PANEL_TOP = 14, PANEL_H = 190;

// ── звёзды — гаснут по мере приближения к горизонту (закатное небо ещё
// светлое внизу, тёмное вверху), позиции фиксированы один раз при загрузке,
// мерцают через синус по фазе.
const STARS = Array.from({length:55}, ()=>({
  x: Math.random()*CW,
  y: Math.random()*HORIZON_Y*0.62,
  r: 0.5 + Math.random()*1.3,
  phase: Math.random()*1000,
  speed: 0.6 + Math.random()*1.2,
}));

// ── птицы — настоящая стая, летящая через экран слева-направо с разной
// скоростью/размером/прозрачностью (параллакс: дальние — мелкие, тусклые,
// медленные; ближние — крупнее и быстрее), машут крыльями (не статичные
// галочки, а V-силуэт с анимированным взмахом).
const BIRDS = Array.from({length:9}, (_,i)=>({
  x0: Math.random()*CW*2 - CW*0.5,
  y: 40 + Math.random()*(HORIZON_Y*0.55),
  size: 5 + Math.random()*7,
  speed: 0.010 + Math.random()*0.02,
  flapSpeed: 0.8 + Math.random()*0.9,
  phase: Math.random()*1000,
  alpha: 0.35 + Math.random()*0.45,
  bobAmp: 4 + Math.random()*6,
}));

// ── блики на воде — фиксированный набор искр вдоль солнечной дорожки,
// каждая мерцает независимо (не просто ряды прямоугольников, а рассыпанные
// точки разного размера — читается как настоящая рябь под закатным светом)
const SPARKLES = Array.from({length:120}, ()=>({
  u: Math.random(),          // позиция вдоль вертикали (0..1 между горизонтом и причалом)
  spread: Math.random(),     // насколько далеко от центральной дорожки
  side: Math.random()<0.5?-1:1,
  size: 1 + Math.random()*2.6,
  phase: Math.random()*1000,
  speed: 300 + Math.random()*500,
}));

function drawTopPanel(){
  const T = PANEL_TOP, TH = PANEL_H;
  const bg = ctx.createLinearGradient(0,T,0,T+TH);
  bg.addColorStop(0,'rgba(10,10,20,0.92)'); bg.addColorStop(1,'rgba(4,4,10,0.92)');
  ctx.fillStyle = bg; ctx.fillRect(0,T,CW,TH);
  ctx.strokeStyle = 'rgba(255,210,80,0.35)'; ctx.lineWidth = 1.5;
  ctx.strokeRect(2,T+2,CW-4,TH-4);

  ctx.font = 'bold 20px Arial Black'; ctx.textAlign = 'center';
  ctx.strokeStyle = 'rgba(0,0,0,0.9)'; ctx.lineWidth = 4;
  ctx.strokeText('🎣 РЫБАЛКА', CW/2, T+26);
  ctx.fillStyle = '#7fd3ff'; ctx.fillText('🎣 РЫБАЛКА', CW/2, T+26);

  const rules = [
    { text:'👍 100 лайков = 1 попытка', color:'#8fffb0' },
    { text:'🎁 1 монета = 1 попытка',   color:'#FFD700' },
  ];
  ctx.font = 'bold 16px Arial Black'; ctx.textAlign = 'left';
  rules.forEach((r,i)=>{
    const ry = T+52 + i*25;
    ctx.strokeStyle = 'rgba(0,0,0,0.85)'; ctx.lineWidth = 3;
    ctx.strokeText(r.text, 14, ry);
    ctx.fillStyle = r.color; ctx.fillText(r.text, 14, ry);
  });

  ctx.strokeStyle = 'rgba(255,255,255,0.15)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(10,T+106); ctx.lineTo(CW-10,T+106); ctx.stroke();

  ctx.font = 'bold 15px Arial Black'; ctx.textAlign = 'center';
  ctx.strokeStyle = 'rgba(0,0,0,0.9)'; ctx.lineWidth = 3;
  ctx.strokeText('🏆 ТОП ЗА СЕГОДНЯ', CW/2, T+126);
  ctx.fillStyle = '#ffd24f'; ctx.fillText('🏆 ТОП ЗА СЕГОДНЯ', CW/2, T+126);

  const DEMO_TOP_TODAY = [
    { name:'@golden_carp', count:14 },
    { name:'@rybak_88',    count:9  },
    { name:'@LehaTvel',    count:6  },
    { name:'@zritel_kek',  count:3  },
  ];
  const rankColors = ['#FFD700','#C0C0C0','#CD7F32','#AAAAAA'];
  DEMO_TOP_TODAY.forEach((p,i)=>{
    const ry = T+148 + i*18;
    ctx.font = 'bold 14px Arial Black';
    ctx.textAlign = 'left';
    ctx.strokeStyle = 'rgba(0,0,0,0.85)'; ctx.lineWidth = 2.5;
    ctx.strokeText((i+1)+'.', 16, ry);
    ctx.fillStyle = rankColors[i]; ctx.fillText((i+1)+'.', 16, ry);
    ctx.strokeText(p.name, 40, ry);
    ctx.fillStyle = '#eee'; ctx.fillText(p.name, 40, ry);
    ctx.textAlign = 'right';
    ctx.strokeText('🐟'+p.count, CW-14, ry);
    ctx.fillStyle = '#7fd3ff'; ctx.fillText('🐟'+p.count, CW-14, ry);
  });
}

// ══════════════════════════════════════════════════════════════════════
// НЕБО — больше цветовых полос (реалистичный градиент заката), звёзды
// вверху, солнце с мягкими лучами, объёмные облака со светотенью.
// ══════════════════════════════════════════════════════════════════════
function drawSky(t){
  const sky = ctx.createLinearGradient(0, 0, 0, HORIZON_Y);
  sky.addColorStop(0,    '#141033');
  sky.addColorStop(0.16, '#271a4c');
  sky.addColorStop(0.34, '#552f66');
  sky.addColorStop(0.5,  '#8a3f63');
  sky.addColorStop(0.66, '#c85a4e');
  sky.addColorStop(0.8,  '#e88a45');
  sky.addColorStop(0.92, '#f8bc5c');
  sky.addColorStop(1,    '#ffdd8a');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, CW, HORIZON_Y);

  // звёзды — видны только в верхней тёмной части, мерцают
  ctx.save();
  STARS.forEach(st=>{
    const tw = 0.4 + 0.6*Math.abs(Math.sin(t/900*st.speed + st.phase));
    const fade = 1 - Math.min(1, st.y/(HORIZON_Y*0.62)); // ярче ближе к верху
    ctx.globalAlpha = tw*fade*0.85;
    ctx.fillStyle = '#fff8e0';
    ctx.beginPath(); ctx.arc(st.x, st.y, st.r, 0, Math.PI*2); ctx.fill();
  });
  ctx.restore();

  const sunX = CW/2, sunY = HORIZON_Y - 6;

  // мягкие расходящиеся лучи солнца — медленно вращаются
  ctx.save();
  ctx.translate(sunX, sunY);
  ctx.rotate(t/40000);
  const rays = 14;
  for (let i=0;i<rays;i++){
    const a = (i/rays)*Math.PI*2;
    const len = 150 + Math.sin(t/1500 + i)*18;
    const grad = ctx.createLinearGradient(0,0, Math.cos(a)*len, Math.sin(a)*len);
    grad.addColorStop(0, 'rgba(255,224,160,0.16)');
    grad.addColorStop(1, 'rgba(255,224,160,0)');
    ctx.strokeStyle = grad;
    ctx.lineWidth = 10;
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(Math.cos(a)*len, Math.sin(a)*len); ctx.stroke();
  }
  ctx.restore();

  // само солнце, наполовину скрытое горизонтом — многослойное свечение
  const sunGrad = ctx.createRadialGradient(sunX, sunY, 4, sunX, sunY, 130);
  sunGrad.addColorStop(0,   'rgba(255,245,210,0.95)');
  sunGrad.addColorStop(0.35,'rgba(255,210,140,0.55)');
  sunGrad.addColorStop(0.7, 'rgba(255,170,110,0.22)');
  sunGrad.addColorStop(1,   'rgba(255,170,110,0)');
  ctx.fillStyle = sunGrad;
  ctx.beginPath(); ctx.arc(sunX, sunY, 130, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(sunX, sunY, 48, 0, Math.PI*2);
  const coreGrad = ctx.createRadialGradient(sunX,sunY,0,sunX,sunY,48);
  coreGrad.addColorStop(0,'#fffdf3'); coreGrad.addColorStop(1,'#ffdb8f');
  ctx.fillStyle = coreGrad; ctx.fill();

  // облака — многослойные объёмные "пельмешки" с тёплым низом/холодным верхом
  const clouds = [[70,150,60],[420,110,80],[220,60,50],[500,175,42],[30,205,36]];
  clouds.forEach(([cx,cy,r])=>{
    const drift = Math.sin(t/8000 + cx)*6;
    ctx.save();
    ctx.translate(cx+drift, cy);
    for (let i=0;i<4;i++){
      const ox = (i-1.5)*r*0.42, oy = Math.sin(i*1.7)*r*0.12;
      const rr = r*(0.55 + (i%2)*0.18);
      const g = ctx.createLinearGradient(0, oy-rr*0.4, 0, oy+rr*0.4);
      g.addColorStop(0, 'rgba(255,255,255,0.16)');
      g.addColorStop(1, 'rgba(255,200,150,0.22)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.ellipse(ox, oy, rr, rr*0.62, 0, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();
  });
}

// стая птиц — реалистичный взмах крыльев, параллакс по глубине
function drawBirds(t){
  BIRDS.forEach(b=>{
    const span = CW + 200;
    const x = (((b.x0 + t*b.speed) % span) + span) % span - 100;
    const y = b.y + Math.sin(t/1100 + b.phase)*b.bobAmp;
    const flap = Math.sin(t/110*b.flapSpeed + b.phase) * b.size*0.85;
    ctx.save();
    ctx.strokeStyle = `rgba(35,18,42,${b.alpha})`;
    ctx.lineWidth = Math.max(1, b.size*0.3);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x-b.size, y+flap*0.4);
    ctx.quadraticCurveTo(x-b.size*0.35, y-flap, x, y);
    ctx.quadraticCurveTo(x+b.size*0.35, y-flap, x+b.size, y+flap*0.4);
    ctx.stroke();
    ctx.restore();
  });
}

// ══════════════════════════════════════════════════════════════════════
// ВОДА — отражение цветов заката (не однотонный сине-зелёный, а тёплые
// тона у горизонта переходящие в глубокий синий), рассыпанные мерцающие
// блики вместо рядов прямоугольников, две волновые прослойки с пеной.
// ══════════════════════════════════════════════════════════════════════
function drawWater(t){
  const water = ctx.createLinearGradient(0, HORIZON_Y, 0, DOCK_TOP);
  water.addColorStop(0,    '#d9a06a');
  water.addColorStop(0.05, '#a97a86');
  water.addColorStop(0.16, '#5f6f92');
  water.addColorStop(0.4,  '#3a6588');
  water.addColorStop(0.7,  '#1f4a6a');
  water.addColorStop(1,    '#0c2c44');
  ctx.fillStyle = water;
  ctx.fillRect(0, HORIZON_Y, CW, DOCK_TOP-HORIZON_Y);

  const waterH = DOCK_TOP - HORIZON_Y;

  // солнечная дорожка — тёплая мягкая полоса по центру, расширяется книзу
  ctx.save();
  ctx.globalAlpha = 0.35;
  const pathGrad = ctx.createLinearGradient(0,HORIZON_Y,0,DOCK_TOP);
  pathGrad.addColorStop(0,'rgba(255,225,170,0.6)');
  pathGrad.addColorStop(1,'rgba(255,180,110,0.05)');
  ctx.fillStyle = pathGrad;
  ctx.beginPath();
  ctx.moveTo(CW/2-8, HORIZON_Y);
  ctx.lineTo(CW/2+8, HORIZON_Y);
  ctx.lineTo(CW/2+70, DOCK_TOP);
  ctx.lineTo(CW/2-70, DOCK_TOP);
  ctx.closePath(); ctx.fill();
  ctx.restore();

  // рассыпанные мерцающие блики — концентрируются у солнечной дорожки,
  // но не строгими рядами, каждая искра мигает в своём ритме
  ctx.save();
  SPARKLES.forEach(sp=>{
    const py = HORIZON_Y + sp.u*waterH;
    const widthAtY = 8 + sp.u*70; // дорожка расширяется книзу
    const px = CW/2 + sp.side*sp.spread*widthAtY;
    const tw = Math.abs(Math.sin(t/sp.speed + sp.phase));
    if (tw < 0.35) return;
    ctx.globalAlpha = tw*0.7*(1-sp.spread*0.3);
    ctx.fillStyle = sp.spread < 0.4 ? 'rgba(255,236,190,0.95)' : 'rgba(255,190,120,0.7)';
    ctx.fillRect(px, py, sp.size, sp.size*0.6);
  });
  ctx.restore();

  // волны — две прослойки для глубины: дальняя (мельче, светлее, быстрее
  // из-за перспективы) и ближняя (крупнее, темнее, с пенными гребнями)
  for (let layer=0; layer<2; layer++){
    const n = layer===0 ? 14 : 9;
    for (let i=0;i<n;i++){
      const u = i/n;
      const py = HORIZON_Y + 10 + u*(waterH-20);
      const amp = layer===0 ? 2.2 : 4.5;
      ctx.strokeStyle = layer===0 ? 'rgba(255,255,255,0.09)' : 'rgba(255,255,255,0.14)';
      ctx.lineWidth = (layer===0 ? 1 : 1.6) + u*1.6;
      ctx.beginPath();
      for (let x=0;x<=CW;x+=16){
        const yy = py + Math.sin(x/(34+u*20) + t/(850-layer*150) + i*1.7)*amp*(0.4+u*1.3);
        x===0 ? ctx.moveTo(x,yy) : ctx.lineTo(x,yy);
      }
      ctx.stroke();

      // пенные искры на гребнях ближних волн
      if (layer===1 && u>0.35){
        ctx.save();
        ctx.globalAlpha = 0.5;
        for (let x=10;x<CW;x+=38){
          const yy = py + Math.sin(x/54 + t/700 + i*1.7)*amp*(0.4+u*1.3);
          const foam = Math.sin(t/500 + x*0.1 + i)*0.5+0.5;
          if (foam>0.6){
            ctx.fillStyle = 'rgba(255,255,255,0.5)';
            ctx.fillRect(x, yy-1, 6+foam*4, 1.4);
          }
        }
        ctx.restore();
      }
    }
  }

  // лёгкая дымка/туман у самой линии горизонта — размывает стык неба и воды
  const mist = ctx.createLinearGradient(0,HORIZON_Y-14,0,HORIZON_Y+26);
  mist.addColorStop(0,'rgba(255,220,180,0)');
  mist.addColorStop(0.5,'rgba(255,220,180,0.22)');
  mist.addColorStop(1,'rgba(255,220,180,0)');
  ctx.fillStyle = mist;
  ctx.fillRect(0,HORIZON_Y-14,CW,40);
}

function drawDock(t){
  const wood = ctx.createLinearGradient(0, DOCK_TOP, 0, CH);
  wood.addColorStop(0, '#8a5a34');
  wood.addColorStop(1, '#4a3218');
  ctx.fillStyle = wood;
  ctx.fillRect(0, DOCK_TOP, CW, CH-DOCK_TOP);

  ctx.strokeStyle = 'rgba(0,0,0,0.28)'; ctx.lineWidth = 2;
  const vanishX = CW/2;
  for (let i=-5;i<=5;i++){
    const topX = vanishX + i*10;
    const botX = vanishX + i*70;
    ctx.beginPath(); ctx.moveTo(topX, DOCK_TOP); ctx.lineTo(botX, CH); ctx.stroke();
  }
  for (let i=0;i<4;i++){
    const py = DOCK_TOP + (i+1)*(CH-DOCK_TOP)/4.4;
    ctx.strokeStyle = 'rgba(0,0,0,0.22)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(0,py); ctx.lineTo(CW,py); ctx.stroke();
  }

  ctx.fillStyle = '#5c3d20';
  ctx.fillRect(0, DOCK_TOP-14, CW, 14);
  ctx.fillStyle = '#7a5230';
  ctx.fillRect(0, DOCK_TOP-14, CW, 3);
  ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = 1;
  for (let x=20; x<CW; x+=48){ ctx.beginPath(); ctx.moveTo(x,DOCK_TOP-14); ctx.lineTo(x,DOCK_TOP); ctx.stroke(); }
}

function drawBucket(x, y, s){
  ctx.save();
  ctx.translate(x,y); ctx.scale(s,s);

  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath(); ctx.ellipse(0, 32, 30, 8, 0, 0, Math.PI*2); ctx.fill();

  const bodyGrad = ctx.createLinearGradient(-26,0,26,0);
  bodyGrad.addColorStop(0,   '#1c4a63');
  bodyGrad.addColorStop(0.32,'#4f95bd');
  bodyGrad.addColorStop(0.5, '#6fb8de');
  bodyGrad.addColorStop(0.68,'#3d7ea6');
  bodyGrad.addColorStop(1,   '#173d52');
  ctx.fillStyle = bodyGrad;
  ctx.beginPath();
  ctx.moveTo(-26,-1); ctx.lineTo(-19,33); ctx.lineTo(19,33); ctx.lineTo(26,-1); ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.4)'; ctx.lineWidth = 1.2; ctx.stroke();

  ctx.strokeStyle = 'rgba(0,0,0,0.18)'; ctx.lineWidth = 1.5;
  [10, 21].forEach(ry=>{
    const rw = 26 - (ry/33)*7;
    ctx.beginPath(); ctx.ellipse(0, ry, rw, 2.6, 0, 0, Math.PI); ctx.stroke();
  });

  ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 2.5; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(-16,4); ctx.lineTo(-12,29); ctx.stroke();

  ctx.beginPath(); ctx.ellipse(0,-1,26,7.5,0,0,Math.PI*2);
  ctx.fillStyle = '#8fd0f0'; ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.4)'; ctx.lineWidth = 1.2; ctx.stroke();

  ctx.beginPath(); ctx.ellipse(0,1,22,6.2,0,0,Math.PI*2);
  const waterGrad = ctx.createRadialGradient(-4,0,2,0,1,22);
  waterGrad.addColorStop(0,'#bfe7f5'); waterGrad.addColorStop(1,'#1f5570');
  ctx.fillStyle = waterGrad; ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = 1; ctx.stroke();

  [[-9,0,-0.35,'#dfeef2'], [7,2,0.5,'#cfe8ee']].forEach(([fx,fy,rot,col])=>{
    ctx.save();
    ctx.translate(fx,fy); ctx.rotate(rot); ctx.scale(1,0.55);
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.ellipse(0,0,7,2.6,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-6,0); ctx.lineTo(-11,-3.5); ctx.lineTo(-11,3.5); ctx.closePath(); ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,0.25)'; ctx.lineWidth=0.6; ctx.stroke();
    ctx.restore();
  });

  ctx.fillStyle = '#555';
  ctx.beginPath(); ctx.arc(-25,-2,2.6,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(25,-2,2.6,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#7a7a7a'; ctx.lineWidth = 2.2;
  ctx.beginPath(); ctx.arc(0,-6,26,Math.PI*1.12,Math.PI*1.88); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.lineWidth = 0.8;
  ctx.beginPath(); ctx.arc(0,-6,26,Math.PI*1.15,Math.PI*1.5); ctx.stroke();

  ctx.restore();
}

function drawRod(baseX, bobberX, bobberY, color, scale){
  const s = scale||1;
  const baseX_ = baseX, baseY_ = CH + 60*s;
  const tipX = baseX_ + (bobberX-baseX_)*0.4;
  const tipY = baseY_ + (bobberY-baseY_)*0.62;

  const bendX = tipX > baseX_ ? -18*s : 18*s;
  const midX = (baseX_+tipX)/2 + bendX, midY = (baseY_+tipY)/2;
  const steps = 20;
  const pts = [];
  for (let i=0;i<=steps;i++){
    const u = i/steps;
    const x = (1-u)*(1-u)*baseX_ + 2*(1-u)*u*midX + u*u*tipX;
    const y = (1-u)*(1-u)*baseY_ + 2*(1-u)*u*midY + u*u*tipY;
    pts.push([x,y]);
  }
  const baseW = 9*s, tipW = 1.4*s;
  const left = [], right = [];
  for (let i=0;i<pts.length;i++){
    const u = i/steps;
    const w = baseW*(1-u) + tipW*u;
    const prev = pts[Math.max(0,i-1)], next = pts[Math.min(steps,i+1)];
    const dx = next[0]-prev[0], dy = next[1]-prev[1];
    const len = Math.hypot(dx,dy) || 1;
    const nx = -dy/len, ny = dx/len;
    left.push([pts[i][0]+nx*w/2, pts[i][1]+ny*w/2]);
    right.push([pts[i][0]-nx*w/2, pts[i][1]-ny*w/2]);
  }
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(left[0][0], left[0][1]);
  for (let i=1;i<left.length;i++) ctx.lineTo(left[i][0], left[i][1]);
  for (let i=right.length-1;i>=0;i--) ctx.lineTo(right[i][0], right[i][1]);
  ctx.closePath();
  const grad = ctx.createLinearGradient(baseX_, baseY_, tipX, tipY);
  grad.addColorStop(0, '#2e2116'); grad.addColorStop(1, '#9a7a48');
  ctx.fillStyle = grad; ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.4)'; ctx.lineWidth = 0.8*s; ctx.stroke();

  ctx.strokeStyle = 'rgba(0,0,0,0.55)'; ctx.lineWidth = 1*s;
  [0.3, 0.55, 0.78].forEach(u=>{
    const idx = Math.round(u*steps);
    const w = baseW*(1-u) + tipW*u;
    ctx.beginPath(); ctx.arc(pts[idx][0], pts[idx][1], w*0.9, 0, Math.PI*2); ctx.stroke();
  });

  ctx.fillStyle = '#232323';
  ctx.beginPath(); ctx.ellipse(baseX_, baseY_-6*s, 9*s, 6*s, 0.3, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(baseX_, baseY_-6*s, 3.5*s, 0, Math.PI*2); ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(tipX, tipY);
  ctx.quadraticCurveTo((tipX+bobberX)/2, Math.min(tipY,bobberY)-10, bobberX, bobberY);
  ctx.stroke();
  ctx.restore();
}

const BOBBER_COLORS = ['#ff5566','#4fa8ff','#5fe36a','#c26bff','#4fe3d0'];
const DEMO_ANGLERS = [
  { name:'@LehaTvel',     baseX:60,  px:0.20, py:0.32, colorIdx:0 },
  { name:'@rybak_88',     baseX:210, px:0.42, py:0.22, colorIdx:1 },
  { name:'@zritel_kek',   baseX:400, px:0.62, py:0.40, colorIdx:2 },
  { name:'@golden_carp',  baseX:550, px:0.84, py:0.26, colorIdx:4, champ:true },
];
const ME = { name:'@ТЫ (стример)', baseX:300, px:0.5, py:0.55 };

function bobberPos(a){
  return { x: a.px*CW, y: HORIZON_Y + a.py*(DOCK_TOP-HORIZON_Y) };
}

function drawBobber(x, y, s, color, name, isChamp, t){
  const bob = Math.sin(t/450 + x*0.05)*3;
  y += bob;

  ctx.save();
  ctx.globalAlpha = 0.25;
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.ellipse(x, y+6*s, 14*s, 4*s, 0, 0, Math.PI*2); ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.beginPath();
  ctx.moveTo(x, y-16*s);
  ctx.quadraticCurveTo(x+7*s, y-4*s, x, y+2*s);
  ctx.quadraticCurveTo(x-7*s, y-4*s, x, y-16*s);
  ctx.closePath();
  ctx.fillStyle = '#e8433f'; ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.4)'; ctx.lineWidth = 1; ctx.stroke();

  ctx.beginPath(); ctx.ellipse(x, y+6*s, 6*s, 9*s, 0, 0, Math.PI*2);
  ctx.fillStyle = '#fdfdfd'; ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.stroke();

  ctx.beginPath(); ctx.moveTo(x, y-16*s); ctx.lineTo(x, y-24*s);
  ctx.strokeStyle = '#c9982f'; ctx.lineWidth = 1.5*s; ctx.stroke();
  ctx.restore();

  if (isChamp){
    ctx.save();
    ctx.font = `${13*s}px Arial`;
    ctx.textAlign = 'center';
    ctx.fillText('🏆', x, y-28*s);
    ctx.restore();
  }

  ctx.font = `bold ${12*s}px Arial Black`;
  ctx.textAlign = 'center';
  const w = ctx.measureText(name).width;
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(x-w/2-5, y-40*s, w+10, 15*s);
  ctx.strokeStyle = 'rgba(0,0,0,0.9)'; ctx.lineWidth = 2.5;
  ctx.strokeText(name, x, y-29*s);
  ctx.fillStyle = isChamp ? '#FFD700' : color;
  ctx.fillText(name, x, y-29*s);
}

function drawFish(x, y, s, rot, color){
  ctx.save();
  ctx.translate(x,y); ctx.rotate(rot); ctx.scale(s,s);
  ctx.fillStyle = color || '#bfe0e8';
  ctx.beginPath(); ctx.ellipse(0,0,10,4.2,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-8,0); ctx.lineTo(-16,-6); ctx.lineTo(-16,6); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = 0.8; ctx.stroke();
  ctx.fillStyle = '#1a1a1a';
  ctx.beginPath(); ctx.arc(6,-0.5,1.2,0,Math.PI*2); ctx.fill();
  ctx.restore();
}
function easeInOut(u){ return u<0.5 ? 2*u*u : 1-Math.pow(-2*u+2,2)/2; }

const CATCH_CYCLE_MS = 7000;
const PHASE = { idleEnd:3000, biteEnd:4000, reelEnd:5600, depositEnd:6100, recastEnd:6800 };
function getCatchPhase(t){
  const u = t % CATCH_CYCLE_MS;
  if (u < PHASE.idleEnd)    return { phase:'idle' };
  if (u < PHASE.biteEnd)    return { phase:'bite',    u:(u-PHASE.idleEnd)/(PHASE.biteEnd-PHASE.idleEnd) };
  if (u < PHASE.reelEnd)    return { phase:'reel',    u:easeInOut((u-PHASE.biteEnd)/(PHASE.reelEnd-PHASE.biteEnd)) };
  if (u < PHASE.depositEnd) return { phase:'deposit', u:(u-PHASE.reelEnd)/(PHASE.depositEnd-PHASE.reelEnd) };
  if (u < PHASE.recastEnd)  return { phase:'recast',  u:easeInOut((u-PHASE.depositEnd)/(PHASE.recastEnd-PHASE.depositEnd)) };
  return { phase:'idle' };
}

const BUCKET_X = CW*0.72, BUCKET_Y = DOCK_TOP + 14;
const REEL_TARGET = { x: ME.baseX + 40, y: DOCK_TOP - 20 };

function loop(t){
  ctx.clearRect(0,0,CW,CH);
  drawSky(t);
  drawBirds(t);
  drawWater(t);
  drawDock(t);

  drawBucket(BUCKET_X, BUCKET_Y, 1.6);

  const waterPos = bobberPos(ME);
  const ph = getCatchPhase(t);
  let meX = waterPos.x, meY = waterPos.y;
  let flyingFish = null;
  let showMeBobber = true;

  if (ph.phase === 'bite'){
    const env = Math.sin(ph.u * Math.PI);
    meX = waterPos.x + Math.sin(t/55)*5*env;
    meY = waterPos.y + env*16 + Math.sin(t/40)*3*env;
  } else if (ph.phase === 'reel'){
    meX = waterPos.x + (REEL_TARGET.x-waterPos.x)*ph.u;
    meY = waterPos.y + (REEL_TARGET.y-waterPos.y)*ph.u;
  } else if (ph.phase === 'deposit'){
    meX = REEL_TARGET.x; meY = REEL_TARGET.y;
    const fx = REEL_TARGET.x + (BUCKET_X-REEL_TARGET.x)*ph.u;
    const fy = REEL_TARGET.y + (BUCKET_Y-REEL_TARGET.y)*ph.u - Math.sin(ph.u*Math.PI)*46;
    const rot = -0.3 + ph.u*1.1;
    flyingFish = { x:fx, y:fy, rot };
    if (ph.u > 0.7) showMeBobber = false;
  } else if (ph.phase === 'recast'){
    meX = REEL_TARGET.x + (waterPos.x-REEL_TARGET.x)*ph.u;
    meY = REEL_TARGET.y + (waterPos.y-REEL_TARGET.y)*ph.u - Math.sin(ph.u*Math.PI)*70;
  }

  drawRod(ME.baseX, meX, meY, '#ffd24f', 1.7);
  DEMO_ANGLERS.forEach(a=>{
    const b = bobberPos(a);
    drawRod(a.baseX, b.x, b.y, BOBBER_COLORS[a.colorIdx], 1.15);
  });

  DEMO_ANGLERS.forEach(a=>{
    const b = bobberPos(a);
    drawBobber(b.x, b.y, 1, BOBBER_COLORS[a.colorIdx], a.name, !!a.champ, t + a.px*1000);
  });
  if (showMeBobber) drawBobber(meX, meY, 1.4, '#ffd24f', ME.name, false, t);
  if (flyingFish) drawFish(flyingFish.x, flyingFish.y, 1.3, flyingFish.rot, '#fff2c8');

  if (ph.phase === 'deposit' && ph.u > 0.85){
    ctx.save();
    ctx.font = 'bold 15px Arial Black'; ctx.textAlign = 'center';
    ctx.strokeStyle = 'rgba(0,0,0,0.9)'; ctx.lineWidth = 3;
    ctx.strokeText('🐟 Поймал!', BUCKET_X, BUCKET_Y-46);
    ctx.fillStyle = '#ffe98a';
    ctx.fillText('🐟 Поймал!', BUCKET_X, BUCKET_Y-46);
    ctx.restore();
  }

  drawTopPanel();

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
