<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>Leha Neploxo Game</title>
<link rel="icon" href="img/world_icon_192.png">
<link rel="manifest" href="world.webmanifest">
<link rel="apple-touch-icon" href="img/world_icon_180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-fullscreen">
<meta name="apple-mobile-web-app-title" content="Leha Neploxo">
<meta name="theme-color" content="#08040f">
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:Arial,sans-serif;color:#fff;
            -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{width:min(100vw, 100vh*16/9);height:auto;aspect-ratio:16/9;background:#000;display:block;touch-action:none}
  /* Экран вертикальный (например, включена блокировка поворота) — не блокируем игру, а разворачиваем картинку на 90° */
  @media (orientation:portrait){
    body.ingame #wrap{display:block}
    body.ingame canvas{position:fixed;left:50%;top:50%;width:min(100vh,177.78vw);transform:translate(-50%,-50%) rotate(90deg)}
  }

  /* экраны входа / создания персонажа */
  #ov{position:fixed;inset:0;z-index:20;display:flex;
      background:radial-gradient(ellipse at 50% 30%,#2a1140 0%,#08040f 70%);overflow:auto;padding:12px;box-sizing:border-box}
  #ov[hidden]{display:none}
  .box{margin:auto;background:rgba(12,10,24,.94);border:2px solid #6f4bd8;border-radius:16px;padding:22px 26px;
       width:min(420px,100%);box-sizing:border-box;box-shadow:0 0 40px rgba(120,70,255,.35)}
  .box.wide{width:min(900px,100%)}
  h1{margin:0 0 4px;font-size:30px;text-align:center;letter-spacing:2px;color:#ffd23f;text-shadow:0 0 14px rgba(255,80,0,.6)}
  .sub{text-align:center;color:#9fb0d8;font-size:13px;margin-bottom:14px}
  .tabs{display:flex;gap:8px;margin-bottom:14px}
  .tab{flex:1;padding:10px;text-align:center;border-radius:10px;background:#1a1730;color:#9fb0d8;cursor:pointer;font-weight:bold}
  .tab.on{background:#6f4bd8;color:#fff}
  label{display:block;font-size:13px;color:#b9c5e8;margin:10px 0 4px}
  input{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:2px solid #2b2650;background:#0a0818;color:#fff;
        font-size:16px;outline:none;-webkit-user-select:text;user-select:text}
  input:focus{border-color:#8a63ff}
  .hint{font-size:12px;color:#8391b8;margin-top:5px}
  .warn{font-size:13px;color:#ffc933;background:rgba(255,200,50,.08);border:1px solid rgba(255,200,50,.35);border-radius:8px;padding:8px 10px;margin-top:12px}
  .err{min-height:20px;color:#ff7b7b;font-size:14px;margin-top:10px;text-align:center}
  button.main{width:100%;padding:14px;margin-top:8px;border:0;border-radius:12px;background:linear-gradient(#ff7a3d,#e0472e);color:#fff;
       font-size:18px;font-weight:bold;cursor:pointer}
  button.main:disabled{opacity:.5;cursor:default}
  .link{margin-top:12px;text-align:center;font-size:13px;color:#8391b8;cursor:pointer;text-decoration:underline}
  .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  @media (max-width:760px){.cards{grid-template-columns:repeat(2,1fr)}}
  .card{border:2px solid #2b2650;border-radius:12px;padding:10px;background:#0d0b1e;cursor:pointer;text-align:center}
  .card.on{border-color:#ffd23f;box-shadow:0 0 16px rgba(255,210,63,.4)}
  .card img{height:110px;image-rendering:pixelated}
  .card .nm{font-weight:bold;margin:4px 0 6px}
  .st{display:flex;align-items:center;gap:6px;font-size:12px;margin:3px 0;color:#c9d3f2}
  .st span{width:60px;text-align:left}.st i{display:block;height:8px;border-radius:4px}
  .sw{display:flex;justify-content:center;gap:6px;margin-top:6px}
  .sw img{height:44px;border:2px solid transparent;border-radius:8px;padding:2px;background:#15122b}
  .sw img.on{border-color:#ffd23f}
  #msg{position:fixed;inset:0;z-index:25;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.75);
       font-size:22px;text-align:center;padding:20px}
  #msg[hidden]{display:none}
  #msgText{white-space:pre-line;line-height:1.5;max-width:520px}
  #fs{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:calc(8px + env(safe-area-inset-right,0px));z-index:40;
      width:40px;height:40px;padding:0;border-radius:10px;border:1px solid rgba(255,255,255,.25);background:rgba(10,10,24,.55);
      color:#fff;opacity:.5;display:flex;align-items:center;justify-content:center;cursor:pointer}
  #fs:hover,#fs:active{opacity:1}
  #fs svg{width:22px;height:22px}
  #fs .ic-off{display:none}#fs.on .ic-on{display:none}#fs.on .ic-off{display:block}
  @media (max-height:520px){
    #ov{padding:8px}
    .box{padding:12px 18px}
    h1{font-size:22px;margin:0}
    .sub{display:none}
    .tabs{margin-bottom:8px}.tab{padding:7px}
    label{margin:6px 0 2px}
    input{padding:8px 10px}
    .warn{padding:5px 8px;margin-top:6px;font-size:12px}
    .err{min-height:14px;margin-top:4px}
    button.main{padding:10px;margin-top:4px;font-size:16px}
    .card{padding:6px}.card img{height:64px}.card .nm{margin:2px 0 3px;font-size:14px}
    .st{margin:1px 0;font-size:11px}.sw{margin-top:3px}.sw img{height:30px}
    .cards{gap:6px}
  }
  #scrStart{width:min(940px,100%);margin:auto;display:flex;flex-direction:column;gap:10px}
  #scrStart[hidden]{display:none}
  .banner{position:relative;height:clamp(150px,54vh,360px);border-radius:16px;overflow:hidden;border:2px solid #6f4bd8;
          box-shadow:0 0 40px rgba(120,70,255,.4);background:linear-gradient(#05010c 0%,#160a2c 55%,#2a1140 100%)}
  .banner .city{position:absolute;inset:0;background:url(sprites/streets_of_fight/stage/back.png) repeat-x 0 82%/auto 70%;image-rendering:pixelated}
  .banner .road{position:absolute;left:0;right:0;bottom:0;height:24%;background:linear-gradient(#2c3f57,#0e1622);border-top:3px solid #6b5f68}
  .banner .fighters{position:absolute;left:0;right:0;bottom:6%;display:flex;justify-content:space-evenly;align-items:flex-end;padding:0 2%}
  .banner .fighters img{height:clamp(56px,min(30vh,21vw),190px);max-width:24%;object-fit:contain;image-rendering:pixelated;filter:drop-shadow(0 6px 3px rgba(0,0,0,.65))}
  .banner .ttl{position:absolute;top:5%;left:0;right:0;text-align:center;font-family:"Arial Black",Arial;line-height:1.02}
  .banner .t1{font-size:clamp(20px,min(8vh,7.4vw),62px);color:#ffd23f;letter-spacing:2px;text-shadow:0 0 18px rgba(255,90,0,.9),0 3px 0 #7a2a00}
  .banner .t2{font-size:clamp(26px,min(11vh,10vw),84px);color:#ff4a3a;letter-spacing:8px;text-shadow:0 0 22px rgba(255,40,0,.85),0 4px 0 #500}
  .banner .tag{position:absolute;left:0;right:0;bottom:1.5%;text-align:center;font-size:clamp(11px,2.4vh,15px);color:#cfd8ff;letter-spacing:1px;text-shadow:0 1px 3px #000}
  .langs{display:flex;gap:8px;justify-content:center}
  .lang{flex:1;max-width:200px;padding:10px 6px;border-radius:10px;border:2px solid #2b2650;background:#14112a;color:#9fb0d8;font-size:15px;font-weight:bold;cursor:pointer}
  .lang.on{background:#6f4bd8;border-color:#a58bff;color:#fff}
  #scrStart button.main{margin-top:0}
  @media (max-height:520px){ .lang{padding:7px 4px;font-size:14px} #scrStart{gap:6px} }
  .pw{position:relative}
  .pw input{padding-right:46px}
  .eye{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:36px;height:36px;padding:0;border:0;background:transparent;
       color:#8391b8;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .eye svg{width:22px;height:22px}
  .eye .e-off{display:none}.eye.on{color:#ffd23f}.eye.on .e-on{display:none}.eye.on .e-off{display:block}
  .pwrow{display:flex;flex-direction:column}
  @media (max-height:520px){ .pwrow{flex-direction:row;gap:8px}.pwcol{flex:1;min-width:0} }
  #clanForm{position:fixed;inset:0;z-index:26;display:flex;background:rgba(0,0,0,.72);padding:10px;overflow:auto}
  #clanForm[hidden]{display:none}
  #msg button{margin-top:16px;padding:12px 26px;border:0;border-radius:10px;background:#6f4bd8;color:#fff;font-size:17px;font-weight:bold}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="1280" height="720"></canvas></div>

<div id="ov">
  <!-- стартовая страница: баннер игры + выбор языка -->
  <div id="scrStart">
    <div class="banner">
      <div class="city"></div><div class="road"></div>
      <div class="fighters">
        <img src="sprites/urban_brawlers/brute_arms/Idle/idle1.png" alt="">
        <img src="sprites/streets_of_fight/brawler_girl_v5_blue/Idle/idle1.png" alt="">
        <img src="sprites/urban_brawlers/batting_girl_v7_pink/Idle/idle1.png" alt="">
        <img src="sprites/urban_brawlers/bancho_v4_teal/Idle/idle1.png" alt="">
      </div>
      <div class="ttl"><div class="t1">LEHA NEPLOXO</div><div class="t2">GAME</div></div>
      <div class="tag" data-i="tagline"></div>
    </div>
    <div class="langs">
      <button class="lang" data-lang="uk">Українська</button>
      <button class="lang" data-lang="en">English</button>
      <button class="lang" data-lang="ru">Русский</button>
    </div>
    <button class="main" id="play" data-i="play"></button>
  </div>
  <!-- вход / регистрация -->
  <div class="box" id="scrAuth" hidden>
    <h1>LEHA NEPLOXO GAME</h1>
    <div class="tabs"><div class="tab on" id="tabReg" data-i="tab_reg"></div><div class="tab" id="tabLog" data-i="tab_log"></div></div>
    <label for="nick" data-i="nick"></label>
    <input id="nick" maxlength="16" autocomplete="username" autocapitalize="off" spellcheck="false" data-ph="nick_ph">
    <div class="hint" id="nickHint" data-i="nick_hint"></div>
    <div class="pwrow">
      <div class="pwcol">
        <label for="pass" data-i="pass"></label>
        <div class="pw">
          <input id="pass" type="password" maxlength="64" autocomplete="new-password" autocapitalize="off" autocorrect="off" spellcheck="false" data-ph="pass_ph">
          <button type="button" class="eye" id="eye" data-title="show_pass">
            <svg class="e-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="e-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.9 17.9A10.9 10.9 0 0112 20C5 20 1 12 1 12a18.5 18.5 0 015.1-5.9M9.9 4.2A10.7 10.7 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.2 3.2M1 1l22 22"/><path d="M14.1 14.1a3 3 0 11-4.2-4.2"/></svg>
          </button>
        </div>
      </div>
      <div class="pwcol" id="pass2Box">
        <label for="pass2" data-i="pass2"></label>
        <div class="pw"><input id="pass2" type="password" maxlength="64" autocomplete="new-password" autocapitalize="off" autocorrect="off" spellcheck="false" data-ph="pass2_ph"></div>
      </div>
    </div>
    <div class="warn" id="passWarn" data-i="pass_warn"></div>
    <div class="err" id="err"></div>
    <button class="main" id="go"></button>
  </div>
  <!-- выбор бойца (тот же экран — и при регистрации, и при смене бойца в игре) -->
  <div class="box wide" id="scrCreate" hidden>
    <h1 id="createTitle" data-i="choose_title"></h1><div class="sub" id="createSub" data-i="choose_sub"></div>
    <div class="cards" id="cards"></div>
    <div class="err" id="err2"></div>
    <button class="main" id="start" data-i="go_world"></button>
    <div class="link" id="createCancel" data-i="cancel" hidden></div>
  </div>
</div>
<button id="fs" data-title="fs_title">
  <svg class="ic-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
  <svg class="ic-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>
</button>
<div id="clanForm" hidden>
  <div class="box">
    <h1 data-i="clan_form_title"></h1>
    <label for="cName" data-i="clan_name"></label>
    <input id="cName" maxlength="20" autocomplete="off" spellcheck="false" data-ph="clan_name_ph">
    <label for="cTag" data-i="clan_tag"></label>
    <input id="cTag" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false" data-ph="clan_tag_ph">
    <div class="err" id="cErr"></div>
    <button class="main" id="cGo" data-i="clan_create_go"></button>
    <div class="link" id="cCancel" data-i="cancel"></div>
  </div>
</div>
<div id="msg" hidden><div><div id="msgText"></div><button id="msgBtn">Ок</button></div></div>

  if (auth && token) opt.headers.Authorization = 'Bearer ' + token;
  let r; try { r = await fetch('/world-api/' + path, opt); } catch(_){ const ne = new Error(''); ne.code = 'net'; throw ne; }
  let data = {}; try { data = await r.json(); } catch(_){}
  if (!r.ok) { const e = new Error(data.error || ''); e.code = data.code || 'net'; e.status = r.status; throw e; }
  return data;
};

function connect(){

  ws.onopen = () => { retry = 0; };
  ws.onmessage = ev => { let m; try { m = JSON.parse(ev.data); } catch(_){ return; } onServer(m); };
  ws.onclose = ev => {
    connected = false;
    if (stopRetry) return;
    if (ev.code === 4001){ showMsg(t('need_login_msg'), t('btn_log'), logout); return; }
    if (ev.code === 4002){ document.body.classList.remove('ingame'); $('ov').hidden = false; $('scrAuth').hidden = true; showCreate(); return; }
    if (ev.code === 4004){ stopRetry = true; showMsg(t('kicked'), t('play_here'), () => location.reload()); return; }
    retry++; setTimeout(connect, Math.min(5000, 500 * retry));
  };

function onServer(m){
  switch (m.t){
    case 'hello':
      myId = m.id; ZONE_W = m.zoneW; WORLD_W = m.world; GROUND_MIN = m.ground[0]; GROUND_MAX = m.ground[1];
      for (let i=0;i<m.zones.length;i++) if (ZONES[i]) ZONES[i].type = m.zones[i];
      ents.clear(); me.x = m.x; me.y = m.y; camX = Math.max(0, Math.min(WORLD_W-CW, me.x - CW/2)); connected = true; break;
    case 'add':
      for (const a of m.e){ const e = ents.get(a.id) || { id:a.id, rx:0, ry:0, x:0, y:0, f:1, s:0, ps:0, t:0, h:1, m:1, l:1, c:0, init:false };
        e.n = a.n; e.ty = a.ty; e.v = a.v; e.k = a.k; ents.set(a.id, e); }
      break;
    case 's': {
      for (const r of m.a){
        const e = ents.get(r[0]); if (!e) continue;
        e.x = r[1]; e.y = r[2]; e.f = r[3];
        if (e.s !== r[4]){ e.s = r[4]; e.t = 0; }
        e.h = r[5]; e.m = r[6]; e.l = r[7]; e.c = r[8]; e.cl = r[9] || 0;
        if (!e.init){ e.rx = e.x; e.ry = e.y; e.init = true; }
        if (e.id === myId){
          const d = Math.hypot(e.x - me.x, e.y - me.y);
          if (d > 160){ me.x = e.x; me.y = e.y; } else { me.x += (e.x - me.x) * 0.12; me.y += (e.y - me.y) * 0.12; }
        }
      }
      for (const id of m.rm) ents.delete(id);
      for (const v of m.ev){
        const e = ents.get(v[0]); if (!e) continue;
        floater(e, v[2] ? t('block_dmg', v[1]) : '−'+v[1], v[2] ? '#7ec8ff' : (e.id === myId ? '#ff5a5a' : '#ffe14a'));
      }
      if ((m.me.rm || '') !== room) changeRoom(m.me.rm || '');
      Object.assign(me, { mo:m.me.mo, su:m.me.su, suStamp:performance.now(), sp:m.me.sp, stm:m.me.stm, xp:m.me.xp, need:m.me.need, pt:m.me.pt, st:m.me.st, dh:m.me.dh, ds:m.me.ds });
      break;
    }
    case 'money': { const e = ents.get(m.id) || myEnt(); if (e) floater(e, (m.d > 0 ? '+$' : '−$') + Math.abs(m.d), m.d > 0 ? '#7dff9a' : '#ff5a5a'); break; }
    case 'toast': toast(t('m_' + m.k, ...(m.a || [])), m.color); break;
    case 'lvl': ui.banner = { text:t('lvlup', m.level), sub:t('lvlup_sub', m.points), t:2.6 }; break;
    case 'ko': ui.koText = 2; ui.card = null; break;
    case 'card': ui.card = m; ui.panel = false; break;
    case 'clans': Object.assign(clanTags, m.m); break;
    case 'mm': miniPlayers = m.p; break;
    case 'clan':
      clanState.clan = m.clan; clanState.invites = m.invites;
      if (clanState.first){ clanState.first = false; if (m.invites.length) toast(t('m_clan_pending', m.invites.length), '#7dc8ff'); }
      break;
    case 'clan_err': $('cErr').textContent = t('ce_' + m.code); $('cGo').disabled = false; break;
    case 'clan_ok': $('clanForm').hidden = true; break;
    case 'fighter_change_ok': switchingFighter = false; $('ov').hidden = true; $('start').disabled = false; break;
    case 'fighter_change_err': $('err2').textContent = m.code === 'cooldown' ? t('err_fighter_cooldown', m.days) : t('err_bad_fighter'); $('start').disabled = false; break;
    case 'kicked': break;
  }
}

    if (p.x>=h.x && p.x<=h.x+h.w && p.y>=h.y && p.y<=h.y+h.h){ ptrs.set(e.pointerId, {kind:'ui'}); h.fn(); return; }
  }
  if (ui.touch || e.pointerType === 'mouse'){
    for (const b of btns) if (Math.hypot(p.x-b.x, p.y-b.y) <= b.r*1.15){
      b.down = true; ptrs.set(e.pointerId, {kind:'btn', b});
      if (b.name === 'block') blockHeld = true; else doAction(b.name);
      return;
    }
  }
  if (e.pointerType !== 'mouse' && p.x < CW/2 && !joy.active){
    Object.assign(joy, { active:true, id:e.pointerId, ox:p.x, oy:p.y, x:p.x, y:p.y, vx:0, vy:0 });
    ptrs.set(e.pointerId, {kind:'joy', t0:performance.now(), p0:p}); return;
  }
  ptrs.set(e.pointerId, {kind:'tap', t0:performance.now(), p0:p});
});
canvas.addEventListener('pointermove', e => {
  const s = ptrs.get(e.pointerId); if (!s || s.kind !== 'joy') return;
  const p = toCanvas(e); joy.x = p.x; joy.y = p.y;
  const dx = p.x-joy.ox, dy = p.y-joy.oy, len = Math.hypot(dx,dy), R = 70;
  if (len < 10){ joy.vx = joy.vy = 0; } else { const m = Math.min(1, len/R); joy.vx = dx/len*m; joy.vy = dy/len*m; }
});
function endPointer(e){
  const s = ptrs.get(e.pointerId); if (!s) return; ptrs.delete(e.pointerId);
  const p = toCanvas(e), quick = performance.now()-s.t0 < 300 && s.p0 && Math.hypot(p.x-s.p0.x, p.y-s.p0.y) < 14;
  if (s.kind === 'joy'){ joy.active = false; joy.vx = joy.vy = 0; if (quick) tapWorld(p.x, p.y); }
  else if (s.kind === 'btn'){ s.b.down = false; if (s.b.name === 'block') blockHeld = false; }
  else if (s.kind === 'tap' && quick) tapWorld(p.x, p.y);
}
canvas.addEventListener('pointerup', endPointer);

const actorK = e => room === 'club' ? clubPersp(e.ry) : 0.9 + 0.16 * (e.ry - 500) / 200;   // перспектива: ниже по экрану — чуть крупнее (диапазон 500..700 как раньше, выше 500 — мельче)
const FIGHTER_H = 160;
function tapWorld(x, y){
  let hit = null;
  for (const a of ents.values()){
    const k = actorK(a), h = FIGHTER_H*k, sx = a.rx - camX;

  if (!hit){ ui.card = null; return; }
  if (hit.id === myId){ ui.panel = true; return; }
  askCard(hit);
}

const clubPersp = y => 0.62 + 0.43 * (Math.max(0, Math.min(1, (y - 215) / (700 - 215))));
const CLUB_DOOR_X = 6 * 1800 + 900;        // где на улице дверь клуба (центр 7-го района)

const CLUB_DANCES = [['Balancing','balancing'], ['hips','hips'], ['Skip','skip'], ['slide','slide'], ['snap','snap']];
// исходные цвета спрайта: волосы 206,32,56 / 138,11,65 (тень); платье 192,177,10 / 91,103,49 (тень); юбка/отделка 136,140,120 / 88,86,81
const CLUB_PALETTES = [
  { name:'красные волосы, синее платье', map:{ '192,177,10':[52,120,235], '91,103,49':[24,60,150], '136,140,120':[150,168,210], '88,86,81':[64,76,112] } },
  { name:'чёрные волосы, розовое платье', map:{ '206,32,56':[46,36,58], '138,11,65':[24,18,32], '192,177,10':[240,72,160], '91,103,49':[150,26,92], '136,140,120':[232,176,208], '88,86,81':[122,62,92] } },
  { name:'светлые волосы, изумрудное платье', map:{ '206,32,56':[246,206,92], '138,11,65':[192,142,46], '192,177,10':[30,190,120], '91,103,49':[14,108,70], '136,140,120':[168,224,198], '88,86,81':[58,108,88] } },
];
const _cdfr = {}, _crc = {};
function clubDanceFrames(di){
  if (_cdfr[di]) return _cdfr[di];
  const [dir, pre] = CLUB_DANCES[di], out = [];
  for (let i = 1; i <= 8; i++){ const im = new Image(); im.src = 'sprites/club_npc/dancing_girl/' + dir + '/' + pre + i + '.png'; out.push(im); }
  return _cdfr[di] = out;
}
// перекрашенный кадр (кэш): заменяем только цвета волос/платья по таблице палитры
function clubRecolored(pi, di, fi){
  const key = pi + '|' + di + '|' + fi; if (_crc[key]) return _crc[key];
  const im = clubDanceFrames(di)[fi]; if (!ready(im)) return null;
  const c = document.createElement('canvas'); c.width = im.naturalWidth; c.height = im.naturalHeight;
  const g = c.getContext('2d'); g.drawImage(im, 0, 0);
  const id = g.getImageData(0, 0, c.width, c.height), d = id.data, map = CLUB_PALETTES[pi].map;
  for (let o = 0; o < d.length; o += 4){ if (d[o+3] < 40) continue; const m = map[d[o] + ',' + d[o+1] + ',' + d[o+2]]; if (m){ d[o] = m[0]; d[o+1] = m[1]; d[o+2] = m[2]; } }
  g.putImageData(id, 0, 0);
  return _crc[key] = c;
}

function clubFloor(t){

  for (let row = 0, y = 214; y < CH; y += 46, row++) for (let x = (row%2)*60; x < CW; x += 120){ ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y+46); ctx.stroke(); }

  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++){
    const hue = (c*38 + r*52 + t*0.09) % 360, pulse = 0.35 + 0.35*Math.sin(t*0.006 + c*0.9 + r*1.3);

  rr(CLUB_DANCE.x0-8, CLUB_DANCE.y0-8, CLUB_DANCE.x1-CLUB_DANCE.x0+16, CLUB_DANCE.y1-CLUB_DANCE.y0+16, 26); ctx.stroke(); ctx.shadowBlur = 0;
}

const CLUB_DRINKS = [ ['beer','cocktail','shots'], ['wine','bottle','tall'], ['tall','beer','beer'], ['cocktail','wine','shots'] ];
function clubDrink(kind, x, y, k){

let camX = 0;

function floater(e, text, color){ ui.floaters.push({ e, text, color, t:0 }); }

function update(dt){
  const my = myEnt();
  // ввод → сервер (20 раз/сек максимум, только при изменении; раз в секунду как пульс)
  let dx = 0, dy = 0;
  if (keys.ArrowLeft || keys.KeyA) dx -= 1;
  if (keys.ArrowRight || keys.KeyD) dx += 1;
  if (keys.ArrowUp || keys.KeyW) dy -= 1;
  if (keys.ArrowDown || keys.KeyS) dy += 1;
  const canSprint = me.stm > 0;   // шкала бега кончилась — сервер всё равно урежет до шага, не просим зря (иначе будет дёргаться при коррекции позиции)
  let run = (keys.ShiftLeft || keys.ShiftRight) && canSprint ? 1.3 : 1;   // держим тот же потолок, что и сервер (RUN_CAP)
  if (joy.active && (joy.vx || joy.vy)){ dx = joy.vx; dy = joy.vy; run = (Math.hypot(dx,dy) > 0.9 && canSprint) ? 1.3 : 1; }
  const blk = !!(keys.Space || blockHeld);
  const inp = { t:'in', dx:+dx.toFixed(2), dy:+dy.toFixed(2), run, blk };
  const sig = inp.dx+'|'+inp.dy+'|'+run+'|'+blk, now = performance.now();
  if (connected && (sig !== me.sent && now - me.sentAt > 45 || now - me.sentAt > 1000)){ sendWs(inp); me.sent = sig; me.sentAt = now; }

  // предсказание своей позиции (те же формулы, что на сервере)
  if (my){
    const s = my.s, locked = s === ST.hurt || s === ST.ko;
    const slow = locked ? 0 : (s >= 2 && s <= 4) ? 0.15 : s === ST.block ? 0.35 : 1;
    const len = Math.hypot(dx, dy) || 1, k = Math.min(1, len);
    const sp = me.sp * run * slow;
    if (room === 'club'){ me.x += dx/len*k*sp*dt; me.y += dy/len*k*sp*0.6*dt; clubConstrainMe(); }
    else {
      me.x = Math.max(60, Math.min(WORLD_W-60, me.x + dx/len*k*sp*dt));
      me.y = Math.max(GROUND_MIN, Math.min(GROUND_MAX, me.y + dy/len*k*sp*0.6*dt));
    }
  }
  // сглаживание чужих
  const a = 1 - Math.exp(-dt*14);
  for (const e of ents.values()){
    e.t += dt;
    if (e.id === myId){ e.rx = me.x; e.ry = me.y; } else { e.rx += (e.x - e.rx)*a; e.ry += (e.y - e.ry)*a; }
  }
  for (const f of ui.floaters) f.t += dt;
  ui.floaters = ui.floaters.filter(f => f.t < 1.1);
  for (const t of ui.toasts) t.t -= dt; ui.toasts = ui.toasts.filter(t => t.t > 0);
  if (ui.banner){ ui.banner.t -= dt; if (ui.banner.t <= 0) ui.banner = null; }
  if (ui.koText > 0) ui.koText -= dt;
  if (ui.fade > 0) ui.fade -= dt;
  if (room === 'club') camX = 0;
  else { const target = Math.max(0, Math.min(WORLD_W-CW, me.x - CW/2)); camX += (target - camX) * Math.min(1, dt*8); }
}

function drawSpotBeam(x, groundY, topY, tiltPx, color){

function drawVelvetRope(x1, x2, groundY, h){

    ctx.fillStyle = '#2a2420'; ctx.fillRect(x-2, groundY-h, 4, h);

    ctx.beginPath(); ctx.ellipse(x, groundY+1, 7, 2.5, 0, 0, Math.PI*2); ctx.fill();
  });

// координаты локальные: земля — y=0, центр двери — cx0 (снаружи вызывается через translate/scale)
function drawClubEntrance(cx0, text, t){
  const doorW = 56, doorH = 81, doorY = -doorH, doorX = cx0 - doorW/2;
  const colW = 7, colGap = 10, segH = 14;
  [doorX-colGap-colW, doorX+doorW+colGap].forEach((cx,i)=>{
    const segs = Math.ceil(doorH/segH);
    for (let sg=0; sg<segs; sg++){
      const sy = doorY + sg*segH;
      const on = ((sg + Math.floor((t||0)/220)) % 2)===0;
      ctx.fillStyle = on ? (i===0?'#ff2fb0':'#2fe0ff') : 'rgba(255,255,255,0.15)';
      if (on){ ctx.shadowColor = i===0?'#ff8fe0':'#9df5ff'; ctx.shadowBlur=8; } else ctx.shadowBlur=0;
      ctx.fillRect(cx, sy+1, colW, segH-2);
    }
  });
  ctx.shadowBlur=0;
  ctx.fillStyle = '#0a0a0c'; ctx.fillRect(doorX-6, doorY-4, doorW+12, doorH+4);
  const leafW = doorW/2;
  const doorGrad = ctx.createLinearGradient(doorX,doorY,doorX+doorW,doorY);
  doorGrad.addColorStop(0,'#2b1b12'); doorGrad.addColorStop(1,'#1a100b');
  ctx.fillStyle = doorGrad;

function drawActor(e){

  const k = actorK(e), h = FIGHTER_H*k, sx = e.rx - camX;

  const list = framesOf(e.ty, e.v, anim), n = list.length, fps = def[3];
  let idx = Math.floor(e.t * fps);
  idx = (anim === 'idle' || anim === 'walk') ? idx % n : Math.min(n-1, idx);
  if (e.s === ST.ko) idx = A[e.ty].lying ? Math.min(n-1, Math.floor(e.t * 9)) : 0;   // панк: падает кадрами до «лежит»; остальные: стоячий кадр, кладём поворотом

      ctx.fillText(r[1], cx+63, dy+14);
      ctx.fillStyle = '#3a3a55'; rr(cx, dy+20, 60, 32, 8); ctx.fill();
      txt('−10', cx+30, dy+41, 14, '#fff');
      addHit(cx, dy+20, 60, 32, () => sendWs({ t:'debug_stat', stat:r[0], delta:-10 }));
      ctx.fillStyle = '#3a3a55'; rr(cx+66, dy+20, 60, 32, 8); ctx.fill();
      txt('+10', cx+96, dy+41, 14, '#fff');
      addHit(cx+66, dy+20, 60, 32, () => sendWs({ t:'debug_stat', stat:r[0], delta:10 }));
    });
  }
  ctx.fillStyle = '#3a3a55'; rr(x+w/2-110, y+h-96, 220, 34, 10); ctx.fill();
  txt(t('change_fighter_btn'), x+w/2, y+h-73, 15, '#dfe6ff'); addHit(x+w/2-110, y+h-96, 220, 34, () => { ui.panel = false; openFighterSwitch(); });
  ctx.font = '12px Arial'; ctx.textAlign = 'center'; ctx.fillStyle = '#7f8db0';
  ctx.fillText(t('no_reset'), x+w/2, y+h-52);
  ctx.fillStyle = 'rgba(120,40,40,0.8)'; rr(x+w/2-70, y+h-40, 140, 30, 8); ctx.fill();
  txt(t('logout'), x+w/2, y+h-19, 15, '#fff'); addHit(x+w/2-70, y+h-40, 140, 30, () => { stopRetry = true; logout(); });
}
function drawOverlays(){
  if (ui.banner){
    const b = ui.banner, a = Math.min(1, b.t/0.5);
    ctx.globalAlpha = a*0.6; ctx.fillStyle = '#000'; ctx.fillRect(0, 300, CW, 110);
    ctx.globalAlpha = a; txt(b.text, CW/2, 352, 40, '#ffd23f'); txt(b.sub, CW/2, 392, 20, '#fff'); ctx.globalAlpha = 1;
  }
  if (ui.koText > 0){
    ctx.globalAlpha = Math.min(0.6, ui.koText/2); ctx.fillStyle = '#300'; ctx.fillRect(0, 0, CW, CH); ctx.globalAlpha = 1;
    txt(t('ko'), CW/2, 340, 60, '#ff5a5a');
  }
  ui.toasts.forEach((t, i) => {
    ctx.font = 'bold 18px Arial'; const w = ctx.measureText(t.text).width + 36, y = 640 - i*40 - (ui.touch ? 0 : 20);
    ctx.globalAlpha = Math.min(1, t.t/0.4); ctx.fillStyle = 'rgba(8,8,16,0.88)'; rr(CW/2-w/2, y-24, w, 34, 10); ctx.fill();
    ctx.textAlign = 'center'; ctx.fillStyle = t.color; ctx.fillText(t.text, CW/2, y); ctx.globalAlpha = 1;
  });
  if (ui.fade > 0){ ctx.globalAlpha = Math.min(1, ui.fade / 0.6); ctx.fillStyle = '#000'; ctx.fillRect(0, 0, CW, CH); ctx.globalAlpha = 1; }
  if (!connected){
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, 0, CW, CH);
    txt(t('connecting'), CW/2, CH/2, 34, '#fff');
  }
}

let last = performance.now();
function frame(now){
  const dt = Math.min(0.05, (now-last)/1000); last = now;
  if (connected) update(dt); else camX += 0;
  ui.hits = [];
  ctx.clearRect(0, 0, CW, CH);
  if (room === 'club') drawClubScene();
  else { drawSky(); drawRoad(); drawWalls(); drawLamps(); drawZoneDecor(); [...ents.values()].sort((a,b) => a.ry - b.ry).forEach(drawActor); }
  drawFloaters();
  if (connected){ drawHUD(); drawControls(); drawDoorPrompt(); drawCard(); drawPanel(); drawClanPanel(); }
  drawOverlays();
  requestAnimationFrame(frame);
}

// ═══════════════ НА ВЕСЬ ЭКРАН ═══════════════
// Android/ПК: Fullscreen API. iPhone Safari его не поддерживает (запрет iOS) —
// там показываем инструкцию «На экран Домой»: установленная иконка открывается без полосок.
const fsBtn = $('fs'), docEl = document.documentElement;
const reqFs = docEl.requestFullscreen || docEl.webkitRequestFullscreen;
const exitFs = document.exitFullscreen || document.webkitExitFullscreen;
const inFs = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
const standalone = navigator.standalone === true || matchMedia('(display-mode: fullscreen)').matches || matchMedia('(display-mode: standalone)').matches;
if (standalone) fsBtn.hidden = true;
fsBtn.addEventListener('click', async () => {
  if (!reqFs){
        showMsg(t('ios_help'), t('understood'));
    return;
  }
  try {
    if (inFs()) exitFs.call(document);
    else { await reqFs.call(docEl); try { await screen.orientation.lock('landscape'); } catch(_){} }
  } catch(_){}
});
['fullscreenchange', 'webkitfullscreenchange'].forEach(ev => document.addEventListener(ev, () => fsBtn.classList.toggle('on', inFs())));

// ═══════════════ СТАРТ ═══════════════
// Каждый заход начинается со стартовой страницы (баннер + выбор языка). Язык по умолчанию —
// тот, что выбран раньше (или язык браузера); поменять его можно только здесь.
document.querySelectorAll('.lang').forEach(b => b.onclick = () => { lang = b.dataset.lang; try { localStorage.setItem('world_lang', lang); } catch(_){} applyLang(); });
applyLang(); setMode('reg');
$('play').onclick = async () => {
  try { localStorage.setItem('world_lang', lang); } catch(_){}
  $('scrStart').hidden = true;
  if (!token){ $('scrAuth').hidden = false; return; }
  try {
    const r = await api('me', null, true);
    if (r.char) enterGame(); else showCreate();
  } catch(e){
    if (e.status === 401){ try { localStorage.removeItem('world_token'); } catch(_){} token = null; }
    $('scrAuth').hidden = false;
  }
};
</script>
