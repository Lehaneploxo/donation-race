<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Гараж внутри — черновик</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:Arial,sans-serif;user-select:none}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{width:min(100vw,100vh*16/9);height:auto;aspect-ratio:16/9;display:block}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="1280" height="720"></canvas></div>
<script>
// ═══ ЧЕРНОВИК: ГАРАЖ ВНУТРИ (одна комната на весь экран) ═══
// Раскладка: вход — внизу по центру (как в клубе), машина на подъёмнике — по центру сзади,
// верстак с инструментами — слева, стеллаж с шинами и инструментальный шкаф — справа.
// Механика пока НЕТ — сюда встанет готовый спрайт (как бармен/танцоры в клубе).
// Здесь только макет: ходить можно, драться нельзя.
const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
const CW = 1280, CH = 720;

// зона ходьбы (ступни)
const Y_MIN = 260, Y_MAX = 705, X_MIN = 34, X_MAX = 1246;
const persp = y => 0.62 + 0.43 * (Math.max(0, Math.min(1, (y - 230) / (700 - 230))));

const DOOR = { x0:590, x1:772 };                    // вход/выход снизу — тот же проём, что в клубе
const LIFT = { x:640, y:330 };                      // машина на подъёмнике, по центру сзади
const BENCH = { x0:70, y0:300, x1:330, y1:420 };    // верстак слева
const TIRES = { x:1040, y:420 };                    // стопка шин справа
const CABINET = { x:1150, y:330 };                  // инструментальный шкаф у стены

// игрок — переиспользуем спрайт «Хулиган» (bancho), как в клубе
const CH_DEF = { bancho: { base:'urban_brawlers', idle:[7,9], walk:[6,12] } };
const _fc = {};
function frames(type, dir, anim){
  const k = dir + '|' + anim; if (_fc[k]) return _fc[k];
  const d = CH_DEF[type], n = d[anim][0], out = [];
  for (let i=1;i<=n;i++){ const im = new Image(); im.src = `sprites/${d.base}/${dir}/${anim==='idle'?'Idle':'Walk'}/${anim}${i}.png`; out.push(im); }
  return _fc[k] = out;
}
const ready = im => im && im.complete && im.naturalWidth;
const me = { x:676, y:668, face:1, t:0, moving:false };

const keys = {};
let note = null;
const nearDoor = () => me.y > Y_MAX - 26 && me.x > DOOR.x0 && me.x < DOOR.x1;
addEventListener('keydown', e => { keys[e.code] = true; if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code)) e.preventDefault();
  if (e.code === 'KeyE' && nearDoor()) note = { text: 'Выход на улицу (в черновике не работает)', t: 2.2 }; });
addEventListener('keyup', e => { keys[e.code] = false; });

function update(dt){
  let dx = 0, dy = 0;
  if (keys.ArrowLeft || keys.KeyA) dx -= 1; if (keys.ArrowRight || keys.KeyD) dx += 1;
  if (keys.ArrowUp || keys.KeyW) dy -= 1;   if (keys.ArrowDown || keys.KeyS) dy += 1;
  const run = (keys.ShiftLeft || keys.ShiftRight) ? 1.6 : 1, len = Math.hypot(dx, dy) || 1;
  me.moving = !!(dx || dy);
  if (dx) me.face = dx > 0 ? 1 : -1;
  me.x += dx/len * 240 * run * dt; me.y += dy/len * 150 * run * dt;
  me.x = Math.max(X_MIN, Math.min(X_MAX, me.x)); me.y = Math.max(Y_MIN, Math.min(Y_MAX, me.y));
  // твёрдые препятствия: подъёмник с машиной, стопка шин, шкаф, верстак
  const block = (bx, by, r, ry) => { const ddx = me.x-bx, ddy=(me.y-by)*(ry||1.6), d=Math.hypot(ddx,ddy); if (d<r){ me.x=bx+ddx/(d||1)*r; me.y=by+ddy/(d||1)*r/(ry||1.6); } };
  block(LIFT.x, LIFT.y+70, 130, 2.6);
  block(TIRES.x, TIRES.y+40, 60, 1.8);
  block(CABINET.x, CABINET.y+40, 46, 1.8);
  if (me.y > BENCH.y0-10 && me.y < BENCH.y1+40 && me.x > BENCH.x0-10 && me.x < BENCH.x1+10 && me.y < BENCH.y1+10) me.y = BENCH.y1+40;
  me.t += dt;
  if (note){ note.t -= dt; if (note.t <= 0) note = null; }
}

function rr(x, y, w, h, r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function txt(s, x, y, size, color, align){
  ctx.font = `bold ${size}px "Arial Black", Arial`; ctx.textAlign = align || 'center'; ctx.lineJoin = 'round';
  ctx.strokeStyle = 'rgba(0,0,0,0.85)'; ctx.lineWidth = Math.max(3, size/6); ctx.strokeText(s, x, y); ctx.fillStyle = color; ctx.fillText(s, x, y);
}

function drawFloor(){
  const g = ctx.createLinearGradient(0, 205, 0, CH); g.addColorStop(0, '#2a2a2e'); g.addColorStop(1, '#17171a');
  ctx.fillStyle = g; ctx.fillRect(0, 205, CW, CH-205);
  // бетонные плиты пола
  ctx.save(); ctx.beginPath(); ctx.rect(0, 205, CW, CH-205); ctx.clip();
  ctx.strokeStyle = 'rgba(255,255,255,0.05)'; ctx.lineWidth = 2;
  for (let y = 220; y < CH; y += 60){ ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(CW, y); ctx.stroke(); }
  for (let x = 0; x < CW; x += 120){ ctx.beginPath(); ctx.moveTo(x, 205); ctx.lineTo(x, CH); ctx.stroke(); }
  ctx.restore();
  // масляное пятно под подъёмником
  ctx.save(); ctx.globalAlpha = 0.35; ctx.fillStyle = '#050505';
  ctx.beginPath(); ctx.ellipse(LIFT.x, LIFT.y+150, 150, 34, 0, 0, Math.PI*2); ctx.fill(); ctx.restore();
  // жёлто-чёрная разметка у входа
  ctx.fillStyle = 'rgba(20,20,20,0.6)'; ctx.fillRect(DOOR.x0+10, 600, DOOR.x1-DOOR.x0-20, CH-600);
  ctx.strokeStyle = '#ffcc33'; ctx.lineWidth = 4; ctx.setLineDash([14,10]);
  ctx.strokeRect(DOOR.x0+10, 600, DOOR.x1-DOOR.x0-20, CH-600); ctx.setLineDash([]);
}

function drawWall(){
  const wg = ctx.createLinearGradient(0, 0, 0, 205); wg.addColorStop(0, '#1c1e22'); wg.addColorStop(1, '#33363c');
  ctx.fillStyle = wg; ctx.fillRect(0, 0, CW, 205);
  // кирпич по низу стены
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  for (let row=0, y=170; y<205; y+=18, row++) for (let x=(row%2)*40; x<CW; x+=80) ctx.fillRect(x, y, 76, 14);
  txt('GARAGE', 130, 60, 34, '#ffcc33', 'left');
  ctx.save(); ctx.shadowColor = '#ff5a3d'; ctx.shadowBlur = 16; txt('24/7 TUNING', 1150, 40, 18, '#ff8a5a', 'right'); ctx.restore();
}

// перфоборд с инструментами над верстаком (силуэты)
function drawPegboard(){
  ctx.fillStyle = '#3a3f46'; rr(BENCH.x0, 60, BENCH.x1-BENCH.x0, 130, 6); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.12)'; ctx.lineWidth = 1;
  for (let x = BENCH.x0+14; x < BENCH.x1-10; x += 20) for (let y = 76; y < 178; y += 20){ ctx.beginPath(); ctx.arc(x, y, 2, 0, Math.PI*2); ctx.stroke(); }
  const tools = [ ['#c94a2e', 40, 90, 60], ['#8a8f96', 110, 100, 40], ['#3a7fd0', 170, 85, 55], ['#d0c23a', 220, 95, 45] ];
  tools.forEach(([col, x, y, h]) => { ctx.strokeStyle = col; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(BENCH.x0+x, y); ctx.lineTo(BENCH.x0+x, y+h); ctx.stroke(); });
}
function drawBench(){
  ctx.fillStyle = '#5a4530'; rr(BENCH.x0, BENCH.y0, BENCH.x1-BENCH.x0, 28, 4); ctx.fill();
  ctx.fillStyle = '#2e2418'; ctx.fillRect(BENCH.x0+6, BENCH.y0+28, BENCH.x1-BENCH.x0-12, BENCH.y1-BENCH.y0-28);
  ctx.fillStyle = 'rgba(255,255,255,0.15)'; ctx.fillRect(BENCH.x0+2, BENCH.y0+2, BENCH.x1-BENCH.x0-4, 4);
  // мелочь на верстаке
  ['#c94a2e','#3a7fd0','#d0c23a'].forEach((c,i) => { ctx.fillStyle = c; ctx.fillRect(BENCH.x0+30+i*70, BENCH.y0-10, 40, 12); });
}
function drawTires(){
  for (let i=0;i<4;i++){
    ctx.fillStyle = '#1a1a1a'; ctx.beginPath(); ctx.ellipse(TIRES.x, TIRES.y - i*20, 58, 22, 0, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#000'; ctx.lineWidth = 3; ctx.stroke();
    ctx.fillStyle = '#333'; ctx.beginPath(); ctx.ellipse(TIRES.x, TIRES.y - i*20, 22, 9, 0, 0, Math.PI*2); ctx.fill();
  }
}
function drawCabinet(){
  ctx.fillStyle = '#c0392b'; rr(CABINET.x-46, CABINET.y-70, 92, 130, 6); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  for (let y = CABINET.y-58; y < CABINET.y+50; y += 24) ctx.fillRect(CABINET.x-40, y, 80, 3);
  for (let y = CABINET.y-58; y < CABINET.y+50; y += 24){ ctx.fillStyle='#f4d35e'; ctx.beginPath(); ctx.arc(CABINET.x+30, y+12, 4, 0, Math.PI*2); ctx.fill(); }
}
// машина на подъёмнике — силуэт спорткара, приподнят над полом
function drawLift(t){
  const bob = Math.sin(t*0.0015) * 2;
  const bx = LIFT.x, by = LIFT.y + bob;
  // стойки подъёмника
  ctx.fillStyle = '#8a8f96';
  ctx.fillRect(bx-140, by+40, 16, 130); ctx.fillRect(bx+124, by+40, 16, 130);
  ctx.fillStyle = '#c0392b'; ctx.fillRect(bx-150, by+165, 300, 14);
  // кузов
  ctx.save(); ctx.translate(bx, by);
  ctx.fillStyle = '#e04b2f';
  ctx.beginPath(); ctx.moveTo(-150, 30); ctx.lineTo(-120, -10); ctx.lineTo(-40, -34); ctx.lineTo(60, -34); ctx.lineTo(130, -6); ctx.lineTo(150, 30); ctx.lineTo(150, 46); ctx.lineTo(-150, 46); ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(180,230,255,0.55)'; ctx.beginPath(); ctx.moveTo(-30,-30); ctx.lineTo(50,-30); ctx.lineTo(70,-8); ctx.lineTo(-45,-8); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#1a1a1a'; ctx.beginPath(); ctx.arc(-95, 46, 26, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(95, 46, 26, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#555'; ctx.beginPath(); ctx.arc(-95, 46, 11, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(95, 46, 11, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.25)'; ctx.fillRect(-140, 4, 280, 6);
  ctx.restore();
  // искры под машиной (декор)
  for (let i=0;i<3;i++){ const a = t*0.003 + i*2.1, ex = bx + Math.cos(a)*40, ey = by+120+Math.sin(a*2)*6;
    ctx.fillStyle = `rgba(255,200,80,${0.4+0.4*Math.sin(t*0.01+i)})`; ctx.beginPath(); ctx.arc(ex, ey, 2.5, 0, Math.PI*2); ctx.fill(); }
}
function drawPlayer(){
  const k = persp(me.y), h = 160 * k;
  const anim = me.moving ? 'walk' : 'idle', list = frames('bancho', me.face>0?'right':'left', anim);
  const idx = Math.floor(me.t*8) % list.length, img = list[idx];
  ctx.save(); ctx.globalAlpha = 0.35; ctx.fillStyle = '#000'; ctx.beginPath(); ctx.ellipse(me.x, me.y, 28*k, 8*k, 0, 0, Math.PI*2); ctx.fill(); ctx.restore();
  if (ready(img)){ const sc = h / img.height, dw = img.width * sc; ctx.save(); ctx.imageSmoothingEnabled = false; ctx.drawImage(img, me.x - dw/2, me.y - h + 6, dw, h); ctx.restore(); }
  else { ctx.fillStyle = '#c94a2e'; rr(me.x-14*k, me.y-h, 28*k, h-6, 6); ctx.fill(); }
}

let last = performance.now();
function frame(now){
  const dt = Math.min(0.05, (now-last)/1000); last = now;
  update(dt);
  ctx.clearRect(0,0,CW,CH);
  drawWall(); drawPegboard(); drawFloor();
  const items = [ { y: BENCH.y1, fn: drawBench }, { y: TIRES.y, fn: drawTires }, { y: CABINET.y, fn: drawCabinet }, { y: LIFT.y+100, fn: () => drawLift(now) }, { y: me.y, fn: drawPlayer } ];
  items.sort((a,b) => a.y - b.y).forEach(it => it.fn());
  if (nearDoor()){ txt('E — выход', me.x, me.y - 190, 16, '#fff', 'center'); }
  if (note){ ctx.globalAlpha = Math.min(1, note.t/0.4); txt(note.text, CW/2, CH-40, 18, '#ffd23f', 'center'); ctx.globalAlpha = 1; }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
