<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Fantasy Arena — черновик формата Street Fighter</title>
<style>
  html, body { width:100vw; height:100vh; margin:0; background:#000; overflow:hidden; font-family:Arial,sans-serif; }
  #wrap { position:absolute; left:0; top:0; width:600px; height:1000px; transform-origin:0 0; }
  #panel { position:absolute; bottom:0; left:0; right:0; background:rgba(0,0,0,0.7); padding:8px; display:flex; flex-wrap:wrap; gap:5px; justify-content:center; }
  button { background:#222; color:#fff; border:1px solid #666; border-radius:6px; padding:6px 9px; font-size:11px; cursor:pointer; }
  button.active { background:#a02020; border-color:#ff6666; }
  button:active { background:#444; }
  .row { display:flex; gap:5px; width:100%; justify-content:center; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="600" height="1000"></canvas>
  <div id="panel">
    <div class="row" id="mapPicks"></div>
    <div class="row">
      <button onclick="startBattle()">↺ Новый бой</button>
    </div>
  </div>
</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const CW = canvas.width, CH = canvas.height;
const PANEL_TOP = 14, PANEL_H = 250;
const WALL_TOP = PANEL_TOP + PANEL_H + 10;

function fitScreen(){
  const s = Math.min(window.innerWidth/CW, window.innerHeight/CH);
  const wrap = document.getElementById('wrap');
  wrap.style.transform = `translate(${(window.innerWidth-CW*s)/2}px,${(window.innerHeight-CH*s)/2}px) scale(${s})`;
}
window.addEventListener('resize', fitScreen); fitScreen();

// ---------- roster (frame size == sheet height, frames laid out horizontally) ----------
const ROSTER = {
  hero_knight: { label:'🛡️ Рыцарь', dir:'hero_knight', frame:180, speed:110,
    anims:{ idle:['Idle.png',11], move:['Run.png',8], attack:['Attack1.png',7], hit:['Take Hit.png',4], death:['Death.png',11] } },
  martial_hero: { label:'🥋 Самурай', dir:'martial_hero', frame:200, speed:130,
    anims:{ idle:['Idle.png',8], move:['Run.png',8], attack:['Attack1.png',6], hit:['Take Hit.png',4], death:['Death.png',6] } },
  evil_wizard: { label:'🧙 Маг', dir:'evil_wizard', frame:150, speed:90,
    anims:{ idle:['Idle.png',8], move:['Move.png',8], attack:['Attack.png',8], hit:['Take Hit.png',4], death:['Death.png',5] } },
  huntress: { label:'🏹 Охотница', dir:'huntress', frame:150, speed:120,
    anims:{ idle:['Idle.png',8], move:['Run.png',8], attack:['Attack1.png',5], hit:['Take hit.png',3], death:['Death.png',8] } },
};
const imgCache = {};
function getImg(dir,file){
  const key = dir+'/'+file;
  if(!imgCache[key]){ const im = new Image(); im.src = `sprites/fantasy_arena/${dir}/${file}`; imgCache[key]=im; }
  return imgCache[key];
}
// preload all
Object.values(ROSTER).forEach(r=>Object.values(r.anims).forEach(a=>getImg(r.dir,a[0])));

// ---------- автобой: толпа бойцов бродит по арене и дерётся, как в streetfighter_arena.html
// (updateBotSpawns/update/startExchange/updateExchanges/finishExchange там) — не строгий
// 1 на 1, а N бойцов: каждый бродит к случайной точке, и как только двое оказываются
// ближе FIGHT_DIST — начинается exchange (серия 1-3 ударов, порядок внутри пары случайный),
// после размена — отступ друг от друга и пауза, дальше снова бродят. Погибший спустя
// паузу возрождается заново (случайный персонаж) — бой идёт бесконечно, как крауд-арена.
const FIGHTER_COUNT = 5;
const RING_X = { min:70, max: CW-70 };
const FIGHT_DIST = 100;      // дистанция, с которой начинается обмен ударами
const MIN_SEP = 85;          // минимальная дистанция между живыми бойцами (мягкое разведение)
const PUNCH_TICK_MS = 260;   // пауза между отдельными ударами внутри серии
const RETREAT_PUSH = 55;     // отступ друг от друга после обмена
const RESPAWN_DELAY_MS = 2200; // сколько лежит труп, прежде чем возродиться заново

function clampX(x){ return Math.max(RING_X.min, Math.min(RING_X.max, x)); }

function spawnFighter(x){
  const keys = Object.keys(ROSTER);
  const charKey = keys[Math.floor(Math.random()*keys.length)];
  return {
    charKey, x, tx:x, y:910, facing: Math.random()<0.5?1:-1,
    anim:'idle', frame:0, t:0, animLockUntil:0,
    hp:100, maxHp:100,
    wanderPause: 200+Math.random()*800,
    punchCooldown:0, inExchange:false,
    alive:true, respawnAt:0,
  };
}

let fighters = [];
let activeExchanges = [];

function startBattle(){
  fighters = [];
  for(let i=0;i<FIGHTER_COUNT;i++){
    const x = RING_X.min + (RING_X.max-RING_X.min) * ((i+0.5)/FIGHTER_COUNT);
    fighters.push(spawnFighter(x));
  }
  activeExchanges = [];
}

function startExchange(a,b){
  a.inExchange = b.inExchange = true;
  const hits = 1 + Math.floor(Math.random()*3);
  const queue = [];
  for(let i=0;i<hits;i++){
    // порядок внутри пары случайный — иначе тот, кто всегда бьёт первым,
    // мог бы убить соперника раньше, чем дойдёт очередь до его ответа
    if(Math.random()<0.5){ queue.push({attacker:a,defender:b}); queue.push({attacker:b,defender:a}); }
    else { queue.push({attacker:b,defender:a}); queue.push({attacker:a,defender:b}); }
  }
  activeExchanges.push({ a, b, queue, idx:0, timer:0 });
}

function throwPunch(attacker, defender){
  const def = ROSTER[attacker.charKey], odef = ROSTER[defender.charKey];
  if(def.anims.attack){ attacker.anim='attack'; attacker.frame=0; attacker.t=0; attacker.animLockUntil=performance.now()+PUNCH_TICK_MS+120; }
  attacker.facing = defender.x>=attacker.x ? 1 : -1;
  defender.facing = attacker.x>=defender.x ? 1 : -1;
  const dmg = 8 + Math.floor(Math.random()*10);
  defender.hp = Math.max(0, defender.hp - dmg);
  if(defender.hp<=0){
    if(odef.anims.death){ defender.anim='death'; defender.frame=0; defender.t=0; defender.animLockUntil=performance.now()+100000; }
    defender.alive = false; defender.respawnAt = performance.now()+RESPAWN_DELAY_MS;
  } else if(odef.anims.hit){
    defender.anim='hit'; defender.frame=0; defender.t=0; defender.animLockUntil=performance.now()+PUNCH_TICK_MS+60;
  }
}

function finishExchange(ex){
  const { a, b } = ex;
  const cd = 1000 + Math.random()*500;
  a.punchCooldown = cd; b.punchCooldown = cd;
  a.inExchange = false; b.inExchange = false;
  if(a.alive) a.anim='idle';
  if(b.alive) b.anim='idle';
  if(a.alive && b.alive){
    const dir = a.x<=b.x ? -1 : 1;
    a.tx = clampX(a.x + dir*RETREAT_PUSH);
    b.tx = clampX(b.x - dir*RETREAT_PUSH);
    a.wanderPause = b.wanderPause = 500;
  }
}

function updateExchanges(dt){
  for(let i=activeExchanges.length-1; i>=0; i--){
    const ex = activeExchanges[i];
    ex.timer -= dt*1000;
    if(ex.timer > 0) continue;
    if(!ex.a.alive || !ex.b.alive || ex.idx >= ex.queue.length){
      finishExchange(ex);
      activeExchanges.splice(i,1);
      continue;
    }
    const {attacker,defender} = ex.queue[ex.idx];
    ex.idx++;
    ex.timer = PUNCH_TICK_MS;
    if(attacker.alive && defender.alive) throwPunch(attacker, defender);
  }
}

function updateBattle(now, dt){
  for(const f of fighters){
    if(!f.alive){
      if(now >= f.respawnAt) Object.assign(f, spawnFighter(f.x));
      continue;
    }
    if(f.punchCooldown>0) f.punchCooldown -= dt*1000;
    if(f.inExchange) continue;

    f.wanderPause -= dt*1000;
    const dx = f.tx - f.x;
    if(Math.abs(dx)<6 && f.wanderPause<=0){
      f.tx = RING_X.min + Math.random()*(RING_X.max-RING_X.min);
      f.wanderPause = 500 + Math.random()*1400;
    }
    if(Math.abs(dx)>6){
      const def = ROSTER[f.charKey];
      f.x += Math.sign(dx) * (def.speed||100) * dt;
      f.facing = dx>0 ? 1 : -1;
      f.anim = 'move';
    } else {
      f.anim = 'idle';
    }
  }

  // мягкое разведение — живые бойцы не должны залипать друг в друге
  for(let i=0;i<fighters.length;i++){
    const a = fighters[i]; if(!a.alive) continue;
    for(let j=i+1;j<fighters.length;j++){
      const b = fighters[j]; if(!b.alive) continue;
      const d = b.x-a.x, ad = Math.abs(d)||0.001;
      if(ad < MIN_SEP){
        const push=(MIN_SEP-ad)/2, dir = d<0?-1:1;
        a.x = clampX(a.x - dir*push);
        b.x = clampX(b.x + dir*push);
      }
    }
  }

  // запуск обменов между сблизившимися бойцами
  for(let i=0;i<fighters.length;i++){
    const a = fighters[i]; if(!a.alive || a.punchCooldown>0 || a.inExchange) continue;
    for(let j=i+1;j<fighters.length;j++){
      const b = fighters[j]; if(!b.alive || b.punchCooldown>0 || b.inExchange) continue;
      if(Math.abs(a.x-b.x) < FIGHT_DIST) startExchange(a,b);
    }
  }

  updateExchanges(dt);
}
startBattle();

// ---------- map: тайловая подземная арена, собрана из Tilesetv3.png ----------
// Fort of Illusion (готовая картинка 895x272) не подходила: под зону 600x726
// её растягивало почти в 2.7 раза и обрезало по бокам — мылилась и превращалась
// в случайный кусок стены. Тут вместо одной картинки — тайлы 16x16, отрисованные
// на целом пиксельном масштабе (без дробного зума), поэтому чётко и без мыла,
// и в том же стиле пиксель-арта, что и бойцы.
//
// "Ощущение движения" (по запросу) — стена+пол непрерывно скроллятся (scrollX),
// плюс по стене периодически проезжают декорации (дверь/окно/знамя/факел/ворота
// из Fort of Illusion Files/Assets/Layers/all-props.png) — однородный кирпич сам
// по себе почти не читается как движение, а landmarks делают эффект однозначным.
const tilesetImg = new Image(); tilesetImg.src = 'sprites/fantasy_arena/stage/Tilesetv3.png';
const propsImg = new Image(); propsImg.src = "sprites/fantasy_arena/stage2/Fort of Illusion Files/Assets/Layers/all-props.png";
const TILE = 16;
const TS = 3; // масштаб тайла (целое число — без мыла на пиксель-арте)
const WALL_TILE = { sx: 6*TILE, sy: 15*TILE }; // однотонный тёмный камень стены
const FLOOR_TILE = { sx: 6*TILE, sy: 20*TILE }; // светлее каменный пол
const FLOOR_ROWS = 4; // сколько тайлов пола (в высоту) отвести под пол

const SCROLL_SPEED = 42; // px/сек — скорость "движения" карты
let scrollX = 0;

// вырезки из all-props.png (координаты сняты через сеточный инспектор по факту)
const PROPS = [
  { sx:0,   sy:160, sw:96, sh:64,  scale:2.1, anchor:'bottom' }, // дверь закрытая
  { sx:160, sy:150, sw:32, sh:170, scale:2.1, anchor:'bottom' }, // факел на шесте + знамя
  { sx:112, sy:160, sw:32, sh:48,  scale:2.1, anchor:'bottom' }, // окно витражное
  { sx:144, sy:80,  sw:48, sh:48,  scale:2.1, anchor:'top' },    // знамя на стене
  { sx:240, sy:160, sw:64, sh:64,  scale:2.1, anchor:'bottom' }, // открытые ворота
];
const PROP_SPACING = 300; // расстояние между декорациями в "мировых" пикселях

const MAPS = [
  { key:'crypt', label:'🏰 Каменный склеп' },
  { key:'ship', label:'🚢 Корабль в море' },
];
let currentMap = 'ship';
function renderMapPicks(){
  const el = document.getElementById('mapPicks');
  el.innerHTML = '';
  MAPS.forEach(m=>{
    const b = document.createElement('button');
    b.textContent = m.label;
    if(m.key===currentMap) b.classList.add('active');
    b.onclick = ()=>{ currentMap = m.key; renderMapPicks(); };
    el.appendChild(b);
  });
}
renderMapPicks();

// ---------- background: общая для обеих карт часть (тень стыка + виньетка) ----------
function drawSeamAndVignette(seamY, areaH){
  const seam = ctx.createLinearGradient(0,seamY-24,0,seamY+10);
  seam.addColorStop(0,'rgba(0,0,0,0)'); seam.addColorStop(1,'rgba(0,0,0,0.55)');
  ctx.fillStyle=seam; ctx.fillRect(0,seamY-24,CW,34);
  const vgrad = ctx.createLinearGradient(0,0,CW,0);
  vgrad.addColorStop(0,'rgba(0,0,0,0.5)'); vgrad.addColorStop(0.12,'rgba(0,0,0,0)');
  vgrad.addColorStop(0.88,'rgba(0,0,0,0)'); vgrad.addColorStop(1,'rgba(0,0,0,0.5)');
  ctx.fillStyle=vgrad; ctx.fillRect(0,WALL_TOP,CW,areaH);
}

function drawBGCrypt(){
  ctx.fillStyle='#0a0e18'; ctx.fillRect(0,WALL_TOP,CW,CH-WALL_TOP);
  if(!tilesetImg.complete || tilesetImg.naturalWidth===0) return;
  ctx.imageSmoothingEnabled = false;
  const step = TILE*TS;
  const areaH = CH-WALL_TOP;
  const floorH = FLOOR_ROWS*step;
  const wallH = areaH - floorH;
  const seamY = WALL_TOP+wallH;
  const scrollOff = ((scrollX % step) + step) % step;
  // стена
  for(let y=WALL_TOP; y<WALL_TOP+wallH; y+=step){
    for(let x=-scrollOff; x<CW; x+=step){
      ctx.drawImage(tilesetImg, WALL_TILE.sx, WALL_TILE.sy, TILE, TILE, x, y, step, step);
    }
  }
  // пол
  for(let y=WALL_TOP+wallH; y<CH; y+=step){
    for(let x=-scrollOff; x<CW; x+=step){
      ctx.drawImage(tilesetImg, FLOOR_TILE.sx, FLOOR_TILE.sy, TILE, TILE, x, y, step, step);
    }
  }
  // декорации, проезжающие по стене (создают однозначное ощущение движения)
  if(propsImg.complete && propsImg.naturalWidth>0){
    const firstIdx = Math.floor((scrollX-150)/PROP_SPACING);
    for(let i=firstIdx; i*PROP_SPACING - scrollX < CW+150; i++){
      const p = PROPS[((i%PROPS.length)+PROPS.length)%PROPS.length];
      const cx = i*PROP_SPACING - scrollX;
      const dw = p.sw*p.scale, dh = p.sh*p.scale;
      const dy = p.anchor==='bottom' ? seamY-dh : WALL_TOP+6;
      ctx.drawImage(propsImg, p.sx, p.sy, p.sw, p.sh, cx-dw/2, dy, dw, dh);
    }
  }
  drawSeamAndVignette(seamY, areaH);
}

// ---------- background: корабль в море (полностью процедурная отрисовка, без
// внешних спрайтов). По прямому уточнению пользователя: сам корабль (палуба,
// мачта, борт) НЕ едет никуда — это статичная сцена, "камера" сидит на борту.
// Двигается только море (волны + блики анимируются по времени t), плюс
// остаётся лёгкое покачивание всей сцены (см. render()) — это и даёт "плывёт",
// без ощущения, что мимо корабля едет ландшафт (как раньше — отклонено).
function drawShipProp(type, cx, seamY, t){
  if(type==='mast'){
    const poleW=10, poleH=(seamY-WALL_TOP)*0.92, topY=seamY-poleH;
    // такелаж — растяжки от вершины мачты к палубе, за мачтой
    ctx.strokeStyle='rgba(60,40,20,0.55)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(cx, topY+4); ctx.lineTo(cx-70, seamY-4); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx, topY+4); ctx.lineTo(cx+38, seamY-4); ctx.stroke();
    // сама мачта + лёгкая текстура дерева
    ctx.fillStyle='#4a2f18'; ctx.fillRect(cx-poleW/2, topY, poleW, poleH);
    ctx.strokeStyle='rgba(0,0,0,0.25)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(cx-2,topY); ctx.lineTo(cx-2,seamY); ctx.stroke();
    // парус
    ctx.fillStyle='rgba(238,231,210,0.94)';
    ctx.beginPath();
    ctx.moveTo(cx, topY+6);
    ctx.lineTo(cx+66, topY+38);
    ctx.lineTo(cx, topY+92);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,0.25)'; ctx.lineWidth=1.5; ctx.stroke();
    // вымпел на верхушке, слегка колышется
    const flutter = Math.sin(t*0.004)*6;
    ctx.fillStyle='#a02020';
    ctx.beginPath();
    ctx.moveTo(cx, topY-2); ctx.lineTo(cx+26+flutter, topY+4); ctx.lineTo(cx, topY+10);
    ctx.closePath(); ctx.fill();
  } else if(type==='barrel'){
    const w=46,h=54;
    const grad = ctx.createLinearGradient(cx-w/2,0,cx+w/2,0);
    grad.addColorStop(0,'#6e431f'); grad.addColorStop(0.5,'#9a662f'); grad.addColorStop(1,'#6e431f');
    ctx.fillStyle=grad; ctx.fillRect(cx-w/2, seamY-h, w, h);
    ctx.strokeStyle='#3d2510'; ctx.lineWidth=2;
    for(let i=1;i<4;i++){ ctx.beginPath(); ctx.moveTo(cx-w/2+i*(w/4), seamY-h); ctx.lineTo(cx-w/2+i*(w/4), seamY); ctx.stroke(); }
    ctx.lineWidth=4;
    ctx.strokeRect(cx-w/2, seamY-h+8, w, 6);
    ctx.strokeRect(cx-w/2, seamY-6-6, w, 6);
  } else if(type==='rope'){
    ctx.strokeStyle='#c9a86a'; ctx.lineWidth=5;
    ctx.beginPath(); ctx.arc(cx, seamY-22, 17, 0, Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx, seamY-22, 9, 0, Math.PI*2); ctx.stroke();
    ctx.strokeStyle='rgba(0,0,0,0.2)'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.arc(cx, seamY-22, 13, 0.3, Math.PI*1.3); ctx.stroke();
  } else if(type==='wheel'){
    const r=26;
    ctx.strokeStyle='#3d2510'; ctx.lineWidth=5;
    ctx.beginPath(); ctx.arc(cx, seamY-r-4, r, 0, Math.PI*2); ctx.stroke();
    ctx.fillStyle='#3d2510';
    for(let a=0;a<8;a++){
      const ang = a*Math.PI/4;
      ctx.save(); ctx.translate(cx, seamY-r-4); ctx.rotate(ang);
      ctx.fillRect(-3, -r-6, 6, 12);
      ctx.restore();
    }
    ctx.fillStyle='#6e431f'; ctx.beginPath(); ctx.arc(cx, seamY-r-4, 7, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle='#4a2f18'; ctx.fillRect(cx-5, seamY-10, 10, 10);
  }
}
// фиксированные позиции палубного реквизита — корабль статичен, ничего не проезжает мимо
const SHIP_PROPS_FIXED = [
  { type:'barrel', xr:0.12 },
  { type:'wheel',  xr:0.30 },
  { type:'mast',   xr:0.58 },
  { type:'rope',   xr:0.88 },
];
function drawWaveBand(yTop, yBot, freq, phase, fillTop, fillBot){
  ctx.beginPath();
  ctx.moveTo(-40, yTop + Math.sin(-40*freq+phase)*(yBot-yTop)*0.5);
  for(let x=-40; x<=CW+40; x+=8){
    const yy = yTop + Math.sin(x*freq+phase)*(yBot-yTop)*0.5 + Math.sin(x*freq*2.3+phase*1.7)*(yBot-yTop)*0.15;
    ctx.lineTo(x,yy);
  }
  ctx.lineTo(CW+40, yBot+30); ctx.lineTo(-40, yBot+30); ctx.closePath();
  const g = ctx.createLinearGradient(0,yTop,0,yBot+30);
  g.addColorStop(0,fillTop); g.addColorStop(1,fillBot);
  ctx.fillStyle = g; ctx.fill();
}
function drawWaveLine(y, amp, freq, phase, color, lineW){
  ctx.strokeStyle=color; ctx.lineWidth=lineW; ctx.beginPath();
  for(let x=-40; x<=CW+40; x+=8){
    const yy = y + Math.sin(x*freq+phase)*amp + Math.sin(x*freq*2.3+phase*1.7)*amp*0.3;
    if(x===-40) ctx.moveTo(x,yy); else ctx.lineTo(x,yy);
  }
  ctx.stroke();
  // мелкие штрихи пены на гребне волны — прерывистая текстура вместо ровной линии
  ctx.strokeStyle=color; ctx.lineWidth=lineW*0.6;
  for(let x=-40; x<=CW+40; x+=22){
    const yy = y + Math.sin(x*freq+phase)*amp + Math.sin(x*freq*2.3+phase*1.7)*amp*0.3;
    ctx.beginPath(); ctx.moveTo(x, yy-1); ctx.lineTo(x+8, yy-1); ctx.stroke();
  }
}
// простой детерминированный псевдослучайный шум (без Math.random, чтобы блики
// не "прыгали" каждый кадр — только плавно мерцают по sin(t))
function hashSeed(i){ const s = Math.sin(i*12.9898)*43758.5453; return s - Math.floor(s); }
function drawBGShip(t){
  const areaH = CH-WALL_TOP;
  const floorH = FLOOR_ROWS*TILE*TS; // та же высота палубы, что и пол в склепе — бойцы стоят на том же уровне
  const wallH = areaH - floorH;
  const seamY = WALL_TOP+wallH;
  const horizonY = WALL_TOP + wallH*0.42;

  // небо с мягким свечением у горизонта
  const sky = ctx.createLinearGradient(0,WALL_TOP,0,horizonY);
  sky.addColorStop(0,'#5fb3e8'); sky.addColorStop(0.65,'#a9deff'); sky.addColorStop(1,'#f3fbff');
  ctx.fillStyle=sky; ctx.fillRect(0,WALL_TOP,CW,horizonY-WALL_TOP);

  // солнце — мягкое свечение у горизонта
  const sunX = CW*0.74, sunY = horizonY-4;
  const sunGlow = ctx.createRadialGradient(sunX,sunY,4, sunX,sunY,70);
  sunGlow.addColorStop(0,'rgba(255,250,220,0.9)'); sunGlow.addColorStop(0.4,'rgba(255,240,190,0.35)'); sunGlow.addColorStop(1,'rgba(255,240,190,0)');
  ctx.fillStyle=sunGlow; ctx.beginPath(); ctx.arc(sunX,sunY,70,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='rgba(255,252,235,0.95)'; ctx.beginPath(); ctx.arc(sunX,sunY,16,0,Math.PI*2); ctx.fill();

  // облака — медленно плывут по небу (петлёй по ширине экрана)
  ctx.fillStyle='rgba(255,255,255,0.75)';
  const cloudDrift = (t*0.006);
  [[0.12,0.35,34],[0.55,0.22,44],[0.85,0.5,28]].forEach(([xr,yr,r],i)=>{
    const cx = ((xr*CW + cloudDrift*(0.4+i*0.2)) % (CW+160)) - 80;
    const cy = WALL_TOP + (horizonY-WALL_TOP)*yr;
    ctx.beginPath();
    ctx.ellipse(cx, cy, r, r*0.55, 0, 0, Math.PI*2);
    ctx.ellipse(cx+r*0.7, cy+r*0.12, r*0.65, r*0.4, 0, 0, Math.PI*2);
    ctx.ellipse(cx-r*0.7, cy+r*0.15, r*0.55, r*0.35, 0, 0, Math.PI*2);
    ctx.fill();
  });

  // море — более глубокий, живой градиент + световая полоса у горизонта
  const sea = ctx.createLinearGradient(0,horizonY,0,seamY);
  sea.addColorStop(0,'#4fb8d6'); sea.addColorStop(0.15,'#1f8fb8');
  sea.addColorStop(0.55,'#136f96'); sea.addColorStop(1,'#0a3f5c');
  ctx.fillStyle=sea; ctx.fillRect(0,horizonY,CW,seamY-horizonY);
  const glare = ctx.createLinearGradient(0,horizonY,0,horizonY+40);
  glare.addColorStop(0,'rgba(255,255,255,0.55)'); glare.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=glare; ctx.fillRect(0,horizonY,CW,40);

  // волны — несколько рядов, анимируются по времени (не по позиции корабля —
  // корабль стоит на месте, волны "текут" сами по себе). Под каждой линией —
  // залитая полупрозрачная "пенная" полоса для объёма, а не просто штрих.
  // Лёгкое размытие смягчает пиксельную "механичность" линий синуса.
  const seaH = seamY-horizonY;
  ctx.save();
  ctx.filter = 'blur(0.7px)';
  drawWaveBand(horizonY+seaH*0.60, horizonY+seaH*0.66, 0.013, t*0.0006+4, 'rgba(255,255,255,0.16)', 'rgba(255,255,255,0)');
  drawWaveBand(horizonY+seaH*0.80, horizonY+seaH*0.87, 0.011, -t*0.0005+6, 'rgba(255,255,255,0.22)', 'rgba(255,255,255,0)');
  drawWaveLine(horizonY+seaH*0.22, 3, 0.020, t*0.0009, 'rgba(255,255,255,0.30)', 2);
  drawWaveLine(horizonY+seaH*0.42, 4.5, 0.016, -t*0.0007+2, 'rgba(255,255,255,0.40)', 2.5);
  drawWaveLine(horizonY+seaH*0.63, 6, 0.013, t*0.0006+4, 'rgba(255,255,255,0.5)', 3);
  drawWaveLine(horizonY+seaH*0.85, 8, 0.011, -t*0.0005+6, 'rgba(255,255,255,0.65)', 3.5);
  ctx.restore();

  // блуждающие блики-каустики — мягкие пятна света, плывущие по воде (аддитивно)
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  [[0.2,0.35],[0.5,0.6],[0.78,0.45]].forEach(([xr,yr],i)=>{
    const px = ((xr*CW + t*0.012*(i%2?1:-1)) % (CW+120)) - 60;
    const py = horizonY + yr*seaH;
    const r = 26 + 6*Math.sin(t*0.0015+i*3);
    const g = ctx.createRadialGradient(px,py,0, px,py,r);
    g.addColorStop(0,'rgba(255,255,255,0.16)'); g.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(px,py,r,0,Math.PI*2); ctx.fill();
  });
  ctx.restore();

  // блики — мерцающие точки на воде
  for(let i=0;i<26;i++){
    const rx = hashSeed(i), ry = hashSeed(i+100);
    const px = rx*CW, py = horizonY + ry*seaH;
    const tw = 0.5 + 0.5*Math.sin(t*0.003 + i*7.3);
    if(tw < 0.55) continue;
    ctx.fillStyle = `rgba(255,255,255,${(tw-0.55)*1.2})`;
    ctx.fillRect(px, py, 3, 1.5);
  }

  // борт корабля — изогнутый деревянный борт (не прямая линия — читается как
  // обшивка корпуса, а не забор) + пена вдоль ватерлинии + стойки поручня
  const railBase = seamY-14;
  const railY = x => railBase - 6*Math.sin((x/CW)*Math.PI);
  ctx.fillStyle='#5e371b';
  ctx.beginPath(); ctx.moveTo(0, railY(0));
  for(let x=0;x<=CW;x+=10) ctx.lineTo(x, railY(x));
  ctx.lineTo(CW, seamY); ctx.lineTo(0, seamY); ctx.closePath(); ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,0.3)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(0, railY(0));
  for(let x=0;x<=CW;x+=10) ctx.lineTo(x, railY(x));
  ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,0.65)'; ctx.lineWidth=2;
  for(let x=0;x<CW;x+=14){
    const yy = railY(x) - 2 + Math.sin(x*0.05+t*0.004)*1.5;
    ctx.beginPath(); ctx.moveTo(x,yy); ctx.lineTo(x+7,yy); ctx.stroke();
  }
  ctx.fillStyle='#3d2510';
  for(let x=24;x<CW;x+=76) ctx.fillRect(x-2, railY(x), 4, seamY-railY(x));

  // палуба — доски со швами и лёгкой текстурой волокон, ФИКСИРОВАНЫ (корабль не едет)
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle='#7a4a26'; ctx.fillRect(0, seamY, CW, floorH);
  const plankH = 34, plankW = 58;
  for(let row=0, y=seamY; y<CH; y+=plankH, row++){
    const rowOffset = (row%2)*(plankW/2);
    for(let x=-rowOffset; x<CW; x+=plankW){
      // волокна доски — тонкие горизонтальные штрихи разной длины
      ctx.strokeStyle='rgba(0,0,0,0.12)'; ctx.lineWidth=1;
      for(let k=0;k<3;k++){
        const fy = y+6+k*9;
        ctx.beginPath(); ctx.moveTo(x+6, fy); ctx.lineTo(x+plankW-10-k*6, fy); ctx.stroke();
      }
      // заклёпки по углам доски
      ctx.fillStyle='rgba(0,0,0,0.35)';
      ctx.fillRect(x+5, y+5, 2, 2); ctx.fillRect(x+plankW-8, y+5, 2, 2);
    }
  }
  ctx.strokeStyle='rgba(0,0,0,0.32)'; ctx.lineWidth=2;
  for(let y=seamY+plankH; y<CH; y+=plankH){
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(CW,y); ctx.stroke();
  }
  ctx.strokeStyle='rgba(0,0,0,0.2)'; ctx.lineWidth=1.5;
  for(let row=0, y=seamY; y<CH; y+=plankH, row++){
    const rowOffset = (row%2)*(plankW/2);
    for(let x=-rowOffset; x<CW; x+=plankW){
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, Math.min(y+plankH,CH)); ctx.stroke();
    }
  }

  // мачта/бочка/штурвал/канат — стоят на фиксированных местах на палубе
  SHIP_PROPS_FIXED.forEach(p => drawShipProp(p.type, p.xr*CW, seamY, t));

  drawSeamAndVignette(seamY, areaH);
}

function drawBG(t){
  if(currentMap==='ship') drawBGShip(t);
  else drawBGCrypt();
}

// ---------- HUD panel (same layout as Street Fighter: rules left, top right) ----------
function drawHUD(){
  const T = PANEL_TOP, TH = PANEL_H;
  const bg = ctx.createLinearGradient(0,T,0,T+TH);
  bg.addColorStop(0,'rgba(20,10,25,0.97)'); bg.addColorStop(1,'rgba(8,4,10,0.97)');
  ctx.fillStyle=bg; ctx.fillRect(0,T,CW,TH);
  ctx.strokeStyle='rgba(180,80,255,0.4)'; ctx.lineWidth=1.5;
  ctx.strokeRect(2,T+2,CW-4,TH-4);

  ctx.font='bold 24px Arial Black'; ctx.textAlign='center';
  ctx.strokeStyle='rgba(0,0,0,0.9)'; ctx.lineWidth=4;
  ctx.strokeText('FANTASY ARENA', CW/2, T+34, CW-20);
  ctx.save(); ctx.shadowColor='#b040ff'; ctx.shadowBlur=10;
  ctx.fillStyle='#c060ff'; ctx.fillText('FANTASY ARENA', CW/2, T+34, CW-20);
  ctx.restore();

  ctx.font='11px Arial'; ctx.fillStyle='rgba(255,255,255,0.4)';
  ctx.fillText('(рабочее название — черновик)', CW/2, T+50);

  const vg = ctx.createLinearGradient(0,T+58,0,T+TH-6);
  vg.addColorStop(0,'rgba(255,255,255,0)'); vg.addColorStop(0.3,'rgba(255,255,255,0.12)');
  vg.addColorStop(0.7,'rgba(255,255,255,0.12)'); vg.addColorStop(1,'rgba(255,255,255,0)');
  ctx.strokeStyle=vg; ctx.beginPath(); ctx.moveTo(CW/2,T+58); ctx.lineTo(CW/2,T+TH-6); ctx.stroke();

  const rules = [
    { text:'👍 1 лайк = +10❤️ +1💪', color:'#FF88CC' },
    { text:'🎁 1 монета = +100❤️ +10💪', color:'#FFD700' },
    { text:'💬 Напиши "rating" — узнаешь топ', color:'#8fffb0' },
    { text:'🎮 Напиши "skin1"-"skin4" — выбери героя', color:'#7fd3ff' },
  ];
  const rY = T+72, rStep = 28;
  const ruleFont='bold 22px Arial Black';
  const ruleAvailW = CW/2-16;
  ctx.font=ruleFont;
  let sx=1; rules.forEach(r=>{sx=Math.min(sx, ruleAvailW/ctx.measureText(r.text).width);});
  rules.forEach((r,i)=>{
    ctx.save(); ctx.scale(sx,1); ctx.font=ruleFont; ctx.textAlign='left';
    ctx.strokeStyle='rgba(0,0,0,0.85)'; ctx.lineWidth=3.5;
    ctx.strokeText(r.text, 8/sx, rY+i*rStep);
    ctx.fillStyle=r.color; ctx.fillText(r.text, 8/sx, rY+i*rStep);
    ctx.restore();
  });

  ctx.font='bold 12px Arial Black'; ctx.textAlign='center';
  ctx.strokeStyle='rgba(0,0,0,0.9)'; ctx.lineWidth=3;
  ctx.strokeText('🏆 ТОП БОЙЦЫ 🏆', CW*0.75, T+70, CW/2-16);
  ctx.fillStyle='#ffd24f'; ctx.fillText('🏆 ТОП БОЙЦЫ 🏆', CW*0.75, T+70, CW/2-16);

  const top = [
    {name:'dragon_slay3r', pts:2140},{name:'moonlit_fox', pts:1870},
    {name:'gg_viewer', pts:1420},{name:'kkatya', pts:980},{name:'no_name', pts:640},
  ];
  const rankColors = ['#FFD700','#C0C0C0','#CD7F32','#AAAAAA','#666666'];
  const tX = CW/2+8, tY = T+98, tStep=29;
  top.forEach((p,i)=>{
    const y = tY+i*tStep;
    if(i===0){ ctx.fillStyle='rgba(255,215,0,0.08)'; ctx.fillRect(tX-4,y-21,CW/2-12,tStep-1); }
    ctx.font = i===0?'bold 20px Arial Black':'bold 18px Arial Black';
    ctx.textAlign='left'; ctx.strokeStyle='rgba(0,0,0,0.9)'; ctx.lineWidth=3.5;
    ctx.strokeText((i+1)+'.', tX, y);
    ctx.fillStyle=rankColors[i]; ctx.fillText((i+1)+'.', tX, y);
    ctx.strokeText(p.name, tX+24, y, 148);
    ctx.fillStyle = i===0?'#FFE566':'#EEEEEE'; ctx.fillText(p.name, tX+24, y, 148);
    ctx.textAlign='right'; ctx.strokeStyle='rgba(0,0,0,0.9)'; ctx.lineWidth=3;
    ctx.font = i===0?'bold 16px Arial':'bold 15px Arial';
    ctx.strokeText('⚡'+p.pts, CW-8, y);
    ctx.fillStyle='#e0a0ff'; ctx.fillText('⚡'+p.pts, CW-8, y);
  });
  ctx.font='9px Arial'; ctx.fillStyle='rgba(255,255,255,0.25)';
  ctx.textAlign='center'; ctx.fillText('пример / заглушка данных', CW*0.75, T+TH-6);
}

// ---------- fighter render ----------
function drawFighter(f, now){
  const def = ROSTER[f.charKey];
  const animDef = def.anims[f.anim] || def.anims.idle;
  const [file, count] = animDef;
  const img = getImg(def.dir, file);
  const fps = f.anim==='idle' ? 8 : 14;
  if(now - f.t > 1000/fps){
    f.t = now;
    if(f.anim==='move'){ f.frame = (f.frame+1) % count; }
    else if(f.frame < count-1) f.frame++;
    else if(f.anim==='death'){ /* hold last frame */ }
    else if(f.anim!=='idle' && now < f.animLockUntil){ /* hold */ }
    else { f.anim='idle'; f.frame=0; }
  }
  if(!img.complete || img.naturalWidth===0) return;
  const size = def.frame;
  const sx = Math.min(f.frame, count-1) * size;
  const drawH = 380, drawW = 380;
  ctx.save();
  ctx.translate(f.x, f.y);
  ctx.scale(f.facing, 1);
  ctx.drawImage(img, sx, 0, size, size, -drawW/2, -drawH, drawW, drawH);
  ctx.restore();

  if(f.anim!=='death'){
    const bw=90, bh=8, bx=f.x-bw/2, by=f.y-345;
    ctx.fillStyle='rgba(0,0,0,0.6)'; ctx.fillRect(bx-2,by-2,bw+4,bh+4);
    const pct = Math.max(0,f.hp)/f.maxHp;
    const hpColor = pct>0.5?'#5ee06a':(pct>0.25?'#ffcc4d':'#ff5050');
    ctx.fillStyle=hpColor; ctx.fillRect(bx,by,bw*pct,bh);
    ctx.strokeStyle='rgba(255,255,255,0.5)'; ctx.lineWidth=1; ctx.strokeRect(bx,by,bw,bh);
  }
}

let lastT = 0;
function render(t){
  const dt = lastT ? Math.min((t-lastT)/1000, 0.05) : 0; // сек, клампим на случай лагов вкладки
  lastT = t;
  scrollX += SCROLL_SPEED*dt;
  updateBattle(t, dt);
  ctx.clearRect(0,0,CW,CH);
  const rocking = currentMap==='ship';
  if(rocking){
    const cx = CW/2, cy = WALL_TOP + (CH-WALL_TOP)/2;
    ctx.save();
    ctx.translate(cx, cy + Math.sin(t/1200)*6);
    ctx.rotate(Math.sin(t/1500)*0.012);
    ctx.translate(-cx, -cy);
  }
  drawBG(t);
  fighters.forEach(f => drawFighter(f, t));
  if(rocking) ctx.restore();
  drawHUD();
  requestAnimationFrame(render);
}
requestAnimationFrame(render);
</script>
