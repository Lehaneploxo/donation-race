<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Fantasy Arena — черновик формата Street Fighter</title>
<style>
  html, body { width:100vw; height:100vh; margin:0; background:#000; overflow:hidden; font-family:Arial,sans-serif; }
  #wrap { position:absolute; left:0; top:0; width:600px; height:1000px; transform-origin:0 0; }
  #panel { position:absolute; bottom:0; left:0; right:0; background:rgba(0,0,0,0.7); padding:8px; display:flex; flex-wrap:wrap; gap:5px; justify-content:center; }
  button { background:#222; color:#fff; border:1px solid #666; border-radius:6px; padding:6px 9px; font-size:11px; cursor:pointer; }
  button.active { background:#a02020; border-color:#ff6666; }
  button:active { background:#444; }
  .row { display:flex; gap:5px; width:100%; justify-content:center; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="600" height="1000"></canvas>
  <div id="panel">
    <div class="row" id="mapPicks"></div>
    <div class="row">
      <button onclick="startBattle()">↺ Новый бой</button>
    </div>
  </div>
</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const CW = canvas.width, CH = canvas.height;
const PANEL_TOP = 14, PANEL_H = 250;
const WALL_TOP = PANEL_TOP + PANEL_H + 10;

function fitScreen(){
  const s = Math.min(window.innerWidth/CW, window.innerHeight/CH);
  const wrap = document.getElementById('wrap');
  wrap.style.transform = `translate(${(window.innerWidth-CW*s)/2}px,${(window.innerHeight-CH*s)/2}px) scale(${s})`;
}
window.addEventListener('resize', fitScreen); fitScreen();

// ---------- roster (frame size == sheet height, frames laid out horizontally) ----------
const ROSTER = {
  hero_knight: { label:'🛡️ Рыцарь', dir:'hero_knight', frame:180, speed:110,
    anims:{ idle:['Idle.png',11], move:['Run.png',8], attack:['Attack1.png',7], hit:['Take Hit.png',4], death:['Death.png',11] } },
  martial_hero: { label:'🥋 Самурай', dir:'martial_hero', frame:200, speed:130,
    anims:{ idle:['Idle.png',8], move:['Run.png',8], attack:['Attack1.png',6], hit:['Take Hit.png',4], death:['Death.png',6] } },
  evil_wizard: { label:'🧙 Маг', dir:'evil_wizard', frame:150, speed:90,
    anims:{ idle:['Idle.png',8], move:['Move.png',8], attack:['Attack.png',8], hit:['Take Hit.png',4], death:['Death.png',5] } },
  huntress: { label:'🏹 Охотница', dir:'huntress', frame:150, speed:120,
    anims:{ idle:['Idle.png',8], move:['Run.png',8], attack:['Attack1.png',5], hit:['Take hit.png',3], death:['Death.png',8] } },
};
const imgCache = {};
function getImg(dir,file){
  const key = dir+'/'+file;
  if(!imgCache[key]){ const im = new Image(); im.src = `sprites/fantasy_arena/${dir}/${file}`; imgCache[key]=im; }
  return imgCache[key];
}
// preload all
Object.values(ROSTER).forEach(r=>Object.values(r.anims).forEach(a=>getImg(r.dir,a[0])));

// ---------- автобой: толпа бойцов бродит по арене и дерётся, как в streetfighter_arena.html
// (updateBotSpawns/update/startExchange/updateExchanges/finishExchange там) — не строгий
// 1 на 1, а N бойцов: каждый бродит к случайной точке, и как только двое оказываются
// ближе FIGHT_DIST — начинается exchange (серия 1-3 ударов, порядок внутри пары случайный),
// после размена — отступ друг от друга и пауза, дальше снова бродят. Погибший спустя
// паузу возрождается заново (случайный персонаж) — бой идёт бесконечно, как крауд-арена.
const FIGHTER_COUNT = 5;
const RING_X = { min:70, max: CW-70 };
const FIGHT_DIST = 100;      // дистанция, с которой начинается обмен ударами
const MIN_SEP = 85;          // минимальная дистанция между живыми бойцами (мягкое разведение)
const PUNCH_TICK_MS = 260;   // пауза между отдельными ударами внутри серии
const RETREAT_PUSH = 55;     // отступ друг от друга после обмена
const RESPAWN_DELAY_MS = 2200; // сколько лежит труп, прежде чем возродиться заново

function clampX(x){ return Math.max(RING_X.min, Math.min(RING_X.max, x)); }

function spawnFighter(x){
  const keys = Object.keys(ROSTER);
  const charKey = keys[Math.floor(Math.random()*keys.length)];
  return {
    charKey, x, tx:x, y:985, facing: Math.random()<0.5?1:-1,
    anim:'idle', frame:0, t:0, animLockUntil:0,
    hp:100, maxHp:100,
    wanderPause: 200+Math.random()*800,
    punchCooldown:0, inExchange:false,
    alive:true, respawnAt:0,
  };
}

let fighters = [];
let activeExchanges = [];

function startBattle(){
  fighters = [];
  for(let i=0;i<FIGHTER_COUNT;i++){
    const x = RING_X.min + (RING_X.max-RING_X.min) * ((i+0.5)/FIGHTER_COUNT);
    fighters.push(spawnFighter(x));
  }
  activeExchanges = [];
}

function startExchange(a,b){
  a.inExchange = b.inExchange = true;
  const hits = 1 + Math.floor(Math.random()*3);
  const queue = [];
  for(let i=0;i<hits;i++){
    // порядок внутри пары случайный — иначе тот, кто всегда бьёт первым,
    // мог бы убить соперника раньше, чем дойдёт очередь до его ответа
    if(Math.random()<0.5){ queue.push({attacker:a,defender:b}); queue.push({attacker:b,defender:a}); }
    else { queue.push({attacker:b,defender:a}); queue.push({attacker:a,defender:b}); }
  }
  activeExchanges.push({ a, b, queue, idx:0, timer:0 });
}

function throwPunch(attacker, defender){
  const def = ROSTER[attacker.charKey], odef = ROSTER[defender.charKey];
  if(def.anims.attack){ attacker.anim='attack'; attacker.frame=0; attacker.t=0; attacker.animLockUntil=performance.now()+PUNCH_TICK_MS+120; }
  attacker.facing = defender.x>=attacker.x ? 1 : -1;
  defender.facing = attacker.x>=defender.x ? 1 : -1;
  const dmg = 8 + Math.floor(Math.random()*10);
  defender.hp = Math.max(0, defender.hp - dmg);
  if(defender.hp<=0){
    if(odef.anims.death){ defender.anim='death'; defender.frame=0; defender.t=0; defender.animLockUntil=performance.now()+100000; }
    defender.alive = false; defender.respawnAt = performance.now()+RESPAWN_DELAY_MS;
  } else if(odef.anims.hit){
    defender.anim='hit'; defender.frame=0; defender.t=0; defender.animLockUntil=performance.now()+PUNCH_TICK_MS+60;
  }
}

function finishExchange(ex){
  const { a, b } = ex;
  const cd = 1000 + Math.random()*500;
  a.punchCooldown = cd; b.punchCooldown = cd;
  a.inExchange = false; b.inExchange = false;
  if(a.alive) a.anim='idle';
  if(b.alive) b.anim='idle';
  if(a.alive && b.alive){
    const dir = a.x<=b.x ? -1 : 1;
    a.tx = clampX(a.x + dir*RETREAT_PUSH);
    b.tx = clampX(b.x - dir*RETREAT_PUSH);
    a.wanderPause = b.wanderPause = 500;
  }
}

function updateExchanges(dt){
  for(let i=activeExchanges.length-1; i>=0; i--){
    const ex = activeExchanges[i];
    ex.timer -= dt*1000;
    if(ex.timer > 0) continue;
    if(!ex.a.alive || !ex.b.alive || ex.idx >= ex.queue.length){
      finishExchange(ex);
      activeExchanges.splice(i,1);
      continue;
    }
    const {attacker,defender} = ex.queue[ex.idx];
    ex.idx++;
    ex.timer = PUNCH_TICK_MS;
    if(attacker.alive && defender.alive) throwPunch(attacker, defender);
  }
}

function updateBattle(now, dt){
  for(const f of fighters){
    if(!f.alive){
      if(now >= f.respawnAt) Object.assign(f, spawnFighter(f.x));
      continue;
    }
    if(f.punchCooldown>0) f.punchCooldown -= dt*1000;
    if(f.inExchange) continue;

    f.wanderPause -= dt*1000;
    const dx = f.tx - f.x;
    if(Math.abs(dx)<6 && f.wanderPause<=0){
      f.tx = RING_X.min + Math.random()*(RING_X.max-RING_X.min);
      f.wanderPause = 500 + Math.random()*1400;
    }
    if(Math.abs(dx)>6){
      const def = ROSTER[f.charKey];
      f.x += Math.sign(dx) * (def.speed||100) * dt;
      f.facing = dx>0 ? 1 : -1;
      f.anim = 'move';
    } else {
      f.anim = 'idle';
    }
  }

  // мягкое разведение — живые бойцы не должны залипать друг в друге
  for(let i=0;i<fighters.length;i++){
    const a = fighters[i]; if(!a.alive) continue;
    for(let j=i+1;j<fighters.length;j++){
      const b = fighters[j]; if(!b.alive) continue;
      const d = b.x-a.x, ad = Math.abs(d)||0.001;
      if(ad < MIN_SEP){
        const push=(MIN_SEP-ad)/2, dir = d<0?-1:1;
        a.x = clampX(a.x - dir*push);
        b.x = clampX(b.x + dir*push);
      }
    }
  }

  // запуск обменов между сблизившимися бойцами
  for(let i=0;i<fighters.length;i++){
    const a = fighters[i]; if(!a.alive || a.punchCooldown>0 || a.inExchange) continue;
    for(let j=i+1;j<fighters.length;j++){
      const b = fighters[j]; if(!b.alive || b.punchCooldown>0 || b.inExchange) continue;
      if(Math.abs(a.x-b.x) < FIGHT_DIST) startExchange(a,b);
    }
  }

  updateExchanges(dt);
}
startBattle();

// ---------- фоны-карты: несколько готовых пиксель-арт паков ansimuz на
// сравнение (free — use in commercial projects, credit not required у всех).
// Общая схема для всех: слои прижаты к низу (к стыку с полом) на целом
// пиксельном масштабе, без растягивания под произвольную высоту (мылит
// пиксель-арт — так был отклонён Fort of Illusion), зазор сверху закрашен
// ровным цветом, пол — плоская заливка в цвет низа ближнего слоя.
const TILE = 16;
const TS = 3;
const FLOOR_ROWS = 4; // высота пола в "тайлах" — задаёт floorH для всех расчётов позиций

const SCROLL_SPEED = 42; // px/сек — скорость "движения" сквозь карту
let scrollX = 0;

function drawParallaxLayer(img, scale, bottomY, speedFactor){
  if(!img.complete || img.naturalWidth===0) return;
  const dw = img.naturalWidth*scale, dh = img.naturalHeight*scale;
  const y = bottomY - dh;
  const off = ((scrollX*speedFactor % dw) + dw) % dw;
  for(let x=-off; x<CW; x+=dw){
    ctx.drawImage(img, x, y, dw, dh);
  }
}

// ---------- background: тень стыка + виньетка (общая отрисовка глубины) ----------
function drawSeamAndVignette(seamY, areaH){
  const seam = ctx.createLinearGradient(0,seamY-24,0,seamY+10);
  seam.addColorStop(0,'rgba(0,0,0,0)'); seam.addColorStop(1,'rgba(0,0,0,0.55)');
  ctx.fillStyle=seam; ctx.fillRect(0,seamY-24,CW,34);
  const vgrad = ctx.createLinearGradient(0,0,CW,0);
  vgrad.addColorStop(0,'rgba(0,0,0,0.5)'); vgrad.addColorStop(0.12,'rgba(0,0,0,0)');
  vgrad.addColorStop(0.88,'rgba(0,0,0,0)'); vgrad.addColorStop(1,'rgba(0,0,0,0.5)');
  ctx.fillStyle=vgrad; ctx.fillRect(0,WALL_TOP,CW,areaH);
}

// ---- "Готический зал" (Gothicvania Cold Corridors) — 5 слоёв арок на разной
// глубине (back/far/middle/near/foreground) + отдельный тайл пола.
const CORRIDOR_DIR = "sprites/fantasy_arena/stage5_corridor/Cold Corridors Files/Assets/Layers";
const corridorLayerNames = ['back','far','middle','near','foreground'];
const corridorLayers = corridorLayerNames.map(n => { const im = new Image(); im.src = `${CORRIDOR_DIR}/${n}.png`; return im; });
const corridorTileset = new Image(); corridorTileset.src = `${CORRIDOR_DIR}/tileset.png`;
const CORRIDOR_SCALE = 2;
const CORRIDOR_SKY_COLOR = '#1a0f52';
const CORRIDOR_FLOOR_COLOR = '#6b4a8f';
const CORRIDOR_SPEEDS = [0.03, 0.08, 0.18, 0.4, 0.7]; // back..foreground — дальше слой, медленнее едет
function drawBGCorridor(){
  const areaH = CH-WALL_TOP, floorH = FLOOR_ROWS*TILE*TS, wallH = areaH-floorH, seamY = WALL_TOP+wallH;
  ctx.fillStyle = CORRIDOR_SKY_COLOR; ctx.fillRect(0, WALL_TOP, CW, wallH);
  ctx.imageSmoothingEnabled = false;
  corridorLayers.forEach((img,i) => drawParallaxLayer(img, CORRIDOR_SCALE, seamY, CORRIDOR_SPEEDS[i]));
  ctx.fillStyle = CORRIDOR_FLOOR_COLOR; ctx.fillRect(0, seamY, CW, floorH);
  if(corridorTileset.complete && corridorTileset.naturalWidth>0){
    const tw = corridorTileset.naturalWidth*CORRIDOR_SCALE, th = corridorTileset.naturalHeight*CORRIDOR_SCALE;
    const off = ((scrollX*0.4 % tw) + tw) % tw;
    for(let x=-off; x<CW; x+=tw){
      ctx.drawImage(corridorTileset, 0,0, corridorTileset.naturalWidth, corridorTileset.naturalHeight, x, seamY, tw, th);
    }
  }
  drawSeamAndVignette(seamY, areaH);
}

// ---- "Кладбище" (Gothicvania Cemetery) — луна+облака, дальние горы,
// ближний слой холмов/надгробий/мёртвых деревьев (включает низ-землю).
const CEMETERY_DIR = "sprites/fantasy_arena/stage6_cemetery";
const cemeteryBg = new Image(); cemeteryBg.src = `${CEMETERY_DIR}/background.png`;
const cemeteryMountains = new Image(); cemeteryMountains.src = `${CEMETERY_DIR}/mountains.png`;
const cemeteryGraveyard = new Image(); cemeteryGraveyard.src = `${CEMETERY_DIR}/graveyard.png`;
const CEMETERY_SCALE = 2;
const CEMETERY_SKY_COLOR = '#170a1f';
const CEMETERY_FLOOR_COLOR = '#0a0510';
function drawBGCemetery(){
  const areaH = CH-WALL_TOP, floorH = FLOOR_ROWS*TILE*TS, wallH = areaH-floorH, seamY = WALL_TOP+wallH;
  ctx.fillStyle = CEMETERY_SKY_COLOR; ctx.fillRect(0, WALL_TOP, CW, wallH);
  ctx.imageSmoothingEnabled = false;
  drawParallaxLayer(cemeteryBg, CEMETERY_SCALE, seamY, 0.05);
  drawParallaxLayer(cemeteryMountains, CEMETERY_SCALE, seamY, 0.2);
  drawParallaxLayer(cemeteryGraveyard, CEMETERY_SCALE, seamY, 0.5);
  ctx.fillStyle = CEMETERY_FLOOR_COLOR; ctx.fillRect(0, seamY, CW, floorH);
  drawSeamAndVignette(seamY, areaH);
}

// ---- "Болото" (Gothicvania Swamp) — тёмно-зелёный фон-текстура + ближний
// слой (свисающие лианы, факелы, тыквы).
const SWAMP_DIR = "sprites/fantasy_arena/stage7_swamp";
const swampBg = new Image(); swampBg.src = `${SWAMP_DIR}/background.png`;
const swampMid = new Image(); swampMid.src = `${SWAMP_DIR}/mid-layer-01.png`;
const SWAMP_SCALE = 2;
const SWAMP_SKY_COLOR = '#0d2416';
const SWAMP_FLOOR_COLOR = '#040d07';
function drawBGSwamp(){
  const areaH = CH-WALL_TOP, floorH = FLOOR_ROWS*TILE*TS, wallH = areaH-floorH, seamY = WALL_TOP+wallH;
  ctx.fillStyle = SWAMP_SKY_COLOR; ctx.fillRect(0, WALL_TOP, CW, wallH);
  ctx.imageSmoothingEnabled = false;
  drawParallaxLayer(swampBg, SWAMP_SCALE, seamY, 0.05);
  drawParallaxLayer(swampMid, SWAMP_SCALE, seamY, 0.4);
  ctx.fillStyle = SWAMP_FLOOR_COLOR; ctx.fillRect(0, seamY, CW, floorH);
  drawSeamAndVignette(seamY, areaH);
}

// ---- "Собор" (GothicVania Church) — витражи/алтарь/горгулья (5 панелей
// подряд) + повторяющаяся колонна с факелами на переднем плане.
const CHURCH_DIR = "sprites/fantasy_arena/stage8_church";
const churchBg = new Image(); churchBg.src = `${CHURCH_DIR}/backgrounds.png`;
const churchColumn = new Image(); churchColumn.src = `${CHURCH_DIR}/column.png`;
const CHURCH_SCALE = 2;
const CHURCH_SKY_COLOR = '#100a24';
const CHURCH_FLOOR_COLOR = '#241a3a';
function drawBGChurch(){
  const areaH = CH-WALL_TOP, floorH = FLOOR_ROWS*TILE*TS, wallH = areaH-floorH, seamY = WALL_TOP+wallH;
  ctx.fillStyle = CHURCH_SKY_COLOR; ctx.fillRect(0, WALL_TOP, CW, wallH);
  ctx.imageSmoothingEnabled = false;
  drawParallaxLayer(churchBg, CHURCH_SCALE, seamY, 0.15);
  drawParallaxLayer(churchColumn, CHURCH_SCALE, seamY, 0.5);
  ctx.fillStyle = CHURCH_FLOOR_COLOR; ctx.fillRect(0, seamY, CW, floorH);
  drawSeamAndVignette(seamY, areaH);
}

// ---- "Улица" (GothicVania Town) — горы/облака на закате, силуэт города,
// мощёная дорога тайлом внизу (ground.png, 16px — целочисленный TS-масштаб).
const TOWN_DIR = "sprites/fantasy_arena/stage9_town";
const townBg = new Image(); townBg.src = `${TOWN_DIR}/background.png`;
const townMid = new Image(); townMid.src = `${TOWN_DIR}/middleground.png`;
const townGround = new Image(); townGround.src = `${TOWN_DIR}/ground.png`;
const TOWN_SCALE = 2;
const TOWN_SKY_COLOR = '#4a2f42';
const TOWN_FLOOR_COLOR = '#241220';
function drawBGTown(){
  const areaH = CH-WALL_TOP, floorH = FLOOR_ROWS*TILE*TS, wallH = areaH-floorH, seamY = WALL_TOP+wallH;
  ctx.fillStyle = TOWN_SKY_COLOR; ctx.fillRect(0, WALL_TOP, CW, wallH);
  ctx.imageSmoothingEnabled = false;
  drawParallaxLayer(townBg, TOWN_SCALE, seamY, 0.08);
  drawParallaxLayer(townMid, TOWN_SCALE, seamY, 0.25);
  ctx.fillStyle = TOWN_FLOOR_COLOR; ctx.fillRect(0, seamY, CW, floorH);
  if(townGround.complete && townGround.naturalWidth>0){
    const tw = townGround.naturalWidth*TS, th = townGround.naturalHeight*TS;
    const off = ((scrollX % tw) + tw) % tw;
    for(let x=-off; x<CW; x+=tw){
      ctx.drawImage(townGround, 0,0, townGround.naturalWidth, townGround.naturalHeight, x, seamY, tw, th);
    }
  }
  drawSeamAndVignette(seamY, areaH);
}

// ---- "Лес иллюзий" (SunnyLand Forest of Illusion) — светлый солнечный лес,
// 2 слоя (back/middle), пол — плоская заливка (родной tiles.png давал те же
// "островки" с зазорами, что и у "Высокого леса" — от него отказались).
const ILLUSION_DIR = "sprites/fantasy_arena/stage10_illusion";
const illusionBack = new Image(); illusionBack.src = `${ILLUSION_DIR}/back.png`;
const illusionMiddle = new Image(); illusionMiddle.src = `${ILLUSION_DIR}/middle.png`;
const ILLUSION_SCALE = 2;
const ILLUSION_SKY_COLOR = '#aee8ff';
const ILLUSION_FLOOR_COLOR = '#3f7a3a';
function drawBGIllusion(){
  const areaH = CH-WALL_TOP, floorH = FLOOR_ROWS*TILE*TS, wallH = areaH-floorH, seamY = WALL_TOP+wallH;
  ctx.fillStyle = ILLUSION_SKY_COLOR; ctx.fillRect(0, WALL_TOP, CW, wallH);
  ctx.imageSmoothingEnabled = false;
  drawParallaxLayer(illusionBack, ILLUSION_SCALE, seamY, 0.1);
  drawParallaxLayer(illusionMiddle, ILLUSION_SCALE, seamY, 0.35);
  ctx.fillStyle = ILLUSION_FLOOR_COLOR; ctx.fillRect(0, seamY, CW, floorH);
  drawSeamAndVignette(seamY, areaH);
}

// ---- "Высокий лес" (SunnyLand Tall Forest Environment) — светлый лес,
// 3 слоя (back/far/middle), пол — плоская заливка (родной тайлсет земли
// давал вид "кирпичей"/пеньков с зазорами — от него отказались).
const TALLFOREST_DIR = "sprites/fantasy_arena/stage11_tallforest";
const tallforestBack = new Image(); tallforestBack.src = `${TALLFOREST_DIR}/back.png`;
const tallforestFar = new Image(); tallforestFar.src = `${TALLFOREST_DIR}/far.png`;
const tallforestMiddle = new Image(); tallforestMiddle.src = `${TALLFOREST_DIR}/middle.png`;
const TALLFOREST_SCALE = 2;
const TALLFOREST_SKY_COLOR = '#bdeeff';
const TALLFOREST_FLOOR_COLOR = '#2f6b34';
function drawBGTallforest(){
  const areaH = CH-WALL_TOP, floorH = FLOOR_ROWS*TILE*TS, wallH = areaH-floorH, seamY = WALL_TOP+wallH;
  ctx.fillStyle = TALLFOREST_SKY_COLOR; ctx.fillRect(0, WALL_TOP, CW, wallH);
  ctx.imageSmoothingEnabled = false;
  drawParallaxLayer(tallforestBack, TALLFOREST_SCALE, seamY, 0.08);
  drawParallaxLayer(tallforestFar, TALLFOREST_SCALE, seamY, 0.2);
  drawParallaxLayer(tallforestMiddle, TALLFOREST_SCALE, seamY, 0.45);
  ctx.fillStyle = TALLFOREST_FLOOR_COLOR; ctx.fillRect(0, seamY, CW, floorH);
  drawSeamAndVignette(seamY, areaH);
}

// ---- "Осенний лес" (Parallax Forest v2) — тёплый золотистый лес, 3 слоя
// (back/middle/front), без отдельного тайла земли — пол плоской заливкой.
const AUTUMN_DIR = "sprites/fantasy_arena/stage12_parallaxforest";
const autumnBack = new Image(); autumnBack.src = `${AUTUMN_DIR}/back.png`;
const autumnMiddle = new Image(); autumnMiddle.src = `${AUTUMN_DIR}/middle.png`;
const autumnFront = new Image(); autumnFront.src = `${AUTUMN_DIR}/front.png`;
const AUTUMN_SCALE = 3;
const AUTUMN_SKY_COLOR = '#f3c26b';
const AUTUMN_FLOOR_COLOR = '#4a2f18';
function drawBGAutumn(){
  const areaH = CH-WALL_TOP, floorH = FLOOR_ROWS*TILE*TS, wallH = areaH-floorH, seamY = WALL_TOP+wallH;
  ctx.fillStyle = AUTUMN_SKY_COLOR; ctx.fillRect(0, WALL_TOP, CW, wallH);
  ctx.imageSmoothingEnabled = false;
  drawParallaxLayer(autumnBack, AUTUMN_SCALE, seamY, 0.08);
  drawParallaxLayer(autumnMiddle, AUTUMN_SCALE, seamY, 0.25);
  drawParallaxLayer(autumnFront, AUTUMN_SCALE, seamY, 0.5);
  ctx.fillStyle = AUTUMN_FLOOR_COLOR; ctx.fillRect(0, seamY, CW, floorH);
  drawSeamAndVignette(seamY, areaH);
}

const MAPS = [
  { key:'corridor', label:'⛪ Готический зал', draw: drawBGCorridor },
  { key:'cemetery', label:'⚰️ Кладбище', draw: drawBGCemetery },
  { key:'swamp', label:'🐸 Болото', draw: drawBGSwamp },
  { key:'church', label:'🕯️ Собор', draw: drawBGChurch },
  { key:'town', label:'🏘️ Улица', draw: drawBGTown },
  { key:'illusion', label:'🌳 Лес иллюзий', draw: drawBGIllusion },
  { key:'tallforest', label:'🌲 Высокий лес', draw: drawBGTallforest },
  { key:'autumn', label:'🍂 Осенний лес', draw: drawBGAutumn },
];
let currentMap = 'corridor';
function renderMapPicks(){
  const el = document.getElementById('mapPicks');
  el.innerHTML = '';
  MAPS.forEach(m=>{
    const b = document.createElement('button');
    b.textContent = m.label;
    if(m.key===currentMap) b.classList.add('active');
    b.onclick = ()=>{ currentMap = m.key; renderMapPicks(); };
    el.appendChild(b);
  });
}
renderMapPicks();
function drawBG(){
  (MAPS.find(m=>m.key===currentMap) || MAPS[0]).draw();
}

// ---- автосмена карт каждые 5 минут (как комнаты в Street Fighter) — бой
// не сбрасывается, просто на следующем кадре меняется фон + подсветка кнопки.
const MAP_SWITCH_MS = 5*60*1000;
let nextMapSwitchAt = 0;
function updateMapSwitch(now){
  if(nextMapSwitchAt===0){ nextMapSwitchAt = now + MAP_SWITCH_MS; return; }
  if(now < nextMapSwitchAt) return;
  const idx = MAPS.findIndex(m=>m.key===currentMap);
  currentMap = MAPS[(idx+1) % MAPS.length].key;
  renderMapPicks();
  nextMapSwitchAt = now + MAP_SWITCH_MS;
}

// ---------- HUD panel (same layout as Street Fighter: rules left, top right) ----------
function drawHUD(){
  const T = PANEL_TOP, TH = PANEL_H;
  const bg = ctx.createLinearGradient(0,T,0,T+TH);
  bg.addColorStop(0,'rgba(20,10,25,0.97)'); bg.addColorStop(1,'rgba(8,4,10,0.97)');
  ctx.fillStyle=bg; ctx.fillRect(0,T,CW,TH);
  ctx.strokeStyle='rgba(180,80,255,0.4)'; ctx.lineWidth=1.5;
  ctx.strokeRect(2,T+2,CW-4,TH-4);

  ctx.font='bold 24px Arial Black'; ctx.textAlign='center';
  ctx.strokeStyle='rgba(0,0,0,0.9)'; ctx.lineWidth=4;
  ctx.strokeText('FANTASY ARENA', CW/2, T+34, CW-20);
  ctx.save(); ctx.shadowColor='#b040ff'; ctx.shadowBlur=10;
  ctx.fillStyle='#c060ff'; ctx.fillText('FANTASY ARENA', CW/2, T+34, CW-20);
  ctx.restore();

  ctx.font='11px Arial'; ctx.fillStyle='rgba(255,255,255,0.4)';
  ctx.fillText('(рабочее название — черновик)', CW/2, T+50);

  const vg = ctx.createLinearGradient(0,T+58,0,T+TH-6);
  vg.addColorStop(0,'rgba(255,255,255,0)'); vg.addColorStop(0.3,'rgba(255,255,255,0.12)');
  vg.addColorStop(0.7,'rgba(255,255,255,0.12)'); vg.addColorStop(1,'rgba(255,255,255,0)');
  ctx.strokeStyle=vg; ctx.beginPath(); ctx.moveTo(CW/2,T+58); ctx.lineTo(CW/2,T+TH-6); ctx.stroke();

  const rules = [
    { text:'👍 1 лайк = +10❤️ +1💪', color:'#FF88CC' },
    { text:'🎁 1 монета = +100❤️ +10💪', color:'#FFD700' },
    { text:'💬 Напиши "rating" — узнаешь топ', color:'#8fffb0' },
    { text:'🎮 Напиши "skin1"-"skin4" — выбери героя', color:'#7fd3ff' },
  ];
  const rY = T+72, rStep = 28;
  const ruleFont='bold 22px Arial Black';
  const ruleAvailW = CW/2-16;
  ctx.font=ruleFont;
  let sx=1; rules.forEach(r=>{sx=Math.min(sx, ruleAvailW/ctx.measureText(r.text).width);});
  rules.forEach((r,i)=>{
    ctx.save(); ctx.scale(sx,1); ctx.font=ruleFont; ctx.textAlign='left';
    ctx.strokeStyle='rgba(0,0,0,0.85)'; ctx.lineWidth=3.5;
    ctx.strokeText(r.text, 8/sx, rY+i*rStep);
    ctx.fillStyle=r.color; ctx.fillText(r.text, 8/sx, rY+i*rStep);
    ctx.restore();
  });

  ctx.font='bold 12px Arial Black'; ctx.textAlign='center';
  ctx.strokeStyle='rgba(0,0,0,0.9)'; ctx.lineWidth=3;
  ctx.strokeText('🏆 ТОП БОЙЦЫ 🏆', CW*0.75, T+70, CW/2-16);
  ctx.fillStyle='#ffd24f'; ctx.fillText('🏆 ТОП БОЙЦЫ 🏆', CW*0.75, T+70, CW/2-16);

  const top = [
    {name:'dragon_slay3r', pts:2140},{name:'moonlit_fox', pts:1870},
    {name:'gg_viewer', pts:1420},{name:'kkatya', pts:980},{name:'no_name', pts:640},
  ];
  const rankColors = ['#FFD700','#C0C0C0','#CD7F32','#AAAAAA','#666666'];
  const tX = CW/2+8, tY = T+98, tStep=29;
  top.forEach((p,i)=>{
    const y = tY+i*tStep;
    if(i===0){ ctx.fillStyle='rgba(255,215,0,0.08)'; ctx.fillRect(tX-4,y-21,CW/2-12,tStep-1); }
    ctx.font = i===0?'bold 20px Arial Black':'bold 18px Arial Black';
    ctx.textAlign='left'; ctx.strokeStyle='rgba(0,0,0,0.9)'; ctx.lineWidth=3.5;
    ctx.strokeText((i+1)+'.', tX, y);
    ctx.fillStyle=rankColors[i]; ctx.fillText((i+1)+'.', tX, y);
    ctx.strokeText(p.name, tX+24, y, 148);
    ctx.fillStyle = i===0?'#FFE566':'#EEEEEE'; ctx.fillText(p.name, tX+24, y, 148);
    ctx.textAlign='right'; ctx.strokeStyle='rgba(0,0,0,0.9)'; ctx.lineWidth=3;
    ctx.font = i===0?'bold 16px Arial':'bold 15px Arial';
    ctx.strokeText('⚡'+p.pts, CW-8, y);
    ctx.fillStyle='#e0a0ff'; ctx.fillText('⚡'+p.pts, CW-8, y);
  });
  ctx.font='9px Arial'; ctx.fillStyle='rgba(255,255,255,0.25)';
  ctx.textAlign='center'; ctx.fillText('пример / заглушка данных', CW*0.75, T+TH-6);
}

// ---------- fighter render ----------
function drawFighter(f, now){
  const def = ROSTER[f.charKey];
  const animDef = def.anims[f.anim] || def.anims.idle;
  const [file, count] = animDef;
  const img = getImg(def.dir, file);
  const fps = f.anim==='idle' ? 8 : 14;
  if(now - f.t > 1000/fps){
    f.t = now;
    if(f.anim==='move'){ f.frame = (f.frame+1) % count; }
    else if(f.frame < count-1) f.frame++;
    else if(f.anim==='death'){ /* hold last frame */ }
    else if(f.anim!=='idle' && now < f.animLockUntil){ /* hold */ }
    else { f.anim='idle'; f.frame=0; }
  }
  if(!img.complete || img.naturalWidth===0) return;
  const size = def.frame;
  const sx = Math.min(f.frame, count-1) * size;
  const drawH = 380, drawW = 380;
  ctx.save();
  ctx.translate(f.x, f.y);
  ctx.scale(f.facing, 1);
  ctx.drawImage(img, sx, 0, size, size, -drawW/2, -drawH, drawW, drawH);
  ctx.restore();

  if(f.anim!=='death'){
    const bw=90, bh=8, bx=f.x-bw/2, by=f.y-345;
    ctx.fillStyle='rgba(0,0,0,0.6)'; ctx.fillRect(bx-2,by-2,bw+4,bh+4);
    const pct = Math.max(0,f.hp)/f.maxHp;
    const hpColor = pct>0.5?'#5ee06a':(pct>0.25?'#ffcc4d':'#ff5050');
    ctx.fillStyle=hpColor; ctx.fillRect(bx,by,bw*pct,bh);
    ctx.strokeStyle='rgba(255,255,255,0.5)'; ctx.lineWidth=1; ctx.strokeRect(bx,by,bw,bh);
  }
}

let lastT = 0;
function render(t){
  const dt = lastT ? Math.min((t-lastT)/1000, 0.05) : 0; // сек, клампим на случай лагов вкладки
  lastT = t;
  scrollX += SCROLL_SPEED*dt;
  updateMapSwitch(t);
  updateBattle(t, dt);
  ctx.clearRect(0,0,CW,CH);
  drawBG();
  fighters.forEach(f => drawFighter(f, t));
  drawHUD();
  requestAnimationFrame(render);
}
requestAnimationFrame(render);
</script>
