<script>
// ════════════════════════════════════════════════════════════════════════
// NEPLOXO STREET WARS — Street Fighters 1 (streetfighter_arena.html), та же
// логика боя один в один: Энергия (жизнь) и Сила (урон), обмены ударами
// сериями 1-3, после серии бойцы расходятся, нокаут обнуляет бойца, топ =
// отнятая энергия за день, чемпион прошлого дня, боты, Team, диктор.
// Отличия только в картинке: 3D-город и люди из GTA вместо спрайтов,
// комнаты = места Neploxo City, и оружие в руке растёт вместе с Силой.
// ════════════════════════════════════════════════════════════════════════
const NB = window.NB;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const wrap = document.getElementById('wrap');
const CW = canvas.width;
const Q = new URLSearchParams(location.search);

function applyScale(){
  const vw = document.documentElement.clientWidth || window.innerWidth;
  const vh = document.documentElement.clientHeight || window.innerHeight;
  const s = Math.min(vw/600, vh/1000);
  const x = (vw - 600*s)/2, y = (vh - 1000*s)/2;
  wrap.style.transform = `translate(${x}px,${y}px) scale(${s})`;
}
window.addEventListener('resize', applyScale);
applyScale();

// ── Бойцы: ТОЛЬКО два показателя — Энергия (жизнь/выносливость) и Сила (урон) ── (как в SF1)
const LIKE_POWER_CAP = 500;
const INACTIVITY_MS = 5*60*1000;   // 5 минут без лайков/донатов — тает только Сила, Энергия не трогается
const POWER_DECAY_INTERVAL_MS = 1000;

// ── Оружие: чисто внешний вид, урон всё так же = Сила (как в SF1) ──
const WEAPONS = [
  { id:'fists',   at:0,    icon:'👊', name:'кулаки' },
  { id:'bat',     at:50,   icon:'🏏', name:'биту' },
  { id:'knife',   at:150,  icon:'🔪', name:'нож' },
  { id:'pistol',  at:400,  icon:'🔫', name:'пистолет', gun:true },
  { id:'shotgun', at:1000, icon:'💥', name:'дробовик', gun:true },
];
function weaponOf(power){ let w = WEAPONS[0]; for (const x of WEAPONS) if (power >= x.at) w = x; return w; }

// ── Уровни и ранги — один в один SF1 ──
const LEVEL_THRESHOLDS = [
  0,30,250,1000,2500,5000,10000,16000,25000,35000,
  55000,70000,95000,125000,150000,200000,250000,300000,375000,450000,
  525000,600000,700000,825000,950000,1100000,1200000,1400000,1600000,1800000,
  2000000,2200000,2500000,2700000,3000000,3300000,3600000,4000000,4300000,4700000,
  5100000,5600000,6000000,6500000,7000000,7600000,8100000,8700000,9300000,10000000,
  10600000,11100000,11800000,12400000,13100000,13800000,14600000,15400000,16300000,17200000,
  18250000,19250000,20250000,21250000,22500000,23750000,25000000,26500000,28000000,29500000,
  31250000,33000000,34750000,36750000,38750000,41000000,43000000,45500000,48000000,51000000,
  53500000,56500000,59500000,63000000,66500000,70500000,74000000,78500000,82500000,87500000,
  92000000,97000000,103000000,108000000,114000000,121000000,128000000,135000000,142000000,150000000,
];
const LEVEL_RANKS = [
  { name:'Новичок улиц',     from:1,  to:5,  color:'#9a9a9a' },
  { name:'Дворовый боец',    from:6,  to:10, color:'#b8752e' },
  { name:'Хулиган квартала', from:11, to:15, color:'#3fa9f5' },
  { name:'Уличный боец',     from:16, to:20, color:'#2ecc71' },
  { name:'Гроза района',     from:21, to:25, color:'#17c9b2' },
  { name:'Ветеран улиц',     from:26, to:30, color:'#9b59f6' },
  { name:'Мастер кулака',    from:31, to:35, color:'#ef4bb0' },
  { name:'Гроза города',     from:36, to:40, color:'#ff8c1a' },
  { name:'Чемпион района',   from:41, to:45, color:'#ff2e4d' },
  { name:'Легенда улиц',     from:46, to:50, color:'#ffd700' },
  { name:'Идол улиц',            from:51, to:55,  color:'#4f8cff' },
  { name:'Гроза мегаполиса',     from:56, to:60,  color:'#6a5cff' },
  { name:'Император улиц',       from:61, to:65,  color:'#e055ff' },
  { name:'Несокрушимый боец',    from:66, to:70,  color:'#ff4d6d' },
  { name:'Живая легенда',        from:71, to:75,  color:'#ffe066' },
  { name:'Элита города',         from:76, to:80,  color:'#30e3ca' },
  { name:'Титан улиц',           from:81, to:85,  color:'#ff9142' },
  { name:'Бессмертный боец',     from:86, to:90,  color:'#7ef9ff' },
  { name:'Властелин мегаполиса', from:91, to:95,  color:'#c76bff' },
  { name:'Миф улиц',             from:96, to:100, color:'#ffffff' },
];
function levelOf(total){
  total = total || 0;
  let lvl = 1;
  for (let i=0; i<LEVEL_THRESHOLDS.length; i++){
    if (total >= LEVEL_THRESHOLDS[i]) lvl = i+1; else break;
  }
  return lvl;
}
function rankOfLevel(level){ return LEVEL_RANKS.find(r => level>=r.from && level<=r.to) || LEVEL_RANKS[0]; }
function rankIndexOfLevel(level){ const idx = LEVEL_RANKS.findIndex(r => level>=r.from && level<=r.to); return idx>=0 ? idx : 0; }
function levelProgress(total){
  total = total || 0;
  const level = levelOf(total);
  const cur = LEVEL_THRESHOLDS[level-1];
  const next = LEVEL_THRESHOLDS[level] ?? null;
  const frac = next==null ? 1 : Math.min(1, Math.max(0, (total-cur)/(next-cur)));
  return { level, cur, next, frac };
}
function drawLevelText(rightEdgeX, y, s, level){
  const rank = rankOfLevel(level);
  const txt = 'ур.' + level;
  ctx.save();
  ctx.font = `bold ${15*s}px Arial Black`;
  const w = ctx.measureText(txt).width;
  const x = rightEdgeX - w;
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.fillRect(x - 5*s, y - 12*s, w + 10*s, 16*s);
  ctx.textAlign = 'left';
  ctx.lineWidth = 3.5*s; ctx.strokeStyle = 'rgba(0,0,0,0.95)';
  ctx.strokeText(txt, x, y);
  ctx.fillStyle = rank.color;
  ctx.fillText(txt, x, y);
  ctx.restore();
}

// ── Чемпион улицы: победитель ПРОШЛОГО ДНЯ — золотой ник + золотой костюм ──
let _championName = null;
function applyChampionSkin(v){ v.isChamp = true; if (v.m) v.m.gold(true); }
function revertChampionSkin(v){ v.isChamp = false; if (v.m) v.m.gold(false); }
function syncChampionStatus(){
  const newName = (_weeklyChampion && _weeklyChampion.username) || null;
  if (newName === _championName){
    if (newName){ const v = findRealFighter(newName); if (v && !v.isChamp) applyChampionSkin(v); }
    return;
  }
  if (_championName){ const old = findRealFighter(_championName); if (old) revertChampionSkin(old); }
  _championName = newName;
  if (_championName){ const now = findRealFighter(_championName); if (now) applyChampionSkin(now); }
}

const VARIANTS = [];
const _fighterCache = new Map();

// ── Геометрия экрана: плашка сверху, ринг ниже (координаты SF1, пиксели 600×1000) ──
const PANEL_TOP = 14, PANEL_H = 250;
const WALL_TOP = PANEL_TOP + PANEL_H + 10;
const FLOOR_TOP = 480, FLOOR_BOT = 1000;
const RING = { xMin:75, xMax:525, yMin:FLOOR_TOP+45, yMax:FLOOR_BOT-35 };
const KO_FALL_MS = 1600;
const FIGHT_DIST = 68;
const FIGHT_Y_GAP = 30;
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

// ════════════════════════ 3D: город и люди из GTA ════════════════════════
const gl = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas: gl, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(1.5, window.devicePixelRatio || 1));
renderer.setSize(600, 1000, false);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFShadowMap;
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xe98a86, 70, 250);
const camera = new THREE.PerspectiveCamera(44, 600/1000, .1, 320);
const hemi = new THREE.HemisphereLight(0xffc2d6, 0x4b3a6b, .78); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffb27a, 1.05);
sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left:-22, right:22, top:22, bottom:-22, near:1, far:220 });
sun.shadow.camera.updateProjectionMatrix(); sun.shadow.bias = -.0008; sun.shadow.normalBias = .04;
scene.add(sun, sun.target);
const dn = NB.createDayNight(scene, hemi, sun), sky = dn.sky;
const world = NB.buildWorld(scene, renderer);
world.setFog(70, 250);

// ── Места (вместо комнат SF1): каждые 5 минут бой переезжает, бойцы те же ──
const atDoor = (name, x, z, nx, nz, off = 7) => ({ name, cx: x + nx*off, cz: z + nz*off, dir: Math.atan2(-nx, -nz) });
const ROOMS = [
  { name:'Клуб NEPLOXO 21', cx:103, cz:24, dir:-Math.PI/2 },
  atDoor('Отель на Оушен-драйв', 92, -31, 1, 0),
  atDoor('Полицейский участок', -65.8, -30.5, 1, 0),
  atDoor('Пожарная часть', 26, -58, 0, 1),
];
const ROOM_SWITCH_MS = (+(Q.get('roomSec')||0) || 5*60) * 1000;
let roomIdx = (+(Q.get('room')||0)) % ROOMS.length;
let roomSwitchTimer = ROOM_SWITCH_MS;
const CAM = { dist:12, h:7, ly:0.5, ahead:6 };
const camFwd = new THREE.Vector3(), camRight = new THREE.Vector3();
function placeCamera(){
  const P = ROOMS[roomIdx], fx = Math.sin(P.dir), fz = Math.cos(P.dir);
  camFwd.set(fx, 0, fz); camRight.set(-fz, 0, fx);
  camera.position.set(P.cx - fx*CAM.dist, CAM.h, P.cz - fz*CAM.dist);
  camera.lookAt(P.cx + fx*CAM.ahead, CAM.ly, P.cz + fz*CAM.ahead);
}
placeCamera();
// пиксели ринга SF1 (x поперёк экрана, y в глубину) → метры на улице:
// 450 px ринга ≈ 6.6 м, нижний край ринга ближе к камере
const M_PER_PX = 6.6/450;
function ringToWorld(x, y){
  const P = ROOMS[roomIdx], u = (x - 300)*M_PER_PX, v = (745 - y)*M_PER_PX;
  return { x: P.cx + camRight.x*u + camFwd.x*v, z: P.cz + camRight.z*u + camFwd.z*v };
}

/* ---------- люди: модель как у героя GTA, лица из атласа игры, одежда из бутика ---------- */
const SKIN = ['#f3cfb0', '#e8b890', '#d49a6e', '#b97a50', '#8d5a36', '#633b22'];
const HAIR = ['#1e140e', '#2e1d12', '#4a2e1a', '#6b4423', '#a8743c', '#d9b36c', '#b34a2a', '#111111'];
const CL = NB.CLOTHES;
const MEN_TOPS = Object.keys(CL.top).filter(k => !CL.top[k].hidden && !['tuxedo','gold','diamond','croc','cop'].includes(k));
const PANTS = Object.keys(CL.pants).filter(k => k !== 'gold');
const SHOES = ['white','flip','black','brown','red','cyan'];
const HATS = ['none','none','none','cap_red','cap_black','cap_neon','bandana','beanie','bucket','fedora','cowboy'];
const GLASSES = ['none','none','none','aviator','round','big','sport','shutter'];
const CHAINS = ['none','none','none','silver','gold'];
const F_COLORS = [0xff7eb6, 0xf5f5f0, 0x3fe6e0, 0xffd23d, 0x141418, 0xd0102a, 0x9b5cff, 0x39ff6a, 0xd9a54a];
const F_BOTTOMS = [{ c:0x141418, skirt:true }, { c:0xff4fa3, skirt:true }, { c:0x4a6fa0, shorts:true }, { c:0x24242c }, { c:0x2b3d6b }, { c:0x8a1f2a, skirt:true }];
const geoCache = new Map();
const boxGeo = (w, h, d) => { const k = w+','+h+','+d; let g = geoCache.get(k); if (!g) geoCache.set(k, g = new THREE.BoxGeometry(w, h, d)); return g; };
const Lm = c => new THREE.MeshLambertMaterial(c);
const chance = p => Math.random() < p;

function makePerson(female){
  const skinHex = pick(SKIN), hairHex = pick(HAIR);
  const shirt = Lm({ color:0xffffff }), skin = Lm({ color:skinHex }), jeans = Lm({ color:0x3b5a8a }),
    shoe = Lm({ color:0xf2f2f2 }), hair = Lm({ color:hairHex }), belt = Lm({ color:0x3a2a1c });
  const root = new THREE.Group();
  const B = (w, h, d, mat, x, y, z, parent) => { const m = new THREE.Mesh(boxGeo(w, h, d), mat); m.position.set(x, y, z); m.castShadow = true; parent.add(m); return m; };
  const G = (x, y, z, parent) => { const g = new THREE.Group(); g.position.set(x, y, z); parent.add(g); return g; };
  const sw = female ? .86 : 1;
  const hips = G(0, .95, 0, root);
  B(female ? .36 : .34, .14, .21, jeans, 0, .01, 0, hips);
  if (!female) B(.35, .04, .22, belt, 0, .08, 0, hips);
  const skirt = B(.4, .3, .27, jeans, 0, -.1, 0, hips); skirt.visible = false;
  const torso = G(0, .08, 0, hips);
  B(.4*sw, .5, .23*(female ? .95 : 1), shirt, 0, .27, 0, torso);
  B(.12, .1, .02, skin, 0, .46, .112, torso);
  const head = G(0, .52, 0, torso);
  B(.1, .08, .1, skin, 0, .04, 0, head);
  B(.22, .25, .23, skin, 0, .2, .005, head);
  const hairTop = B(.235, .07, .245, hair, 0, .33, -.005, head);
  B(.235, .17, .07, hair, 0, .24, -.095, head);
  if (female){ B(.25, .36, .08, hair, 0, .14, -.11, head); B(.04, .3, .14, hair, -.12, .17, -.03, head); B(.04, .3, .14, hair, .12, .17, -.03, head); }
  B(.045, .055, .035, skin, 0, .17, .128, head); B(.03, .065, .055, skin, -.118, .2, 0, head); B(.03, .065, .055, skin, .118, .2, 0, head);
  {
    const A = NB.faces.atlas, i = NB.faces.pick({ female, old: chance(.08), hairHex, shades: chance(.15) }), [u0, v0, u1, v1] = NB.faces.uv(i);
    const fg = new THREE.PlaneGeometry(.205, .215), uv = fg.attributes.uv;
    for (let k = 0; k < uv.count; k++) uv.setXY(k, uv.getX(k) ? u1 : u0, uv.getY(k) ? v1 : v0);
    const face = new THREE.Mesh(fg, Lm({ map: A.tex, alphaTest: .5 })); face.position.set(0, .19, .1235); head.add(face);
  }
  const cap = G(0, 0, 0, head); cap.visible = false;
  const arm = side => {
    const sh = G(side*.255*sw, .46, 0, torso);
    const up = B(.13*sw, .2, .14, shirt, 0, -.08, 0, sh);
    const elb = B(.09, .1, .09, skin, 0, -.22, 0, sh);
    const el = G(0, -.27, 0, sh);
    const fore = B(.085, .24, .085, skin, 0, -.12, 0, el);
    B(.09, .09, .065, skin, 0, -.28, 0, el);
    const hand = G(0, -.3, 0, el);
    return { sh, el, hand, up, elb, fore };
  };
  const leg = side => {
    const hip = G(side*.1, 0, 0, hips);
    const thigh = B(.15, .46, .17, jeans, 0, -.23, 0, hip);
    const kn = G(0, -.46, 0, hip);
    const shin = B(.13, .42, .15, jeans, 0, -.21, 0, kn);
    B(.14, .08, .27, shoe, 0, -.45, .05, kn);
    return { hip, kn, shin, thigh };
  };
  const aL = arm(-1), aR = arm(1), lL = leg(-1), lR = leg(1);
  root.rotation.order = 'YXZ';
  const m = { root, hips, torso, head, aL, aR, lL, lR, shirt, jeans, cap, skin, shoe, hairTop, skirt };
  // одежда: у мужчин — вещи из бутика игры, у женщин — топ + юбка / шорты / брюки
  const look = female
    ? { top:'tee_white', pants:'jeans', shoes:'white', hat: chance(.15) ? pick(['cap_neon','bucket','fedora']) : 'none', glasses: chance(.3) ? pick(['aviator','big','round']) : 'none', chain: chance(.3) ? 'gold' : 'none' }
    : { top:pick(MEN_TOPS), pants:pick(PANTS), shoes:pick(SHOES), hat:pick(HATS), glasses:pick(GLASSES), chain:pick(CHAINS), watch: chance(.2) ? 'gold' : 'none' };
  const fTop = pick(F_COLORS), fBot = pick(F_BOTTOMS), fShoe = pick([0xd0202a, 0x141414, 0xf5f5f0, 0xc9a27a, 0xff7eb6]);
  function dress(){
    NB.dressHero(m, look);
    for (const l of [lL, lR]) { l.thigh.material = jeans; }
    skirt.visible = false;
    if (female){
      m.shirt.map = null; m.shirt.color.setHex(fTop); m.shirt.needsUpdate = true;
      m.jeans.map = null; m.jeans.color.setHex(fBot.c); m.jeans.needsUpdate = true;
      for (const l of [lL, lR]) { l.shin.material = (fBot.skirt || fBot.shorts) ? skin : jeans; if (fBot.skirt) l.thigh.material = skin; }
      skirt.visible = !!fBot.skirt;
      m.shoe.color.setHex(fShoe);
      m.hairTop.visible = true;

function findRealFighter(username){ return VARIANTS.find(v=>!v.isBot && v.name===username); }

// gain: { likeEnergy?, likePower?, giftEnergy?, giftPower? } — как в SF1
function applyGrowth(username, gain, isGift){
  if (!username) return;
  let v = findRealFighter(username);
  const isNew = !v;
  if (!v){
    const pos = spawnRingPos();
    v = Object.assign({ name: username, isBot: false, isChamp: false, stolenEnergy: 0, powerDecayAcc: 0, kos: 0, allTimeStolen: 0, knownRankIdx: 0 }, randomLook());
    v.energyMax = 0; v.energy = 0; v.powerMax = 0; v.power = 0;
    const cached = _fighterCache.get(username);
    if (cached){ v.allTimeStolen = cached.allTimeStolen; v.knownRankIdx = cached.knownRankIdx; }
    initFighterRuntime(v, pos.x, pos.y);
    VARIANTS.push(v);
    requestTier(username);
  }
  syncChampionStatus();
  v.lastActiveAt = Date.now();

  let gainedEnergy = gain.giftEnergy || 0;
  let gainedPower  = gain.giftPower  || 0;
  gainedEnergy += gain.likeEnergy || 0;
  if (gain.likePower && v.power < LIKE_POWER_CAP) gainedPower += gain.likePower;
  v.energyMax += gainedEnergy;
  v.powerMax  += gainedPower;

  const wasDown = !v.alive || v.eliminated;
  if (wasDown){
    // выбитый боец возвращается — каждый раз новым случайным человеком
    const pos = spawnRingPos();
    Object.assign(v, randomLook());
    v.alive = true; v.eliminated = false;
    v.energy = v.energyMax;
    v.power = v.powerMax;
    v.state = 'idle';
    v.x = pos.x; v.y = pos.y; v.tx = pos.x; v.ty = pos.y;
    dressFighter(v);
    pushEvent(v.isChamp ? pick(CHAMPION_ENTRANCE_LINES)(cleanNickForSpeech(v.name))
                         : pick(REVIVE_LINES)(cleanNickForSpeech(v.name)), true, v.isChamp);
  } else {
    v.energy += gainedEnergy;
    v.power  += gainedPower;
  }
  if (isNew || wasDown){
    const lvlBonus = levelOf(v.allTimeStolen||0);
    v.energyMax += lvlBonus;
    v.energy    += lvlBonus;
  }
  syncWeapon(v);
  if (isNew && !wasDown) {
    pushEvent(v.isChamp ? pick(CHAMPION_ENTRANCE_LINES)(cleanNickForSpeech(v.name))
                         : pick(JOIN_LINES)(cleanNickForSpeech(v.name)), true, v.isChamp);
  } else if (isGift && !wasDown) pushEvent(pick(GIFT_LINES)(cleanNickForSpeech(v.name)), true);
}

function triggerBigGiftEffect(username, coins){

function spawnCoinRain(count){ const spread = 250 + count*3; for (let i=0;i<count;i++) coinRain.push(makeCoin(spread)); }
function makeCoin(spread){
  return { x: Math.random()*CW, y: -20 - Math.random()*spread, vy: 3.5 + Math.random()*3.5, rot: Math.random()*Math.PI, rotSpeed: 0.15 + Math.random()*0.25, size: 8 + Math.random()*5, sway: Math.random()*Math.PI*2 };

const COIN_GRADIENT = ctx.createRadialGradient(-0.3,-0.3,0.02, 0,0,1);

function updateDrawCoinRain(dt){
  ctx.save();
  for (let i=coinRain.length-1; i>=0; i--){
    const c = coinRain[i];
    c.y += c.vy * (dt/16.7);
    c.x += Math.sin((c.y+c.sway*40)/28) * 0.8;
    c.rot += c.rotSpeed;
    if (c.y > canvas.height+20){ coinRain.splice(i,1); continue; }
    const scaleX = Math.max(0.18, Math.abs(Math.cos(c.rot)));
    ctx.save();
    ctx.translate(c.x, c.y); ctx.scale(scaleX*c.size, c.size);
    ctx.fillStyle = COIN_GRADIENT;

function pushEvent(text, urgent, protect){
  const item = { text, protected: !!protect, ts: Date.now() };
  if (urgent){
    if (!vProtected){ if (window.speechSynthesis) window.speechSynthesis.cancel(); vSpeaking = false; }
    vQueue.unshift(item);
    if (vQueue.length>12) vQueue.length = 12;
  } else {
    vQueue.push(item);
    if (vQueue.length>12) vQueue.shift();
  }
  vSpeakNext();
}
function estimateSpeechMs(text){ return Math.min(7000, Math.max(2200, text.length*75)); }
const SPEECH_STALE_MS = 10000;
function vSpeakNext(){
  if (vSpeaking) return;
  while (vQueue.length && Date.now() - vQueue[0].ts > SPEECH_STALE_MS) vQueue.shift();
  if (vQueue.length===0){ vScheduleQuiet(); return; }
  clearTimeout(vQuietTimer);
  const item = vQueue.shift();
  vSpeaking = true;
  vProtected = item.protected;
  const onDone = ()=>{ vSpeaking=false; vProtected=false; setTimeout(vSpeakNext, 400); };
  if (voiceEnabled && window.speechSynthesis) speak(item.text, onDone);
  else setTimeout(onDone, estimateSpeechMs(item.text));
}

let audioCtx = null;
function getAudioCtx(){ if (!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)(); return audioCtx; }
function noiseBurst(ac, now, len, vol, filterHz){
  const bufSize = Math.floor(ac.sampleRate*len);
  const buf = ac.createBuffer(1, bufSize, ac.sampleRate);
  const data = buf.getChannelData(0);
  for (let i=0;i<bufSize;i++) data[i] = (Math.random()*2-1)*(1-i/bufSize);
  const noise = ac.createBufferSource(); noise.buffer = buf;
  const g = ac.createGain(); g.gain.setValueAtTime(vol, now); g.gain.exponentialRampToValueAtTime(0.001, now+len);
  if (filterHz){ const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = filterHz; noise.connect(f); f.connect(g); } else noise.connect(g);
  g.connect(ac.destination); noise.start(now);
}
function playPunchSound(){
  const ac = getAudioCtx(); const now = ac.currentTime;
  const osc = ac.createOscillator(), gain = ac.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(150, now); osc.frequency.exponentialRampToValueAtTime(55, now+0.09);
  gain.gain.setValueAtTime(0.4, now); gain.gain.exponentialRampToValueAtTime(0.001, now+0.13);
  osc.connect(gain); gain.connect(ac.destination); osc.start(now); osc.stop(now+0.14);
  noiseBurst(ac, now, 0.06, 0.3);
}
function playShotSound(big){
  const ac = getAudioCtx(); const now = ac.currentTime;
  noiseBurst(ac, now, big ? 0.35 : 0.18, big ? 0.6 : 0.45, big ? 2200 : 3500);
  const osc = ac.createOscillator(), gain = ac.createGain();
  osc.type = 'square'; osc.frequency.setValueAtTime(big ? 90 : 160, now); osc.frequency.exponentialRampToValueAtTime(40, now+0.12);
  gain.gain.setValueAtTime(0.25, now); gain.gain.exponentialRampToValueAtTime(0.001, now+0.14);
  osc.connect(gain); gain.connect(ac.destination); osc.start(now); osc.stop(now+0.15);
}
function playKOSound(){
  if (!voiceEnabled) return;
  const ac = getAudioCtx(); const now = ac.currentTime;
  const osc = ac.createOscillator(), gain = ac.createGain();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(200, now); osc.frequency.exponentialRampToValueAtTime(38, now+0.5);
  gain.gain.setValueAtTime(0.32, now); gain.gain.exponentialRampToValueAtTime(0.001, now+0.55);
  osc.connect(gain); gain.connect(ac.destination); osc.start(now); osc.stop(now+0.6);
}

      if (d.type==='init' || d.type==='status'){

      if (d.type==='arena_boxing_chat' && _gameMode==='tiktok') onLike(d.username);

      if (d.type==='top_streetwars') { _dbTop = (d.data||[]).map(p=>({ username:p.username, stolen:p.total_stolen })); }
      if (d.type==='streetwars_weekly_champion') { _weeklyChampion = d.champion || null; syncChampionStatus(); }
      if (d.type==='streetwars_tier_info'){

function roundRectPath(x, y, w, h, r){
  ctx.beginPath();

  ctx.lineTo(x+w, y+h-r); ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
  ctx.lineTo(x+r, y+h); ctx.quadraticCurveTo(x, y+h, x, y+h-r);
  ctx.lineTo(x, y+r); ctx.quadraticCurveTo(x, y, x+r, y);
  ctx.closePath();
}

// ── метки над бойцом (SF1 drawFighter): ур. + ник, ❤️ Энергия, 💪 Сила (+ оружие) ──
const FIGHTER_SCALE = 0.85 * 1.25;
const _proj = new THREE.Vector3();
function drawFighterLabels(v){
  if (v.eliminated || !v.m || v.wx == null) return;
  const s = FIGHTER_SCALE;
  _proj.set(v.wx, v.alive ? 2.35 : 0.9, v.wz).project(camera);
  if (_proj.z > 1) return;
  const cx = (_proj.x + 1)/2*CW, top = (1 - _proj.y)/2*1000;
  // три строки над головой: ник, ❤️ Энергия, 💪 Сила
  const labelY = top - 36*s;
  ctx.save();
  if (!v.alive) ctx.globalAlpha = Math.max(0, Math.min(1, v.koTimer/400));
  ctx.textAlign = 'center';
  ctx.font = `bold ${16*s}px Arial Black`;
  const tag = (v.team ? '🚩' : '') + (v.isBot ? '🤖' : '');
  const crownTag = (v.isChamp && v.alive) ? ' 👑' : '';
  const nameTxt = v.alive ? tag+v.name+crownTag : tag+v.name+' 💤';
  const nameW = ctx.measureText(nameTxt).width;
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.fillRect(cx - nameW/2 - 6*s, labelY - 14*s, nameW + 12*s, 18*s);
  const level = (!v.isBot) ? levelOf(v.allTimeStolen||0) : null;
  const isTopRank = level!=null && level >= 96;
  if (v.isChamp && v.alive){
    ctx.lineWidth = 4.5*s; ctx.strokeStyle = 'rgba(40,20,0,0.95)';
    ctx.strokeText(nameTxt, cx, labelY); ctx.fillStyle = '#FFD700'; ctx.fillText(nameTxt, cx, labelY);
  } else if (isTopRank && v.alive){
    ctx.lineWidth = 4.5; ctx.strokeStyle = 'rgba(0,0,0,0.95)'; ctx.strokeText(nameTxt, cx, labelY);
    ctx.shadowColor = '#ffcc33'; ctx.shadowBlur = 6*s; ctx.fillStyle = '#fff2b0'; ctx.fillText(nameTxt, cx, labelY); ctx.shadowBlur = 0;
  } else {
    ctx.fillStyle = v.alive ? v.color : '#888';
    ctx.strokeStyle = 'rgba(0,0,0,0.95)'; ctx.lineWidth = 4.5;
    ctx.strokeText(nameTxt, cx, labelY); ctx.fillText(nameTxt, cx, labelY);
  }
  if (level!=null && v.alive) drawLevelText(cx - nameW/2 - 8*s, labelY, s, level);
  if (v.alive){
    ctx.font = `bold ${13*s}px Arial`;
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,0.9)';
    const enTxt = `❤️ ${Math.max(0,v.energy)}`;
    ctx.strokeText(enTxt, cx, labelY + 18*s); ctx.fillStyle = '#FF6688'; ctx.fillText(enTxt, cx, labelY + 18*s);
    const pwTxt = `💪 ${v.power}` + (v.weapon && v.weapon.id !== 'fists' ? ' ' + v.weapon.icon : '');
    ctx.strokeText(pwTxt, cx, labelY + 36*s); ctx.fillStyle = '#ff9d5c'; ctx.fillText(pwTxt, cx, labelY + 36*s);
  }
  ctx.restore();
}

// ════════════════════════ Игровая логика — SF1 один в один ════════════════════════
function damageFor(power){ return Math.max(1, power); }
const KO_LINES = [
  (w,l)=>`⚔️ ${w} нокаутировал ${l}!`,
  (w,l)=>`💥 ${w} уложил ${l} прямо на асфальт!`,
  (w,l)=>`🥋 ${l} досчитался до десяти от ${w}!`,
  (w,l)=>`😵 ${w} выключил свет для ${l}!`,
  (w,l)=>`🌟 ${l} увидел звёзды после удара ${w}!`,
  (w,l)=>`🚑 ${l} уезжает на скорой стараниями ${w}!`,
];
const TIRED_LINES = [
  l=>`💦 ${l} выдохся и упал!`,
  l=>`🥵 ${l} сдулся без сил!`,
  l=>`😮‍💨 ${l} рухнул от истощения!`,
  l=>`🫠 ${l} закончился раньше боя!`,
];
function collapse(loser, winner){
  if (!loser.alive) return;
  loser.alive = false;
  loser.state = 'ko'; loser.animName = 'ko';
  loser.koTimer = KO_FALL_MS;
  playKOSound();
  if (!loser.isBot){ loser.energyMax = 0; loser.energy = 0; loser.powerMax = 0; loser.power = 0; }
  if (winner){
    if (!winner.isBot){ winner.kos = (winner.kos||0) + 1; reportKO(winner.name); }
    if (!winner.isBot) pushEvent(pick(KO_LINES)(cleanNickForSpeech(winner.name), cleanNickForSpeech(loser.name)), true);
  } else if (!loser.isBot) {
    pushEvent(pick(TIRED_LINES)(cleanNickForSpeech(loser.name)), true);
  }
}

let activeExchanges = [];
const PUNCH_TICK_MS = 240;
function startExchange(a, b){
  a.punchCooldown = 999999; b.punchCooldown = 999999;
  a.inExchange = true; b.inExchange = true;
  a.facing = b.x>=a.x ? -1 : 1;
  b.facing = a.x>=b.x ? -1 : 1;
  a.foe = b; b.foe = a;
  const hits = 1 + Math.floor(Math.random()*3);
  const queue = [];
  for (let i=0; i<hits; i++){
    if (Math.random() < 0.5){ queue.push({ attacker:a, defender:b }); queue.push({ attacker:b, defender:a }); }
    else { queue.push({ attacker:b, defender:a }); queue.push({ attacker:a, defender:b }); }
  }
  activeExchanges.push({ a, b, queue, idx:0, timer:0 });
}
// у каждого оружия свой набор ударов — как CHAR_ATTACKS у силуэтов SF1
const WEAPON_ATTACKS = { fists:['jab','punch','kick'], bat:['swing','swing2'], knife:['stab','slash'], pistol:['shoot'], shotgun:['shoot'] };
function throwPunch(attacker, defender){
  const wid = (attacker.weapon || WEAPONS[0]).id;
  attacker.state='punch'; attacker.animName=pick(WEAPON_ATTACKS[wid]); attacker.stateTimer=PUNCH_TICK_MS;
  defender.state='hurt'; defender.animName='hurt'; defender.stateTimer=PUNCH_TICK_MS;
  attacker.facing = defender.x>=attacker.x ? -1 : 1;
  defender.facing = attacker.x>=defender.x ? -1 : 1;
  attacker.foe = defender; defender.foe = attacker;

  const dmg = damageFor(attacker.power);
  const stolen = Math.min(dmg, Math.max(0, defender.energy));
  defender.energy -= dmg;
  defender.power = Math.max(1, defender.power - Math.max(1, Math.floor(dmg*0.3)));
  defender.lastAttacker = attacker;
  syncWeapon(defender, true);
  if (attacker.weapon && attacker.weapon.gun){ playShotSound(wid === 'shotgun'); fireShot(attacker, defender, wid === 'shotgun'); }
  else { playPunchSound(); hitSpark(defender, wid === 'bat' ? .55 : .35); }

  attacker.stolenEnergy += stolen;
  if (!attacker.isBot){
    attacker.allTimeStolen = (attacker.allTimeStolen||0) + stolen;
    reportStolen(attacker.name, stolen);
    const newRankIdx = rankIndexOfLevel(levelOf(attacker.allTimeStolen));
    if (newRankIdx > (attacker.knownRankIdx||0)){
      attacker.knownRankIdx = newRankIdx;
      pushEvent(pick(RANK_UP_LINES)(cleanNickForSpeech(attacker.name), LEVEL_RANKS[newRankIdx].name), true, true);
    }
  }
  if (defender.energy<=0) collapse(defender, attacker);
}
function finishExchange(ex){
  const { a, b } = ex;
  const cd = 1000 + Math.random()*500;
  a.punchCooldown = cd; b.punchCooldown = cd;
  a.inExchange = false; b.inExchange = false;
  a.foe = null; b.foe = null;
  if (a.alive) a.state = 'idle';
  if (b.alive) b.state = 'idle';
  if (a.alive && b.alive){
    // после серии — расходятся в разные стороны (SF1)
    const dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy)||1, push=75;
    a.tx = clamp(a.x - dx/d*push, RING.xMin, RING.xMax);
    a.ty = clamp(a.y - dy/d*push, RING.yMin, RING.yMax);
    b.tx = clamp(b.x + dx/d*push, RING.xMin, RING.xMax);
    b.ty = clamp(b.y + dy/d*push, RING.yMin, RING.yMax);
    a.wanderPause = 500; b.wanderPause = 500;
  }
}
function updateExchanges(dt){
  for (let i=activeExchanges.length-1; i>=0; i--){
    const ex = activeExchanges[i];
    ex.timer -= dt;
    if (ex.timer > 0) continue;
    if (!ex.a.alive || !ex.b.alive || ex.idx >= ex.queue.length){ finishExchange(ex); activeExchanges.splice(i,1); continue; }
    const { attacker, defender } = ex.queue[ex.idx];
    ex.idx++;
    ex.timer = PUNCH_TICK_MS;
    if (attacker.alive && defender.alive) throwPunch(attacker, defender);
  }
}

function update(dt){
  for (const v of VARIANTS){
    if (!v.alive){
      if (!v.eliminated){
        v.koTimer -= dt;
        if (v.koTimer<=0){ v.eliminated = true; v.team = false; }
      }
      continue;
    }
    if (v.energy<=0){ collapse(v, v.lastAttacker); continue; }
    if (!v.isBot && v.power>1 && Date.now()-v.lastActiveAt >= INACTIVITY_MS){
      v.powerDecayAcc = (v.powerDecayAcc||0) + dt;
      while (v.powerDecayAcc >= POWER_DECAY_INTERVAL_MS && v.power>1){ v.powerDecayAcc -= POWER_DECAY_INTERVAL_MS; v.power -= 1; }
      syncWeapon(v, true);
    } else if (!v.isBot){
      v.powerDecayAcc = 0;
    }
    if (v.punchCooldown>0) v.punchCooldown -= dt;
    if (v.state==='punch' || v.state==='hurt'){
      v.stateTimer -= dt;
      if (v.stateTimer<=0) v.state='idle';
      continue;
    }
    if (v.inExchange) continue;
    v.wanderPause -= dt;
    const dx=v.tx-v.x, dy=v.ty-v.y, dist=Math.hypot(dx,dy);
    if (dist<6 && v.wanderPause<=0){
      v.tx = RING.xMin + Math.random()*(RING.xMax-RING.xMin);
      v.ty = RING.yMin + Math.random()*(RING.yMax-RING.yMin);
      v.wanderPause = 500 + Math.random()*1400;
    }
    if (dist>6){
      const speed = 0.05;
      v.x += (dx/dist)*speed*dt;
      v.y += (dy/dist)*speed*dt;
      v.facing = dx>=0 ? -1 : 1;
      v.moveDx = dx/dist; v.moveDy = dy/dist;
      v.state = 'walk';
    } else {
      v.state = 'idle';
    }
  }
  const MIN_SEP = 58;
  for (let i=0;i<VARIANTS.length;i++){
    const a = VARIANTS[i];
    if (!a.alive) continue;
    for (let j=i+1;j<VARIANTS.length;j++){
      const b = VARIANTS[j];
      if (!b.alive) continue;
      const dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy)||0.001;
      if (d < MIN_SEP){
        const push = (MIN_SEP-d)/2, ux=dx/d, uy=dy/d;
        a.x = clamp(a.x-ux*push, RING.xMin, RING.xMax); a.y = clamp(a.y-uy*push, RING.yMin, RING.yMax);
        b.x = clamp(b.x+ux*push, RING.xMin, RING.xMax); b.y = clamp(b.y+uy*push, RING.yMin, RING.yMax);
      }
    }
  }
  for (let i=0;i<VARIANTS.length;i++){
    const a = VARIANTS[i];
    if (!a.alive || a.punchCooldown>0) continue;
    for (let j=i+1;j<VARIANTS.length;j++){
      const b = VARIANTS[j];
      if (!b.alive || b.punchCooldown>0) continue;
      if (a.team && b.team) continue;
      if (Math.hypot(a.x-b.x, a.y-b.y) < FIGHT_DIST && Math.abs(a.y-b.y) < FIGHT_Y_GAP) startExchange(a,b);
    }
  }
  updateExchanges(dt);
  updateBotSpawns(dt);

  // смена места каждые ROOM_SWITCH_MS — бой и бойцы не сбрасываются
  roomSwitchTimer -= dt;
  if (roomSwitchTimer <= 0){
    roomIdx = (roomIdx + 1) % ROOMS.length;
    roomSwitchTimer = ROOM_SWITCH_MS;
    placeCamera();
    pushEvent(pick(ROOM_LINES)(ROOMS[roomIdx].name), false);
  }
  for (let i=VARIANTS.length-1; i>=0; i--){
    const v = VARIANTS[i];
    if (!v.eliminated) continue;
    if (!v.isBot) _fighterCache.set(v.name, { allTimeStolen: v.allTimeStolen, knownRankIdx: v.knownRankIdx });
    dropFighterModel(v);
    VARIANTS.splice(i, 1);
  }
}

// ════════════════════════ 3D-анимация (вместо спрайтов) ════════════════════════
const fx = [];
const sparkMat = new THREE.MeshBasicMaterial({ color:0xffe08a, transparent:true, depthWrite:false });
const flashMat = new THREE.MeshBasicMaterial({ color:0xfff1a0, transparent:true, depthWrite:false });
const tracerMat = new THREE.LineBasicMaterial({ color:0xffe9a0, transparent:true });
const sphere = new THREE.SphereGeometry(1, 8, 6);
function spark(x, y, z, s, mat){
  const m = new THREE.Mesh(sphere, (mat || sparkMat).clone()); m.position.set(x, y, z); m.scale.setScalar(s*.3); scene.add(m);
  fx.push({ m, t:0, life:.18, s });
}
function hitSpark(v, s){ if (v.wx != null) spark(v.wx, 1.4, v.wz, s); }
const _muzzle = new THREE.Vector3();
function fireShot(att, def, big){
  if (!att.m || att.wx == null || def.wx == null) return;
  att.m.W[big ? 'shotgun' : 'pistol'].getWorldPosition(_muzzle);
  _muzzle.x += Math.sin(att.heading)*.5; _muzzle.z += Math.cos(att.heading)*.5; _muzzle.y = 1.35;
  spark(_muzzle.x, _muzzle.y, _muzzle.z, big ? .7 : .45, flashMat);
  const n = big ? 5 : 1;
  for (let k=0; k<n; k++){
    const to = new THREE.Vector3(def.wx + (big ? (Math.random()-.5)*.6 : 0), 1.3 + (big ? (Math.random()-.5)*.4 : 0), def.wz + (big ? (Math.random()-.5)*.6 : 0));
    const l = new THREE.Line(new THREE.BufferGeometry().setFromPoints([_muzzle.clone(), to]), tracerMat.clone()); scene.add(l);
    fx.push({ m:l, t:0, life:.09, line:true });
  }
  hitSpark(def, big ? .5 : .35);
}
function updateFx(dt){
  for (let i = fx.length-1; i >= 0; i--){
    const e = fx[i]; e.t += dt; const k = e.t/e.life;
    if (k >= 1){ scene.remove(e.m); if (e.line) e.m.geometry.dispose(); fx.splice(i, 1); continue; }
    e.m.material.opacity = 1 - k; if (!e.line) e.m.scale.setScalar(e.s*(.3 + k));
  }
}
const lerp = (a, b, k) => a + (b - a)*k;
const KO_STUMBLE_END = 300, KO_FALL_END = 650, KO_SETTLE_END = 1300;
function angTo(from, to){ return Math.atan2(to.wx - from.wx, to.wz - from.wz); }
function turn(v, want, k){ let d = want - v.heading; while (d > Math.PI) d -= Math.PI*2; while (d < -Math.PI) d += Math.PI*2; v.heading += d*k; }
function animate(v, dt){
  const m = v.m; if (!m) return;
  const p = ringToWorld(v.x, v.y); v.wx = p.x; v.wz = p.z;
  const sec = dt/1000, k = Math.min(1, sec*16);
  // куда смотрит: на соперника в обмене, иначе — по ходу движения
  if (v.foe && v.alive && v.foe.wx != null) turn(v, angTo(v, v.foe), Math.min(1, sec*14));
  else if (v.state === 'walk'){
    const a = ringToWorld(v.x + (v.moveDx||0)*10, v.y + (v.moveDy||0)*10);
    turn(v, Math.atan2(a.x - v.wx, a.z - v.wz), Math.min(1, sec*8));
  }
  const wid = (v.weapon || WEAPONS[0]).id;
  let rsx = 0, rel = 0, lsx = 0, lel = 0, rsz = 0, hipL = -.06, hipR = -.06, knL = .12, knR = .12, lean = 0, twist = 0, bob = 0, y = 0, rootX = 0, back = 0;
  // стойка с оружием
  const guard = () => {
    if (wid === 'fists'){ rsx = -1.0; rel = -1.7; lsx = -1.1; lel = -1.8; }
    else if (wid === 'bat'){ rsx = -2.3; rel = -.7; lsx = -.5; lel = -.7; }
    else if (wid === 'knife'){ rsx = -.9; rel = -1.0; lsx = -1.0; lel = -1.7; }
    else if (wid === 'pistol'){ rsx = -1.0; rel = -.4; lsx = -.2; lel = -.3; }
    else { rsx = -1.0; rel = -.3; lsx = -1.0; lel = -.6; }
  };
  if (v.state === 'walk'){
    v.walkPh += sec*9;
    const s = Math.sin(v.walkPh);
    hipL = s*.55; hipR = -s*.55; knL = Math.max(0, -s)*.8; knR = Math.max(0, s)*.8;
    lsx = -s*.45; rsx = s*.45; lel = -.35; rel = -.35; bob = Math.abs(Math.cos(v.walkPh))*.04;
    if (wid !== 'fists'){ rsx = wid === 'bat' ? -.3 + s*.2 : -.5; rel = -.4; }
  } else if (v.state === 'idle'){
    guard(); bob = Math.sin(performance.now()/260 + v.walkPh)*.015;
  } else if (v.state === 'punch'){
    guard();
    const pr = 1 - Math.max(0, v.stateTimer)/PUNCH_TICK_MS, e = Math.sin(Math.min(1, pr*1.6)*Math.PI);
    switch (v.animName){
      case 'jab':   rsx = lerp(-1.0, -1.6, e); rel = lerp(-1.7, -.05, e); lean = .12*e; break;
      case 'punch': lsx = lerp(-1.1, -1.6, e); lel = lerp(-1.8, -.05, e); twist = .45*e; lean = .15*e; break;
      case 'kick':  hipR = 1.45*e; knR = .1; hipL = -.1; lean = -.18*e; break;
      case 'swing': rsx = lerp(-2.9, -.6, Math.min(1, pr*1.4)); rel = -.2; twist = lerp(.5, -.5, Math.min(1, pr*1.4)); lean = .2*e; break;
      case 'swing2': rsx = -1.5; rel = -.2; rsz = lerp(-1.2, 1.2, Math.min(1, pr*1.4)); twist = lerp(-.7, .6, Math.min(1, pr*1.4)); break;
      case 'stab':  rsx = lerp(-.9, -1.55, e); rel = lerp(-1.0, 0, e); lean = .18*e; break;
      case 'slash': rsx = -1.4; rel = -.3; rsz = lerp(-1.0, .9, Math.min(1, pr*1.5)); twist = lerp(-.4, .4, Math.min(1, pr*1.5)); break;
      case 'shoot': rsx = -1.55 - .35*e; rel = 0; if (wid === 'shotgun'){ lsx = -1.45; lel = -.35; } back = -.05*e; break;
    }
  } else if (v.state === 'hurt'){
    guard(); const pr = 1 - Math.max(0, v.stateTimer)/PUNCH_TICK_MS; lean = -.35*Math.sin(pr*Math.PI); back = -.06*Math.sin(pr*Math.PI);
  } else if (v.state === 'ko'){
    // падение на спину: шатается, падает, доседает, исчезает (тайминги SF1)
    const t = Math.max(0, KO_FALL_MS - v.koTimer);
    rsx = lsx = -2.6; rel = lel = 0; hipL = hipR = knL = knR = 0;
    if (t <= KO_STUMBLE_END){ const q = t/KO_STUMBLE_END; lean = -.2 - Math.sin(q*Math.PI*3)*.09*(1-q); rsx = lsx = -.6; }
    else if (t <= KO_FALL_END){ const q = (t-KO_STUMBLE_END)/(KO_FALL_END-KO_STUMBLE_END); rootX = -q*q*q*Math.PI/2; back = -q*q*q*.4; }
    else { const q = Math.min(1, (t-KO_FALL_END)/(KO_SETTLE_END-KO_FALL_END)); rootX = -Math.PI/2 + Math.sin(q*Math.PI*2.2)*.04*(1-q); back = -.4; }
    y = Math.min(1, Math.abs(rootX)/(Math.PI/2))*.12;
  }
  if (v.state === 'ko'){
    m.aR.sh.rotation.x = rsx; m.aR.el.rotation.x = rel; m.aL.sh.rotation.x = lsx; m.aL.el.rotation.x = lel;
    m.lL.hip.rotation.x = 0; m.lR.hip.rotation.x = 0; m.lL.kn.rotation.x = 0; m.lR.kn.rotation.x = 0; m.torso.rotation.set(lean, 0, 0);
  } else {
    m.aR.sh.rotation.x = lerp(m.aR.sh.rotation.x, rsx, k); m.aR.el.rotation.x = lerp(m.aR.el.rotation.x, rel, k); m.aR.sh.rotation.z = lerp(m.aR.sh.rotation.z, rsz, k);
    m.aL.sh.rotation.x = lerp(m.aL.sh.rotation.x, lsx, k); m.aL.el.rotation.x = lerp(m.aL.el.rotation.x, lel, k);
    m.lL.hip.rotation.x = lerp(m.lL.hip.rotation.x, -hipL, k); m.lR.hip.rotation.x = lerp(m.lR.hip.rotation.x, -hipR, k);
    m.lL.kn.rotation.x = lerp(m.lL.kn.rotation.x, knL, k); m.lR.kn.rotation.x = lerp(m.lR.kn.rotation.x, knR, k);
    m.torso.rotation.x = lerp(m.torso.rotation.x, lean, k); m.torso.rotation.y = lerp(m.torso.rotation.y, twist, k);
  }
  m.root.rotation.x = v.state === 'ko' ? rootX : 0;
  m.root.rotation.y = v.heading;
  m.root.position.set(v.wx + Math.sin(v.heading)*back, y + bob, v.wz + Math.cos(v.heading)*back);
  // перед исчезновением с ринга — уходит в асфальт (как fade-out в SF1)
  if (!v.alive && v.koTimer < (KO_FALL_MS - KO_SETTLE_END)) m.root.position.y -= (1 - v.koTimer/(KO_FALL_MS - KO_SETTLE_END))*.35;
}

// ════════════════════════ Главный цикл (30 fps, как в SF1) ════════════════════════
const START_HOUR = Q.get('hour') != null ? +Q.get('hour') : 19.2;
const FIXED_HOUR = Q.get('hour') != null;
let _lastT = 0, _lastFrameT = 0, gameMin = 0;
const FRAME_INTERVAL = 1000/30;
function loop(t){
  if (t - _lastFrameT < FRAME_INTERVAL) { requestAnimationFrame(loop); return; }
  _lastFrameT = t;
  if (!_lastT) _lastT = t;
  const dt = Math.min(50, t-_lastT);
  _lastT = t;
  update(dt);
  for (const v of VARIANTS) animate(v, dt);
  updateFx(dt/1000);

  // город: время суток как в игре (игровая минута за реальную секунду)
  gameMin += dt/1000;
  const env = dn.update(FIXED_HOUR ? START_HOUR : START_HOUR + gameMin/60, t/1000);
  const P = ROOMS[roomIdx];
  sun.target.position.set(P.cx, 0, P.cz); sun.target.updateMatrixWorld();
  sun.position.copy(sun.target.position).addScaledVector(env.lightDir, 90);
  sky.position.copy(camera.position);
  env.px = P.cx; env.pz = P.cz;
  world.update(t/1000, env);
  renderer.render(scene, camera);

  ctx.clearRect(0,0,canvas.width,canvas.height);
  const sorted = [...VARIANTS].sort((a,b)=>a.y-b.y);
  for (const v of sorted) drawFighterLabels(v);
  drawHUD();
  updateDrawCoinRain(dt);
  drawGiftBanner();
  requestAnimationFrame(loop);
}
document.getElementById('loading').remove();
requestAnimationFrame(loop);
window.SW = { VARIANTS, ROOMS, camera, onLike, onGift, CAM, placeCamera };
</script>
