<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>🎣 Fishing</title>
<style>
  html, body { width:100vw; height:100vh; margin:0; background:#000; overflow:hidden; font-family:Arial,sans-serif; }
  #wrap { position:absolute; left:0; top:0; width:600px; height:1000px; transform-origin:0 0; }
  canvas { display:block; background:#000; }
  .ui-btn { position:fixed; z-index:99999; width:26px; height:26px; font-size:12px; background:rgba(0,0,0,0.55);
    color:rgba(255,255,255,0.55); border:1px solid rgba(255,255,255,0.2); border-radius:6px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; }
  #backBtn { top:calc(50% - 30px); right:10px; }
  #fsBtn   { top:calc(50% + 20px); right:10px; }
  #statusBadge { position:fixed; top:8px; right:8px; z-index:99999; padding:5px 10px; border-radius:8px;
    font-size:11px; font-weight:bold; font-family:Arial,sans-serif; display:none; }
  #statusBadge.connecting { background:rgba(80,80,80,0.7); color:#ddd; display:block; }
  #statusBadge.live       { background:rgba(200,30,30,0.75); color:#fff; display:block; }
  #statusBadge.demo       { background:rgba(180,140,0,0.75); color:#fff; display:block; }
  #statusBadge.error      { background:rgba(150,0,0,0.75); color:#fff; display:block; }
  #ratingOverlay { position:fixed; left:50%; top:14%; transform:translateX(-50%); z-index:99999;
    background:rgba(5,5,10,0.88); border:1px solid rgba(255,210,80,0.4); border-radius:12px;
    padding:12px 16px; text-align:center; display:none; max-width:80vw; font-family:Arial,sans-serif; }
  #tsunamiVideo { position:absolute; left:0; top:0; width:600px; height:1000px; object-fit:cover;
    display:none; background:#000; }
</style>
</head>
<body>
<button id="backBtn" class="ui-btn" title="Главное меню">⌂</button>
<button id="fsBtn"   class="ui-btn" title="На весь экран">⛶</button>
<div id="wrap"><canvas id="c" width="600" height="1000"></canvas><video id="tsunamiVideo" muted playsinline webkit-playsinline></video></div>
<div id="statusBadge"></div>
<div id="ratingOverlay"></div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const wrap = document.getElementById('wrap');
const CW = canvas.width, CH = canvas.height;

function applyScale(){
  const vw = document.documentElement.clientWidth || window.innerWidth;
  const vh = document.documentElement.clientHeight || window.innerHeight;
  const s = Math.min(vw/CW, vh/CH);
  const x = (vw - CW*s)/2, y = (vh - CH*s)/2;
  wrap.style.transform = `translate(${x}px,${y}px) scale(${s})`;
}
window.addEventListener('resize', applyScale);
applyScale();

const DOCK_TOP = 830;

// ── фон — зацикленное видео причала/моря. Один <video> с нативным loop —
// ролик смонтирован так, что чайка влетает слева и улетает за правый край
// одним цельным пролётом, это уже готовый бесшовный цикл сам по себе.
const bgVideo = document.createElement('video');
bgVideo.src = 'img/fishing_bg_video.mp4';
bgVideo.muted = true;
bgVideo.loop = true;
bgVideo.autoplay = true;
bgVideo.playsInline = true;
bgVideo.preload = 'auto';
bgVideo.play().catch(()=>{});

const HORIZON_FRAC = 0.40;
const BG = { ready:false, sx:0, sy:0, sw:0, sh:0, horizonY: CH*0.4 };
function computeCrop(){
  const vw = bgVideo.videoWidth, vh = bgVideo.videoHeight;
  const destAspect = CW/CH;
  const srcAspect = vw/vh;
  let sw, sh, sx, sy;
  if (srcAspect > destAspect){
    sh = vh; sw = vh*destAspect;
    sx = (vw-sw)/2; sy = 0;
  } else {
    sw = vw; sh = vw/destAspect;
    sx = 0; sy = (vh-sh)/2;
  }
  BG.sx=sx; BG.sy=sy; BG.sw=sw; BG.sh=sh;
  BG.horizonY = CH*HORIZON_FRAC;
  BG.ready = true;
}
bgVideo.addEventListener('loadedmetadata', computeCrop);

// ── спец-событие (раз в 3 минуты) — ПОДМЕНЯЕТ фоновое видео на канвасе,
// а не закрывает весь экран отдельным слоем поверх игры (2026-08-12, по
// просьбе пользователя: "ничего не должно пропадать с экрана" — рыбаки,
// поплавки, правила и топ дня должны оставаться видны поверх спец-видео,
// как обычно). Тот же приём, что и bgVideo выше — off-DOM <video>,
// рисуется в canvas через drawImage, а не отдельный видимый DOM-элемент.
// Это заодно убирает риск того, что браузер на телефоне решит открыть
// видео в нативном полноэкранном плеере (что могло приводить к зависанию
// анимации — см. watchdog в конце файла).
const specialVideo = document.createElement('video');
specialVideo.muted = true;
specialVideo.playsInline = true;
specialVideo.preload = 'auto';
let _specialEventActive = false;
const SPECIAL_BG = { ready:false, sx:0, sy:0, sw:0, sh:0 };
function computeSpecialCrop(){
  const vw = specialVideo.videoWidth, vh = specialVideo.videoHeight;
  if (!vw || !vh) return;
  const destAspect = CW/CH;
  const srcAspect = vw/vh;
  let sw, sh, sx, sy;
  if (srcAspect > destAspect){
    sh = vh; sw = vh*destAspect;
    sx = (vw-sw)/2; sy = 0;
  } else {
    sw = vw; sh = vw/destAspect;
    sx = 0; sy = (vh-sh)/2;
  }
  SPECIAL_BG.sx=sx; SPECIAL_BG.sy=sy; SPECIAL_BG.sw=sw; SPECIAL_BG.sh=sh;
  SPECIAL_BG.ready = true;
}
specialVideo.addEventListener('loadedmetadata', computeSpecialCrop);

const SPARKLES = Array.from({length:150}, ()=>({
  u: Math.random(),
  spread: Math.random(),
  side: Math.random()<0.5?-1:1,
  size: 1 + Math.random()*2.8,
  phase: Math.random()*1000,
  speed: 260 + Math.random()*480,
}));

const RIPPLE_EVENTS = Array.from({length:5}, ()=>({
  x: 60 + Math.random()*(CW-120),
  yFrac: 0.12 + Math.random()*0.68,
  period: 5000 + Math.random()*5000,
  offset: Math.random()*8000,
}));

const GRAIN_SIZE = 96;
const grainCanvas = document.createElement('canvas');
grainCanvas.width = GRAIN_SIZE; grainCanvas.height = GRAIN_SIZE;
(function buildGrain(){
  const gctx = grainCanvas.getContext('2d');
  const img = gctx.createImageData(GRAIN_SIZE, GRAIN_SIZE);
  for (let i=0;i<img.data.length;i+=4){
    const v = Math.random()*255;
    img.data[i]=v; img.data[i+1]=v; img.data[i+2]=v; img.data[i+3]=Math.random()*30;
  }
  gctx.putImageData(img,0,0);
})();
const grainPattern = ctx.createPattern(grainCanvas,'repeat');

// иконка подарка Money Gun в строке правил "Money Gun = 🌊" — сам подарок
// из TikTok картинкой, цунами эмодзи-волной (кадр из видео был неразборчив
// в таком маленьком размере)
const moneyGunIcon = new Image();
moneyGunIcon.src = 'img/fishing_moneygun_icon.webp';

// правила — в правом верхнем углу (2026-08-12, по просьбе: раньше были
// слева, теперь топ дня поднялся туда, где раньше стояли правила). Каждая
// строка правил получила своё "= 🐟" (кроме Money Gun — там как и было
// "= 🌊", сами правила не меняем, только добавляем знак равно и рыбку).
// правила выровнены по ТРЁМ общим колонкам, одинаковым для всех трёх строк
// (LIKE/COINS/Money Gun): текст правила растёт влево от LABEL_RIGHT_X, "="
// всегда стоит на EQ_X, эмодзи/иконка результата — всегда по центру ICON_CX.
// Раньше эмодзи было замешано в жирный обводимый текст (обводка его мазала)
// и ширина Money Gun считалась отдельно через measureText — из-за этого
// колонки "=" и иконок между строками не совпадали (просили исправить
// неровность, 2026-08-12).
const RULES_RIGHT_X = CW - 12;
const ICON_SLOT = 40, RULE_GAP = 10;
const ICON_CX = RULES_RIGHT_X - ICON_SLOT/2;
function drawEquals(ry){
  ctx.textAlign = 'right'; ctx.font = 'bold 30px Arial Black';
  ctx.strokeStyle = 'rgba(0,0,0,0.85)'; ctx.lineWidth = 6;
  ctx.strokeText('=', EQ_X, ry);
  ctx.fillStyle = '#7fd3ff'; ctx.fillText('=', EQ_X, ry);
}
function drawRuleLabel(ry, label, color){
  ctx.textAlign = 'right'; ctx.font = 'bold 30px Arial Black';
  ctx.strokeStyle = 'rgba(0,0,0,0.85)'; ctx.lineWidth = 6;
  ctx.strokeText(label, LABEL_RIGHT_X, ry);
  ctx.fillStyle = color; ctx.fillText(label, LABEL_RIGHT_X, ry);
}
function drawRuleIconEmoji(ry, emoji){
  ctx.textAlign = 'center'; ctx.font = '30px Arial';
  ctx.fillText(emoji, ICON_CX, ry+4);
}
ctx.font = 'bold 30px Arial Black';
const EQ_X = RULES_RIGHT_X - ICON_SLOT - RULE_GAP; // правый край "=" — общий для всех строк
const LABEL_RIGHT_X = EQ_X - ctx.measureText('=').width - RULE_GAP; // правый край текста правила — тоже общий

function drawTopPanel(){
  drawRuleLabel(40, '❤️ LIKE (100)', '#8fffb0');
  drawEquals(40);
  drawRuleIconEmoji(40, '🐟');

  drawRuleLabel(84, '🌹 1 COINS', '#FFD700');
  drawEquals(84);
  drawRuleIconEmoji(84, '🐟');

  // Money Gun: вместо текста слева — иконка подарка (реальная картинка из
  // TikTok), справа от "=" — та же колонка ICON_CX, что и у рыбок выше
  const gunIconSize = ICON_SLOT;
  if (moneyGunIcon.complete) ctx.drawImage(moneyGunIcon, LABEL_RIGHT_X-gunIconSize, 128-gunIconSize+8, gunIconSize, gunIconSize);
  drawEquals(128);
  drawRuleIconEmoji(128, '🌊');

  // топ дня — теперь слева вверху, там, где раньше начинались правила
  const topHeaderY = 40;
  ctx.font = 'bold 20px Arial Black'; ctx.textAlign = 'left';
  ctx.strokeStyle = 'rgba(0,0,0,0.9)'; ctx.lineWidth = 4;
  ctx.strokeText('🏆 TOP OF THE DAY', 12, topHeaderY);
  ctx.fillStyle = '#ffd24f'; ctx.fillText('🏆 TOP OF THE DAY', 12, topHeaderY);

  // топ-5 на экране (сервер может прислать больше — обрезаем при рендере,
  // 2026-08-12 по просьбе пользователя: было топ-10, стало топ-5). Если
  // участников меньше — список просто короче, без заглушек.
  const rankColors = ['#FFD700','#C0C0C0','#CD7F32'];
  const shownTop = topList.slice(0,5);
  shownTop.forEach((p,i)=>{
    const ry = topHeaderY + 33 + i*27;
    const line = (i+1)+'. '+p.name+'  🐟'+p.count;
    ctx.font = 'bold 18px Arial Black';
    ctx.strokeStyle = 'rgba(0,0,0,0.85)'; ctx.lineWidth = 4;
    ctx.strokeText(line, 12, ry);
    ctx.fillStyle = rankColors[i] || '#dddddd'; ctx.fillText(line, 12, ry);
  });

  // "ТОП ВЧЕРА" (2026-08-12) — снапшот вчерашнего топа дня, виден весь
  // следующий день после полуночного сброса (см. top_fishing_yesterday
  // ниже). Показываем только топ-3, приглушённым цветом, чтобы не спорить
  // за внимание с сегодняшним топом. Если вчера никто не рыбачил — блок
  // просто не рисуется (без заглушек, как и у топа дня).
  if (yesterdayTopList.length){
    const yHeaderY = topHeaderY + 33 + shownTop.length*27 + 24;
    ctx.font = 'bold 16px Arial Black'; ctx.textAlign = 'left';
    ctx.strokeStyle = 'rgba(0,0,0,0.9)'; ctx.lineWidth = 4;
    ctx.strokeText('🕐 ТОП ВЧЕРА', 12, yHeaderY);
    ctx.fillStyle = '#9fb8c4'; ctx.fillText('🕐 ТОП ВЧЕРА', 12, yHeaderY);
    yesterdayTopList.slice(0,3).forEach((p,i)=>{
      const ry = yHeaderY + 24 + i*22;
      const line = (i+1)+'. '+p.name+'  🐟'+p.count;
      ctx.font = 'bold 15px Arial Black';
      ctx.strokeStyle = 'rgba(0,0,0,0.85)'; ctx.lineWidth = 3.5;
      ctx.strokeText(line, 12, ry);
      ctx.fillStyle = 'rgba(220,220,220,0.75)'; ctx.fillText(line, 12, ry);
    });
  }
}

// многие телефоны декодируют аппаратно только ОДНО видео разом — пока
// играет specialVideo, браузер сам может поставить bgVideo на паузу, чтобы
// освободить декодер, и без явного .play() он потом навсегда остаётся на
// паузе ("стандартное видео после спецэффекта не идёт", 2026-08-12). Поэтому
// каждый кадр подстраховываемся: если видео, которое должно сейчас играть,
// вдруг оказалось на паузе — сами его перезапускаем, не дожидаясь, пока
// кто-то явно об этом попросит.
function ensurePlaying(video){
  if (video.paused) video.play().catch(()=>{});
}
function drawBackground(){
  if (_specialEventActive && SPECIAL_BG.ready && specialVideo.readyState >= 2){
    ensurePlaying(specialVideo);
    ctx.drawImage(specialVideo, SPECIAL_BG.sx, SPECIAL_BG.sy, SPECIAL_BG.sw, SPECIAL_BG.sh, 0, 0, CW, CH);
  } else if (BG.ready && bgVideo.readyState >= 2){
    ensurePlaying(bgVideo);
    ctx.drawImage(bgVideo, BG.sx, BG.sy, BG.sw, BG.sh, 0, 0, CW, CH);
  } else {
    const g = ctx.createLinearGradient(0,0,0,CH);
    g.addColorStop(0,'#1a2c4a'); g.addColorStop(0.4,'#3a5a72'); g.addColorStop(1,'#123a4f');
    ctx.fillStyle = g; ctx.fillRect(0,0,CW,CH);
    ctx.save();
    ctx.font = 'bold 14px Arial'; ctx.fillStyle='rgba(255,255,255,0.5)'; ctx.textAlign='center';
    ctx.fillText('видео загружается…', CW/2, CH/2);
    ctx.restore();
  }
}

function drawWaterFX(t){
  const waterH = DOCK_TOP - BG.horizonY;
  if (waterH <= 0) return;

  ctx.save();
  ctx.beginPath(); ctx.rect(0, BG.horizonY, CW, waterH); ctx.clip();

  SPARKLES.forEach(sp=>{
    const py = BG.horizonY + sp.u*waterH;
    const widthAtY = 8 + sp.u*68;
    const px = CW/2 + sp.side*sp.spread*widthAtY;
    const tw = Math.abs(Math.sin(t/sp.speed + sp.phase));
    if (tw < 0.4) return;
    ctx.globalAlpha = tw*0.6*(1-sp.spread*0.25);
    ctx.fillStyle = sp.spread < 0.4 ? 'rgba(255,244,214,0.95)' : 'rgba(255,214,160,0.55)';
    ctx.fillRect(px, py, sp.size, sp.size*0.6);
  });
  ctx.globalAlpha = 1;

  RIPPLE_EVENTS.forEach(r=>{
    const cyc = (t + r.offset) % r.period;
    if (cyc > 1500) return;
    const y = BG.horizonY + r.yFrac*waterH;
    const maxR = 9 + r.yFrac*24;
    [0, 0.42].forEach(dl=>{
      const uu = cyc/1500 + dl;
      if (uu > 1) return;
      const rad = uu*maxR;
      const alpha = (1-uu)*0.3;
      ctx.strokeStyle = `rgba(255,255,255,${alpha})`;
      ctx.lineWidth = 1.1;
      ctx.beginPath(); ctx.ellipse(r.x, y, rad, rad*0.32, 0, 0, Math.PI*2); ctx.stroke();
    });
  });

  ctx.save();
  ctx.globalAlpha = 0.4;
  for (let x=6;x<CW;x+=34){
    const foam = Math.sin(t/480 + x*0.12)*0.5+0.5;
    if (foam>0.55){
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      ctx.fillRect(x, DOCK_TOP-8-foam*3, 7+foam*5, 1.6);
    }
  }
  ctx.restore();

  ctx.restore();
}

function drawBucket(x, y, s){
  ctx.save();
  ctx.translate(x,y); ctx.scale(s,s);

  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath(); ctx.ellipse(0, 32, 30, 8, 0, 0, Math.PI*2); ctx.fill();

  const bodyGrad = ctx.createLinearGradient(-26,0,26,0);
  bodyGrad.addColorStop(0,   '#1c4a63');
  bodyGrad.addColorStop(0.32,'#4f95bd');
  bodyGrad.addColorStop(0.5, '#6fb8de');
  bodyGrad.addColorStop(0.68,'#3d7ea6');
  bodyGrad.addColorStop(1,   '#173d52');
  ctx.fillStyle = bodyGrad;
  ctx.beginPath();
  ctx.moveTo(-26,-1); ctx.lineTo(-19,33); ctx.lineTo(19,33); ctx.lineTo(26,-1); ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.4)'; ctx.lineWidth = 1.2; ctx.stroke();

  ctx.strokeStyle = 'rgba(0,0,0,0.18)'; ctx.lineWidth = 1.5;
  [10, 21].forEach(ry=>{
    const rw = 26 - (ry/33)*7;
    ctx.beginPath(); ctx.ellipse(0, ry, rw, 2.6, 0, 0, Math.PI); ctx.stroke();
  });

  ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 2.5; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(-16,4); ctx.lineTo(-12,29); ctx.stroke();

  ctx.beginPath(); ctx.ellipse(0,-1,26,7.5,0,0,Math.PI*2);
  ctx.fillStyle = '#8fd0f0'; ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.4)'; ctx.lineWidth = 1.2; ctx.stroke();

  ctx.beginPath(); ctx.ellipse(0,1,22,6.2,0,0,Math.PI*2);
  const waterGrad = ctx.createRadialGradient(-4,0,2,0,1,22);
  waterGrad.addColorStop(0,'#bfe7f5'); waterGrad.addColorStop(1,'#1f5570');
  ctx.fillStyle = waterGrad; ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = 1; ctx.stroke();

  [[-9,0,-0.35,'#dfeef2'], [7,2,0.5,'#cfe8ee']].forEach(([fx,fy,rot,col])=>{
    ctx.save();
    ctx.translate(fx,fy); ctx.rotate(rot); ctx.scale(1,0.55);
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.ellipse(0,0,7,2.6,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-6,0); ctx.lineTo(-11,-3.5); ctx.lineTo(-11,3.5); ctx.closePath(); ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,0.25)'; ctx.lineWidth=0.6; ctx.stroke();
    ctx.restore();
  });

  ctx.fillStyle = '#555';
  ctx.beginPath(); ctx.arc(-25,-2,2.6,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(25,-2,2.6,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#7a7a7a'; ctx.lineWidth = 2.2;
  ctx.beginPath(); ctx.arc(0,-6,26,Math.PI*1.12,Math.PI*1.88); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.lineWidth = 0.8;
  ctx.beginPath(); ctx.arc(0,-6,26,Math.PI*1.15,Math.PI*1.5); ctx.stroke();

  ctx.restore();
}

function drawRod(baseX, bobberX, bobberY, color, scale, tension){
  const s = scale||1;
  const ten = tension||0;
  const baseX_ = baseX, baseY_ = CH + 60*s;
  const tipX = baseX_ + (bobberX-baseX_)*0.4;
  const tipY = baseY_ + (bobberY-baseY_)*0.62;

  const bendX = (tipX > baseX_ ? -18*s : 18*s) * (1 + ten*1.4);
  const midX = (baseX_+tipX)/2 + bendX, midY = (baseY_+tipY)/2;
  const steps = 20;
  const pts = [];
  for (let i=0;i<=steps;i++){
    const u = i/steps;
    const x = (1-u)*(1-u)*baseX_ + 2*(1-u)*u*midX + u*u*tipX;
    const y = (1-u)*(1-u)*baseY_ + 2*(1-u)*u*midY + u*u*tipY;
    pts.push([x,y]);
  }
  const baseW = 9*s, tipW = 1.4*s;
  const left = [], right = [];
  for (let i=0;i<pts.length;i++){
    const u = i/steps;
    const w = baseW*(1-u) + tipW*u;
    const prev = pts[Math.max(0,i-1)], next = pts[Math.min(steps,i+1)];
    const dx = next[0]-prev[0], dy = next[1]-prev[1];
    const len = Math.hypot(dx,dy) || 1;
    const nx = -dy/len, ny = dx/len;
    left.push([pts[i][0]+nx*w/2, pts[i][1]+ny*w/2]);
    right.push([pts[i][0]-nx*w/2, pts[i][1]-ny*w/2]);
  }
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(left[0][0], left[0][1]);
  for (let i=1;i<left.length;i++) ctx.lineTo(left[i][0], left[i][1]);
  for (let i=right.length-1;i>=0;i--) ctx.lineTo(right[i][0], right[i][1]);
  ctx.closePath();
  const grad = ctx.createLinearGradient(baseX_, baseY_, tipX, tipY);
  grad.addColorStop(0, '#2e2116'); grad.addColorStop(1, '#9a7a48');
  ctx.fillStyle = grad; ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.4)'; ctx.lineWidth = 0.8*s; ctx.stroke();

  ctx.strokeStyle = 'rgba(0,0,0,0.55)'; ctx.lineWidth = 1*s;
  [0.3, 0.55, 0.78].forEach(u=>{
    const idx = Math.round(u*steps);
    const w = baseW*(1-u) + tipW*u;
    ctx.beginPath(); ctx.arc(pts[idx][0], pts[idx][1], w*0.9, 0, Math.PI*2); ctx.stroke();
  });

  ctx.fillStyle = '#232323';
  ctx.beginPath(); ctx.ellipse(baseX_, baseY_-6*s, 9*s, 6*s, 0.3, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(baseX_, baseY_-6*s, 3.5*s, 0, Math.PI*2); ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.strokeStyle = ten>0.15 ? 'rgba(255,255,255,0.8)' : 'rgba(255,255,255,0.4)';
  ctx.lineWidth = 1 + ten*1.5;
  ctx.beginPath();
  ctx.moveTo(tipX, tipY);
  ctx.quadraticCurveTo((tipX+bobberX)/2, Math.min(tipY,bobberY)-10, bobberX, bobberY);
  ctx.stroke();
  ctx.restore();
}

function drawSplash(x, y, power){
  ctx.save();
  const n = 6;
  for (let i=0;i<n;i++){
    const a = (i/n)*Math.PI*2 + power*3;
    const len = 6 + power*22;
    const dx = Math.cos(a)*len, dy = Math.sin(a)*len*0.6 - power*6;
    ctx.strokeStyle = `rgba(255,255,255,${0.25+power*0.5})`;
    ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+dx, y+dy); ctx.stroke();
  }
  ctx.fillStyle = `rgba(255,255,255,${0.15+power*0.25})`;
  ctx.beginPath(); ctx.ellipse(x, y+3, 10+power*14, 3+power*4, 0, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}

const BOBBER_COLORS = ['#ff5566','#4fa8ff','#5fe36a','#c26bff','#4fe3d0'];
// ── зрители — фиксированный пул "мест" на воде (не резиновый список: у
// реального стрима может быть много уникальных донатеров за эфир). Место
// занимает тот, кто первым закинул монету/добил 100 лайков; если все места
// заняты — выселяем "самого выселяемого" (см. getOrAssignAngler ниже:
// приоритет по донату — чем больше зритель донатил в этом сеансе, тем
// дольше держится его место, но не навсегда). 15 мест (2026-08-11,
// увеличено с 8 по просьбе пользователя) — рендер удочки лёгкий, никакой
// физики/коллизий между зрителями тут нет, потолок только в разметке
// экрана (координаты подобраны руками, чтобы не налезали друг на друга).
const SLOTS = [
  { baseX:40,  px:0.10, py:0.28 },
  { baseX:130, px:0.24, py:0.46 },
  { baseX:220, px:0.36, py:0.22 },
  { baseX:400, px:0.62, py:0.42 },
  { baseX:480, px:0.74, py:0.24 },
  { baseX:560, px:0.88, py:0.44 },
  { baseX:90,  px:0.16, py:0.60 },
  { baseX:520, px:0.80, py:0.60 },
  { baseX:18,  px:0.03, py:0.16 },
  { baseX:180, px:0.30, py:0.10 },
  { baseX:300, px:0.50, py:0.08 },
  { baseX:348, px:0.58, py:0.62 },
  { baseX:252, px:0.42, py:0.80 },
  { baseX:48,  px:0.08, py:0.80 },
  { baseX:564, px:0.94, py:0.80 },
].map((s,i)=>({ ...s, colorIdx: i % BOBBER_COLORS.length, occupant:null }));
const anglersByUser = new Map(); // usernameLower -> angler

// зрители, которым в моменте не хватило места (редкий случай: все 15 мест
// заняты активным вываживанием прямо сейчас) — не теряются, ждут своей
// очереди и рассаживаются автоматически, как только освобождается место
// (см. drainWaitingQueue в loop()). Рейтинг в БД при этом не страдает —
// reportFish пишется независимо от того, нашлось ли место на экране.
let waitingQueue = []; // [{ username, fish, tier, rare }]
function queueWaiting(username, fish, tier, rare){
  waitingQueue.push({ username, fish, tier, rare });
  if (waitingQueue.length > 200) waitingQueue.shift(); // защита от неограниченного роста при вирусном донат-шторме
}
function drainWaitingQueue(t){
  while (waitingQueue.length){
    const next = waitingQueue[0];
    const a = getOrAssignAngler(next.username, t);
    if (!a) break; // всё ещё нет места — ждём следующего кадра
    waitingQueue.shift();
    a.totalFish = (a.totalFish||0) + next.fish;
    if (a.catch) a.queue.push({ tier: next.tier, fish: next.fish, rare: next.rare });
    else a.catch = { tier: next.tier, fish: next.fish, startTime: t, rare: next.rare };
  }
}

function getOrAssignAngler(username, t){
  const key = username.toLowerCase();
  let a = anglersByUser.get(key);
  if (a){ a.lastActive = t; return a; }

  let slot = SLOTS.find(s => !s.occupant);
  if (!slot){
    // приоритет по донату: "выселяемость" = время бездействия, делённое на
    // (1 + сколько рыбок принёс зрителю донат/лайки в этом сеансе). Крупный
    // донатер держит место намного дольше при равном простое, но не вечно —
    // при достаточно долгом отсутствии он всё равно наберёт высокий счёт и
    // уступит место новому зрителю.
    const free = SLOTS.filter(s => s.occupant && !s.occupant.catch);
    if (!free.length) return null; // все прямо сейчас тащат рыбу — некуда посадить нового
    free.sort((x,y)=>{
      const sx = (t - x.occupant.lastActive) / (1 + (x.occupant.totalFish||0));
      const sy = (t - y.occupant.lastActive) / (1 + (y.occupant.totalFish||0));
      return sy - sx; // самый выселяемый (наибольший счёт) — первый
    });
    slot = free[0];
    anglersByUser.delete(slot.occupant.key);
  }
  a = { key, name:'@'+username, baseX:slot.baseX, px:slot.px, py:slot.py, colorIdx:slot.colorIdx, catch:null, queue:[], lastActive:t, totalFish:0 };
  slot.occupant = a;
  anglersByUser.set(key, a);
  return a;
}

function bobberPos(a){
  return { x: a.px*CW, y: BG.horizonY + a.py*(DOCK_TOP-BG.horizonY) };
}

function drawBobber(x, y, s, color, name, isChamp, t){
  const bob = Math.sin(t/450 + x*0.05)*3;
  y += bob;

  ctx.save();
  ctx.globalAlpha = 0.25;
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.ellipse(x, y+6*s, 14*s, 4*s, 0, 0, Math.PI*2); ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.beginPath();
  ctx.moveTo(x, y-16*s);
  ctx.quadraticCurveTo(x+7*s, y-4*s, x, y+2*s);
  ctx.quadraticCurveTo(x-7*s, y-4*s, x, y-16*s);
  ctx.closePath();
  ctx.fillStyle = '#e8433f'; ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.4)'; ctx.lineWidth = 1; ctx.stroke();

  ctx.beginPath(); ctx.ellipse(x, y+6*s, 6*s, 9*s, 0, 0, Math.PI*2);
  ctx.fillStyle = '#fdfdfd'; ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.stroke();

  ctx.beginPath(); ctx.moveTo(x, y-16*s); ctx.lineTo(x, y-24*s);
  ctx.strokeStyle = '#c9982f'; ctx.lineWidth = 1.5*s; ctx.stroke();
  ctx.restore();

  if (isChamp){
    ctx.save();
    ctx.font = `${13*s}px Arial`;
    ctx.textAlign = 'center';
    ctx.fillText('🏆', x, y-28*s);
    ctx.restore();
  }

  ctx.font = `bold ${12*s}px Arial Black`;
  ctx.textAlign = 'center';
  const w = ctx.measureText(name).width;
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(x-w/2-5, y-40*s, w+10, 15*s);
  ctx.strokeStyle = 'rgba(0,0,0,0.9)'; ctx.lineWidth = 2.5;
  ctx.strokeText(name, x, y-29*s);
  ctx.fillStyle = isChamp ? '#FFD700' : color;
  ctx.fillText(name, x, y-29*s);
}

// размер рыбки плавно растёт вместе с точной суммой ЭТОГО конкретного улова
// (2026-08-11, по просьбе пользователя) — раньше все "средние" рыбки от 10
// до 99 монет выглядели одинаково, теперь 12 монет заметно мельче 95. Вид
// (форма/цвет/сколько сопротивляется — durMs в tierForCoins) по-прежнему
// решает диапазон монет, scaleRange растёт ТОЛЬКО внутри своего диапазона —
// поведение вываживания не трогаем, риск сломать баланс минимальный.
// Диапазоны scaleRange подобраны так, что верх одного вида ниже низа
// следующего — рост всегда монотонный по всей шкале, без скачков вниз на
// границе видов. Интерполяция по логарифму (не линейно) — донаты различаются
// на порядки, линейная шкала сделала бы рост незаметным у мелких сумм.
const FISH_VISUAL = {
  small:  { color:'#bfe0e8', coinsRange:[1, 9],       scaleRange:[0.85, 1.15] },
  medium: { color:'#8fd0c0', coinsRange:[10, 99],     scaleRange:[1.3,  1.9]  },
  pike:   { color:'#6fae5a', coinsRange:[100, 999],   scaleRange:[2.0,  2.6]  },
  shark:  { color:'#9aa7b0', coinsRange:[1000, 5000], scaleRange:[2.8,  3.6]  }, // 5000+ монет — потолок размера
};
function fishVisualScale(kind, coins){
  const vis = FISH_VISUAL[kind] || FISH_VISUAL.small;
  const [lo, hi] = vis.coinsRange;
  const c = Math.max(lo, Math.min(hi, Number(coins) || lo));
  const u = hi > lo ? Math.log(c/lo) / Math.log(hi/lo) : 0;
  const [sLo, sHi] = vis.scaleRange;
  return sLo + (sHi-sLo)*u;
}
function drawFish(x, y, s, rot, kind, coins, wigglePhase){
  const vis = FISH_VISUAL[kind] || FISH_VISUAL.small;
  const sizeScale = fishVisualScale(kind, coins);
  const wig = wigglePhase!=null ? Math.sin(wigglePhase)*0.55 : 0;
  ctx.save();
  ctx.translate(x,y); ctx.rotate(rot); ctx.scale(s*sizeScale, s*sizeScale);
  ctx.fillStyle = vis.color;

  function tail(attachX, len, spread){
    ctx.save();
    ctx.translate(attachX, 0); ctx.rotate(wig);
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-len,-spread); ctx.lineTo(-len,spread); ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  if (kind === 'shark'){
    ctx.beginPath(); ctx.ellipse(0,0,13,4.6,0,0,Math.PI*2); ctx.fill();
    tail(-10, 9, 7);
    ctx.beginPath(); ctx.moveTo(-1,-4); ctx.lineTo(3,-13); ctx.lineTo(6,-4); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#eef4f6';
    ctx.beginPath(); ctx.ellipse(1,2.6,9,2,0,0,Math.PI*2); ctx.fill();
  } else if (kind === 'pike'){
    ctx.beginPath(); ctx.ellipse(0,0,12,3.4,0,0,Math.PI*2); ctx.fill();
    tail(-9, 8, 5);
  } else {
    ctx.beginPath(); ctx.ellipse(0,0,10,4.2,0,0,Math.PI*2); ctx.fill();
    tail(-8, 8, 6);
  }
  ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = 0.8; ctx.stroke();
  ctx.fillStyle = '#1a1a1a';
  ctx.beginPath(); ctx.arc(kind==='shark'?8:6,-0.5,1.2,0,Math.PI*2); ctx.fill();
  ctx.restore();
}

// ── редкие уловы: рисуются вместо обычной рыбы, когда a.catch.rare задан
// (см. rollRareItem/spawnCatch выше). Мусор (носок) — приглушённо, без
// эффектов, с рваными дырками. Сокровище — золотое свечение + искры,
// крупнее. На очки не влияет — это просто "обёртка" сверху обычной
// поклёвки (fish=coins не меняется).
const RARE_PARTICLES = [];
function spawnRareSparkles(x, y, count){
  for (let i=0;i<count;i++){
    const a = Math.random()*Math.PI*2, sp = 0.6+Math.random()*1.6;
    RARE_PARTICLES.push({ x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-0.6, life:1, size:1.5+Math.random()*2 });
  }
}
function drawRareItem(x, y, rot, rare, t){
  const isTreasure = rare.kind === 'treasure';
  if (isTreasure){
    const glowR = 100 + Math.sin(t/140)*14;
    const grad = ctx.createRadialGradient(x,y,4,x,y,glowR);
    grad.addColorStop(0,'rgba(255,220,120,0.55)');
    grad.addColorStop(1,'rgba(255,220,120,0)');
    ctx.save();
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(x,y,glowR,0,Math.PI*2); ctx.fill();
    ctx.restore();
    if (Math.random()<0.35) spawnRareSparkles(x + (Math.random()-0.5)*44, y + (Math.random()-0.5)*44, 1);
  }
  ctx.save();
  ctx.translate(x,y); ctx.rotate(rot*0.5);
  ctx.font = (isTreasure ? 90 : 66) + 'px Arial';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(rare.emoji, 0, 0);
  // рваный носок — пара тёмных дырок + зигзаг разрыва поверх эмодзи, чтобы
  // было видно, что носок именно старый/рваный, один (не пара)
  if (rare.key === 'sock'){
    ctx.fillStyle = 'rgba(25,18,12,0.8)';
    ctx.beginPath(); ctx.arc(-9, 15, 5.5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(11, 4, 3.5, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = 'rgba(25,18,12,0.85)'; ctx.lineWidth = 2.4; ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(-16,23); ctx.lineTo(-9,17); ctx.lineTo(-3,24); ctx.lineTo(4,16); ctx.lineTo(11,25);
    ctx.stroke();
  }
  ctx.restore();
}
function updateDrawRareParticles(){
  for (let i=RARE_PARTICLES.length-1;i>=0;i--){
    const p = RARE_PARTICLES[i];
    p.x+=p.vx; p.y+=p.vy; p.vy+=0.04; p.life-=0.025;
    if (p.life<=0){ RARE_PARTICLES.splice(i,1); continue; }
    ctx.save();
    ctx.globalAlpha = Math.max(0,p.life);
    ctx.fillStyle = '#ffe08a';
    ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
}

function easeInOut(u){ return u<0.5 ? 2*u*u : 1-Math.pow(-2*u+2,2)/2; }

function getCatchPhaseFor(elapsed, tier){
  const D = tier.durMs;
  if (elapsed < D.bite) return { phase:'bite', u: elapsed/D.bite };
  let e = elapsed - D.bite;
  if (e < D.reel){
    const raw = e/D.reel;
    const segs = tier.struggle;
    let tension = 0;
    let u = raw;
    if (segs>0){
      const local = (raw*segs) % 1;
      if (local < 0.4){
        tension = Math.sin(local/0.4*Math.PI) * (1-raw);
        u = raw - tension*0.26;
      }
    }
    u = Math.max(0, Math.min(1, u));
    return { phase:'reel', u: easeInOut(u), tension };
  }
  e -= D.reel;
  if (e < D.deposit) return { phase:'deposit', u: e/D.deposit };
  e -= D.deposit;
  if (e < D.recast) return { phase:'recast', u: easeInOut(e/D.recast) };
  return { phase:'done' };
}
function reelTargetFor(a){
  return { x: Math.min(CW-30, Math.max(30, a.baseX+40)), y: DOCK_TOP-20 };
}

const BUCKET_X = CW*0.84, BUCKET_Y = CH*0.90;

// какой размер ОДНОГО подарка — какая рыба и насколько долго/яростно она
// сопротивляется вываживанию. Работает для ЛЮБОЙ реальной суммы монет
// (диапазон, не точное совпадение) — рейтинг при этом всегда получает
// fish = coins (1 монета = 1 рыбка), это НЕ зависит от вида/размера рыбы.
function tierForCoins(coins){
  if (coins >= 1000) return { kind:'shark',  struggle:6, durMs:{ bite:1100, reel:10000, deposit:900, recast:1000 } };
  if (coins >= 100)  return { kind:'pike',   struggle:3, durMs:{ bite:900,  reel:4500,  deposit:650, recast:800  } };
  if (coins >= 10)   return { kind:'medium', struggle:1, durMs:{ bite:800,  reel:1800,  deposit:500, recast:700  } };
  return                    { kind:'small',  struggle:0, durMs:{ bite:700,  reel:900,   deposit:500, recast:700  } };
}
const LIKE_TIER = tierForCoins(1); // порог лайков всегда даёт мелкую рыбку

// ── Редкие уловы (2026-08-12) — вместо обычной рыбы иногда попадается
// что-то необычное: рваный носок или маленькое сокровище. На очки/рейтинг
// НИКАК не влияет — fish=coins всё так же (rare — это просто визуальная
// "обёртка" поверх обычной поклёвки), см. spawnCatch.
const RARE_CHANCE = 0.03; // 3% шанс вместо обычной рыбы (легко подкрутить)
const RARE_JUNK = [
  { key:'sock', emoji:'🧦', text:'🧦 Чей-то носок...' },
];
const RARE_TREASURE = [
  { key:'goldfish', emoji:'🐠', text:'ЗОЛОТАЯ РЫБКА!' },
  { key:'octopus',  emoji:'🐙', text:'ОСЬМИНОГ!' },
  { key:'crab',     emoji:'🦀', text:'КРАБ ВЦЕПИЛСЯ!' },
];
function rollRareItem(){
  if (Math.random() >= RARE_CHANCE) return null;
  const isTreasure = Math.random() < 0.5;
  const pool = isTreasure ? RARE_TREASURE : RARE_JUNK;
  const pick = pool[Math.floor(Math.random()*pool.length)];
  return { ...pick, kind: isTreasure ? 'treasure' : 'junk' };
}

let lastT = 0;
let topList = []; // с сервера — дневной топ, см. wsConnect/top_fishing
let yesterdayTopList = []; // с сервера — снапшот топа за прошлый день, см. wsConnect/top_fishing_yesterday

// если у удильщика уже идёт улов — новый встаёт в очередь и стартует сам,
// как только текущий долетит до ведра (нужно для money gun: 5 поклёвок подряд)
function spawnCatch(username, fish, tier){
  spawnCatchWithRare(username, fish, tier, rollRareItem());
}
// forcedRare — для debug-панели (принудительно показать конкретный редкий
// предмет, не дожидаясь 3% шанса); обычный спавн всегда идёт через spawnCatch выше
function spawnCatchWithRare(username, fish, tier, rare){
  const a = getOrAssignAngler(username, lastT);
  if (!a){ queueWaiting(username, fish, tier, rare); return; } // все 15 мест заняты активным вываживанием — встаёт в очередь (см. drainWaitingQueue), рыбку в БД всё равно засчитаем
  a.totalFish = (a.totalFish||0) + fish; // копится для приоритета по донату, см. getOrAssignAngler
  if (a.catch){
    a.queue.push({ tier, fish, rare });
  } else {
    a.catch = { tier, fish, startTime: lastT, rare };
  }
}

function drawPostProcess(){
  ctx.save();
  ctx.globalCompositeOperation = 'overlay';
  ctx.globalAlpha = 0.35;
  ctx.fillStyle = grainPattern;
  ctx.fillRect(0,0,CW,CH);
  ctx.restore();

  const vg = ctx.createRadialGradient(CW/2, CH*0.4, CH*0.28, CW/2, CH*0.4, CH*0.78);
  vg.addColorStop(0,'rgba(0,0,0,0)');
  vg.addColorStop(1,'rgba(0,0,0,0.34)');
  ctx.fillStyle = vg;
  ctx.fillRect(0,0,CW,CH);
}

function renderAngler(a, t, scale){
  const rest = bobberPos(a);
  let x = rest.x, y = rest.y;
  let flyingFish = null, showBobber = true, caughtText = null, caughtRare = null, splash = null, tension = 0;

  if (a.catch){
    const target = reelTargetFor(a);
    const ph = getCatchPhaseFor(t - a.catch.startTime, a.catch.tier);
    if (ph.phase === 'bite'){
      const env = Math.sin(ph.u * Math.PI);
      x = rest.x + Math.sin(t/55)*5*env;
      y = rest.y + env*16 + Math.sin(t/40)*3*env;
      if (env > 0.6) splash = { x, y, power: env };
    } else if (ph.phase === 'reel'){
      const jitter = ph.tension>0.05 ? Math.sin(t/30)*ph.tension*4 : 0;
      x = rest.x + (target.x-rest.x)*ph.u + jitter;
      y = rest.y + (target.y-rest.y)*ph.u;
      tension = ph.tension;
      if (ph.tension > 0.12) splash = { x, y, power: ph.tension };
    } else if (ph.phase === 'deposit'){
      x = target.x; y = target.y;
      const fx = target.x + (BUCKET_X-target.x)*ph.u;
      const fy = target.y + (BUCKET_Y-target.y)*ph.u - Math.sin(ph.u*Math.PI)*46;
      const rot = -0.3 + ph.u*1.1;
      flyingFish = { x:fx, y:fy, rot, kind:a.catch.tier.kind, coins:a.catch.fish, rare:a.catch.rare };
      if (ph.u > 0.7) showBobber = false;
      if (ph.u > 0.85){
        const rare = a.catch.rare;
        caughtRare = rare;
        // без словесного описания предмета — и так видно по картинке, что
        // поймалось; просто эмодзи + очки, как у обычной рыбы
        caughtText = rare ? `${rare.emoji} +${a.catch.fish}` : `🐟 +${a.catch.fish}!`;
      }
    } else if (ph.phase === 'recast'){
      x = target.x + (rest.x-target.x)*ph.u;
      y = target.y + (rest.y-target.y)*ph.u - Math.sin(ph.u*Math.PI)*70;
    } else if (ph.phase === 'done'){
      const next = a.queue.shift();
      a.catch = next ? { tier: next.tier, fish: next.fish, startTime: t, rare: next.rare } : null;
    }
  }

  drawRod(a.baseX, x, y, BOBBER_COLORS[a.colorIdx] || '#ffd24f', scale, tension);
  return { x, y, flyingFish, showBobber, caughtText, caughtRare, splash };
}

let lastFrameWallClock = Date.now(); // для watchdog ниже — реальное время последнего кадра
function loop(t){
  lastT = t;
  lastFrameWallClock = Date.now();
  drainWaitingQueue(t); // рассаживаем зрителей из очереди ожидания, если освободилось место
  ctx.clearRect(0,0,CW,CH);

  drawBackground();
  drawWaterFX(t);

  drawBucket(BUCKET_X, BUCKET_Y, 1.6);

  // своей удочки стримера на воде нет — ловят только реальные зрители
  // (донат/лайк-порог), стример тут камера, а не игрок
  const anglers = Array.from(anglersByUser.values());
  const renders = anglers.map(a => ({ a, r: renderAngler(a, t, 1.15) }));

  renders.forEach(({a,r})=>{
    if (!r.showBobber) return;
    const isChamp = topList.length>0 && topList[0].name.toLowerCase() === a.name.toLowerCase();
    drawBobber(r.x, r.y, 1, BOBBER_COLORS[a.colorIdx], a.name, isChamp, t + a.px*1000);
  });
  renders.forEach(({r})=>{
    if (r.splash) drawSplash(r.splash.x, r.splash.y, r.splash.power);
  });
  renders.forEach(({r})=>{
    if (!r.flyingFish) return;
    if (r.flyingFish.rare) drawRareItem(r.flyingFish.x, r.flyingFish.y, r.flyingFish.rot, r.flyingFish.rare, t);
    else drawFish(r.flyingFish.x, r.flyingFish.y, 1.3, r.flyingFish.rot + Math.sin(t/50)*0.15, r.flyingFish.kind, r.flyingFish.coins, t/40);
  });
  updateDrawRareParticles();
  renders.forEach(({r})=>{
    if (!r.caughtText) return;
    const isTreasure = r.caughtRare && r.caughtRare.kind === 'treasure';
    const isJunk = r.caughtRare && r.caughtRare.kind === 'junk';
    ctx.save();
    ctx.font = (isTreasure ? 'bold 19px Arial Black' : 'bold 15px Arial Black');
    ctx.textAlign = 'center';
    ctx.strokeStyle = 'rgba(0,0,0,0.9)'; ctx.lineWidth = isTreasure?4:3;
    ctx.strokeText(r.caughtText, BUCKET_X, BUCKET_Y-46);
    ctx.fillStyle = isTreasure ? '#ffd24f' : (isJunk ? '#9aa0a6' : '#ffe98a');
    if (isTreasure){ ctx.shadowColor='#ffcc33'; ctx.shadowBlur=8; }
    ctx.fillText(r.caughtText, BUCKET_X, BUCKET_Y-46);
    ctx.restore();
  });

  drawPostProcess();
  drawTopPanel();

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ── Watchdog (2026-08-12) — если requestAnimationFrame молчит дольше 3с,
// цикл сам себя перезапускает. На телефоне видео со звуком (цунами/спец-
// события) иногда триггерит нативный полноэкранный проигрыватель ОС, тот
// приостанавливает JS-таймеры страницы, и после возврата requestAnimationFrame
// не всегда возобновляется сам — картинка "замерзает" на последнем кадре
// до ручного обновления страницы. setInterval переживает такие паузы лучше,
// чем rAF-цепочка, поэтому проверяем именно им. В норме (60 кадров/сек)
// этот таймер вообще ничего не делает — просто наблюдает.
setInterval(()=>{
  if (Date.now() - lastFrameWallClock > 3000){
    lastFrameWallClock = Date.now();
    requestAnimationFrame(loop);
  }
}, 2000);

// ══════════════════════════════════════════════════════════════════════
// Живое подключение к TikTok-чату — тот же паттерн, что у остальных игр
// (streetfighter_arena.html и т.п.): сервер шлёт общие "arena_*" события
// на весь стрим, тут выбираем только gift/like и реагируем реальными
// донатами/лайками (demo-режим игнорируем — на воде тогда просто пусто).
// ══════════════════════════════════════════════════════════════════════
// ── подарок "Money Gun" — сначала полноэкранное цунами, и только когда
// оно доиграет, зрителю начинают приходить рыбки (см. arena_gift ниже)
const tsunamiVideo = document.getElementById('tsunamiVideo');
tsunamiVideo.src = 'img/fishing_tsunami.mp4';
let _tsunamiPlaying = false;
function playTsunami(onDone){
  if (_tsunamiPlaying){ onDone(); return; } // уже идёт — не дублируем, просто сразу отдаём улов
  _tsunamiPlaying = true;
  let done = false;
  const finish = ()=>{
    if (done) return;
    done = true;
    tsunamiVideo.style.display = 'none';
    tsunamiVideo.onended = null;
    tsunamiVideo.pause(); // освобождаем декодер — та же причина, что и у specialVideo (см. finish в playSpecialEvent)
    _tsunamiPlaying = false;
    bgVideo.play().catch(()=>{}); // явно возвращаем фон, если телефон поставил его на паузу ради декодера цунами
    onDone();
  };
  tsunamiVideo.currentTime = 0;
  tsunamiVideo.style.display = 'block';
  tsunamiVideo.onended = finish;
  tsunamiVideo.play().catch(finish);
  setTimeout(finish, 12000); // страховка, если 'ended' не пришло
}

function triggerMoneyGun(username, coins){
  const fishCount = Math.max(1, Math.round(coins/100));
  reportFish(username, coins);
  playTsunami(()=>{
    for (let i=0;i<fishCount;i++) spawnCatch(username, 100, tierForCoins(100));
  });
}

// ── Спец-события (раз в 3 минуты, 2026-08-12, переделано в тот же день по
// просьбе пользователя) — одно из 3 видео по кругу (6388→6400→6403→снова
// 6388…) ПОДМЕНЯЕТ фоновое видео причала прямо на канвасе (см. drawBackground
// выше), НЕ закрывая экран отдельным слоем — рыбаки/поплавки/правила/топ дня
// остаются видны поверх, как обычно, ничего не пропадает с экрана.
const SPECIAL_EVENT_VIDEOS = ['img/fishing_special1.mp4', 'img/fishing_special2.mp4', 'img/fishing_special3.mp4'];
const SPECIAL_EVENT_INTERVAL_MS = 3 * 60 * 1000;
let _specialEventIdx = 0;
function playSpecialEvent(){
  if (_specialEventActive) return; // не перекрываем сами себя (цунами Money Gun больше не мешает — разные слои)
  _specialEventActive = true;
  SPECIAL_BG.ready = false; // до loadedmetadata нового ролика — доля секунды фон просто останется прежним кадром
  specialVideo.src = SPECIAL_EVENT_VIDEOS[_specialEventIdx % SPECIAL_EVENT_VIDEOS.length];
  _specialEventIdx++;
  let done = false;
  const finish = ()=>{
    if (done) return;
    done = true;
    specialVideo.onended = null;
    specialVideo.pause(); // сразу освобождаем декодер, не ждём следующего кадра
    _specialEventActive = false;
    bgVideo.play().catch(()=>{}); // явно требуем вернуть фон — не полагаемся только на ensurePlaying в drawBackground
  };
  specialVideo.currentTime = 0;
  specialVideo.onended = finish;
  specialVideo.play().catch(finish);
  setTimeout(finish, 15000); // страховка, если 'ended' не пришло
}
setInterval(playSpecialEvent, SPECIAL_EVENT_INTERVAL_MS);

let _ws = null, _wsUser = '', _gameMode = 'connecting';
const _likeCounts = new Map(); // username -> накопленные лайки этого стрима

function setStatus(cls, text){
  const el = document.getElementById('statusBadge');
  if (!el) return;
  el.className = cls;
  el.textContent = text;
}

function wsConnect(username){
  _wsUser = username;
  if (_ws && _ws.readyState < 2){ _ws.onclose = null; _ws.close(); }
  const proto = location.protocol==='https:' ? 'wss:' : 'ws:';
  _ws = new WebSocket(`${proto}//${location.host}?username=${encodeURIComponent(username)}`);
  _ws.onopen = ()=> setStatus('connecting', '⏳ @'+username+'…');
  _ws.onmessage = (e)=>{
    try {
      const d = JSON.parse(e.data);
      if (d.type==='init' || d.type==='status'){
        const m = d.tiktokMode || d.mode;
        _gameMode = m || 'connecting';
        if (m==='tiktok') setStatus('live', '🔴 LIVE @'+(d.username||username));
        else if (m==='demo') setStatus('demo', '🟡 Ожидание эфира…');
        else setStatus('connecting', '⏳ @'+username+'…');
      }
      if (d.type==='arena_gift' && _gameMode==='tiktok'){
        const coins = Number(d.coins)||0;
        if (coins > 0){
          if ((d.giftName||'') === 'Money Gun') triggerMoneyGun(d.username, coins);
          else {
            spawnCatch(d.username, coins, tierForCoins(coins));
            reportFish(d.username, coins);
          }
        }
      }
      if (d.type==='arena_like' && _gameMode==='tiktok'){
        const key = (d.username||'').toLowerCase();
        const prev = _likeCounts.get(key) || 0;
        const total = prev + (Number(d.likes)||0);
        _likeCounts.set(key, total);
        const crossings = Math.floor(total/100) - Math.floor(prev/100);
        if (crossings > 0){
          spawnCatch(d.username, crossings, LIKE_TIER);
          reportFish(d.username, crossings);
        }
      }
      if (d.type==='top_fishing'){
        topList = (d.data||[]).map(p=>({ name:'@'+p.username, count:p.daily_fish }));
      }
      if (d.type==='top_fishing_yesterday'){
        yesterdayTopList = (d.data||[]).map(p=>({ name:'@'+p.username, count:p.daily_fish }));
      }
      if (d.type==='arena_fishing_rating' && _gameMode==='tiktok'){
        if (d.rank){
          _showRating(
            `<span style="color:#7fd3ff;font-size:16px;font-weight:bold;">🎣 @${d.username}</span><br>`+
            `<span style="color:#FFD700;font-size:15px;">#${d.rank} место всего</span><br>`+
            `<span style="color:#8fffb0;font-size:14px;">🐟 ${Number(d.totalFish).toLocaleString()} рыбок всего</span><br>`+
            `<span style="color:#fff;font-size:13px;">🐟 ${Number(d.dailyFish).toLocaleString()} рыбок сегодня</span>`
          );
        } else {
          _showRating(`<span style="color:#AAA;font-size:15px;">🎣 @${d.username}<br>пока не в рейтинге</span>`);
        }
      }
    } catch(err){ console.error('[fishing ws]', err); }
  };
  _ws.onclose = ()=>{ setStatus('error', '❌ Disconnected…'); setTimeout(()=>wsConnect(_wsUser), 3000); };
  _ws.onerror = ()=>{};
}

let _ratingHideTimer = null;
function _showRating(html){
  const el = document.getElementById('ratingOverlay');
  if (!el) return;
  el.innerHTML = html;
  el.style.display = 'block';
  if (_ratingHideTimer) clearTimeout(_ratingHideTimer);
  _ratingHideTimer = setTimeout(()=>{ el.style.display = 'none'; }, 6000);
}

// рыбки в БД пишем не мгновенно на каждое событие, а копим по нику и шлём
// пачкой раз в 3 сек — визуально поклёвка уже идёт сразу, задержка касается
// только записи в топ, чтобы не долбить БД при вирусном донат-моменте
let _pendingFish = {};
function reportFish(username, fish){
  if (!username || !fish) return;
  _pendingFish[username] = (_pendingFish[username]||0) + fish;
}
setInterval(()=>{
  if (!_ws || _ws.readyState!==1) return;
  for (const u in _pendingFish){
    const fish = _pendingFish[u];
    if (fish > 0) _ws.send(JSON.stringify({ type:'fishing_catch', username:u, fish }));
  }
  _pendingFish = {};
}, 3000);

function fetchFishingTop(){
  fetch('/top-fishing?limit=5').then(r=>r.json()).then(d=>{
    if (d.ok && d.top) topList = d.top.map(p=>({ name:'@'+p.username, count:p.daily_fish }));
  }).catch(()=>{});
}
fetchFishingTop();
setInterval(fetchFishingTop, 30000);

// топ вчера меняется всего раз в сутки (в полночь) — достаточно подтянуть
// один раз при загрузке страницы, дальше обновится сам через WS-broadcast
// top_fishing_yesterday в момент сброса (см. checkFishingDailyReset на сервере)
function fetchFishingYesterdayTop(){
  fetch('/top-fishing-yesterday').then(r=>r.json()).then(d=>{
    if (d.ok && d.top) yesterdayTopList = d.top.map(p=>({ name:'@'+p.username, count:p.daily_fish }));
  }).catch(()=>{});
}
fetchFishingYesterdayTop();

(function initLive(){
  const p = new URLSearchParams(location.search);
  const u = (p.get('username')||'').replace(/^@/,'').trim();
  if (u) wsConnect(u);
})();

document.getElementById('backBtn').addEventListener('click', ()=>{ location.href='/'; });
document.getElementById('fsBtn').addEventListener('click', ()=>{
  if (document.fullscreenElement) { document.exitFullscreen && document.exitFullscreen(); }
  else {
    document.documentElement.requestFullscreen && document.documentElement.requestFullscreen().then(()=>{
      if (screen.orientation && screen.orientation.lock) screen.orientation.lock('portrait').catch(()=>{});
    }).catch(()=>{});
  }
});

// звук видео — автоплей со звуком браузер блокирует (разрешён только
// muted-автоплей), поэтому все видео стартуют беззвучно и включают звук по
// первому касанию/клику где угодно на странице. Раньше размучивался только
// фон (bgVideo) — цунами Money Gun и спец-события каждые 3 минуты
// (tsunamiVideo/specialVideo) оставались без звука навсегда, хотя сам звук
// в роликах есть (2026-08-12, по просьбе пользователя — заметил тишину у
// спец-видео). specialVideo — off-DOM (как bgVideo), звук всё равно идёт в
// колонки независимо от того, показан ли он на экране как отдельный элемент.
document.addEventListener('pointerdown', function unlockVideoSoundOnce(){
  bgVideo.muted = false;
  bgVideo.volume = 0.6;
  bgVideo.play().catch(()=>{});
  tsunamiVideo.muted = false;
  tsunamiVideo.volume = 0.8;
  specialVideo.muted = false;
  specialVideo.volume = 0.8;
  document.removeEventListener('pointerdown', unlockVideoSoundOnce);
});

// ручное тестирование без реального доната/эфира — ?debug=1 в адресе,
// каждая кнопка жмёт ровно ту же ветку кода, что и настоящее событие
// (отдельный тестовый юзернейм на кнопку — чтобы уловы не толкались в одну очередь)
if (new URLSearchParams(location.search).get('debug') === '1'){
  const panel = document.createElement('div');
  panel.style.cssText = 'position:fixed;left:8px;bottom:8px;z-index:99999;display:flex;'+
    'flex-direction:column;gap:4px;font-family:Arial,sans-serif;';

  const buttons = [
    ['🐟 SMALL (1)',   ()=>{ spawnCatch('TestSmall', 1, tierForCoins(1)); reportFish('TestSmall', 1); }],
    ['🐠 MEDIUM (10)', ()=>{ spawnCatch('TestMedium', 10, tierForCoins(10)); reportFish('TestMedium', 10); }],
    ['🐡 PIKE (100)',  ()=>{ spawnCatch('TestPike', 100, tierForCoins(100)); reportFish('TestPike', 100); }],
    ['🦈 SHARK (1000)',()=>{ spawnCatch('TestShark', 1000, tierForCoins(1000)); reportFish('TestShark', 1000); }],
    ['❤️ LIKE x100',   ()=>{ spawnCatch('TestLike', 1, LIKE_TIER); reportFish('TestLike', 1); }],
    ['🔫 MONEY GUN',   ()=> triggerMoneyGun('TestGun', 500)],
    ['🎬 SPECIAL VIDEO (след. по кругу)', ()=> playSpecialEvent()],
  ];
  buttons.forEach(([label, fn])=>{
    const btn = document.createElement('button');
    btn.textContent = '🧪 '+label;
    btn.style.cssText = 'padding:8px 12px;font-weight:bold;background:#1a4a6e;color:#fff;'+
      'border:1px solid rgba(255,255,255,0.4);border-radius:8px;cursor:pointer;';
    btn.addEventListener('click', fn);
    panel.appendChild(btn);
  });

  // ── редкие уловы — принудительно вызвать конкретный предмет, не дожидаясь
  // 3% шанса (см. RARE_CHANCE/rollRareItem)
  const rarePanel = document.createElement('div');
  rarePanel.style.cssText = 'position:fixed;right:8px;bottom:8px;z-index:99999;display:flex;'+
    'flex-direction:column;gap:4px;font-family:Arial,sans-serif;max-height:90vh;overflow-y:auto;';
  let rareTestCounter = 0;
  function addRareButtons(items, bg){
    items.forEach(item=>{
      const btn = document.createElement('button');
      btn.textContent = '🧪 '+item.emoji+' '+item.key;
      btn.style.cssText = `padding:6px 10px;font-weight:bold;background:${bg};color:#fff;`+
        'border:1px solid rgba(255,255,255,0.4);border-radius:8px;cursor:pointer;font-size:12px;';
      btn.addEventListener('click', ()=>{
        const u = 'TestRare'+(rareTestCounter++);
        spawnCatchWithRare(u, 15, tierForCoins(15), item);
        reportFish(u, 15);
      });
      rarePanel.appendChild(btn);
    });
  }
  addRareButtons(RARE_TREASURE, '#7a5a12');
  addRareButtons(RARE_JUNK, '#3a3a3a');
  document.body.appendChild(rarePanel);

  document.body.appendChild(panel);
}
</script>
